[package]
name = "ekr"
description = "The command-line surface of the Epistemic Knowledge Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ekr"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ekr-core.workspace = true
ekr-graph.workspace = true
ekr-integrate = { workspace = true, features = ["schema"] }
ekr-kernel = { workspace = true, features = ["schema"] }
ekr-ontology.workspace = true
ekr-sdk.workspace = true
ekr-views.workspace = true
ess-conformance.workspace = true
ess-primitives.workspace = true
httparse.workspace = true
schemars = "1.2"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml_ng.workspace = true
signal-hook = "0.3"
time.workspace = true

[build-dependencies]
wasm-bindgen-cli-support = "=0.2.129"

[dev-dependencies]
base64 = "0.22"
tungstenite = "0.29"
assert_cmd.workspace = true
jsonschema = { version = "0.58", default-features = false }
rusqlite = { workspace = true, features = ["backup"] }
tempfile.workspace = true

[lints]
workspace = true
