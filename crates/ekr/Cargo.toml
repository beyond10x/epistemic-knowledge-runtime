[package]
name = "ekr"
description = "The command-line surface of the Epistemic Knowledge Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ekr"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ekr-core.workspace = true
ekr-graph.workspace = true
ekr-kernel = { workspace = true, features = ["schema"] }
ekr-ontology.workspace = true
ess-conformance.workspace = true
ess-primitives.workspace = true
schemars = "1.2"
serde.workspace = true
serde_json.workspace = true
time.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
jsonschema = { version = "0.58", default-features = false }
serde_yaml_ng.workspace = true
tempfile.workspace = true

[lints]
workspace = true
