<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/graphology@0.26.0/dist/graphology.umd.min.js https://cdn.jsdelivr.net/npm/graphology-library@0.8.0/dist/graphology-library.min.js https://cdn.jsdelivr.net/npm/sigma@3.0.3/dist/sigma.min.js https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js; worker-src blob:; style-src 'unsafe-inline'; connect-src 'self'">
<title>ekr view</title>
<script src="https://cdn.jsdelivr.net/npm/graphology@0.26.0/dist/graphology.umd.min.js" integrity="sha384-YdXPUVLFDJ3oITK7LFAPRyzkOcDK06bb7KRaE8GiQyGLsrvHaLS9Ej/lELMC7aCE" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/graphology-library@0.8.0/dist/graphology-library.min.js" integrity="sha384-JfW8ehTxF6vKpm17Oz+cpaluYzFMvm6YfXgwbw5Hxzrn0rR6WR+0DDDWPEIv9CtK" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/sigma@3.0.3/dist/sigma.min.js" integrity="sha384-2BM4IWUXdUSofkFc94Y1PY8U+cZYLJjB+EqQAoA2vfFGBvZK8aVaxEhICqCY4rlq" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js" integrity="sha384-Y7bC2PBKu8ujxtvo5+Z61OeGdSVRzFsYWBK4i5dnL/U6aFDTodk61qOUkTfInaxS" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root {
  color-scheme: dark;
  --ground: #0b0f17; --panel: #111726; --raised: #182033; --line: #26304a;
  --text: #d6deeb; --muted: #7d8aa8; --accent: #7aa2f7; --warn: #e0af68;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ground); color: var(--text); }
body { font: 13px/1.45 system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; }
header, footer { display: flex; gap: 0.6rem; align-items: center; padding: 0.4rem 0.75rem; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
footer { border-top: 1px solid var(--line); border-bottom: 0; flex-wrap: nowrap; overflow-x: auto; }
header strong { font-size: 14px; letter-spacing: 0.02em; color: var(--accent); }
button, select, input { background: var(--raised); color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; padding: 0.15rem 0.5rem; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); color: var(--ground); border-color: var(--accent); }
header input[type=search] { min-width: 16rem; }
#status { color: var(--muted); margin-left: auto; }
main { display: grid; grid-template-columns: 1fr minmax(22rem, 32%); min-height: 0; }
.view { position: relative; min-height: 0; overflow: hidden; }
#schema-view { overflow: auto; padding: 0.75rem; }
#sigma, #space { position: absolute; inset: 0; }
#notice { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); color: var(--muted); text-align: center; max-width: 30rem; }
#legend { position: absolute; left: 0.5rem; top: 0.5rem; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 0.4rem 0.6rem; max-height: 60%; overflow: auto; z-index: 2; }
#legend ul { list-style: none; margin: 0.2rem 0; padding: 0; }
#legend li { cursor: pointer; white-space: nowrap; }
#legend li.off { opacity: 0.35; }
#metrics { position: absolute; right: 0.5rem; bottom: 0.4rem; color: var(--muted); font: 11px ui-monospace, monospace; z-index: 2; }
#tip { position: absolute; pointer-events: none; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 0.15rem 0.4rem; z-index: 3; }
.swatch { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; margin-right: 0.35em; vertical-align: -0.05em; }
.line-key { display: inline-block; width: 1.8em; border-top: 2px solid var(--muted); margin-right: 0.35em; vertical-align: 0.25em; }
.line-key.dotted { border-top-style: dotted; border-color: var(--warn); }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 0.75rem; min-height: 0; }
aside h2 { margin: 0 0 0.2rem; font-size: 16px; overflow-wrap: anywhere; }
h3 { margin: 1rem 0 0.3rem; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
table { border-collapse: collapse; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 0.2rem 0.35rem; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
th { font-weight: 600; color: var(--muted); }
table.claim { margin-bottom: 0.6rem; background: var(--raised); border-radius: 6px; }
table.claim th:first-child, table.claim td:first-child { width: 7rem; color: var(--muted); }
table.claim thead th:last-child { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text); }
table.outside { opacity: 0.45; }
code, pre, .id { font-family: ui-monospace, monospace; font-size: 12px; }
.muted { color: var(--muted); }
button.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; }
button.link:hover { text-decoration: underline; }
footer button.current { outline: 2px solid var(--accent); }
footer input[type=range] { min-width: 14rem; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--ground); border: 1px solid var(--line); padding: 0.5rem; max-height: 24rem; overflow: auto; }
dialog { width: min(40rem, 90vw); padding: 0.5rem; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
dialog::backdrop { background: #0008; }
dialog input { width: 100%; padding: 0.35rem; }
dialog ul { list-style: none; margin: 0.4rem 0 0; padding: 0; max-height: 50vh; overflow: auto; }
dialog li { padding: 0.2rem 0.35rem; cursor: pointer; border-radius: 4px; }
dialog li.active { background: var(--accent); color: var(--ground); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <strong>ekr view</strong>
  <label>revision <select id="revision"></select></label>
  <button id="show-2d" type="button">2D</button>
  <button id="show-3d" type="button">3D</button>
  <button id="show-schema" type="button">schema</button>
  <button id="relayout" type="button">layout</button>
  <input id="find" type="search" placeholder="find a node or type (Ctrl+K)" autocomplete="off">
  <span id="status" role="status">loading</span>
</header>
<main>
  <section id="graph-view" class="view">
    <div id="sigma"></div>
    <div id="space" hidden></div>
    <div id="legend"></div>
    <div id="notice" hidden></div>
    <div id="tip" hidden></div>
    <div id="metrics"></div>
  </section>
  <section id="schema-view" class="view" hidden></section>
  <aside id="detail"></aside>
</main>
<footer>
  <span class="muted">revision</span>
  <span id="revisions"></span>
  <span class="muted">valid time</span>
  <label><input id="valid-all" type="checkbox" checked> all</label>
  <input id="valid" type="range" min="0" max="1000" value="1000" disabled>
  <span id="valid-at" class="muted"></span>
</footer>
<dialog id="palette">
  <input id="palette-input" type="text" placeholder="node, type, revision or view" autocomplete="off">
  <ul id="palette-list"></ul>
</dialog>
<script>
"use strict";
(function () {
  // The only four addresses this page reads. Every label it shows comes from what they return.
  const HEAD = "/head";
  const PROJECTION = "/projection";
  const ROLES = "/roles";
  const EVIDENCE = "/evidence/";

  // Colours are handed out by type id order, never by anything a type is called.
  const PALETTE = ["#7aa2f7", "#f7768e", "#9ece6a", "#e0af68", "#bb9af7", "#2ac3de", "#ff9e64", "#73daca", "#c0caf5", "#db4b4b", "#41a6b5", "#d18616"];
  const EDGE = "#3b4766";
  const EDGE_LIT = "#a9b8e8";
  const RELATION = "#e0af68";
  const DIM = "#1f2638";
  // Above this many edges, hovering an edge is not tracked: picking edges costs a read-back per
  // frame. Edge labels still show on zoom and around a hovered or chosen node.
  const EDGE_EVENTS_LIMIT = 5000;

  const $ = function (id) { return document.getElementById(id); };
  const libraries = {
    graph: Boolean(window.graphology && window.graphology.MultiDirectedGraph && window.graphologyLibrary && window.graphologyLibrary.FA2Layout) && typeof window.Sigma === "function",
    space: typeof window.ForceGraph3D === "function"
  };

  const state = {
    projection: null,
    head: null,
    roles: new Map(),
    rolesNote: "",
    revision: null,
    view: "2d",
    selected: null,
    evidenceShown: null,
    hover: null,
    hiddenTypes: new Set(),
    validAt: null,
    typeName: new Map(),
    typeColor: new Map(),
    edgeTypeName: new Map(),
    propertyName: new Map(),
    evidenceById: new Map(),
    nodeById: new Map(),
    edgeById: new Map(),
    relations: [],
    degree: new Map(),
    neighbours: new Map(),
    camera: null,
    camera3: null
  };

  // ---------- reading ----------

  function get(path) {
    return fetch(path, { credentials: "omit", cache: "no-store" });
  }

  function json(response) {
    if (!response.ok) {
      return response.text().then(function (message) { throw new Error(response.status + " " + message.trim()); });
    }
    return response.text().then(exact);
  }

  // JSON text to values, with every integer a double cannot hold exactly kept as its source text:
  // the page shows what the store holds, never a rounded neighbour. Strings are passed over whole,
  // so digits inside one are never touched.
  const TOKEN = /"(?:[^"\\]|\\.)*"|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
  function exact(source) {
    return JSON.parse(source.replace(TOKEN, function (token) {
      if (token.charAt(0) === "\"" || !/^-?\d+$/.test(token) || Number.isSafeInteger(Number(token))) { return token; }
      return "\"" + token + "\"";
    }));
  }

  function query() {
    return state.revision === null ? "" : "?revision=" + encodeURIComponent(state.revision);
  }

  // Roles are optional: without them, or when they do not load, no node has a role and every node
  // is still shown.
  function readRoles() {
    const plain = function () {
      return get(ROLES).then(function (response) {
        return response.status === 404 ? { absent: true } : json(response);
      });
    };
    const at = query();
    const first = at === "" ? plain() : get(ROLES + at).then(function (response) {
      return response.ok ? json(response) : plain();
    });
    return first.catch(function (error) { return { failed: error.message }; });
  }

  // Each load is numbered; an answer that is not the latest load's is dropped, so the page never
  // shows one revision while its URL and selector name another.
  let loads = 0;
  function load() {
    loads += 1;
    const mine = loads;
    status("loading revision " + (state.revision === null ? "head" : state.revision));
    // The head is read after the projection, so it is never older than the revision projected.
    Promise.all([get(PROJECTION + query()).then(json), readRoles()])
      .then(function (both) {
        return get(HEAD).then(json).then(function (newest) { return both.concat([newest.head]); });
      })
      .then(function (all) { if (mine === loads) { accept(all[0], all[1], all[2]); } })
      .catch(function (error) {
        if (mine !== loads) { return; }
        status("the projection did not load: " + error.message);
        clear($("detail")).appendChild(text("p", "the projection did not load: " + error.message));
      });
  }

  // ---------- indexing ----------

  function byId(a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; }

  function accept(projection, roles, head) {
    state.projection = projection;
    // No projection names the head; /head does, and it is never below the revision shown.
    state.head = typeof head === "number" && head > projection.meta.revision ? head : projection.meta.revision;
    state.typeName = new Map();
    state.typeColor = new Map();
    state.edgeTypeName = new Map();
    state.propertyName = new Map();
    state.evidenceById = new Map();
    const ontology = projection.ontology;
    ontology.node_types.slice().sort(byId).forEach(function (type, index) {
      state.typeName.set(type.id, type.name);
      state.typeColor.set(type.id, index < PALETTE.length ? PALETTE[index] : "hsl(" + Math.round((index * 137.508) % 360) + " 70% 66%)");
    });
    ontology.edge_types.forEach(function (type) { state.edgeTypeName.set(type.id, type.name); });
    ontology.properties.forEach(function (property) { state.propertyName.set(property.id, property.name); });
    projection.evidence.forEach(function (item) { state.evidenceById.set(item.id, item); });

    state.roles = new Map();
    if (roles && Array.isArray(roles.node_types)) {
      roles.node_types.forEach(function (entry) {
        if (entry && typeof entry.type_id === "string" && typeof entry.role === "string") { state.roles.set(entry.type_id, entry.role); }
      });
      state.rolesNote = "roles of revision " + roles.revision;
    } else if (roles && roles.absent) {
      state.rolesNote = "no roles served";
    } else {
      state.rolesNote = "roles did not load" + (roles && roles.failed ? ": " + roles.failed : "");
    }

    state.nodeById = new Map(projection.nodes.map(function (node) { return [node.id, node]; }));
    state.edgeById = new Map(projection.edges.map(function (edge) { return [edge.id, edge]; }));
    // A relation assertion is a link of its own, never merged into an edge.
    state.relations = [];
    projection.nodes.forEach(function (node) {
      node.assertions.forEach(function (claim) {
        if (claim.predicate_kind === "Relation" && claim.object_kind === "Node" && state.nodeById.has(claim.object_ref)) {
          state.relations.push({ id: claim.id, claim: claim, source: node.id, target: claim.object_ref });
        }
      });
    });
    state.degree = new Map();
    state.neighbours = new Map();
    const touch = function (a, b) {
      state.degree.set(a, (state.degree.get(a) || 0) + 1);
      state.degree.set(b, (state.degree.get(b) || 0) + 1);
      if (!state.neighbours.has(a)) { state.neighbours.set(a, new Set()); }
      if (!state.neighbours.has(b)) { state.neighbours.set(b, new Set()); }
      state.neighbours.get(a).add(b);
      state.neighbours.get(b).add(a);
    };
    projection.edges.forEach(function (edge) {
      if (state.nodeById.has(edge.source) && state.nodeById.has(edge.target)) { touch(edge.source, edge.target); }
    });
    state.relations.forEach(function (relation) { touch(relation.source, relation.target); });

    if (state.selected && !(state.nodeById.has(state.selected.id) || state.edgeById.has(state.selected.id) || state.selected.kind === "assertion")) {
      state.selected = null;
    }
    fillRevisions(projection);
    fillValidTime(projection);
    fillLegend();
    fillSchema();
    showDetail();
    status(
      "revision " + projection.meta.revision + " of " + state.head + " · " +
      projection.meta.node_count + " node · " + projection.meta.edge_count + " edge · " +
      projection.meta.assertion_count + " assertion · " + projection.meta.evidence_count + " evidence · " +
      state.rolesNote
    );
    flat.build();
    space.build();
    show(state.view);
    writeUrl();
  }

  function colourOf(node) { return state.typeColor.get(node.type) || "#8892b0"; }

  // Size grows with degree; a large graph draws every node smaller so its structure stays legible.
  function sizeOf(id) {
    const scale = state.projection && state.projection.nodes.length > 1000 ? 0.55 : 1;
    return (3 + Math.min(14, Math.sqrt(state.degree.get(id) || 0) * 1.8)) * scale;
  }

  function hiddenNode(id) {
    const node = state.nodeById.get(id);
    return !node || state.hiddenTypes.has(node.type);
  }

  // A time bound as the store holds it — a number, or the exact text of one a double cannot hold —
  // read as a BigInt, so ordering never rounds. A missing bound is an open end and reads as null.
  function bound(held) {
    if (held === null || held === undefined) { return null; }
    if (typeof held === "bigint") { return held; }
    if (typeof held === "number" && Number.isInteger(held)) { return BigInt(held); }
    if (typeof held === "string" && /^-?[0-9]+$/.test(held)) { return BigInt(held); }
    throw new Error("a time bound that is not a whole number of milliseconds: " + held);
  }

  function validNow(claim) {
    if (state.validAt === null) { return true; }
    const from = bound(claim.valid_from);
    const to = bound(claim.valid_to);
    return (from === null || from <= state.validAt) && (to === null || state.validAt < to);
  }

  // The node or edge under the pointer, and everything one step from it, stay lit.
  function lit(id) {
    const focus = state.hover || (state.selected && state.selected.kind === "node" ? state.selected.id : null);
    if (!focus) { return true; }
    return id === focus || (state.neighbours.get(focus) || new Set()).has(id);
  }

  // With roles, subjects hold the middle band, events a band below and observations one above;
  // a node without a role keeps the place the layout gives it.
  function band(node) {
    const role = state.roles.get(node.type);
    return role === "subject" ? 0 : role === "event" ? 1 : role === "observation" ? -1 : null;
  }

  // ---------- 2D: sigma over graphology, ForceAtlas2 in its worker ----------

  const flat = (function () {
    let graph = null;
    let renderer = null;
    let layout = null;
    let stopAt = 0;
    let overlay = null;
    const frames = [];

    function build() {
      if (!libraries.graph) { return; }
      const started = performance.now();
      const previous = new Map();
      if (graph) { graph.forEachNode(function (key, attributes) { previous.set(key, [attributes.x, attributes.y]); }); }
      if (layout) { layout.kill(); layout = null; }
      graph = new window.graphology.MultiDirectedGraph();
      const count = state.projection.nodes.length;
      state.projection.nodes.forEach(function (node, index) {
        const was = previous.get(node.id);
        const angle = index * 2.399963;
        const radius = Math.sqrt(index + 1) * 10;
        const place = band(node);
        graph.addNode(node.id, {
          x: was ? was[0] : Math.cos(angle) * radius,
          y: was ? was[1] : place === null ? Math.sin(angle) * radius : place * Math.sqrt(count) * 12 + Math.sin(angle) * 4,
          size: sizeOf(node.id),
          label: node.name,
          color: colourOf(node),
          kind: node.type
        });
      });
      state.projection.edges.forEach(function (edge) {
        if (graph.hasNode(edge.source) && graph.hasNode(edge.target)) {
          graph.addEdgeWithKey(edge.id, edge.source, edge.target, {
            size: 1,
            color: EDGE,
            name: state.edgeTypeName.get(edge.type) || edge.type,
            relation: false
          });
        }
      });
      state.relations.forEach(function (relation) {
        if (!graph.hasEdge(relation.id)) {
          graph.addEdgeWithKey(relation.id, relation.source, relation.target, {
            size: 1,
            color: RELATION,
            name: state.edgeTypeName.get(relation.claim.predicate) || relation.claim.predicate,
            relation: true
          });
        }
      });
      if (!renderer) {
        try {
          renderer = new window.Sigma(graph, $("sigma"), {
            allowInvalidContainer: true,
            enableEdgeEvents: graph.size <= EDGE_EVENTS_LIMIT,
            renderEdgeLabels: true,
            defaultEdgeType: "arrow",
            labelColor: { color: "#d6deeb" },
            edgeLabelColor: { color: "#a9b8e8" },
            labelDensity: 0.6,
            labelRenderedSizeThreshold: graph.order < 300 ? 0 : 6,
            labelFont: "system-ui, sans-serif",
            edgeLabelFont: "system-ui, sans-serif",
            edgeLabelSize: 11,
            zIndex: true,
            defaultDrawNodeHover: drawHover,
            nodeReducer: nodeReducer,
            edgeReducer: edgeReducer
          });
        } catch (error) {
          notice("the 2D view could not start: " + error.message);
          renderer = null;
          return;
        }
        overlay = renderer.createCanvas("dotted", { afterLayer: "edges" }).getContext("2d");
        renderer.on("afterRender", afterRender);
        renderer.resize(true);
        renderer.on("enterNode", function (event) { state.hover = event.node; tip(null); refresh(); });
        renderer.on("leaveNode", function () { state.hover = null; refresh(); });
        renderer.on("enterEdge", function (event) { tip(graph.getEdgeAttribute(event.edge, "name"), lastPointer); state.hoverEdge = event.edge; renderer.refresh({ skipIndexation: true }); });
        renderer.on("leaveEdge", function () { tip(null); state.hoverEdge = null; renderer.refresh({ skipIndexation: true }); });
        renderer.on("clickNode", function (event) { select("node", event.node); });
        renderer.on("clickEdge", function (event) {
          select(graph.getEdgeAttribute(event.edge, "relation") ? "assertion" : "edge", event.edge);
        });
        renderer.on("clickStage", function () { select(null, null); });
        renderer.getCamera().on("updated", function () { scheduleUrl(); });
        if (state.camera) { renderer.getCamera().setState(state.camera); }
      } else {
        renderer.setGraph(graph);
        renderer.setSetting("labelRenderedSizeThreshold", graph.order < 300 ? 0 : 6);
        renderer.setSetting("enableEdgeEvents", graph.size <= EDGE_EVENTS_LIMIT);
      }
      metrics.built2d = Math.round(performance.now() - started);
      if (previous.size === 0 || previous.size !== graph.order) { relayout(); }
    }

    function relayout() {
      if (!graph || !libraries.graph) { return; }
      if (layout) { layout.kill(); }
      const library = window.graphologyLibrary;
      const settings = library.layoutForceAtlas2.inferSettings(graph);
      settings.barnesHutOptimize = graph.order > 1000;
      layout = new library.FA2Layout(graph, { settings: settings });
      layout.start();
      stopAt = performance.now() + Math.min(20000, 3000 + graph.order * 2);
      const watch = function () {
        if (!layout) { return; }
        if (performance.now() >= stopAt) {
          layout.stop();
          applyBands();
          return;
        }
        window.setTimeout(watch, 250);
      };
      watch();
    }

    // The hovered node's label on a dark plate, in place of the library's light one.
    function drawHover(context, data, settings) {
      const size = settings.labelSize;
      context.font = settings.labelWeight + " " + size + "px " + settings.labelFont;
      const label = typeof data.label === "string" ? data.label : "";
      const width = label ? context.measureText(label).width + 10 : 0;
      context.fillStyle = "#182033";
      context.strokeStyle = "#7aa2f7";
      context.lineWidth = 1;
      context.beginPath();
      context.arc(data.x, data.y, data.size + 3, 0, Math.PI * 2);
      context.fill();
      context.stroke();
      if (label) {
        const left = data.x + data.size + 4;
        context.fillRect(left, data.y - size / 2 - 4, width, size + 8);
        context.strokeRect(left, data.y - size / 2 - 4, width, size + 8);
        context.fillStyle = "#d6deeb";
        context.fillText(label, left + 5, data.y + size / 3);
      }
      context.fillStyle = data.color;
      context.beginPath();
      context.arc(data.x, data.y, data.size, 0, Math.PI * 2);
      context.fill();
    }

    function applyBands() {
      if (state.roles.size === 0) { return; }
      let spread = 0;
      graph.forEachNode(function (key, attributes) { spread = Math.max(spread, Math.abs(attributes.y)); });
      graph.forEachNode(function (key, attributes) {
        const place = band(state.nodeById.get(key));
        if (place !== null) { graph.setNodeAttribute(key, "y", place * spread + attributes.y * 0.25); }
      });
    }

    function nodeReducer(key, attributes) {
      const out = Object.assign({}, attributes);
      if (hiddenNode(key)) { out.hidden = true; return out; }
      if (!lit(key)) { out.color = DIM; out.label = ""; }
      if ((state.selected && state.selected.id === key) || state.hover === key) { out.highlighted = true; out.zIndex = 1; }
      return out;
    }

    function edgeReducer(key, attributes) {
      const out = Object.assign({}, attributes);
      const ends = graph.extremities(key);
      if (attributes.relation || hiddenNode(ends[0]) || hiddenNode(ends[1])) { out.hidden = true; return out; }
      const focus = state.hover || (state.selected && state.selected.kind === "node" ? state.selected.id : null);
      const touching = focus && (ends[0] === focus || ends[1] === focus);
      out.color = focus ? (touching ? EDGE_LIT : DIM) : EDGE;
      const close = renderer && renderer.getCamera().ratio < 0.35;
      out.label = touching || key === state.hoverEdge || (close && !focus) || (state.selected && state.selected.id === key) ? attributes.name : "";

    }

    // Relation assertions are drawn dotted, over the edges and under the nodes.
    function afterRender() {
      const now = performance.now();
      frames.push(now);
      while (frames.length && frames[0] < now - 1000) { frames.shift(); }
      metrics.fps2d = frames.length;
      if (!overlay) { return; }
      const ratio = window.devicePixelRatio || 1;
      const canvas = overlay.canvas;
      const box = renderer.getDimensions();
      if (canvas.width !== Math.round(box.width * ratio) || canvas.height !== Math.round(box.height * ratio)) {
        canvas.width = Math.round(box.width * ratio);
        canvas.height = Math.round(box.height * ratio);
      }
      overlay.setTransform(ratio, 0, 0, ratio, 0, 0);
      overlay.clearRect(0, 0, canvas.width, canvas.height);
      overlay.setLineDash([2, 4]);
      overlay.lineCap = "round";
      const focus = state.hover || (state.selected && state.selected.kind === "node" ? state.selected.id : null);
      state.relations.forEach(function (relation) {
        if (hiddenNode(relation.source) || hiddenNode(relation.target) || !validNow(relation.claim)) { return; }
        const a = renderer.getNodeDisplayData(relation.source);
        const b = renderer.getNodeDisplayData(relation.target);
        if (!a || !b) { return; }
        const from = renderer.framedGraphToViewport(a);
        const to = renderer.framedGraphToViewport(b);
        const touching = focus && (relation.source === focus || relation.target === focus);
        overlay.globalAlpha = relation.claim.lifecycle.kind === "Active" ? (focus && !touching ? 0.25 : 0.95) : 0.3;
        overlay.strokeStyle = RELATION;
        overlay.lineWidth = touching || (state.selected && state.selected.id === relation.id) ? 2.5 : 1.6;
        const mx = (from.x + to.x) / 2 - (to.y - from.y) * 0.12;
        const my = (from.y + to.y) / 2 + (to.x - from.x) * 0.12;

        overlay.moveTo(from.x, from.y);
        overlay.quadraticCurveTo(mx, my, to.x, to.y);

          overlay.globalAlpha = 1;
          overlay.fillStyle = RELATION;
          overlay.font = "11px system-ui, sans-serif";

        }
      });
      overlay.globalAlpha = 1;
      overlay.setLineDash([]);
      showMetrics();
    }

    function refresh() { if (renderer) { renderer.refresh({ skipIndexation: true }); } }

    function focus(id) {
      if (!renderer || !graph || !graph.hasNode(id)) { return; }
      const at = renderer.getNodeDisplayData(id);
      if (at) { renderer.getCamera().animate({ x: at.x, y: at.y, ratio: Math.min(renderer.getCamera().ratio, 0.4) }, { duration: 400 }); }
    }

    function camera() {
      if (!renderer) { return null; }
      const at = renderer.getCamera().getState();
      // The zoom ratio keeps significant digits, so a deep zoom never writes a ratio of 0.
      return [Number(at.x.toFixed(4)), Number(at.y.toFixed(4)), Number(at.ratio.toPrecision(6))].join(",");
    }

    function resize() { if (renderer) { renderer.resize(true); renderer.refresh(); } }

    return { build: build, relayout: relayout, refresh: refresh, focus: focus, camera: camera, resize: resize };
  })();

  // ---------- 3D: 3d-force-graph ----------

  const space = (function () {
    let view = null;
    let data = null;
    let fitted = false;
    const frames = [];

    function build() {
      if (!libraries.space) { return; }
      if (state.view !== "3d" && !view) { return; }
      const started = performance.now();
      const nodes = state.projection.nodes.map(function (node) { return { id: node.id, type: node.type }; });
      const links = state.projection.edges
        .filter(function (edge) { return state.nodeById.has(edge.source) && state.nodeById.has(edge.target); })
        .map(function (edge) { return { id: edge.id, source: edge.source, target: edge.target, relation: false, predicate: edge.type }; })
        .concat(state.relations.map(function (relation) {
          return { id: relation.id, source: relation.source, target: relation.target, relation: true, predicate: relation.claim.predicate, claim: relation.claim };
        }));
      data = { nodes: nodes, links: links };
      if (!view) {
        try {
          view = window.ForceGraph3D({ controlType: "orbit" })($("space"));
        } catch (error) {
          notice("the 3D view could not start: " + error.message);
          view = null;
          return;
        }
        // Tooltips are this page's own and write text only; the library's are switched off.
        view
          .backgroundColor("#0b0f17")
          .showNavInfo(false)
          .nodeLabel(function () { return ""; })
          .linkLabel(function () { return ""; })
          .nodeResolution(8)
          .nodeRelSize(3)
          .nodeVal(function (node) { return sizeOf(node.id); })
          .nodeColor(function (node) { return lit(node.id) ? state.typeColor.get(node.type) || "#8892b0" : DIM; })
          .nodeVisibility(function (node) { return !hiddenNode(node.id); })
          .linkVisibility(function (link) {
            const a = typeof link.source === "object" ? link.source.id : link.source;
            const b = typeof link.target === "object" ? link.target.id : link.target;
            return !hiddenNode(a) && !hiddenNode(b) && (!link.relation || validNow(link.claim));
          })
          .linkColor(function (link) {
            if (link.relation) { return RELATION; }
            const a = typeof link.source === "object" ? link.source.id : link.source;
            const b = typeof link.target === "object" ? link.target.id : link.target;
            const focus = state.hover || (state.selected && state.selected.kind === "node" ? state.selected.id : null);
            return focus ? (a === focus || b === focus ? EDGE_LIT : DIM) : EDGE;
          })
          .linkOpacity(0.55)
          .linkWidth(function (link) { return link.relation ? 0 : 0.4; })
          .linkDirectionalParticles(function (link) { return link.relation ? 6 : 0; })
          .linkDirectionalParticleSpeed(0.004)
          .linkDirectionalParticleWidth(1.6)
          .linkDirectionalParticleColor(function () { return RELATION; })
          .cooldownTime(15000)
          .onNodeHover(function (node) {
            state.hover = node ? node.id : null;
            tip(node ? (state.nodeById.get(node.id) || {}).name : null, lastPointer);
            restyle();
          })
          .onLinkHover(function (link) {
            tip(link ? state.edgeTypeName.get(link.predicate) || link.predicate : null, lastPointer);
          })
          .onNodeClick(function (node) { select("node", node.id); focus(node.id); })
          .onLinkClick(function (link) { select(link.relation ? "assertion" : "edge", link.id); })
          .onBackgroundClick(function () { select(null, null); })
          .onEngineTick(tick)
          .onEngineStop(function () {
            if (!fitted && !state.camera3) { view.zoomToFit(600, 40); }
            fitted = true;
          });
        view.controls().addEventListener("change", function () { scheduleUrl(); });
        if (state.camera3) { view.cameraPosition({ x: state.camera3[0], y: state.camera3[1], z: state.camera3[2] }); }
      }
      const large = nodes.length > 2000;
      view.nodeResolution(large ? 4 : 8).cooldownTicks(large ? 300 : Infinity);
      view.graphData(data);
      metrics.built3d = Math.round(performance.now() - started);
      resize();
    }

    function tick() {
      const now = performance.now();
      frames.push(now);
      while (frames.length && frames[0] < now - 1000) { frames.shift(); }
      metrics.fps3d = frames.length;
      showMetrics();
    }

    function restyle() {
      if (!view) { return; }
      view.nodeColor(view.nodeColor()).linkColor(view.linkColor()).nodeVisibility(view.nodeVisibility()).linkVisibility(view.linkVisibility());
    }

    function focus(id) {
      if (!view || !data) { return; }
      const node = data.nodes.find(function (candidate) { return candidate.id === id; });
      if (!node || typeof node.x !== "number") { return; }
      const distance = 90;
      const length = Math.hypot(node.x, node.y, node.z) || 1;
      const ratio = 1 + distance / length;
      view.cameraPosition({ x: node.x * ratio, y: node.y * ratio, z: node.z * ratio }, node, 600);
    }

    function camera() {
      if (!view) { return null; }
      const at = view.cameraPosition();
      return [at.x, at.y, at.z].map(function (n) { return Math.round(n); }).join(",");
    }

    function pause(paused) {
      if (!view) { return; }
      if (paused) { view.pauseAnimation(); } else { view.resumeAnimation(); }
    }

    function resize() {
      if (!view) { return; }
      const box = $("graph-view").getBoundingClientRect();

    return { build: build, restyle: restyle, focus: focus, camera: camera, pause: pause, resize: resize, relayout: relayout };
  })();

  // ---------- shared view state ----------

  const metrics = { built2d: null, built3d: null, fps2d: 0, fps3d: 0 };
  function showMetrics() {
    const parts = [];
    if (state.projection) { parts.push(state.projection.nodes.length + " node", state.projection.edges.length + " edge", state.relations.length + " relation assertion"); }
    if (state.view === "2d" && metrics.built2d !== null) { parts.push("2D built " + metrics.built2d + " ms", metrics.fps2d + " frame/s"); }
    if (state.view === "3d" && metrics.built3d !== null) { parts.push("3D built " + metrics.built3d + " ms", metrics.fps3d + " tick/s"); }
    $("metrics").textContent = parts.join(" · ");
  }

  function restyle() {
    flat.refresh();
    space.restyle();
  }

  function notice(message) {
    const element = $("notice");
    element.textContent = message;
    element.hidden = !message;
  }

  let lastPointer = null;
  $("graph-view").addEventListener("pointermove", function (event) { lastPointer = event; });

  function tip(label, event) {
    const element = $("tip");
    if (!label || !event) { element.hidden = true; return; }
    const box = $("graph-view").getBoundingClientRect();
    element.textContent = label;
    element.style.left = (event.clientX - box.left + 12) + "px";
    element.style.top = (event.clientY - box.top + 12) + "px";
    element.hidden = false;
  }

  // ---------- DOM helpers ----------

  function text(tag, value, className) {
    const element = document.createElement(tag);
    if (value !== undefined && value !== null) { element.textContent = String(value); }
    if (className) { element.className = className; }
    return element;
  }

  function clear(element) {
    while (element.firstChild) { element.removeChild(element.firstChild); }
    return element;
  }

  function status(message) { $("status").textContent = message; }

  function link(label, onClick, className) {
    const button = text("button", label, "link" + (className ? " " + className : ""));
    button.type = "button";
    button.addEventListener("click", onClick);
    return button;
  }

  function table(headings, rows, classes) {
    const element = document.createElement("table");
    const head = element.createTHead().insertRow();
    headings.forEach(function (heading) { head.appendChild(text("th", heading)); });
    const body = element.createTBody();
    rows.forEach(function (cells, index) {
      const row = body.insertRow();
      if (classes && classes[index]) { row.className = classes[index]; }
      cells.forEach(function (cell) {
        const td = row.insertCell();
        if (cell instanceof Node) { td.appendChild(cell); } else { td.textContent = cell === null || cell === undefined ? "" : String(cell); }
      });
    });
    return element;
  }

  function group(parts) {
    const span = document.createElement("span");
    parts.forEach(function (part, index) {
      if (index > 0) { span.appendChild(document.createTextNode(" ")); }
      span.appendChild(part instanceof Node ? part : document.createTextNode(String(part)));
    });
    return span;
  }

  // A time as a date where a date can hold it, else its exact milliseconds; a missing one is "…".
  function when(millis) {
    const at = bound(millis);
    if (at === null) { return "…"; }
    const date = new Date(Number(at));
    return isNaN(date.getTime()) ? at.toString() : date.toISOString().replace(".000Z", "Z");
  }

  // Ids share long prefixes; their tail tells them apart.
  function shortId(id) { return "…" + String(id).slice(-8); }

  function span(from, to) { return when(from) + " → " + (bound(to) === null ? "…" : when(to)); }

  function nameOfId(id) {
    const node = state.nodeById.get(id);
    if (node) { return node.name; }
    return state.typeName.get(id) || state.edgeTypeName.get(id) || state.propertyName.get(id) || id;
  }

  function value(projected) {
    if (!projected || typeof projected !== "object") { return String(projected); }
    switch (projected.kind) {
      case "Timestamp": return when(projected.value);
      case "Duration": return projected.value + " ms";
      case "NodeRef": return nameOfId(projected.value);
      case "List": return "[" + projected.value.map(value).join(", ") + "]";
      case "Record": return "{" + Object.keys(projected.value).map(function (key) { return key + ": " + value(projected.value[key]); }).join(", ") + "}";
      default: return String(projected.value);
    }
  }

  function assessment(projected) {
    const parts = [projected.kind];
    if (typeof projected.completed === "number") { parts.push(projected.completed + " of " + projected.required); }
    if (projected.validators) { parts.push(projected.validators.length + " validator"); }
    if (projected.issues && projected.issues.length) { parts.push(projected.issues.join("; ")); }
    if (projected.competing_assertions && projected.competing_assertions.length) { parts.push("against " + projected.competing_assertions.join(", ")); }
    return parts.join(" ");
  }

  function lifecycle(projected) {
    const parts = [projected.kind];
    if (typeof projected.at_revision === "number") { parts.push("at revision " + projected.at_revision); }
    if (projected.by) { parts.push("by " + projected.by); }
    if (bound(projected.effective_from) !== null) { parts.push("from " + when(projected.effective_from)); }
    if (projected.reason) { parts.push(projected.reason); }
    return parts.join(" ");
  }

  function predicate(claim) {
    if (claim.predicate_kind === "Property") { return state.propertyName.get(claim.predicate) || claim.predicate; }
    return state.edgeTypeName.get(claim.predicate) || state.typeName.get(claim.predicate) || claim.predicate;
  }

  function object(claim) {
    if (claim.object_kind === "Value") { return value(claim.object_value); }
    if (claim.object_kind === "Node" && state.nodeById.has(claim.object_ref)) {
      return link(nameOfId(claim.object_ref), function () { focusNode(claim.object_ref); });
    }
    return nameOfId(claim.object_ref);
  }

  function evidenceLinks(ids) {
    return group(ids.map(function (id) { return link(shortId(id), function () { showEvidence(id); }, "id"); }));
  }

  function assertionTable(claims) {
    if (claims.length === 0) { return text("p", "no assertion", "muted"); }
    const list = document.createElement("div");
    claims.slice(0, INDEX_LIMIT).forEach(function (claim) {
      const card = table(["assertion", claim.id], [
        ["predicate", predicate(claim)],
        ["object", object(claim)],
        ["assessment", assessment(claim.assessment)],
        ["lifecycle", lifecycle(claim.lifecycle)],
        ["valid", span(claim.valid_from, claim.valid_to)],
        ["recorded", span(claim.recorded_from, claim.recorded_to)],
        ["evidence", evidenceLinks(claim.evidence)]
      ]);
      card.className = "claim" + (validNow(claim) ? "" : " outside");
      list.appendChild(card);
    });
    if (claims.length > INDEX_LIMIT) { list.appendChild(text("p", (claims.length - INDEX_LIMIT) + " more assertion", "muted")); }

  }

  function propsTable(props) {
    const keys = Object.keys(props);
    if (keys.length === 0) { return text("p", "no property value", "muted"); }
    return table(["property", "value"], keys.map(function (key) {
      return [state.propertyName.get(key) || key, props[key].map(value).join(", ")];
    }));
  }

  // ---------- detail ----------

  function select(kind, id) {
    state.selected = kind ? { kind: kind, id: id } : null;
    state.evidenceShown = null;
    showDetail();
    restyle();
    writeUrl();
  }

  function focusNode(id) {
    select("node", id);
    if (state.view === "3d") { space.focus(id); } else { flat.focus(id); }
  }

  function showDetail() {
    const detail = clear($("detail"));
    const selected = state.selected;
    if (!state.projection) { return; }
    if (selected && selected.kind === "node" && state.nodeById.has(selected.id)) { showNode(detail, state.nodeById.get(selected.id)); }
    else if (selected && selected.kind === "edge" && state.edgeById.has(selected.id)) { showEdge(detail, state.edgeById.get(selected.id)); }
    else if (selected && selected.kind === "assertion") { showRelation(detail, selected.id); }
    else { showIndex(detail); }
    if (state.evidenceShown) { detail.appendChild(evidencePanel(state.evidenceShown)); }
  }

  const INDEX_LIMIT = 200;

  function showIndex(detail) {
    detail.appendChild(text("h2", "nodes"));
    const members = new Map();
    state.projection.nodes.forEach(function (node) {
      if (!members.has(node.type)) { members.set(node.type, []); }
      members.get(node.type).push(node);
    });
    state.projection.ontology.node_types.forEach(function (type) {
      const list = members.get(type.id) || [];
      if (list.length === 0) { return; }
      const heading = text("h3");
      heading.appendChild(swatch(type.id));
      heading.appendChild(document.createTextNode(type.name + " (" + list.length + ")"));
      detail.appendChild(heading);
      const ul = document.createElement("ul");
      list.slice(0, INDEX_LIMIT).forEach(function (node) {
        const item = document.createElement("li");
        item.appendChild(link(node.name, function () { focusNode(node.id); }));
        ul.appendChild(item);
      });
      detail.appendChild(ul);
      if (list.length > INDEX_LIMIT) { detail.appendChild(text("p", (list.length - INDEX_LIMIT) + " more: find them with Ctrl+K", "muted")); }
    });
    const untyped = state.projection.nodes.filter(function (node) { return !state.typeName.has(node.type); });
    if (untyped.length) {
      detail.appendChild(text("h3", "node of an undeclared type (" + untyped.length + ")"));
      untyped.slice(0, INDEX_LIMIT).forEach(function (node) { detail.appendChild(group([link(node.name, function () { focusNode(node.id); })])); });
    }
  }

  function showNode(detail, node) {
    detail.appendChild(text("h2", node.name));
    detail.appendChild(group(["node ·", swatch(node.type), state.typeName.get(node.type) || node.type, role(node.type)]));
    detail.appendChild(text("div", node.id, "id muted"));
    if (node.aliases.length) { detail.appendChild(text("div", "also " + node.aliases.join(", "), "muted")); }
    if (node.state) { detail.appendChild(text("div", "state " + node.state, "muted")); }
    detail.appendChild(text("h3", "property"));
    detail.appendChild(propsTable(node.props));
    const touching = state.projection.edges.filter(function (edge) { return edge.source === node.id || edge.target === node.id; });
    detail.appendChild(text("h3", "edge (" + touching.length + ")"));
    if (touching.length === 0) { detail.appendChild(text("p", "no edge", "muted")); }
    touching.slice(0, INDEX_LIMIT).forEach(function (edge) {
      const out = edge.source === node.id;
      const other = out ? edge.target : edge.source;
      detail.appendChild(text("div")).appendChild(group([
        out ? "→" : "←",
        link(state.edgeTypeName.get(edge.type) || edge.type, function () { select("edge", edge.id); }),
        link(nameOfId(other), function () { focusNode(other); })
      ]));
    });
    detail.appendChild(text("h3", "assertion (" + node.assertions.length + ")"));
    detail.appendChild(assertionTable(node.assertions));
    const inbound = state.relations.filter(function (relation) { return relation.target === node.id; });
    if (inbound.length) {
      detail.appendChild(text("h3", "assertion naming this node (" + inbound.length + ")"));
      inbound.slice(0, INDEX_LIMIT).forEach(function (relation) {
        detail.appendChild(text("div")).appendChild(group([
          link(nameOfId(relation.source), function () { focusNode(relation.source); }),
          predicate(relation.claim),
          link(shortId(relation.id), function () { select("assertion", relation.id); }, "id")
        ]));
      });
    }
  }

  function showEdge(detail, edge) {
    detail.appendChild(text("h2", state.edgeTypeName.get(edge.type) || edge.type));
    detail.appendChild(group(["edge", text("span", edge.id, "id muted")]));
    detail.appendChild(text("div")).appendChild(group([
      link(nameOfId(edge.source), function () { focusNode(edge.source); }),
      "→",
      link(nameOfId(edge.target), function () { focusNode(edge.target); })
    ]));
    detail.appendChild(text("h3", "property"));
    detail.appendChild(propsTable(edge.props));
    detail.appendChild(text("h3", "assertion (" + edge.assertions.length + ")"));
    detail.appendChild(assertionTable(edge.assertions));
  }

  function showRelation(detail, id) {
    let claim = null;
    let subject = null;
    state.projection.nodes.forEach(function (node) {
      node.assertions.forEach(function (candidate) { if (candidate.id === id) { claim = candidate; subject = node; } });
    });
    if (!claim) { showIndex(detail); return; }
    detail.appendChild(text("h2", predicate(claim)));
    detail.appendChild(group(["assertion", text("span", claim.id, "id muted")]));
    detail.appendChild(text("div")).appendChild(group([
      link(subject.name, function () { focusNode(subject.id); }), "→", object(claim)
    ]));
    detail.appendChild(assertionTable([claim]));
  }

  function swatch(typeId) {
    const element = text("span", null, "swatch");
    element.style.background = state.typeColor.get(typeId) || "#8892b0";
    return element;
  }

  function role(typeId) {
    const assigned = state.roles.get(typeId);
    return assigned ? "· role " + assigned : "";
  }

  // ---------- evidence ----------

  function showEvidence(id) {
    state.evidenceShown = id;
    showDetail();
    writeUrl();
  }

  function evidencePanel(id) {
    const panel = document.createElement("section");
    panel.appendChild(text("h3", "evidence"));
    const item = state.evidenceById.get(id);
    if (item) {
      panel.appendChild(table(["field", "value"], [
        ["id", item.id],
        ["kind", item.kind],
        ["locator", item.locator],
        ["section", item.section || ""],
        ["content hash", item.content_hash],
        ["observed", when(item.observed_at)],
        ["confidence", (item.confidence_bp / 100).toFixed(2) + " %"],
        ["retained", item.retained ? "yes" : "no"]
      ]));
    } else {
      // Only evidence the loaded projection holds is ever read: an id from anywhere else is shown
      // as text and never becomes part of an address.
      panel.appendChild(text("p", id + " is not in this revision's evidence", "muted"));
      return panel;
    }
    const body = text("pre", "reading " + item.id);
    panel.appendChild(body);
    if (!item.retained) {
      body.textContent = "the bytes of this evidence are not retained";
      return panel;
    }
    evidenceText(item.id).then(function (shown) { body.textContent = shown; });
    return panel;
  }

  // One read per evidence id for the life of the page: retained evidence bytes never change under
  // an id, and redrawing the panel (a slider, a selection) must not read them again.
  const evidenceRead = new Map();
  function evidenceText(id) {
    if (!evidenceRead.has(id)) {
      evidenceRead.set(id, get(EVIDENCE + encodeURIComponent(id))
        .then(function (response) {
          if (!response.ok) {
            return response.text().then(function (message) { throw new Error(response.status + " " + message.trim()); });
          }
          const type = response.headers.get("content-type") || "";
          return response.arrayBuffer().then(function (bytes) {
            return type.indexOf("text/plain") === 0 ? new TextDecoder("utf-8").decode(bytes) : bytes.byteLength + " bytes that are not text";
          });
        })
        .catch(function (error) {
          evidenceRead.delete(id);
          return "the evidence did not load: " + error.message;
        }));
    }
    return evidenceRead.get(id);
  }

  // ---------- legend, schema, timeline ----------

  function fillLegend() {
    const legend = clear($("legend"));
    const list = document.createElement("ul");
    const counts = new Map();
    state.projection.nodes.forEach(function (node) { counts.set(node.type, (counts.get(node.type) || 0) + 1); });
    state.projection.ontology.node_types.forEach(function (type) {
      const item = document.createElement("li");
      item.appendChild(swatch(type.id));
      item.appendChild(document.createTextNode(type.name + " " + (counts.get(type.id) || 0) + " " + role(type.id)));
      if (state.hiddenTypes.has(type.id)) { item.className = "off"; }
      item.title = type.id;
      item.addEventListener("click", function (event) {
        if (event.altKey) { solo(type.id); return; }
        if (state.hiddenTypes.has(type.id)) { state.hiddenTypes.delete(type.id); } else { state.hiddenTypes.add(type.id); }
        fillLegend();
        restyle();
      });
      list.appendChild(item);
    });
    legend.appendChild(list);
    legend.appendChild(group([text("span", null, "line-key"), "edge"]));
    legend.appendChild(document.createElement("br"));
    legend.appendChild(group([text("span", null, "line-key dotted"), "relation assertion"]));
  }

  function solo(typeId) {
    state.hiddenTypes = new Set(state.projection.ontology.node_types.map(function (type) { return type.id; }).filter(function (id) { return id !== typeId; }));
    fillLegend();
    restyle();
  }

  function fillSchema() {
    const view = clear($("schema-view"));
    const projection = state.projection;
    view.appendChild(text("h3", "schema version"));
    view.appendChild(table(["number", "id", "parent", "revision", "added"], projection.schema.versions.map(function (version) {
      return [version.number, text("code", version.id), version.parent ? text("code", version.parent) : "", version.revision, version.added.map(nameOfId).join(", ")];
    })));
    view.appendChild(text("h3", "revision"));
    const numberOf = new Map(projection.schema.versions.map(function (version) { return [version.id, version.number]; }));
    view.appendChild(table(["revision", "committed", "transaction", "schema version"], projection.schema.revisions.map(function (revision) {
      return [
        link(String(revision.number), function () { goRevision(revision.number); }),
        when(revision.committed_at),
        revision.transaction_id ? text("code", revision.transaction_id) : "",
        numberOf.has(revision.schema_version) ? numberOf.get(revision.schema_version) : revision.schema_version
      ];
    })));
    const counts = new Map();
    projection.nodes.forEach(function (node) { counts.set(node.type, (counts.get(node.type) || 0) + 1); });
    projection.edges.forEach(function (edge) { counts.set(edge.type, (counts.get(edge.type) || 0) + 1); });
    view.appendChild(text("h3", "node type"));
    view.appendChild(table(["type", "id", "role", "property", "node", "assertion"], projection.ontology.node_types.map(function (type) {
      return [group([swatch(type.id), type.name]), text("code", type.id), state.roles.get(type.id) || "", type.properties.map(nameOfId).join(", "), counts.get(type.id) || 0, type.assertions.length];
    })));
    view.appendChild(text("h3", "edge type"));
    view.appendChild(table(["edge type", "id", "source", "target", "property", "edge", "assertion"], projection.ontology.edge_types.map(function (type) {
      return [type.name, text("code", type.id), type.source_types.map(nameOfId).join(", "), type.target_types.map(nameOfId).join(", "), type.properties.map(nameOfId).join(", "), counts.get(type.id) || 0, type.assertions.length];
    })));
    view.appendChild(text("h3", "property"));
    view.appendChild(table(["property", "id", "value kind"], projection.ontology.properties.map(function (property) {
      return [property.name, text("code", property.id), property.value_kind];
    })));
    const typeClaims = [];
    projection.ontology.node_types.concat(projection.ontology.edge_types).forEach(function (type) {
      type.assertions.forEach(function (claim) { typeClaims.push(claim); });
    });
    if (typeClaims.length) {
      view.appendChild(text("h3", "assertion about a type"));
      view.appendChild(assertionTable(typeClaims));
    }
  }

  function fillRevisions(projection) {
    const select = clear($("revision"));
    const strip = clear($("revisions"));
    const committed = new Map(projection.schema.revisions.map(function (revision) { return [revision.number, revision]; }));
    for (let number = state.head; number >= 0; number -= 1) {
      const option = text("option", number === state.head ? number + " (head)" : number);
      option.value = String(number);
      option.selected = number === projection.meta.revision;
      select.appendChild(option);
    }
    for (let number = 0; number <= state.head; number += 1) {
      const button = text("button", number);
      button.type = "button";
      const known = committed.get(number);
      button.title = known ? when(known.committed_at) : "revision " + number;
      if (number === projection.meta.revision) { button.className = "current"; }
      button.addEventListener("click", goRevision.bind(null, number));
      strip.appendChild(button);
    }
  }

  // The valid-time strip spans every valid-time bound the revision's assertions carry.
  let validSpan = null;
  function fillValidTime(projection) {
    const bounds = [];
    const collect = function (claim) {
      [bound(claim.valid_from), bound(claim.valid_to)].forEach(function (at) { if (at !== null) { bounds.push(at); } });
    };
    projection.nodes.forEach(function (node) { node.assertions.forEach(collect); });
    projection.edges.forEach(function (edge) { edge.assertions.forEach(collect); });
    const slider = $("valid");
    const all = $("valid-all");
    if (bounds.length === 0) {
      validSpan = null;
      state.validAt = null;
      all.checked = true;
      all.disabled = true;
      slider.disabled = true;
      $("valid-at").textContent = "no assertion carries a valid time";
      return;
    }
    let low = bounds[0];
    let high = bounds[0];
    bounds.forEach(function (at) { if (at < low) { low = at; } if (at > high) { high = at; } });
    validSpan = [low, high === low ? low + 1n : high];
    all.disabled = false;
    if (state.validAt !== null) {
      if (state.validAt < validSpan[0]) { state.validAt = validSpan[0]; }
      if (state.validAt > validSpan[1]) { state.validAt = validSpan[1]; }
      slider.value = String(((state.validAt - validSpan[0]) * 1000n) / (validSpan[1] - validSpan[0]));
    }
    all.checked = state.validAt === null;
    slider.disabled = state.validAt === null;
    $("valid-at").textContent = state.validAt === null ? "all valid time" : when(state.validAt);
  }

  function readSlider() {
    if (!validSpan || $("valid-all").checked) {
      state.validAt = null;
    } else {
      state.validAt = validSpan[0] + ((validSpan[1] - validSpan[0]) * BigInt($("valid").value)) / 1000n;
    }
    $("valid").disabled = state.validAt === null;
    $("valid-at").textContent = state.validAt === null ? "all valid time" : when(state.validAt);
    showDetail();
    restyle();
    scheduleUrl();
  }

  $("valid").addEventListener("input", readSlider);
  $("valid-all").addEventListener("change", readSlider);

  function goRevision(number) {
    const head = state.projection ? state.head : null;
    state.revision = number === head ? null : number;
    load();
  }

  $("revision").addEventListener("change", function (event) { goRevision(Number(event.target.value)); });

  // ---------- views, palette, URL ----------

  function show(view) {
    state.view = view === "3d" || view === "schema" ? view : "2d";
    const graphShown = state.view !== "schema";
    $("graph-view").hidden = !graphShown;
    $("schema-view").hidden = graphShown;
    $("sigma").hidden = state.view !== "2d";
    $("space").hidden = state.view !== "3d";
    $("relayout").hidden = !graphShown;
    ["2d", "3d", "schema"].forEach(function (name) { $("show-" + name).className = state.view === name ? "on" : ""; });
    const missing = state.view === "2d" && !libraries.graph ? "2D" : state.view === "3d" && !libraries.space ? "3D" : null;
    notice(missing ? "the " + missing + " graph libraries did not load; the lists and the schema still work" : "");
    if (state.view === "3d" && state.projection) { space.build(); }
    space.pause(state.view !== "3d");
    if (state.view === "2d") { flat.resize(); }
    if (state.view === "3d") { space.resize(); }
    showMetrics();
    writeUrl();
  }

  $("show-2d").addEventListener("click", function () { show("2d"); });
  $("show-3d").addEventListener("click", function () { show("3d"); });
  $("show-schema").addEventListener("click", function () { show("schema"); });
  $("relayout").addEventListener("click", function () { if (state.view === "3d") { space.relayout(); } else { flat.relayout(); } });
  window.addEventListener("resize", function () { flat.resize(); space.resize(); });

  let urlTimer = null;
  function scheduleUrl() {
    if (urlTimer !== null) { return; }
    urlTimer = window.setTimeout(function () { urlTimer = null; writeUrl(); }, 300);
  }

  function writeUrl() {
    const params = new URLSearchParams();
    if (state.revision !== null) { params.set("revision", String(state.revision)); }
    if (state.view !== "2d") { params.set("view", state.view); }
    if (state.selected) { params.set(state.selected.kind, state.selected.id); }
    if (state.evidenceShown) { params.set("evidence", state.evidenceShown); }
    if (state.validAt !== null) { params.set("valid", String(state.validAt)); }
    const camera = flat.camera();
    if (camera) { params.set("camera", camera); }
    const camera3 = space.camera();
    if (camera3) { params.set("camera3", camera3); }
    const search = params.toString();
    window.history.replaceState(null, "", search ? "?" + search : window.location.pathname);
  }

  function numbers(raw, length) {
    if (!raw) { return null; }
    const parts = raw.split(",").map(Number);
    return parts.length === length && parts.every(isFinite) ? parts : null;
  }

  function readUrl() {
    const params = new URLSearchParams(window.location.search);
    const revision = params.get("revision");
    state.revision = revision !== null && /^[0-9]+$/.test(revision) ? Number(revision) : null;
    ["node", "edge", "assertion"].forEach(function (kind) {
      if (params.get(kind)) { state.selected = { kind: kind, id: params.get(kind) }; }
    });
    state.evidenceShown = params.get("evidence") || null;
    const valid = params.get("valid");
    state.validAt = valid !== null && /^-?[0-9]+$/.test(valid) ? BigInt(valid) : null;
    // A camera from the URL is used only when it can be a camera: a 2D zoom ratio above zero, and
    // a 3D position off the point it looks at. Anything else falls back to the default view.
    const camera = numbers(params.get("camera"), 3);
    state.camera = camera && camera[2] > 0 ? { x: camera[0], y: camera[1], ratio: camera[2], angle: 0 } : null;
    const camera3 = numbers(params.get("camera3"), 3);
    state.camera3 = camera3 && camera3.some(function (n) { return n !== 0; }) ? camera3 : null;
    const view = params.get("view");
    state.view = view === "3d" || view === "schema" ? view : "2d";
  }

  const palette = $("palette");
  const paletteInput = $("palette-input");
  const paletteList = $("palette-list");
  let choices = [];
  let chosen = 0;

  function entries(words) {
    const all = [
      { label: "view 2D", run: function () { show("2d"); } },
      { label: "view 3D", run: function () { show("3d"); } },
      { label: "view schema", run: function () { show("schema"); } },
      { label: "show every type", run: function () { state.hiddenTypes = new Set(); fillLegend(); restyle(); } }
    ];
    if (!state.projection) { return all; }
    state.projection.ontology.node_types.forEach(function (type) {
      all.push({ label: "type " + type.name + " · show only it", run: function () { solo(type.id); } });
    });
    state.projection.schema.revisions.forEach(function (revision) {
      all.push({ label: "revision " + revision.number, run: function () { goRevision(revision.number); } });
    });
    const matching = function (label) {
      const lower = label.toLowerCase();
      return words.every(function (word) { return lower.indexOf(word) >= 0; });
    };
    const found = all.filter(function (entry) { return matching(entry.label); });
    for (let index = 0; index < state.projection.nodes.length && found.length < 200; index += 1) {
      const node = state.projection.nodes[index];
      const label = node.name + " · " + (state.typeName.get(node.type) || node.type);
      if (matching(label) || (words.length === 1 && node.id === words[0])) {
        found.push({ label: label, run: function () { show(state.view === "schema" ? "2d" : state.view); focusNode(node.id); } });
      }
    }
    return found;
  }

  function filterPalette() {
    const words = paletteInput.value.toLowerCase().split(/\s+/).filter(Boolean);
    choices = entries(words).slice(0, 200);
    chosen = Math.min(chosen, Math.max(0, choices.length - 1));
    clear(paletteList);
    choices.forEach(function (entry, index) {
      const item = text("li", entry.label, index === chosen ? "active" : "");
      item.addEventListener("click", function () { run(index); });
      paletteList.appendChild(item);
    });
  }

  function openPalette() {
    paletteInput.value = "";
    chosen = 0;
    filterPalette();
    if (typeof palette.showModal === "function") { palette.showModal(); } else { palette.setAttribute("open", ""); }
    paletteInput.focus();
  }

  function run(index) {
    const entry = choices[index];
    palette.close();
    if (entry) { entry.run(); }
  }

  paletteInput.addEventListener("input", function () { chosen = 0; filterPalette(); });
  paletteInput.addEventListener("keydown", function (event) {
    if (event.key === "ArrowDown") { chosen = Math.min(choices.length - 1, chosen + 1); filterPalette(); event.preventDefault(); }
    else if (event.key === "ArrowUp") { chosen = Math.max(0, chosen - 1); filterPalette(); event.preventDefault(); }
    else if (event.key === "Enter") { run(chosen); event.preventDefault(); }
  });
  $("find").addEventListener("focus", function (event) { event.target.blur(); openPalette(); });
  document.addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") { event.preventDefault(); openPalette(); }
    else if (event.key === "Escape" && state.evidenceShown) { state.evidenceShown = null; showDetail(); writeUrl(); }
  });

  readUrl();
  load();
})();
</script>
</body>
</html>
