# story:add-evidence-operation, acceptance 2, the citation half.
#
# The target has committed revision 1 before the first act. The fixture
# `add-evidence-absent-citation.yaml` adds evidence 0403 and an assertion that cites 0499, which
# neither canonical state nor this transaction holds. Evidence a transaction adds resolves; any
# other id does not. Validation rejects it with exactly one issue, which the Reference validator
# raises under the name unresolved-evidence.
type: ess-scenario/1
domain: ekr.kernel
scenario: an-assertion-citing-evidence-no-revision-holds-is-rejected-by-name
summary: An assertion citing evidence that neither a revision nor its own transaction holds is rejected with one issue, unresolved-evidence, raised by Reference.

arrange:
  - instance: proposal
    entity: ekr.kernel.GraphTransaction

timeline:
  - at: 2027-01-15T08:00:00Z
    command: ekr.kernel.Propose
    actor: ekr.kernel.Proposer
    input:
      transaction_document: transaction_document
    outcome: proposed
    events:
      - event: ekr.kernel.TransactionProposed
    capture: {instance: proposal, event: ekr.kernel.TransactionProposed, field: transaction_id}

  - at: 2027-01-15T08:00:01Z
    command: ekr.kernel.Validate
    actor: ekr.kernel.Validator
    input:
      transaction_id: {$instance: proposal}
      against: 1
    outcome: rejected
    events:
      - event: ekr.kernel.TransactionRejected
        payload:
          issues: 1

assert:
  - view: ekr.kernel.ValidationIssues
    contains:
      transaction_id: {$instance: proposal}
      validator: Reference
      code: unresolved-evidence
