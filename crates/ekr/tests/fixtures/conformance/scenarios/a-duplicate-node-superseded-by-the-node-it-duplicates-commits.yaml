# story:supersede-node, acceptance a-supersession-is-its-own-revision.
#
# The target has committed revision 1 before the first act: assertion 85f861a70a8d, Alice CEO of
# Acme. One transaction (fixture `supersede-node.yaml`) supersedes Bob (0302) by Alice (0301), for
# a reason and on the seed's evidence 0401, which its evidence set lists. It is proposed,
# validated against revision 1 and committed as revision 2, a revision of its own.
#
# That Bob then leaves every head read, that his record names Alice, the reason and the evidence,
# and that every earlier revision still holds him, is held on both providers by
# crates/ekr-kernel/tests/supersede_node.rs and crates/ekr-views/tests/supersession.rs.
type: ess-scenario/1
domain: ekr.kernel
scenario: a-duplicate-node-superseded-by-the-node-it-duplicates-commits
summary: A transaction that supersedes a node the head holds by another, with a reason and evidence, validates and commits as a revision of its own.

arrange:
  - instance: supersession
    entity: ekr.kernel.GraphTransaction

timeline:
  - at: 2027-01-15T08:00:00Z
    command: ekr.kernel.Propose
    actor: ekr.kernel.Proposer
    input:
      transaction_document: supersession
    outcome: proposed
    events:
      - event: ekr.kernel.TransactionProposed
    capture: {instance: supersession, event: ekr.kernel.TransactionProposed, field: transaction_id}

  - at: 2027-01-15T08:00:01Z
    command: ekr.kernel.Validate
    actor: ekr.kernel.Validator
    input:
      transaction_id: {$instance: supersession}
      against: 1
    outcome: validated
    events:
      - event: ekr.kernel.TransactionValidated
        payload:
          against: 1

  - at: 2027-01-15T08:00:02Z
    command: ekr.kernel.Commit
    actor: ekr.kernel.Committer
    input:
      transaction_id: {$instance: supersession}
    outcome: committed
    events:
      - event: ekr.kernel.RevisionCommitted
        payload:
          number: 2

assert:
  - view: ekr.kernel.Transactions
    contains:
      transaction_id: {$instance: supersession}
      state: Committed
      validated_against: 1

  - view: ekr.kernel.CurrentRevision
    contains:
      number: 2
