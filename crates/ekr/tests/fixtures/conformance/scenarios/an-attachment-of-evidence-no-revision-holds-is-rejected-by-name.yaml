# story:evidence-attaches-to-a-held-assertion, acceptance 2, the unknown evidence.
#
# The target has committed revision 1 before the first act. The fixture
# `attach-evidence-unknown-evidence.yaml` attaches evidence 0499 to assertion 85f861a70a8d, which
# revision 1 holds; neither canonical state nor an AddEvidence of the transaction holds 0499.
# Validation rejects it with exactly one issue, which the Reference validator raises under the
# name unresolved-evidence.
type: ess-scenario/1
domain: ekr.kernel
scenario: an-attachment-of-evidence-no-revision-holds-is-rejected-by-name
summary: Evidence that neither a revision nor its own transaction holds, attached to a held assertion, is rejected with one issue, unresolved-evidence, raised by Reference.

arrange:
  - instance: proposal
    entity: ekr.kernel.GraphTransaction

timeline:
  - at: 2027-01-15T08:00:00Z
    command: ekr.kernel.Propose
    actor: ekr.kernel.Proposer
    input:
      transaction_document: attachment
    outcome: proposed
    events:
      - event: ekr.kernel.TransactionProposed
    capture: {instance: proposal, event: ekr.kernel.TransactionProposed, field: transaction_id}

  - at: 2027-01-15T08:00:01Z
    command: ekr.kernel.Validate
    actor: ekr.kernel.Validator
    input:
      transaction_id: {$instance: proposal}
      against: 1
    outcome: rejected
    events:
      - event: ekr.kernel.TransactionRejected
        payload:
          issues: 1

assert:
  - view: ekr.kernel.ValidationIssues
    contains:
      transaction_id: {$instance: proposal}
      validator: Reference
      code: unresolved-evidence
