# story:merge-entity-applies, acceptance a-merge-of-same-type-duplicates-rewrites-every-reference.
#
# The target has committed revision 1 before the first act: assertion 85f861a70a8d, Alice CEO of
# Acme. One transaction (fixture `merge-node.yaml`) merges Bob (0302) into Alice (0301), both
# Person, for a reason and on the seed's evidence 0401, which its evidence set lists. It is
# proposed, validated against revision 1 and committed as revision 2, a revision of its own.
#
# That Bob then leaves every head read into a record naming Alice and carrying the merge's lineage,
# that every reference to him names Alice, and that every earlier revision still holds him, is held
# on both providers by crates/ekr-kernel/tests/merge_entity.rs and crates/ekr-views/tests/merge.rs.
type: ess-scenario/1
domain: ekr.kernel
scenario: a-duplicate-node-merged-into-the-node-it-duplicates-commits
summary: A transaction that merges a node the head holds into another of its type, with a reason and evidence, validates and commits as a revision of its own.

arrange:
  - instance: merge
    entity: ekr.kernel.GraphTransaction

timeline:
  - at: 2027-01-15T09:00:00Z
    command: ekr.kernel.Propose
    actor: ekr.kernel.Proposer
    input:
      transaction_document: merge
    outcome: proposed
    events:
      - event: ekr.kernel.TransactionProposed
    capture: {instance: merge, event: ekr.kernel.TransactionProposed, field: transaction_id}

  - at: 2027-01-15T09:00:01Z
    command: ekr.kernel.Validate
    actor: ekr.kernel.Validator
    input:
      transaction_id: {$instance: merge}
      against: 1
    outcome: validated
    events:
      - event: ekr.kernel.TransactionValidated
        payload:
          against: 1

  - at: 2027-01-15T09:00:02Z
    command: ekr.kernel.Commit
    actor: ekr.kernel.Committer
    input:
      transaction_id: {$instance: merge}
    outcome: committed
    events:
      - event: ekr.kernel.RevisionCommitted
        payload:
          number: 2

assert:
  - view: ekr.kernel.Transactions
    contains:
      transaction_id: {$instance: merge}
      state: Committed
      validated_against: 1

  - view: ekr.kernel.CurrentRevision
    contains:
      number: 2
