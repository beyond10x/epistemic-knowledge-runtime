# story:edge-type-endpoints-widen, acceptance 3, the removal.
#
# The target runs validation profile v2 (`host-v2.json`), is seeded from `seed-authored.yaml`
# (AUTHORED from Person to Document) and has committed revision 1 before the first act. The fixture
# `widen-removing-an-end.yaml` names AUTHORED's target types as WorkItem alone, which drops
# Document. A widening only adds: validation rejects it with exactly one issue, which the
# OntologyConstraint validator raises under the name edge-endpoint-removed.
type: ess-scenario/1
domain: ekr.kernel
scenario: an-edge-type-widening-that-removes-an-end-is-rejected-by-name
summary: A widening whose target types leave out a type the edge type already has is rejected with one issue, edge-endpoint-removed, raised by OntologyConstraint.

arrange:
  - instance: proposal
    entity: ekr.kernel.GraphTransaction

timeline:
  - at: 2027-01-15T08:00:00Z
    command: ekr.kernel.Propose
    actor: ekr.kernel.Proposer
    input:
      transaction_document: widening
    outcome: proposed
    events:
      - event: ekr.kernel.TransactionProposed
    capture: {instance: proposal, event: ekr.kernel.TransactionProposed, field: transaction_id}

  - at: 2027-01-15T08:00:01Z
    command: ekr.kernel.Validate
    actor: ekr.kernel.Validator
    input:
      transaction_id: {$instance: proposal}
      against: 1
    outcome: rejected
    events:
      - event: ekr.kernel.TransactionRejected
        payload:
          issues: 1

assert:
  - view: ekr.kernel.ValidationIssues
    contains:
      transaction_id: {$instance: proposal}
      validator: OntologyConstraint
      code: edge-endpoint-removed
