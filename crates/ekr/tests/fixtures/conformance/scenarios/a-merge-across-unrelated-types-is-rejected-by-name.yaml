# story:merge-entity-applies, acceptance a-merge-across-sibling-types-is-refused.
#
# The target has committed revision 1 before the first act. The fixture
# `merge-node-unrelated.yaml` merges Acme (0303), an Organization, into Alice (0301), a Person. A
# merge joins nodes of one type or of types related through parents, and neither type conforms to
# the other, so validation rejects it with exactly one issue, which the Type validator raises under
# the name merge-types-unrelated; its message names SupersedeNode as the fix.
type: ess-scenario/1
domain: ekr.kernel
scenario: a-merge-across-unrelated-types-is-rejected-by-name
summary: A merge of an Organization into a Person, neither type conforming to the other, is rejected with one issue, merge-types-unrelated, raised by Type.

arrange:
  - instance: proposal
    entity: ekr.kernel.GraphTransaction

timeline:
  - at: 2027-01-15T09:00:00Z
    command: ekr.kernel.Propose
    actor: ekr.kernel.Proposer
    input:
      transaction_document: merge
    outcome: proposed
    events:
      - event: ekr.kernel.TransactionProposed
    capture: {instance: proposal, event: ekr.kernel.TransactionProposed, field: transaction_id}

  - at: 2027-01-15T09:00:01Z
    command: ekr.kernel.Validate
    actor: ekr.kernel.Validator
    input:
      transaction_id: {$instance: proposal}
      against: 1
    outcome: rejected
    events:
      - event: ekr.kernel.TransactionRejected
        payload:
          issues: 1

assert:
  - view: ekr.kernel.ValidationIssues
    contains:
      transaction_id: {$instance: proposal}
      validator: Type
      code: merge-types-unrelated
