# story:node-gains-an-alias, acceptance 2, the held alias.
#
# The target is seeded from `seed.yaml` and its revision 1 (`revision-1-alias.yaml`) is itself an
# AddAlias: Alice, a Person, gains `the-founder`. The fixture `add-alias-held.yaml` gives Bob, the
# other Person, the same alias. One alias identifies one node of a type, so validation rejects it
# with exactly one issue, which the Structural validator raises under the name
# alias-already-exists.
type: ess-scenario/1
domain: ekr.kernel
scenario: an-alias-a-node-of-the-type-holds-is-rejected-by-name
summary: An alias added to a node when another node of its type already holds it is rejected with one issue, alias-already-exists, raised by Structural.

arrange:
  - instance: proposal
    entity: ekr.kernel.GraphTransaction

timeline:
  - at: 2027-01-15T08:00:00Z
    command: ekr.kernel.Propose
    actor: ekr.kernel.Proposer
    input:
      transaction_document: addition
    outcome: proposed
    events:
      - event: ekr.kernel.TransactionProposed
    capture: {instance: proposal, event: ekr.kernel.TransactionProposed, field: transaction_id}

  - at: 2027-01-15T08:00:01Z
    command: ekr.kernel.Validate
    actor: ekr.kernel.Validator
    input:
      transaction_id: {$instance: proposal}
      against: 1
    outcome: rejected
    events:
      - event: ekr.kernel.TransactionRejected
        payload:
          issues: 1

assert:
  - view: ekr.kernel.ValidationIssues
    contains:
      transaction_id: {$instance: proposal}
      validator: Structural
      code: alias-already-exists
