# story:edge-type-endpoints-widen, acceptance 3, an unknown edge type.
#
# The target runs validation profile v2 (`host-v2.json`), is seeded from `seed-authored.yaml` and
# has committed revision 1 before the first act. The fixture `widen-unknown-edge-type.yaml` widens
# edge type 0299, which no schema version declares. Validation rejects it with exactly one issue,
# which the OntologyConstraint validator raises under the name unknown-edge-type.
type: ess-scenario/1
domain: ekr.kernel
scenario: a-widening-of-an-edge-type-no-version-declares-is-rejected-by-name
summary: A widening of an edge type the schema does not declare is rejected with one issue, unknown-edge-type, raised by OntologyConstraint.

arrange:
  - instance: proposal
    entity: ekr.kernel.GraphTransaction

timeline:
  - at: 2027-01-15T08:00:00Z
    command: ekr.kernel.Propose
    actor: ekr.kernel.Proposer
    input:
      transaction_document: widening
    outcome: proposed
    events:
      - event: ekr.kernel.TransactionProposed
    capture: {instance: proposal, event: ekr.kernel.TransactionProposed, field: transaction_id}

  - at: 2027-01-15T08:00:01Z
    command: ekr.kernel.Validate
    actor: ekr.kernel.Validator
    input:
      transaction_id: {$instance: proposal}
      against: 1
    outcome: rejected
    events:
      - event: ekr.kernel.TransactionRejected
        payload:
          issues: 1

assert:
  - view: ekr.kernel.ValidationIssues
    contains:
      transaction_id: {$instance: proposal}
      validator: OntologyConstraint
      code: unknown-edge-type
