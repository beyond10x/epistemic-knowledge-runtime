# story:add-evidence-operation, acceptance 2, the identity half.
#
# The target has committed revision 1 before the first act. The fixture
# `add-evidence-reused-id.yaml` adds evidence under id 0401, which the seed already holds, with a
# payload that does hash to its entry. Validation rejects it with exactly one issue, which the
# Structural validator raises under the name identity-already-exists: an evidence id names one
# record, as a node or an assertion id does.
type: ess-scenario/1
domain: ekr.kernel
scenario: a-reused-evidence-id-is-rejected-by-name
summary: Evidence added under an id canonical state already holds is rejected with one issue, identity-already-exists, raised by Structural.

arrange:
  - instance: proposal
    entity: ekr.kernel.GraphTransaction

timeline:
  - at: 2027-01-15T08:00:00Z
    command: ekr.kernel.Propose
    actor: ekr.kernel.Proposer
    input:
      transaction_document: transaction_document
    outcome: proposed
    events:
      - event: ekr.kernel.TransactionProposed
    capture: {instance: proposal, event: ekr.kernel.TransactionProposed, field: transaction_id}

  - at: 2027-01-15T08:00:01Z
    command: ekr.kernel.Validate
    actor: ekr.kernel.Validator
    input:
      transaction_id: {$instance: proposal}
      against: 1
    outcome: rejected
    events:
      - event: ekr.kernel.TransactionRejected
        payload:
          issues: 1

assert:
  - view: ekr.kernel.ValidationIssues
    contains:
      transaction_id: {$instance: proposal}
      validator: Structural
      code: identity-already-exists
