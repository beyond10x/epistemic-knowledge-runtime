[package]
name = "ekr-kernel"
description = "The transaction boundary: proposal, validation, commit, snapshot and explain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ekr-core.workspace = true
ekr-graph.workspace = true
ekr-integrate.workspace = true
ekr-ontology.workspace = true
ekr-store.workspace = true
ring.workspace = true
schemars = { version = "1.2", optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["parsing", "formatting"] }

[dev-dependencies]
ess-conformance.workspace = true
ess-primitives.workspace = true
eventlog-core.workspace = true
eventlog-file.workspace = true
eventlog-sqlite.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio.workspace = true
trybuild.workspace = true

[features]
bench = []
schema = ["dep:schemars", "ekr-core/schema", "ekr-ontology/schema", "ekr-graph/schema"]

[[test]]
name = "command_bench"
required-features = ["bench"]

[[test]]
name = "validation_bench"
required-features = ["bench"]

[lints]
workspace = true
