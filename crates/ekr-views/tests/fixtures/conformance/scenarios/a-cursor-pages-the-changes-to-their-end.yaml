# story:changes-since-read: a cursor pages a large change set (ekr.views.GraphChangesV1).
#
# The store `hub` is the one an-overview-lists-at-most-its-limit-of-top-nodes describes: a seed
# alone, the hub and 600 leaves and the 600 edges from the hub to each. A transaction time of 0 ms
# is before the seed, so its changes are the seed's: 601 NodeCreated then 600 EdgeCreated, in the
# format's order, 1,201 changes. At the default limit of 500:
#   - page 1 (no cursor): 500 nodes; 701 remain;
#   - page 2 (after 500): the last 101 nodes and the first 399 edges; 201 remain;
#   - page 3 (after 1000): the last 201 edges; nothing remains;
#   - after 1,201, the end itself: an empty page.
# A read that pages by revision rather than by change, or restarts at the cursor's node count,
# repeats or drops changes across pages 1 and 2.
type: ess-scenario/1
domain: ekr.views
scenario: a-cursor-pages-the-changes-to-their-end
summary: The hub's 1,201 seed changes page as 500 nodes, 101 nodes and 399 edges, then 201 edges at the default limit, and a cursor at the end answers an empty page.

timeline:
  - at: 2027-01-15T12:30:00Z
    command: ekr.views.ChangesSince
    actor: ekr.views.Reader
    input:
      store: hub
      since_kind: TransactionTime
      since: 0
      at: null
      limit: null
      after: null
    outcome: listed
    events:
      - event: ekr.views.ChangesListed
        payload:
          revision: 0
          after: 0
