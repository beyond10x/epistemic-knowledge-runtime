# task:projection-carries-per-type-property-definitions.
#
# The store `property-redeclared` is the seed (revision 0, schema version 0: the node type
# Subject with the property label, a String, and one node) and one schema change (revision 1,
# schema version 1): DefineNodeType Refined, a child of Subject, and ModifyProperty on Refined
# redeclaring label as the Integer rank. At revision 1 two types declare one property id with two
# definitions, and ontology.properties lists one entry per definition, each naming the type it is
# the declaration of: two node types and two property entries. Revision 0 still projects one of
# each. The overview, which carries the same ontology, answers revision 1 too. A renderer that
# carries one definition per property id refuses revision 1, or keeps one definition and reports
# one property entry.
type: ess-scenario/1
domain: ekr.views
scenario: a-property-a-subtype-redeclares-is-projected-for-each-type
summary: After a subtype redeclares an inherited property with another name and value kind, the projection lists one property entry per definition and the overview answers, while revision 0 still lists one.

timeline:
