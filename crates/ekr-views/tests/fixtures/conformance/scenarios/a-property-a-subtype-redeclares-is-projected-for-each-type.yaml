    command: ekr.views.ProjectGraph
    actor: ekr.views.Reader
    input:
      store: property-redeclared
      at: null
    outcome: projected
    events:
      - event: ekr.views.GraphProjected
        payload:
          revision: 1
          schema_versions: 2
          node_types: 2
          edge_types: 0
