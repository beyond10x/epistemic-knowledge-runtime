# story:graph-projection-specification: a projection is of one committed revision (design § 82).
#
# The store `seed-only` has head 0. Asking for revision 1 names a revision that does not exist, so
# nothing is rendered and the refusal says what was asked for and what the head is. A renderer
# that clamps the request to the head answers `projected` for revision 0 and fails.
type: ess-scenario/1
domain: ekr.views
scenario: a-revision-beyond-the-head-is-refused
summary: Asking a store at head 0 for revision 1 is refused as not found, naming the request and the head.

timeline:
  - at: 2027-01-15T08:00:00Z
    command: ekr.views.ProjectGraph
    actor: ekr.views.Reader
    input:
      store: seed-only
      at: 1
    outcome: not-found
    error:
      name: ekr.views.RevisionNotFound
      fields:
        requested: 1
        head: 0
    no_events:
      - ekr.views.GraphProjected
