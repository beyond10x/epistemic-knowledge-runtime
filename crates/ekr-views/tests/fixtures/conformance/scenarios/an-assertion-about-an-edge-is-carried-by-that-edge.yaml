    command: ekr.views.ProjectGraph
    actor: ekr.views.Reader
    input:
      store: edge-assertion
      at: null
    outcome: projected
    events:
      - event: ekr.views.GraphProjected
        payload:
          nodes: 2
          edges: 1
          assertions: 1
          edge_assertions: 1
