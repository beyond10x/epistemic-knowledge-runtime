# story:search-match-kinds: every ekr.node-matches/3 match names its kind and whether it matched
# only after lowercasing (ekr.views.MatchKind, ekr.views.NodeMatchV3 `folded`): each of the five
# kinds, once case-exact and once case-folded.
#
# The store `match-kinds` is the one
# a-search-v3-ranks-a-whole-name-above-case-exact-partial-matches describes. Each step's first match:
#   - `Gateway`: Gateway …c60101, WholeName, case-exact;
#   - `gateway`: Gateway, WholeName, folded;
#   - `router`: core …c60103 by its alias `router`, WholeAlias, case-exact;
#   - `ROUTER`: core, WholeAlias, folded;
#   - `router-`: router-east …c60104, Prefix, case-exact (Router-West is a folded Prefix after it);
#   - `router-w`: Router-West …c60105, Prefix, folded;
#   - `proxy`: edge-proxy …c60102, Substring, case-exact;
#   - `PROXY`: edge-proxy, Substring, folded;
#   - `east router`: router-east, Words, case-exact (both words are in `router-east` as given;
#     east-router, also Words, has the lower degree);
#   - `EAST ROUTER`: router-east, Words, folded.
type: ess-scenario/1
domain: ekr.views
scenario: a-search-v3-names-each-match-kind-and-fold
summary: Under /3, ten searches answer a first match of each kind (WholeName, WholeAlias, Prefix, Substring, Words), each once case-exact and once case-folded.

