# story:store-reading-code-names-no-contents: a check reports store contents named in a
# consumer's code.
#
# The store `edge-assertion` holds node type Subject (…000100) with property label (…000101),
# edge type links (…000102) with property weight (…000103), and nodes alpha (…000110) and beta
# (…000111), each with aliases `<name>-alias-b` and `<name>-alias-a`. `links` and `weight` are
# also runtime words: ESS field names in systems/ekr/domains.
#
# src/reader.ts plants one name of each kind on lines 1 to 4: Subject (NodeType), links
# (EdgeType), label and weight (Property), alpha (CanonicalName) and beta-alias-a (Alias). Six
# findings, the first on line 1; `links` and `weight` are reported too, flagged runtime_word, so
# two runtime-word findings. No literal equals a store id, so none is exempt. Line 5 names
# Subject, alpha and links as bare words, which are no literal. Line 6 quotes runtime words no
# store name equals, line 7 the ids of
# alpha and of Subject, which are no name, and line 8 near misses — another case, a trailing
# space, a prefix: all literals, none found. src/clean.ts holds none. 16 literals over 2 files.
#
# Named at revision 0 with the sources in the other order and reader.ts given twice, the answer
# is the same: sources are read by path, each once. With no source there is nothing to find.
# At revision 5, which the store does not hold, nothing is answered.
type: ess-scenario/1
domain: ekr.views
scenario: code-names-reports-each-planted-name-and-no-id-or-vocabulary
summary: A consumer's sources are reported for every planted type, property, canonical and alias name with file and line, runtime words flagged and ids never; the answer is independent of source order.

timeline:
  - at: 2027-01-15T16:00:00Z
    command: ekr.views.FindCodeNames
    actor: ekr.views.Reader
    input:
      store: edge-assertion
      at: null
      sources:
        - path: src/reader.ts
          text: |
            const kind = "Subject";
            const relation = 'links';
            read(node, "label", `weight`);
            find("alpha") || find('beta-alias-a');
            // A bare word is no literal: Subject alpha links
            const generic = ["name", "aliases", "store", "String"];
            const ids = ["00000000-0000-4000-8000-000000000110", "00000000-0000-4000-8000-000000000100"];
            const near = ["subject", "alpha ", "Alpha", "alpha-alias"];
        - path: src/clean.ts
          text: |
            const kind = node.type_id;
    outcome: found
    events:
      - event: ekr.views.CodeNamesFound
        payload:
          revision: 0
          files: 2
          literals: 16
          exempt: 0
          findings: 6
          runtime_word_findings: 2
          node_types: 1
          edge_types: 1
          properties: 2
          canonical_names: 1
          aliases: 1
          first_file: src/reader.ts
          first_line: 1

  - at: 2027-01-15T16:01:00Z
    command: ekr.views.FindCodeNames
    actor: ekr.views.Reader
    input:
      store: edge-assertion
      at: 0
      sources:
        - path: src/clean.ts
          text: |
            const kind = node.type_id;
        - path: src/reader.ts
          text: |
            const kind = "Subject";
            const relation = 'links';
            read(node, "label", `weight`);
            find("alpha") || find('beta-alias-a');
            // A bare word is no literal: Subject alpha links
            const generic = ["name", "aliases", "store", "String"];
            const ids = ["00000000-0000-4000-8000-000000000110", "00000000-0000-4000-8000-000000000100"];
            const near = ["subject", "alpha ", "Alpha", "alpha-alias"];
        - path: src/reader.ts
          text: |
            const kind = "Subject";
            const relation = 'links';
            read(node, "label", `weight`);
            find("alpha") || find('beta-alias-a');
            // A bare word is no literal: Subject alpha links
            const generic = ["name", "aliases", "store", "String"];
            const ids = ["00000000-0000-4000-8000-000000000110", "00000000-0000-4000-8000-000000000100"];
            const near = ["subject", "alpha ", "Alpha", "alpha-alias"];
    outcome: found
    events:
