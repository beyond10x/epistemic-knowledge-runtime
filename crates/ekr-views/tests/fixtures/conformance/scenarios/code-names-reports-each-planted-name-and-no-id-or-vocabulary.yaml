        payload:
          revision: 0
          files: 2
          literals: 16
          exempt: 0
          findings: 6
          runtime_word_findings: 2
          first_file: src/reader.ts
          first_line: 1

  - at: 2027-01-15T16:02:00Z
    command: ekr.views.FindCodeNames
    actor: ekr.views.Reader
    input:
      store: edge-assertion
      at: null
      sources: []
    outcome: found
    events:
      - event: ekr.views.CodeNamesFound
        payload:
          revision: 0
          files: 0
          literals: 0
          exempt: 0
          findings: 0
