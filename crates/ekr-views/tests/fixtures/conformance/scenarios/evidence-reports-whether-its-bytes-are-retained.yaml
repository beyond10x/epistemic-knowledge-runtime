# story:graph-projection-specification, scenario "evidence whose bytes are and are not retained".
#
# The store `evidence-retention` holds exactly two evidence records: one whose content hash names
# bytes the store retains, and one whose bytes it never received. Both are projected by identity;
# exactly one is marked retained. The projection never carries the bytes themselves (design § 86).
type: ess-scenario/1
domain: ekr.views
scenario: evidence-reports-whether-its-bytes-are-retained
summary: Of two evidence records, the one whose bytes the store holds is projected as retained and the other is not.

timeline:
  - at: 2027-01-15T08:00:00Z
    command: ekr.views.ProjectGraph
    actor: ekr.views.Reader
    input:
      store: evidence-retention
      at: null
    outcome: projected
    events:
      - event: ekr.views.GraphProjected
        payload:
          evidence: 2
          retained_evidence: 1
