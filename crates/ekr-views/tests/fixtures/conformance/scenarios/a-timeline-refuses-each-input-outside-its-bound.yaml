    command: ekr.views.ProjectTimeline
    actor: ekr.views.Reader
    input:
      store: subjects
      at: null
      row_type: null
      hops: 1
      limit: 1
      bucket: null
      subject: null
    outcome: timelined
    events:
      - event: ekr.views.SubjectsTimelined
        payload:
          hops: 1
          rows: 1
          first_row: 00000000-0000-4000-8000-000000a00101

