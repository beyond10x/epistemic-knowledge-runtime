# ProjectTimeline's bounds: `hops` 1 to 3 and `limit` 1 to 500, checked before the store is read;
# a subject the revision does not hold is no refusal, and answers no row.
#
# The store `subjects` is the one a-timeline-row-is-a-subject-with-its-events-within-hops
# describes, a seed only at revision 0. Hops 1 and 3 and limits 1 and 500 are answered; hops 0 and
# 4 and limits 0 and 501 are refused, naming the input, its value and its bounds. Hops 4 with limit
# 0 names hops, the first broken input in the command's declared order. The subject
# 00000000-0000-4000-8000-000000a09999 is no node of the store: the answer lists no row and no
# event, and its row type is the first listed, holder, whose three active subjects reach five
# distinct events within 2 hops.
type: ess-scenario/1
domain: ekr.views
scenario: a-timeline-refuses-each-input-outside-its-bound
summary: Hops 1 and 3 and limits 1 and 500 are answered; hops 0 or 4 and limit 0 or 501 are refused naming the first broken input, and an unknown subject answers no row.

timeline:
