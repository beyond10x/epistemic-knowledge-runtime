# task:changes-since-lists-added-evidence: evidence added after the seed is a change
# (ekr.views.GraphChangesV1, EvidenceAdded).
#
# The store `quality` is the one a-quality-report-counts-evidence-constraints-and-shared-names
# describes. Its changes after the seed:
#   - revision 1: AddEvidence X0; the item i6; a4 and a5 added — 1 evidence, 1 node, 2 assertions;
#   - revision 2: a1 retracted;
#   - revision 3: AddEvidence X1; a6 added and a2 superseded by it — 1 evidence, 1 assertion
#     added, 1 superseded.
# The seed's evidence E0 and E1 came with the seed, not through an AddEvidence, and is no change.
#   - since revision 0, at 3: 8 changes, X0 and X1 each once. A read without EvidenceAdded lists
#     6; one that also lists the seed's evidence counts 4 evidence entries;
#   - since revision 2, at 3: revision 3's 3 changes, X1 among them;
#   - since revision 1, at 2: the retraction alone, and no evidence: a range without an
#     AddEvidence;
#   - since valid time 0, at 3: the 8 assertion changes, every one valid from 500 or 3000 ms, and
#     no evidence, which has no valid time.
type: ess-scenario/1
domain: ekr.views
scenario: an-add-evidence-is-listed-once-as-evidence-added
summary: Since revision 0 at 3 lists both added evidence entries once among 8 changes, since 2 the one of revision 3, and since 1 at 2 or a valid time none.

timeline:
