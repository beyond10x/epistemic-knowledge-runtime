# A seed the revision does not hold is refused, and the refusal names it.
#
# The store `hub` is the one an-overview-lists-at-most-its-limit-of-top-nodes describes; it holds
# no node 00000000-0000-4000-8000-0000001fffff and none 00000000-0000-4000-8000-0000001ffffe.
#   - seeds [hub, …1fffff]: the known hub does not rescue the request; nothing is answered, and
#     the refusal names …1fffff at revision 0. A renderer that drops unknown seeds answers the
#     hub's neighbourhood and fails;
#   - seeds […1fffff, …1ffffe]: the refusal names …1fffff, the first unknown seed in the order
#     the request gave them, not …1ffffe, the lower id;
#   - DescribeNode of …1fffff is refused the same way.
type: ess-scenario/1
domain: ekr.views
scenario: an-unknown-seed-is-refused-by-name
summary: An expansion with one unknown seed among known ones is refused naming it, two unknown seeds name the first given, and describing an unknown node is refused naming it.

