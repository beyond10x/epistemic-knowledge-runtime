# story:supersede-node, acceptance a-read-of-a-superseded-id-names-its-successor and
# a-superseded-node-reads-at-an-earlier-revision.
#
# The store `superseded`: the seed holds alpha (…0110) and beta (…0111), an edge from alpha to
# beta and an assertion about it; revision 1 creates `beta, kept` (…f20001) and an assertion about
# beta; revision 2 supersedes beta by `beta, kept`.
#
# What is held:
#   - at the head, DescribeNode of beta under /1 and /2, and an expansion seeded with beta, are
#     each refused as NodeSuperseded naming `beta, kept` and revision 2;
#   - at revision 1, DescribeNode of beta describes it.
# That every other head read omits beta, and that the refusal reaches every surface by that name,
# is held in crates/ekr-views/tests/supersession.rs and crates/ekr/tests/mcp.rs.
type: ess-scenario/1
domain: ekr.views
scenario: a-superseded-node-is-refused-naming-the-node-it-is-superseded-by
summary: A superseded node is refused as NodeSuperseded naming the node it is superseded by, in either detail format and as a seed; the revision before describes it.

