# task:lineage-shows-widened-ends-and-modified-properties.
#
# The store `schema-changes` is the seed (revision 0, schema version 0: the node type Subject
# with the property label, and one node) and four schema changes, one version each. Revision 1,
# version 1: the node type Observation, the edge type observes from Observation to Subject, and
# the property note on Subject — five ids added over versions 0 and 1. Revision 2, version 2:
# WidenEdgeType on observes, its source gaining Subject and its target Observation, so two ends
# widened and no id added. Revision 3, version 3: ModifyProperty on Subject's label, renamed
# title and made Many, so one property modified. Revision 4, version 4: ModifyProperty
# declaring note on Observation as Subject declares it, so a second property modified.
#
# Each overview counts, over the versions it lists, the widened ends and the modified
# properties: none at revision 1, the two ends from revision 2 on, the first property from
# revision 3 and the second at 4. A renderer that reads only added and removed reports 0
# widened and 0 modified at every revision, and says of versions 2 to 4 that they changed
# nothing.
type: ess-scenario/1
domain: ekr.views
scenario: a-lineage-lists-widened-ends-and-modified-properties
summary: A version made by WidenEdgeType lists its widened ends and one made by ModifyProperty its modified property, each from its own revision on, while added counts only new ids.

timeline:
