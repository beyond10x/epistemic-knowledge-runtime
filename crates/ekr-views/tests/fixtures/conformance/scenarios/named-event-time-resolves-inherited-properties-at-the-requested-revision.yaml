type: ess-scenario/1
domain: ekr.views
scenario: named-event-time-resolves-inherited-properties-at-the-requested-revision
summary: An inherited Timestamp supplies event time, missing values are counted, and historical names and ambiguous timestamp values are checked at the requested revision.
timeline:
  - at: 2027-01-17T10:00:00Z
    command: ekr.views.ExportOcel
    actor: ekr.views.Reader
    input:
      store: ocel-named-time
      at: 0
      events: []
      event_time: [Child.Kind.at]
    outcome: exported
    events:
      - event: ekr.views.OcelExported
        payload:
          revision: 0
          event_types: 1
          object_types: 4
          events: 1
          objects: 1
          undated_events: 1
  - at: 2027-01-17T10:01:00Z
    command: ekr.views.ExportOcel
    actor: ekr.views.Reader
    input:
      store: ocel-named-time
      at: 1
      events: []
      event_time: [Child.Kind.happened_at, Child.Kind.happened_at]
    outcome: exported
    events:
      - event: ekr.views.OcelExported
        payload:
          revision: 1
          events: 1
          objects: 1
          undated_events: 1
  - at: 2027-01-17T10:02:00Z
    command: ekr.views.ExportOcel
    actor: ekr.views.Reader
    input:
      store: ocel-named-time
      at: 1
      events: []
      event_time: [Child.Kind.at]
    outcome: event-time-invalid
    error:
      name: ekr.views.EventTimeInvalid
      fields:
