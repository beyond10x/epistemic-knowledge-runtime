# story:graph-projection-specification, scenario "a seed-only store".
#
# The store `seed-only` holds the seed and nothing else: revision 0, one schema version, no
# committed transaction. Its projection is revision 0 at head 0, one schema version whose first
# valid revision is 0, and one revision entry, the seed's, which carries no transaction id. The
# node, edge, assertion and evidence counts are the seed's own and are the runner's fixture to
# state; this scenario decides only what a seed-only store has exactly one of.
type: ess-scenario/1
domain: ekr.views
scenario: a-seed-only-store-projects-revision-zero
summary: A store holding only its seed projects revision 0 at head 0, with one schema version and one revision entry.

timeline:
  - at: 2027-01-15T08:00:00Z
    command: ekr.views.ProjectGraph
    actor: ekr.views.Reader
    input:
      store: seed-only
      at: null
    outcome: projected
    events:
      - event: ekr.views.GraphProjected
        payload:
          revision: 0
          head: 0
          schema_versions: 1
          revisions: 1
