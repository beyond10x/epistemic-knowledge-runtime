# ChangesSince's refusals and bounds: a revision since below 0 is malformed, decided before any
# bound; `limit` is 1 to 2,000 (500 when absent) and `after` 0 or more; a revision since beyond
# the head is not found, after `at` is read.
#
# The store `changes` is the one a-revision-since-lists-the-changes-after-it describes; its head
# is revision 3.
#   - a revision since of -1 is SinceMalformed, naming its kind and value, even with limit 0;
#   - limit 0 and 2,001 and after -1 are LimitExceeded, naming the input, its value and bounds;
#   - limit 2,000 is answered; so is a valid time of -1, which is a time, not a revision;
#   - since revision 9 is RevisionNotFound, requested 9 and head 3.
type: ess-scenario/1
domain: ekr.views
scenario: changes-refuse-a-malformed-since-and-each-bound
summary: A revision since of -1 is malformed before any bound, limit 0 or 2,001 and after -1 are refused, limit 2,000 and a valid time of -1 are answered, and since revision 9 is not found.

timeline:
  - at: 2027-01-15T12:40:00Z
    command: ekr.views.ChangesSince
    actor: ekr.views.Reader
    input:
      store: changes
      since_kind: Revision
      since: -1
      at: null
      limit: 0
      after: null
    outcome: since-malformed
    error:
      name: ekr.views.SinceMalformed
      fields:
        kind: Revision
        requested: -1
    no_events:
      - ekr.views.ChangesListed

  - at: 2027-01-15T12:41:00Z
    command: ekr.views.ChangesSince
    actor: ekr.views.Reader
    input:
      store: changes
      since_kind: Revision
      since: 0
      at: null
      limit: 0
      after: null
    outcome: limit-exceeded
    error:
      name: ekr.views.LimitExceeded
      fields:
        parameter: limit
        requested: 0
        minimum: 1
        maximum: 2000
    no_events:
      - ekr.views.ChangesListed

  - at: 2027-01-15T12:42:00Z
    command: ekr.views.ChangesSince
    actor: ekr.views.Reader
    input:
      store: changes
      since_kind: Revision
      since: 0
      at: null
      limit: 2001
      after: null
    outcome: limit-exceeded
    error:
      name: ekr.views.LimitExceeded
      fields:
        parameter: limit
        requested: 2001
        minimum: 1
        maximum: 2000
    no_events:
      - ekr.views.ChangesListed

  - at: 2027-01-15T12:43:00Z
    command: ekr.views.ChangesSince
    actor: ekr.views.Reader
    input:
      store: changes
      since_kind: Revision
      since: 0
      at: null
      limit: null
      after: -1
    outcome: limit-exceeded
    error:
      name: ekr.views.LimitExceeded
      fields:
        parameter: after
        requested: -1
        minimum: 0
    no_events:
      - ekr.views.ChangesListed

  - at: 2027-01-15T12:44:00Z
    command: ekr.views.ChangesSince
    actor: ekr.views.Reader
    input:
      store: changes
      since_kind: Revision
      since: 0
      at: null
      limit: 2000
      after: null
    outcome: listed
    events:
      - event: ekr.views.ChangesListed
        payload:
          revision: 3
          total: 7

  - at: 2027-01-15T12:45:00Z
    command: ekr.views.ChangesSince
    actor: ekr.views.Reader
    input:
      store: changes
      since_kind: ValidTime
      since: -1
      at: null
      limit: null
      after: null
    outcome: listed
    events:
      - event: ekr.views.ChangesListed
        payload:
          revision: 3
          total: 6

  - at: 2027-01-15T12:46:00Z
    command: ekr.views.ChangesSince
    actor: ekr.views.Reader
    input:
      store: changes
      since_kind: Revision
      since: 9
