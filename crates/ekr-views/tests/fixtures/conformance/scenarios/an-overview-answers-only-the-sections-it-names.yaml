# ProjectOverview's `sections` (story:overview-sections): ekr.graph-overview/2 carries meta,
# node_types, edge_types and top always, and of ontology, schema, roles and timeline only the ones
# the request names.
#
# The store `hub` is the one an-overview-lists-at-most-its-limit-of-top-nodes describes: a seed
# and nothing else (head 0), one node type and one edge type, 601 nodes and 600 edges, no
# assertion and no evidence.
#
# Named none, the answer's event lists no section, and none of the counts drawn from schema,
# roles or timeline. Each section named alone is the one section listed, and its counts are the
# ones the full overview reports. A section named twice is named once, and the order sections are
# named in does not matter: they are listed in the order ekr.views.OverviewSection declares them.
# A renderer that answers every section whatever is named lists all four in each step and fails.
type: ess-scenario/1
domain: ekr.views
scenario: an-overview-answers-only-the-sections-it-names
summary: The overview answers its counts, type counts and top nodes, and only the sections a request names, each on its own.

timeline:
  - at: 2027-01-15T10:00:00Z
    command: ekr.views.ProjectOverview
    actor: ekr.views.Reader
    input:
      store: hub
      at: null
      limit: 2
      sections: null
    outcome: overviewed
    events:
      - event: ekr.views.GraphOverviewed
        payload:
          revision: 0
          nodes: 601
          edges: 600
          assertions: 0
          evidence: 0
          node_types: 1
          edge_types: 1
          top: 2
          sections: []

