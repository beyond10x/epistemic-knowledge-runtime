# task:store-exports-ocel-event-log: every count of ekr.ocel/1 equals the fixture's
# (ekr.views.OcelLogV1), by the overview's rule and with event types named.
#
# The store `ocel` (crates/ekr-views/tests/support/fixtures.rs, `Fixture::Ocel`):
#   - node types case, subcase (a case), step, note and unused; edge types about (step to case
#     or subcase), touches (case to step), holds (case to note) and follows (step to step).
#   - nodes: cases c1 and c2, the subcase s1, steps p1, p2 and p3, notes n1 and n2; unused has
#     none. p1 and p2 carry a Timestamp property, `at`; p3, c1 and n1 are each the subject of one
#     dated assertion.
#   - by the overview's rule (ekr.views.TypeTiming) step is the one event type: p1 and p2 are
#     timestamped, so judged and instant, and no node of another type is judged. case, subcase,
#     note and unused are object types: 1 event type, 4 object types, 3 events, 5 objects.
#   - edges: e1 and e2 about p1 to c1 (one relationship), e3 about p2 to c2, e4 touches c1 to
#     p3 (on the event p3), e8 about p3 to s1 — 4 event-to-object relationships; e5 and e6 holds
#     c1 to n1 and c1 to n2 — 2 object-to-object; e7 follows p1 to p2, between two events, is
#     not carried.
#   - revision 1 adds an earlier dated fact to p3 and revision 2 retracts it: the counts hold at
#     every revision, and only p3's time moves (held byte for byte in tests/ocel.rs).
#   - named, note is the one event type: n1 is an event, n2 has no dated fact and is left out,
#     and every step is an object. e5 is n1's one relationship; e6, to n2, is not carried; e1 to
#     e4, e7 and e8 are 5 object-to-object relationships.
#   - a name no node type holds is refused, naming it.
type: ess-scenario/1
domain: ekr.views
scenario: an-ocel-export-takes-events-from-valid-time-and-objects-from-the-rest
summary: By the overview's rule step is the one event type at every revision; naming note leaves its undated node out; an unknown name is refused.

