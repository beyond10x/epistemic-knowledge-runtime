      type: 00000000-0000-4000-8000-000000c50002
    outcome: searched
    events:
      - event: ekr.views.NodesSearched
        payload:
          format: ekr.node-matches/2
          matches: 3
          total: 3
          first_match: 00000000-0000-4000-8000-000000c50201

  - at: 2027-03-01T11:02:00Z
    command: ekr.views.SearchNodes
    actor: ekr.views.Reader
    input:
      store: search
