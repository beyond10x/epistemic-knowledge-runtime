[workspace]
resolver = "2"
exclude = ["vendor/serde_yaml_ng"]
members = [
    "crates/ekr",
    "crates/ekr-core",
    "crates/ekr-graph",
    "crates/ekr-kernel",
    "crates/ekr-ontology",
    "crates/ekr-store",
    "crates/ekr-views",
    "crates/ekr-observe",
    "crates/ekr-integrate",
    "xtask",
]

[workspace.package]
version = "0.0.10"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/epistemic-knowledge-runtime"
rust-version = "1.91"

[workspace.dependencies]
assert_cmd = "2"
clap = { version = "4.6", features = ["derive"] }
ekr-core = { path = "crates/ekr-core" }
ekr-graph = { path = "crates/ekr-graph" }
ekr-kernel = { path = "crates/ekr-kernel" }
ekr-ontology = { path = "crates/ekr-ontology" }
ekr-store = { path = "crates/ekr-store" }
ekr-views = { path = "crates/ekr-views" }
ekr-observe = { path = "crates/ekr-observe" }
ekr-integrate = { path = "crates/ekr-integrate" }
ess-conformance = { git = "https://github.com/beyond10x/ess", rev = "be44a3365eb273cb3d447b74cd5b0e75181d284e" }
ess-primitives = { git = "https://github.com/beyond10x/ess", rev = "be44a3365eb273cb3d447b74cd5b0e75181d284e" }
eventlog-core = { git = "https://github.com/beyond10x/eventlog", rev = "fe8a0a7e6e97afde87b349f0840d6e2ed28df3f8" }
eventlog-file = { git = "https://github.com/beyond10x/eventlog", rev = "fe8a0a7e6e97afde87b349f0840d6e2ed28df3f8" }
eventlog-sqlite = { git = "https://github.com/beyond10x/eventlog", rev = "fe8a0a7e6e97afde87b349f0840d6e2ed28df3f8" }
hex = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = "0.3"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt"] }
trybuild = "1"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[patch.crates-io]
serde_yaml_ng = { path = "vendor/serde_yaml_ng" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
