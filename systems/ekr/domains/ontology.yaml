domain: ekr.ontology

summary: >-
  The type system of a graph, held as data: schema versions, node and edge types, property
  definitions with typed values, and the per-type lifecycles and named operations of amendment 87.
  Design § 11–12, § 26, § 50–52. Versions form a lineage: the seed is number 0 with no parent,
  and each later version has number + 1 and the version it was derived from as its parent. A
  schema transaction derives the next version by applying SchemaChanges in order.

naming:
  wire: ontology
  display: Ontology

types:
  - name: ekr.ontology.TypeId
    kind: newtype
    of: Uuid

  - name: ekr.ontology.PropertyId
    kind: newtype
    of: Uuid

  - name: ekr.ontology.SchemaVersionId
    kind: newtype
    of: Uuid

  # Design §11.3. ValueTypeProjection below now retains recursive List and Record parameters;
  # the former assertion that ESS cannot express recursion was incorrect. Float is a legal
  # declaration/proposed value kind, while canonical graph values exclude it (ADR0005).
  - name: ekr.ontology.ValueKind
    kind: enum
    variants:
      - String
      - Boolean
      - Integer
      - Float
      - Decimal
      - Timestamp
      - Duration
      - NodeRef
      - Enum
      - List
      - Record

  # Design § 11.2 `Cardinality` and § 12 `EdgeCardinality` are both named and neither is defined.
  # UNMAPPED: whether EdgeCardinality carries more than One/Many (for example OneToMany with a
  # per-source bound) is not in the design; this enum serves both until the design says otherwise.
  - name: ekr.ontology.Cardinality
    kind: enum
    variants:
      - One
      - Many

  # Amendment 87: a transition of a per-type lifecycle.
  - name: ekr.ontology.Transition
    kind: struct
    fields:
      - name: from
        type: String
      - name: to
        type: String

  # Amendment 87: a named operation on a node type. Preconditions are constraint expressions over
  # the node's properties and arguments; their language is UNMAPPED — design § 11.2 names
  # `Constraint` and does not define it. Kept as text until a constraint language is decided.
  - name: ekr.ontology.OperationDefinition
    kind: struct
    fields:
      - name: name
        type: String
      - name: arguments
        type: Map<String, ekr.ontology.ValueTypeProjection>
      - name: preconditions
        type: List<String>
      - name: transition
        type: Optional<ekr.ontology.Transition>
      - name: emits
        type: List<String>

  # Complete ontology input for §91's root: even unused declarations and every semantic field
  # contribute. Declaration collections are encoded by stable id, sets are unique and sorted,
  # property-map keys agree with nested ids, operation-map keys agree with names. ValueType's
  # optional payload is present only for its exact kind; runtime coherence tests are required.
  # Constraint/precondition strings acquire no newly invented interpretation here; unsupported
  # expressions continue to refuse before a transaction is sealed.
  - name: ekr.ontology.ValueTypeProjection
    kind: struct
    fields:
      - name: kind
        type: ekr.ontology.ValueKind
      - name: allowed_types
        type: Optional<List<ekr.ontology.TypeId>>
      - name: variants
        type: Optional<List<String>>
      - name: element
        type: Optional<ekr.ontology.ValueTypeProjection>
      - name: fields
        type: Optional<Map<String, ekr.ontology.ValueTypeProjection>>

  - name: ekr.ontology.SchemaVersionRecord
    kind: struct
    fields:
      - name: id
        type: ekr.ontology.SchemaVersionId
      - name: number
        type: Integer
      - name: parent
        type: Optional<ekr.ontology.SchemaVersionId>
      - name: created_at
        type: Timestamp

  - name: ekr.ontology.PropertyDeclaration
    kind: struct
    fields:
      - name: id
        type: ekr.ontology.PropertyId
      - name: name
        type: String
      - name: value_type
        type: ekr.ontology.ValueTypeProjection
      - name: cardinality
        type: ekr.ontology.Cardinality
      - name: required
        type: Boolean
      - name: constraints
        type: List<String>

  - name: ekr.ontology.LifecycleDeclaration
    kind: struct
    fields:
      - name: initial
        type: String
      - name: states
        type: List<String>
      - name: transitions
        type: List<ekr.ontology.Transition>

  - name: ekr.ontology.NodeTypeDeclaration
    kind: struct
    fields:
      - name: id
        type: ekr.ontology.TypeId
      - name: name
        type: String
      - name: parents
        type: List<ekr.ontology.TypeId>
      - name: properties
        type: Map<String, ekr.ontology.PropertyDeclaration>
      - name: abstract_type
        type: Boolean
      - name: lifecycle
        type: Optional<ekr.ontology.LifecycleDeclaration>
      - name: operations
        type: Map<String, ekr.ontology.OperationDefinition>

  - name: ekr.ontology.EdgeTypeDeclaration
    kind: struct
    fields:
      - name: id
        type: ekr.ontology.TypeId
      - name: name
        type: String
      - name: source_types
        type: List<ekr.ontology.TypeId>
      - name: target_types
        type: List<ekr.ontology.TypeId>
      - name: cardinality
        type: ekr.ontology.Cardinality
      - name: properties
        type: Map<String, ekr.ontology.PropertyDeclaration>
      - name: inverse
        type: Optional<ekr.ontology.TypeId>
      - name: symmetric
        type: Boolean
      - name: transitive
        type: Boolean

  - name: ekr.ontology.OntologyDocumentProjection
    kind: struct
    fields:
      - name: version
        type: ekr.ontology.SchemaVersionRecord
      - name: node_types
        type: List<ekr.ontology.NodeTypeDeclaration>
      - name: edge_types
        type: List<ekr.ontology.EdgeTypeDeclaration>

  # Design § 26. `Ontology::evolve` in crates/ekr-ontology/src/evolve.rs. The kernel's operations
  # carry these; their canonical encoding is the kernel's, not this domain's. No change removes a
  # type or a property.
  - name: ekr.ontology.PropertyModification
    kind: struct
    fields:
      - name: owner
        type: ekr.ontology.TypeId
      - name: property
        type: ekr.ontology.PropertyDeclaration

  - name: ekr.ontology.SchemaChange
    kind: union
    tag: kind
    variants:
      DefineNodeType: ekr.ontology.NodeTypeDeclaration
      DefineEdgeType: ekr.ontology.EdgeTypeDeclaration
      ModifyProperty: ekr.ontology.PropertyModification

  # Why a next version is not derived. Held equal to `EvolveError::code` by
  # crates/ekr-ontology/tests/schema_evolution.rs.
  - name: ekr.ontology.EvolveRefusalCode
    kind: enum
    variants:
      - empty-schema-change
      - schema-version-reused
      - schema-version-exhausted
      - type-already-declared
      - unknown-property-owner
      - incoherent-schema
      - schema-change-without-effect

  # Why a derived version cannot replace the prior one over current canonical state. Held equal
  # to `Incompatibility::code` by crates/ekr-ontology/tests/schema_evolution.rs.
  - name: ekr.ontology.IncompatibilityCode
    kind: enum
    variants:
      - required-property-missing
      - cardinality-narrowed
      - value-kind-not-admitted
      - value-type-narrowed
      - type-removed
      - type-declaration-changed
      - property-removed
      - not-a-successor
      - constraint-changed

entities:
  # Design § 69 `SchemaRegistry`. One version is canonical at a time. Lineage: the seed has
  # number 0 and no parent; every other version has number = parent.number + 1.
  - name: ekr.ontology.SchemaVersion
    identity:
      name: schema_version_id
      type: ekr.ontology.SchemaVersionId
    fields:
      - name: number
        type: Integer
      - name: parent
        type: Optional<ekr.ontology.SchemaVersionId>
      - name: created_at
        type: Timestamp
    invariants:
      - number >= 0
    relations:
      - name: node_types
        kind: owns
        target: ekr.ontology.NodeType
        cardinality: many
        via: schema_version_id
      - name: edge_types
        kind: owns
        target: ekr.ontology.EdgeType
        cardinality: many
        via: schema_version_id
      - name: properties
        kind: owns
        target: ekr.ontology.PropertyDefinition
        cardinality: many
        via: schema_version_id
    lifecycle:
      initial: Canonical
      states: [Canonical]
      terminal: [Canonical]

  # Design § 11.1 plus amendment 87. Properties are owned by the schema version and name their
  # owning type in `owner_type_id`, because a property may belong to a node type or an edge type
  # and one thing has one owner.
  - name: ekr.ontology.NodeType
    identity:
      name: type_id
      type: ekr.ontology.TypeId
    fields:
      - name: schema_version_id
        type: ekr.ontology.SchemaVersionId
      - name: name
        type: String
      - name: parents
        type: List<ekr.ontology.TypeId>
      - name: abstract_type
        type: Boolean
      - name: lifecycle_initial
        type: Optional<String>
      - name: lifecycle_states
        type: List<String>
      - name: lifecycle_transitions
        type: List<ekr.ontology.Transition>
      - name: operations
        type: List<ekr.ontology.OperationDefinition>
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Design § 12.
  - name: ekr.ontology.EdgeType
    identity:
      name: type_id
      type: ekr.ontology.TypeId
    fields:
      - name: schema_version_id
        type: ekr.ontology.SchemaVersionId
      - name: name
        type: String
      - name: source_types
        type: List<ekr.ontology.TypeId>
      - name: target_types
        type: List<ekr.ontology.TypeId>
      - name: cardinality
        type: ekr.ontology.Cardinality
      - name: inverse
        type: Optional<ekr.ontology.TypeId>
      - name: symmetric
        type: Boolean
      - name: transitive
        type: Boolean
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # Design § 11.2.
  - name: ekr.ontology.PropertyDefinition
    identity:
      name: property_id
      type: ekr.ontology.PropertyId
    fields:
      - name: schema_version_id
        type: ekr.ontology.SchemaVersionId
      - name: owner_type_id
        type: ekr.ontology.TypeId
      - name: name
        type: String
      - name: value_type
        type: ekr.ontology.ValueTypeProjection
      - name: cardinality
        type: ekr.ontology.Cardinality
      - name: required
        type: Boolean
      # UNMAPPED: design § 11.2 `constraints: Vec<Constraint>` — the constraint language is not
      # defined. Held as text until it is.
      - name: constraints
        type: List<String>
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

views:
  - name: ekr.ontology.NodeTypesByVersion
    source: ekr.ontology.NodeType
    consistency: read_your_writes
    order_by:
      - name asc
    fields:
      - name: type_id
        type: ekr.ontology.TypeId
      - name: schema_version_id
        type: ekr.ontology.SchemaVersionId
      - name: name
        type: String
    naming:
      wire: node-types
      display: Node types
