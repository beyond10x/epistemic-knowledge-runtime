domain: ekr.views

summary: >-
  Read-only projections of one committed revision. A view is a deterministic function of a
  snapshot at a revision, a template version and a query scope; every rendered fact carries the id
  of the assertion it came from, and what a view renders is StorageClass Cache (design § 82). The
  full export is the graph projection ekr.graph-projection/1: one JSON document per
  committed revision, scoped to canonical state as of that revision (§ 47), carrying assertion and
  evidence ids for the explain chain (§ 62), the schema version lineage (§ 95) and evidence
  identities without their bytes (§ 86). The format names no domain concept: it is generic over any
  ontology, and every name a viewer shows is taken from the projection's ontology or graph state.
  Five bounded reads draw from the same revision without exporting it: ekr.graph-overview/1
  (ProjectOverview), ekr.graph-slice/1 (ExpandNeighbourhood), ekr.node-detail/1 (DescribeNode),
  ekr.node-matches/1 (SearchNodes) and ekr.graph-timeline/1 (ProjectTimeline), each generic over
  any ontology in the same way. A sixth, ekr.graph-changes/1 (ChangesSince), reads what the
  revisions up to one revision changed after a revision or a time. ekr.store-quality/1
  (ReportStoreQuality) reports how well one revision's assertions are evidenced, its properties
  constrained and its nodes of one type named apart. ekr.code-names/1 (FindCodeNames) reports
  which of a revision's names a consumer's source files carry as literals. ekr.ocel/1
  (ExportOcel) exports one revision as an OCEL 2.0 object-centric event log. This domain writes
  nothing; its ten commands read. Two more, DrawFactSample and ReportFactQuality, sample facts
  for a judge and report the judged sample's pass rate (see the fact-quality paragraph below).

  Determinism, which every renderer of ekr.graph-projection/1 holds to so that two renders of one
  revision are byte-identical. (1) Order. By id: every array whose members carry an `id`, and
  every array of ids, ascending in the lowercase hyphenated text of the UUID — ontology.node_types,
  ontology.edge_types, ontology.properties (the entries of one id by their first owner, see
  ekr.views.ProjectedProperty), each property's owners, each type's properties, source_types,
  target_types and assertions, nodes, edges, evidence, each node's and edge's assertions, each
  assertion's evidence,
  assessment.validators (a set) and each schema version's added. By number, ascending:
  schema.versions and schema.revisions. In the store's own order, because the order is part of the
  value: each node's aliases, each property's value list in props (an ordered list in which
  duplicates count), each ListValue's items, and assessment.issues and
  assessment.competing_assertions (ordered vectors, amendment 88). Map keys (props, a RecordValue's
  fields) ascend by their text. No other array appears in the format. (2) Key order: every
  object's keys appear in the order its type below declares its fields, and a union's tag key
  `kind` comes first. (3) Encoding: UTF-8 JSON with no insignificant whitespace; an Integer or a
  RevisionNumber is a JSON integer with no sign on zero, no leading zero, no fraction and no
  exponent; every time is an ekr.views.EpochMillis, a JSON integer of milliseconds since the Unix
  epoch in UTC, which is how the runtime stores a Timestamp; a Uuid is its lowercase hyphenated
  text; a Decimal is its exact text as the store holds it. (4) Presence: every required field is
  always emitted; an Optional field with no value is omitted, never emitted as null, and one with a
  value is always emitted; an empty list or map is emitted empty, never omitted. No field of this
  format is an Optional inside a list or a map. (5) No field carries a wall-clock time, a host, a
  path, the store's head or anything else that differs between two renders of one revision; a
  revision renders the same bytes before and after any later commit, so a cached or exported
  render and its content hash stay those of a fresh render of that revision. A host that needs
  the head reads it elsewhere.

  Determinism of the five bounded formats, so that two answers to one request against one
  revision are byte-identical. Rules (2) key order, (3) encoding, (4) presence and (5) above hold
  for each of them as written for ekr.graph-projection/1, with "render" read as "answer to one
  request"; a ProjectedOntology, ProjectedAssertion, ProjectedEdge or ProjectedValue inside them is
  ordered as rule (1) orders it; and ids ascend in the lowercase hyphenated text of the UUID. Rule
  (1), order, is per format, and in each no array appears that is not named:
  ekr.graph-overview/1 — ontology as rule (1); schema.versions and schema.revisions by number
  ascending; each version's added and removed by id, then kind in the order
  ekr.views.SchemaMemberKind declares its variants; each version's widened by edge type id, a
  Source end before a Target end, and each widened end's node_types by id; each version's
  modified by owner id, then property id, and each one's changed in the order
  ekr.views.PropertyAspect declares its variants; node_types, edge_types and roles.types by
  type id; timeline.buckets by start ascending, then type id; top by degree descending, then id.
  ekr.graph-slice/1 — nodes and edges in record-sequence order (ekr.views.GraphSliceV1: distance
  ascending, degree descending, id ascending, each node followed by the edges it closes by id),
  which is not id order; meta.seeds and each edge's assertions by id.
  ekr.node-detail/1 — assertions, edges and neighbours by id; referencing by its assertion's id;
  node.aliases and each props value list in the store's order; props keys ascending by their text.
  ekr.node-matches/1 — matches by tier (Exact before Folded), then degree descending, then id;
  never by a name.
  ekr.graph-timeline/1 — row_types by weight / nodes descending, compared exactly as rationals,
  then type id; rows by total descending, then id; each row's cells and strip by start
  ascending, then type id; events by start ascending, then id; each event's path from the
  subject outward, which is not id order.
  ekr.graph-changes/1 — changes by revision ascending, then change kind in the order
  ekr.views.ChangeKind declares its variants, then id ascending; each change's evidence by id.
  Its answer is a function of the request with `at` resolved: a request that names no `at` reads
  the head as it stands at the request, and its answer is byte for byte the answer to the same
  request naming that revision, which meta.revision carries. meta.revision is the revision read,
  never a report of the head: the same request naming that revision answers the same bytes after
  any later commit. A reader that pages keeps `at` fixed to the first page's meta.revision. A
  refusal is outside that rule: a since_revision past the head is refused as RevisionNotFound
  naming the head, and after a later commit the same request may answer an empty page.
  Bounds and the order of refusals, for the six: a bound over the input (depth, hops, limit,
  edge_limit, after) is checked before the store is read, and a broken one answers LimitExceeded
  naming the first broken input in the command's declared input order — for ChangesSince a
  since_revision below 0 answers SinceMalformed before any bound, while a request naming none or
  two of the three since inputs is malformed input that never reaches the command (the endpoint
  answers invalid-query, the MCP tool -32602);
  then an unseeded store answers NotSeeded; then a revision beyond the head answers
  RevisionNotFound — for ChangesSince `at` first, then since_revision; then a node the revision
  does not hold answers NodeNotFound.

  Evidence without retained bytes is unreachable. Evidence enters canonical state in two ways, and
  both carry its bytes: with the seed, whose envelope retains each payload, and through an
  ekr.kernel AddEvidence operation, which carries the payload beside the entry and whose commit
  stores it (decision-blocker:evidence-entry-after-seed, answered by option 1). The kernel's
  verified read also refuses a store whose evidence bytes are missing, rather than reading it
  (crates/ekr-kernel/tests/explain.rs, "A payload deleted from the provider refuses the read
  itself"). So `retained` is true for every evidence record a projection can be rendered from, and
  `retained: false` is unreachable. The flag is kept so the format does not change if a later
  decision admits evidence without bytes.

  The store's quality, ekr.store-quality/1 (ReportStoreQuality), is a function of one revision
  and nothing else: it counts that revision's canonical state, and no refusal, rejected
  transaction or open ambiguity, none of which one revision holds. Rules (2) key order, (3)
  encoding, (4) presence and (5) above hold for it as written for ekr.graph-projection/1; rule
  (1), order: shared_names by type id, then name ascending by its UTF-8 bytes; each entry's
  nodes by id. No other array appears in it. A share is basis points: 10000 times the count,
  divided by the whole it is a share of and rounded down, so 10000 is all of it; a share of a
  whole of 0 is omitted. Every assertion the kernel admits cites evidence (ekr.kernel's
  provenance validator, `assertion-without-evidence`), and every cited record's bytes are
  retained, so with_evidence equals active in every store the kernel wrote; it is counted, not
  assumed, so a store that broke either rule would show it.

  Fact quality by a judged sample: ekr.fact-sample/1 (DrawFactSample) and ekr.fact-quality/1
  (ReportFactQuality). This domain writes nothing and judges nothing; DrawFactSample reads one
  revision, and ReportFactQuality reads no store. The draw. The population is the revision's
  Active assertions, those whose subject is of the requested type when one is named (a node
  subject's type, an edge subject's type, a Type subject's own id, compared exactly: a subtype is
  another type). Each is ranked by its draw key, the lowercase hex SHA-256 of the UTF-8 text
  `ekr.fact-sample/1:<seed>:<assertion id>`, the seed in decimal with a leading `-` when negative
  and the id lowercase hyphenated; the sample is the `size` lowest-ranked, all of them when the
  population is smaller. So one (seed, size, type, revision) draws one sample on every provider,
  a larger size draws a sample the smaller one's is a prefix of, and a later commit leaves the
  sample of an earlier revision as it was. Rules (2) key order, (3) encoding, (4) presence and
  (5) above hold for both formats as written for ekr.graph-projection/1; rule (1), order: items
  by draw key ascending, then assertion id, which is not id order; each item's evidence by id; a
  ProjectedAssertion inside an item as rule (1) orders it. ekr.fact-quality/1 holds no array. The
  report. z is computed from the confidence by Wichura's algorithm AS 241 (PPND16), taking the
  logarithm it needs as 2·atanh((m − 1)/(m + 1)) + e·ln 2 over the binary64 exponent e and
  mantissa m, summed from a fixed number of terms with only the operations IEEE 754 rounds
  exactly; rate, lower and upper follow from z by the formula ekr.views.FactQualityV1 states.
  Every host therefore answers the same binary64 values. A Decimal in ekr.fact-quality/1 is a
  JSON number: the shortest decimal text that reads back as the same binary64 value.

naming:
  wire: views
  display: Views

# Knowledge-inbox projection policy (§ 105), effective only under the upgraded authority:
# default settled-knowledge reads/rendered edges and property values exclude Disputed assertions.
# The complete graph/assertion inspection and attention/explain surfaces retain both claims and
# their evidence, including disputed and historical claims. Never infer settled edge membership
# from the existence of an Edge alone when its supporting claim is disputed. Historical renders
# before the transition retain their original profile and bytes. This is a cross-record renderer
# obligation, exercised against real providers, not an ESS filter over a single view entity.
types:
  # Where the store the projection reads lives, as the host that renders names it. Never emitted in
  # the projection: a location is a fact about the host, not about the revision.
  - name: ekr.views.StoreLocation
    kind: newtype
    of: String

  # The format name and version in one literal, as every other document of this runtime carries it.
  - name: ekr.views.GraphProjectionFormatV1
    kind: enum
    variants: [{name: EkrGraphProjection1, wire: ekr.graph-projection/1}]

  # Every time in the format: milliseconds since the Unix epoch in UTC, the runtime's own
  # Timestamp encoding (crates/ekr-core/src/time.rs). Declared rather than ESS's Timestamp, which
  # ESS spells as a date-time string.
  - name: ekr.views.EpochMillis
    kind: newtype
    of: Integer

  # `revision` is the projected revision. The store's head is not carried: it moves with every
  # later commit, which rule (5) forbids a field to do. The four counts are over the document
  # itself: nodes[], edges[], every assertion entry under nodes[], edges[] and the ontology's
  # types, and evidence[].
  - name: ekr.views.ProjectionMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.GraphProjectionFormatV1
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: node_count
        type: Integer
      - name: edge_count
        type: Integer
      - name: assertion_count
        type: Integer
      - name: evidence_count
        type: Integer

  # A canonical value, readable. Design § 11.3 without Float, which canonical state does not
  # admit (ADR 0005). Duration is an Integer as the store holds it. On the wire a ProjectedValue is
  # {"kind": <variant>, "value": <payload>}: the payload of String, Decimal and Enum is JSON text,
  # of Boolean a JSON boolean, of Integer and Duration a JSON integer, of Timestamp an
  # EpochMillis, of NodeRef a node id, of List an array of ProjectedValue and of Record an object
  # of ProjectedValue by field name.
  - name: ekr.views.TextValue
    kind: newtype
    of: String

  - name: ekr.views.BooleanValue
    kind: newtype
    of: Boolean

  - name: ekr.views.IntegerValue
    kind: newtype
    of: Integer

  - name: ekr.views.ListValue
    kind: newtype
    of: List<ekr.views.ProjectedValue>

  - name: ekr.views.RecordValue
    kind: newtype
    of: Map<String, ekr.views.ProjectedValue>

  - name: ekr.views.ProjectedValue
    kind: union
    tag: kind
    variants:
      String: ekr.views.TextValue
      Boolean: ekr.views.BooleanValue
      Integer: ekr.views.IntegerValue
      Decimal: ekr.views.TextValue
      Timestamp: ekr.views.EpochMillis
      Duration: ekr.views.IntegerValue
      NodeRef: ekr.graph.NodeId
      Enum: ekr.views.TextValue
      List: ekr.views.ListValue
      Record: ekr.views.RecordValue

  # ekr.graph.AssertionLifecycleProjection with its time as EpochMillis. Exactly the payload its
  # kind carries is present (amendment 88).
  - name: ekr.views.ProjectedLifecycle
    kind: struct
    fields:
      - name: kind
        type: ekr.graph.AssertionLifecycleKind
      - name: at_revision
        type: Optional<ekr.kernel.RevisionNumber>
      - name: reason
        type: Optional<String>
      - name: by
        type: Optional<ekr.graph.AssertionId>
      - name: effective_from
        type: Optional<ekr.views.EpochMillis>

  # One assertion as the store holds it at the projected revision. It is listed under the node,
  # edge or type that is its subject, so the subject is not repeated. Exactly the object payload
  # its object_kind names is present: object_value for Value, object_ref for Node and Type.
  # `evidence` is the ids of the evidence its supports reference.
  - name: ekr.views.ProjectedAssertion
    kind: struct
    fields:
      - name: id
        type: ekr.graph.AssertionId
      - name: predicate_kind
        type: ekr.graph.PredicateKind
      - name: predicate
        type: Uuid
      - name: object_kind
        type: ekr.graph.ObjectKind
      - name: object_value
        type: Optional<ekr.views.ProjectedValue>
      - name: object_ref
        type: Optional<Uuid>
      - name: assessment
        type: ekr.graph.AssessmentProjection
      - name: lifecycle
        type: ekr.views.ProjectedLifecycle
      - name: valid_from
        type: Optional<ekr.views.EpochMillis>
      - name: valid_to
        type: Optional<ekr.views.EpochMillis>
      - name: recorded_from
        type: ekr.views.EpochMillis
      - name: recorded_to
        type: Optional<ekr.views.EpochMillis>
      - name: evidence
        type: List<ekr.graph.EvidenceId>

  # The ontology at the projected revision: the schema version that revision's canonical state is
  # valid against. `properties` on a type is the ids of the property definitions it declares;
  # `assertions` are those whose subject is that type.
  #
  # Per-type property definitions (task:projection-carries-per-type-property-definitions).
  # `ontology.properties` holds one entry per definition of a property id among the node and edge
  # types that have it, a definition being its name and value kind together: all of one that
  # this entry carries, so two declarations that differ only in anything else are one
  # definition. A node type has the definition ekr.ontology resolves for it (properties_of: its
  # own declaration, else the most specific ancestor's), declared or inherited; an edge type has
  # what it declares. One id may have several definitions, because the ontology admits a type that
  # redeclares an inherited property with another name or value kind, and ModifyProperty on a
  # child type produces one. An id every type that has it defines alike has exactly one entry, and
  # `owners` is absent. An id with two or more definitions has one entry for each, and each
  # entry's `owners` is the ids of every type that has that definition, whether it declares it or
  # inherits it; every type that has the property is in exactly one entry's `owners`, so the
  # entries of one id have different first owners. A reader takes type T's definition of property
  # P from the entry with id P whose `owners` holds T, else from P's only entry, by lookup alone:
  # no hierarchy is needed. A revision whose types define each property alike renders exactly the
  # bytes it rendered before `owners` existed, so no format version changes and every earlier
  # document reads as before.
  - name: ekr.views.ProjectedProperty
    kind: struct
    fields:
      - name: id
        type: ekr.ontology.PropertyId
      - name: name
        type: String
      - name: value_kind
        type: ekr.ontology.ValueKind
      - name: owners
        type: Optional<List<ekr.ontology.TypeId>>

  - name: ekr.views.ProjectedNodeType
    kind: struct
    fields:
      - name: id
        type: ekr.ontology.TypeId
      - name: name
        type: String
      - name: properties
        type: List<ekr.ontology.PropertyId>
      - name: assertions
        type: List<ekr.views.ProjectedAssertion>

  - name: ekr.views.ProjectedEdgeType
    kind: struct
    fields:
      - name: id
        type: ekr.ontology.TypeId
      - name: name
        type: String
      - name: source_types
        type: List<ekr.ontology.TypeId>
      - name: target_types
        type: List<ekr.ontology.TypeId>
      - name: properties
        type: List<ekr.ontology.PropertyId>
      - name: assertions
        type: List<ekr.views.ProjectedAssertion>

  - name: ekr.views.ProjectedOntology
    kind: struct
    fields:
      - name: node_types
        type: List<ekr.views.ProjectedNodeType>
      - name: edge_types
        type: List<ekr.views.ProjectedEdgeType>
      - name: properties
        type: List<ekr.views.ProjectedProperty>

  # `name` is the node's canonical_name, `type` its type id, `state` its per-type lifecycle state
  # and `props` its property values keyed by property id.
  - name: ekr.views.ProjectedNode
    kind: struct
    fields:
      - name: id
        type: ekr.graph.NodeId
      - name: name
        type: String
      - name: type
        type: ekr.ontology.TypeId
      - name: aliases
        type: List<String>
      - name: state
        type: Optional<String>
      - name: props
        type: Map<String, List<ekr.views.ProjectedValue>>
      - name: assertions
        type: List<ekr.views.ProjectedAssertion>

  # The store's ekr.graph.Edge entities, exactly as it holds them. Whether a relation assertion and
  # an Edge with the same source, type and target are one projected edge is undecided
  # (decision-blocker:relation-assertion-edge-correspondence); this format joins neither to the
  # other, and carries no edge-level lifecycle, valid time or evidence of its own.
  - name: ekr.views.ProjectedEdge
    kind: struct
    fields:
      - name: id
        type: ekr.graph.EdgeId
      - name: source
        type: ekr.graph.NodeId
      - name: target
        type: ekr.graph.NodeId
      - name: type
        type: ekr.ontology.TypeId
      - name: props
        type: Map<String, List<ekr.views.ProjectedValue>>
      - name: assertions
        type: List<ekr.views.ProjectedAssertion>

  # An evidence identity. `locator` and `section` are ekr.graph.Evidence's. `retained` says whether
  # the store holds the bytes `content_hash` names; the bytes themselves are never projected.
  - name: ekr.views.ProjectedEvidence
    kind: struct
    fields:
      - name: id
        type: ekr.graph.EvidenceId
      - name: kind
        type: ekr.graph.EvidenceKind
      - name: locator
        type: String
      - name: section
        type: Optional<String>
      - name: content_hash
        type: ekr.kernel.ContentHash
      - name: observed_at
        type: ekr.views.EpochMillis
      - name: confidence_bp
        type: Integer
      - name: retained
        type: Boolean

  # `revision` is the first revision whose canonical state is valid against this version; `added`
  # the type and property ids this version declares and its parent does not (for the seed's
  # version, every id it declares). Only versions whose `revision` is at most the projected
  # revision are listed.
  - name: ekr.views.ProjectedSchemaVersion
    kind: struct
    fields:
      - name: number
        type: Integer
      - name: id
        type: ekr.ontology.SchemaVersionId
      - name: parent
        type: Optional<ekr.ontology.SchemaVersionId>
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: added
        type: List<Uuid>

  # One committed revision up to and including the projected one. `transaction_id` is omitted for
  # the seed; `schema_version` is the id of the version its canonical state is valid against.
  - name: ekr.views.ProjectedRevision
    kind: struct
    fields:
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: committed_at
        type: ekr.views.EpochMillis
      - name: transaction_id
        type: Optional<ekr.kernel.TransactionId>
      - name: schema_version
        type: ekr.ontology.SchemaVersionId

  - name: ekr.views.ProjectedSchema
    kind: struct
    fields:
      - name: versions
        type: List<ekr.views.ProjectedSchemaVersion>
      - name: revisions
        type: List<ekr.views.ProjectedRevision>
      - name: supporting_evidence
        type: Optional<List<ekr.views.SchemaEvidenceEntry>>

  # An immutable schema transaction's cited evidence. Ordered by revision, then evidence id;
  # omit the containing supporting_evidence field when no schema transaction cited evidence.
  # Seed evidence is not schema-transaction evidence. Entries after the selected revision are
  # excluded. The kernel's SchemaTransactionEvidence relation remains the authority for links.
  # cli::ontology::tests::schema_change_exposes_supporting_evidence holds the presentation
  # binding on both providers; authored ESS conformance remains separate acceptance work.
  - name: ekr.views.SchemaEvidenceEntry
    kind: struct
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: schema_version
        type: ekr.ontology.SchemaVersionId
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: evidence
        type: List<ekr.graph.EvidenceId>

  # The document. Rendered, never stored as canonical state; nothing owns it. Its tie to one
  # revision is design § 82, stated here rather than as a relation.
  - name: ekr.views.GraphProjectionV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.ProjectionMeta
      - name: ontology
        type: ekr.views.ProjectedOntology
      - name: nodes
        type: List<ekr.views.ProjectedNode>
      - name: edges
        type: List<ekr.views.ProjectedEdge>
      - name: evidence
        type: List<ekr.views.ProjectedEvidence>
      - name: schema
        type: ekr.views.ProjectedSchema

  # ---------------------------------------------------------------------------------------------
  # The five bounded reads a viewer draws from instead of the full projection: the overview, a
  # neighbourhood slice, one node's detail, a name search and the subjects' timeline. Each is its
  # own format, and each is
  # generic over any ontology: no type, property or edge type is named, and every label is taken
  # from the document's ontology or graph state. Their determinism rules are in the domain
  # summary above, one paragraph per format.
  # ---------------------------------------------------------------------------------------------

  - name: ekr.views.GraphOverviewFormatV1
    kind: enum
    variants: [{name: EkrGraphOverview1, wire: ekr.graph-overview/1}]

  - name: ekr.views.GraphSliceFormatV1
    kind: enum
    variants: [{name: EkrGraphSlice1, wire: ekr.graph-slice/1}]

  - name: ekr.views.NodeDetailFormatV1
    kind: enum
    variants: [{name: EkrNodeDetail1, wire: ekr.node-detail/1}]

  - name: ekr.views.NodeMatchesFormatV1
    kind: enum
    variants: [{name: EkrNodeMatches1, wire: ekr.node-matches/1}]

  # The position in a neighbourhood's record sequence (ExpandNeighbourhood): the number of records
  # the earlier pages delivered. A page's `next` is its own `after` plus the records it delivered.
  # It names no revision: a reader that pages keeps `at` fixed to the first page's meta.revision,
  # because a cursor read against another revision addresses another sequence.
  - name: ekr.views.SliceCursor
    kind: newtype
    of: Integer

  # A light node record: what a viewer needs to draw a node and nothing it needs to open one.
  # `name` is the node's canonical_name, `type` its type id, `degree` the number of the revision's
  # edges (ekr.graph.Edge) whose source or target is the node, counted over the whole revision,
  # not the answer; an edge whose source and target are both the node (a self-loop) is not
  # counted, as the reference viewer's degree did not count it. A Relation assertion with no Edge
  # is no edge here: UNMAPPED under decision-blocker:relation-assertion-edge-correspondence, which
  # leaves open whether such an assertion and an Edge with the same source, type and target are
  # one edge; the reference viewer drew both and counted both.
  - name: ekr.views.NodeSummary
    kind: struct
    fields:
      - name: id
        type: ekr.graph.NodeId
      - name: type
        type: ekr.ontology.TypeId
      - name: name
        type: String
      - name: degree
        type: Integer

  # What a schema version declares that its neighbour in the lineage does not: a node type, an
  # edge type or a property definition, by kind and id together, with the name the declaring
  # version gives it. One UUID may be both a type's id and a property's (ekr.ontology does not
  # refuse an id reused across kinds), and each is its own member.
  - name: ekr.views.SchemaMemberKind
    kind: enum
    variants: [NodeType, EdgeType, Property]

  - name: ekr.views.SchemaMember
    kind: struct
    fields:
      - name: id
        type: Uuid
      - name: kind
        type: ekr.views.SchemaMemberKind
      - name: name
        type: String

  # One version of the lineage. `revision` is the first revision whose canonical state is valid
  # against it. `added` is every member — a kind and an id — it declares and its parent does not
  # (for the seed's version, every member it declares), named as this version names it; `removed`
  # every member its parent declares and it does not, named as the parent names it (empty for the
  # seed's version). A version that declares a property under an id the parent declares only as
  # a type, or the reverse, adds it. A property is compared by its id alone among properties, so
  # a property that moves from one type to another is in neither list. Only versions whose `revision` is at most the overviewed revision are listed.
  # `widened` and `modified` say what else the version changed against its parent (nothing for
  # the seed's version, which has none): `widened` every end of an edge type both declare that
  # holds a node type in this version and not in the parent (ekr.views.WidenedEnd, what
  # WidenEdgeType does); `modified` every property declaration of a node or edge type that
  # differs from that type's declaration of it in the parent, for a property that is in neither
  # `added` nor `removed` as a Property (ekr.views.ModifiedProperty, what ModifyProperty does to a
  # property that exists). No schema change alters any other part of a type's declaration
  # (DefineNodeType and DefineEdgeType declare new ids only), so a committed version lists nothing
  # in all four exactly when its ontology is its parent's. `added` and `removed` keep
  # their meaning. Presence: `widened` and `modified` are present only when they would list at
  # least one entry, and never emitted empty — an exception to presence rule (4) for these two
  # fields alone — so a version that widens and modifies nothing answers exactly the bytes it
  # answered before the two fields existed.
  - name: ekr.views.OverviewSchemaVersion
    kind: struct
    fields:
      - name: number
        type: Integer
      - name: id
        type: ekr.ontology.SchemaVersionId
      - name: parent
        type: Optional<ekr.ontology.SchemaVersionId>
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: added
        type: List<ekr.views.SchemaMember>
      - name: removed
        type: List<ekr.views.SchemaMember>
      - name: widened
        type: Optional<List<ekr.views.WidenedEnd>>
      - name: modified
        type: Optional<List<ekr.views.ModifiedProperty>>

  # Which end of an edge type: its source_types or its target_types.
  - name: ekr.views.EdgeSide
    kind: enum
    variants: [Source, Target]

  # One end of an edge type that a schema version widened: `node_types` are the node types the
  # end holds in the version and not in its parent, at least one. An end the version leaves as
  # the parent had it is not listed. No schema change narrows an end (docs/schema-evolution.md,
  # edge-endpoint-removed), so a type an end loses is not a field.
  - name: ekr.views.WidenedEnd
    kind: struct
    fields:
      - name: edge_type
        type: ekr.ontology.TypeId
      - name: side
        type: ekr.views.EdgeSide
      - name: node_types
        type: List<ekr.ontology.TypeId>

  # What differs between a type's declaration of a property in a schema version and its
  # declaration of it in the parent. Declared: the type declares it and in the parent did not,
  # while the parent declares the property's id on another type. Undeclared: the reverse; no
  # schema change removes a declaration, so a committed lineage has none. Name, ValueType,
  # Cardinality, Required and Constraints: the type declares it in both, and that part of the
  # declaration (ekr.ontology.PropertyDefinition's name, value_type, cardinality, required,
  # constraints) differs.
  - name: ekr.views.PropertyAspect
    kind: enum
    variants: [Declared, Undeclared, Name, ValueType, Cardinality, Required, Constraints]

  # One property declaration a schema version changed: `owner` is the node type or edge type
  # that declares it, `property` its id, `name` the name this version gives it (the parent's for
  # Undeclared), and `changed` every aspect that differs, at least one.
  - name: ekr.views.ModifiedProperty
    kind: struct
    fields:
      - name: owner
        type: ekr.ontology.TypeId
      - name: property
        type: ekr.ontology.PropertyId
      - name: name
        type: String
      - name: changed
        type: List<ekr.views.PropertyAspect>

  # One committed revision up to and including the overviewed one, with what the overviewed
  # revision's canonical state says existed by then. Growth is read from recorded time, never by
  # loading each revision:
  #   - `assertions` counts the overviewed state's assertions whose recorded_from is at most this
  #     revision's committed_at;
  #   - `nodes` counts its nodes whose recorded time is at most committed_at, where a node's
  #     recorded time is the least recorded_from among the assertions whose subject is that node.
  #     A node no assertion has as its subject has no recorded time and is counted at every
  #     revision from 0; OverviewSchema.unrecorded_nodes says how many there are;
  #   - `edges` likewise. An edge's recorded time is the least recorded_from among the assertions
  #     whose subject is that edge and the Relation assertions whose subject, predicate and
  #     object_ref are the edge's source, type and target; an edge with neither is counted from
  #     revision 0 (OverviewSchema.unrecorded_edges).
  #     UNMAPPED under decision-blocker:relation-assertion-edge-correspondence: the second half
  #     reads a Relation assertion as timing the Edge it matches on source, type and target. It
  #     is used for this count only and joins no record to another; an owner decision on the
  #     blocker may remove it, and then most edges are counted from revision 0.
  # Anything an earlier revision held and the overviewed one does not is in no count, and
  # recorded_to is not read, so a superseded or retracted assertion counts from the revision that
  # recorded it onward, as the reference viewer's per-revision reads counted it.
  - name: ekr.views.OverviewRevision
    kind: struct
    fields:
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: committed_at
        type: ekr.views.EpochMillis
      - name: transaction_id
        type: Optional<ekr.kernel.TransactionId>
      - name: schema_version
        type: ekr.ontology.SchemaVersionId
      - name: nodes
        type: Integer
      - name: edges
        type: Integer
      - name: assertions
        type: Integer

  - name: ekr.views.OverviewSchema
    kind: struct
    fields:
      - name: versions
        type: List<ekr.views.OverviewSchemaVersion>
      - name: revisions
        type: List<ekr.views.OverviewRevision>
      - name: unrecorded_nodes
        type: Integer
      - name: unrecorded_edges
        type: Integer
      - name: supporting_evidence
        type: Optional<List<ekr.views.SchemaEvidenceEntry>>

  # How many nodes of a node type, or edges of an edge type, the overviewed revision holds. Every
  # type the overviewed ontology declares is listed, with zero where it has none.
  - name: ekr.views.TypeCount
    kind: struct
    fields:
      - name: type
        type: ekr.ontology.TypeId
      - name: count
        type: Integer

  # The layout roles, by the reference viewer's valid-time rule, per node type. The rule, exactly:
  #   A node's dated facts are the present valid_from of every assertion whose subject is the node
  #   and of every Relation assertion whose object_ref is the node, of any lifecycle, each counted
  #   once per assertion.
  #   A node is timestamped when one of its property values is an Integer v with
  #   1,000,000,000,000 <= v < 10,000,000,000,000 (the reference viewer's epoch-milliseconds test)
  #   or a Timestamp. UNMAPPED: the reference viewer's export rendered a Timestamp value as text,
  #   so a Timestamp never made a node timestamped there; counting it here is a decision for the
  #   owner. The bench store holds no Timestamp property value, so its roles are the same under
  #   both readings.
  #   A timestamped node is judged and instant. Otherwise a node with at least two dated facts is
  #   judged, and it is also within_hour and instant when its latest dated fact is at most
  #   3,600,000 ms after its earliest. A node with one dated fact or none is not judged: a single
  #   instant cannot show whether its facts gather at one moment.
  #   `neighbour_types` sums, over the type's nodes, the number of distinct node types among the
  #   nodes an edge (either direction) or a Relation assertion (subject to object_ref, either
  #   direction) joins it to; a self-loop joins a node to its own type. Distinct neighbour types do
  #   not depend on the open edge/relation join, so both are read.
  #   A type is an event type when judged > 0 and 5 × instant >= 3 × judged
  #   (instant / judged >= 0.6).
  #   This is EKR's one definition of an event type (task:one-event-type-rule). Every reader that
  #   asks which node types are events takes exactly the types whose `event` is true here, and no
  #   other rule: the timeline (ekr.graph-timeline/1), ekr.ocel/1 when its request names no event
  #   type, and the host's `GET /roles` (ekr.view-roles/1), whose `event` and `observation`
  #   entries together are exactly these types, at the same revision.
  #   The observation type is, among the event types whose neighbour_types / nodes is at least the
  #   mean of neighbour_types / nodes over all event types, the one with the most nodes; ties go to
  #   the lowest type id. The ratios are compared exactly as rationals, never in floating point,
  #   and the tie rule is this format's: the reference viewer compared in floating point and broke
  #   ties by the order in which a type first appeared among its nodes. The host's `GET /roles`
  #   marks exactly this type `observation`.
  # The reference viewer derived three further roles — subject types, the edge type joining an
  # observation to what it is about, and a history property. UNMAPPED: this format does not carry
  # them; whether the overview or the page derives them is open for the owner. The rest of the
  # rule the host serves as /roles — its `subject` role, read off the edge types' source and
  # target types — is not carried either; only its `event` and `observation` roles are, above.
  - name: ekr.views.TypeTiming
    kind: struct
    fields:
      - name: type
        type: ekr.ontology.TypeId
      - name: nodes
        type: Integer
      - name: timestamped
        type: Integer
      - name: judged
        type: Integer
      - name: within_hour
        type: Integer
      - name: instant
        type: Integer
      - name: neighbour_types
        type: Integer
      - name: event
        type: Boolean

  - name: ekr.views.OverviewRoles
    kind: struct
    fields:
      - name: types
        type: List<ekr.views.TypeTiming>
      - name: observation_type
        type: Optional<ekr.ontology.TypeId>

  # Assertions per valid-time bucket per node type. The bucketed assertions are the overviewed
  # state's assertions whose subject is a node and that carry a valid_from, of any lifecycle,
  # keyed by the subject node's type and bucketed by valid_from alone; `undated` counts the
  # node-subject assertions with no valid_from. Assertions whose subject is an edge or a type are
  # in neither. `first` and `last` are the least and greatest bucketed valid_from, omitted when
  # there is none.
  # Width, the reference viewer's automatic rule applied to [first, last] and bounded: the finest
  # is a week (604,800,000 ms) when last - first > 10,368,000,000 ms (120 days), otherwise a day
  # (86,400,000 ms); a day when nothing is bucketed. The widths, finest first, are a day, a week,
  # 4 weeks, 13 weeks, 52 weeks, and 52 weeks doubled once, twice and so on; the width is the
  # first of them, from the finest, that cuts [first, last] into at most 200 buckets —
  # (start(last) - start(first)) / width + 1 <= 200 — so the overview holds at most 200 bucket
  # starts per node type however long its facts run. A bucket's `start` is, for a day,
  # floor(t / 86,400,000) × 86,400,000; for any other width W, floor((t + 259,200,000) / W) × W -
  # 259,200,000, which is a Monday 00:00 UTC (the epoch fell on a Thursday, and every W but a
  # day is a whole number of weeks); floor rounds toward negative infinity. Only buckets holding
  # at least one assertion are listed. The reference viewer bucketed event nodes placed at their
  # time within one subject's neighbourhood; that per-subject heatmap is ekr.graph-timeline/1's.
  - name: ekr.views.TimelineBucket
    kind: struct
    fields:
      - name: start
        type: ekr.views.EpochMillis
      - name: type
        type: ekr.ontology.TypeId
      - name: assertions
        type: Integer

  - name: ekr.views.OverviewTimeline
    kind: struct
    fields:
      - name: bucket_ms
        type: Integer
      - name: first
        type: Optional<ekr.views.EpochMillis>
      - name: last
        type: Optional<ekr.views.EpochMillis>
      - name: undated
        type: Integer
      - name: buckets
        type: List<ekr.views.TimelineBucket>

  # `limit` is the number of top nodes asked for after the default is applied; the four counts are
  # over the overviewed revision's canonical state, not over this document.
  - name: ekr.views.OverviewMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.GraphOverviewFormatV1
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: node_count
        type: Integer
      - name: edge_count
        type: Integer
      - name: assertion_count
        type: Integer
      - name: evidence_count
        type: Integer
      - name: limit
        type: Integer

  # ekr.graph-overview/1. `ontology` is ekr.graph-projection/1's, with the type assertions and
  # their ids. `top` is the min(limit, node_count) nodes of highest degree.
  # Every fact here that one assertion states carries that assertion's id (the ontology's type
  # assertions); counts, roles, buckets and degrees are derived from many and carry none.
  - name: ekr.views.GraphOverviewV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.OverviewMeta
      - name: ontology
        type: ekr.views.ProjectedOntology
      - name: schema
        type: ekr.views.OverviewSchema
      - name: node_types
        type: List<ekr.views.TypeCount>
      - name: edge_types
        type: List<ekr.views.TypeCount>
      - name: roles
        type: ekr.views.OverviewRoles
      - name: timeline
        type: ekr.views.OverviewTimeline
      - name: top
        type: List<ekr.views.NodeSummary>

  # A node of a neighbourhood: its light record and its hop distance from the nearest seed.
  - name: ekr.views.SliceNode
    kind: struct
    fields:
      - name: id
        type: ekr.graph.NodeId
      - name: type
        type: ekr.ontology.TypeId
      - name: name
        type: String
      - name: degree
        type: Integer
      - name: distance
        type: Integer

  # An ekr.graph.Edge of a neighbourhood, light: no props. `assertions` is the ids of the
  # assertions whose subject is this edge, so the facts about it can be opened by id.
  - name: ekr.views.SliceEdge
    kind: struct
    fields:
      - name: id
        type: ekr.graph.EdgeId
      - name: source
        type: ekr.graph.NodeId
      - name: target
        type: ekr.graph.NodeId
      - name: type
        type: ekr.ontology.TypeId
      - name: assertions
        type: List<ekr.graph.AssertionId>

  # `seeds` is the request's seeds as a set; `after` the request's cursor, 0 when it gave none;
  # `node_total` and `edge_total` count the whole neighbourhood, not this page.
  - name: ekr.views.SliceMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.GraphSliceFormatV1
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: seeds
        type: List<ekr.graph.NodeId>
      - name: depth
        type: Integer
      - name: after
        type: ekr.views.SliceCursor
      - name: node_total
        type: Integer
      - name: edge_total
        type: Integer

  # ekr.graph-slice/1: one page of a neighbourhood.
  # The neighbourhood of seeds S at depth d is every node within d hops of a node of S — a hop
  # crosses one of the revision's edges (ekr.graph.Edge) in either direction and of any type — and
  # every edge whose source and target are both in it. A node's distance is its hop count from the
  # nearest seed; seeds are at 0. A Relation assertion with no Edge is not crossed (UNMAPPED, as on
  # NodeSummary).
  # The record sequence: the neighbourhood's nodes by distance ascending, then degree descending,
  # then id ascending; each node followed by the edges it closes — those whose other endpoint comes
  # earlier in the order or is the node itself — by id ascending. So an edge always follows both
  # its endpoints. Distance before degree is this format's: a page never holds a node without the
  # node that led to it; the approved plan said "highest degree first", which it keeps within one
  # distance.
  # A page takes the records from position `after` onward, in order, and stops before the first
  # record that would make it hold more than `limit` nodes or more than `edge_limit` edges, so a
  # page may end between a node and the edges it closes. `next` is present exactly when records
  # remain after the page, and is `after` plus the records the page holds. A cursor at or past the
  # end answers an empty page with no `next`.
  - name: ekr.views.GraphSliceV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.SliceMeta
      - name: nodes
        type: List<ekr.views.SliceNode>
      - name: edges
        type: List<ekr.views.SliceEdge>
      - name: next
        type: Optional<ekr.views.SliceCursor>

  # One node as the store holds it at the revision: ekr.views.ProjectedNode's own fields without
  # its assertions, which the detail carries beside it, and with its degree.
  - name: ekr.views.DetailNode
    kind: struct
    fields:
      - name: id
        type: ekr.graph.NodeId
      - name: name
        type: String
      - name: type
        type: ekr.ontology.TypeId
      - name: aliases
        type: List<String>
      - name: state
        type: Optional<String>
      - name: props
        type: Map<String, List<ekr.views.ProjectedValue>>
      - name: degree
        type: Integer

  # An assertion about something else whose object is the described node (object_kind Node,
  # object_ref the node): the incoming facts, with their subject named, because a ProjectedAssertion
  # leaves its subject to the list it is in.
  - name: ekr.views.ReferencingAssertion
    kind: struct
    fields:
      - name: subject_kind
        type: ekr.graph.SubjectKind
      - name: subject
        type: Uuid
      - name: assertion
        type: ekr.views.ProjectedAssertion

  - name: ekr.views.DetailMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.NodeDetailFormatV1
      - name: revision
        type: ekr.kernel.RevisionNumber

  # ekr.node-detail/1: one node. `assertions` is every assertion whose subject is the node, of any
  # lifecycle, each with its assessment, lifecycle, valid and recorded time and evidence ids;
  # `referencing` every assertion whose object_ref is the node; `edges` every edge whose source or
  # target is the node, with its props and the assertions whose subject is that edge; `neighbours`
  # the light record of every other node an incident edge, one of `assertions`' object_ref or one of
  # `referencing`' Node subjects names, so a viewer can label them without another read. Evidence
  # is carried by id only; its record is read by that id. Bound: one node, and every one of its
  # edges — the detail does not page.
  - name: ekr.views.NodeDetailV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.DetailMeta
      - name: node
        type: ekr.views.DetailNode
      - name: assertions
        type: List<ekr.views.ProjectedAssertion>
      - name: referencing
        type: List<ekr.views.ReferencingAssertion>
      - name: edges
        type: List<ekr.views.ProjectedEdge>
      - name: neighbours
        type: List<ekr.views.NodeSummary>

  # Which comparison a match passed. Exact: the text is a byte-exact substring of the node's
  # canonical_name or of one of its aliases. Folded: not Exact, and the text is a substring after
  # both sides are lowercased by Unicode's Lowercase_Mapping, the full mapping with no locale
  # (Rust's str::to_lowercase) and no normalization. Folding by lowercase mapping rather than
  # Unicode case folding is this format's decision.
  - name: ekr.views.MatchTier
    kind: enum
    variants: [Exact, Folded]

  - name: ekr.views.MatchField
    kind: enum
    variants: [Name, Alias]

  # One match. `field` is Name when the name passed the match's tier, else Alias, and then `alias`
  # is the first alias in the node's alias order that passed it.
  - name: ekr.views.NodeMatch
    kind: struct
    fields:
      - name: id
        type: ekr.graph.NodeId
      - name: type
        type: ekr.ontology.TypeId
      - name: name
        type: String
      - name: degree
        type: Integer
      - name: tier
        type: ekr.views.MatchTier
      - name: field
        type: ekr.views.MatchField
      - name: alias
        type: Optional<String>

  # `total` counts every matching node and `exact_total` the Exact ones among them, before `limit`.
  - name: ekr.views.MatchesMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.NodeMatchesFormatV1
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: text
        type: String
      - name: total
        type: Integer
      - name: exact_total
        type: Integer

  # ekr.node-matches/1: the first `limit` matching nodes. Empty text matches every node, Exactly.
  - name: ekr.views.NodeMatchesV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.MatchesMeta
      - name: matches
        type: List<ekr.views.NodeMatch>

  # ---------------------------------------------------------------------------------------------
  # ekr.graph-timeline/1: the subjects' timeline. One row per subject — a node of the row type —
  # with the events related to it counted per time bucket, the reference viewer's heatmap.
  #
  # Event types are the overview's (ekr.views.TypeTiming `event`), and an event is a node of an
  # event type. A node's time: its least property value that is an Integer v with
  # 1,000,000,000,000 <= v < 10,000,000,000,000 or a Timestamp (the overview's timestamped rule,
  # with its UNMAPPED reading of a Timestamp); otherwise the earliest of its dated facts as
  # ekr.views.TypeTiming defines them; a node with neither has no time. Its end is the greatest of
  # its time and its dated facts. An event is placed at its time.
  #
  # A subject's events within h hops are the events a walk from the subject reaches, the reference
  # viewer's walk exactly. The walk goes hop by hop, 1 to h, across the revision's edges
  # (ekr.graph.Edge) in either direction; a node is reached at most once, at the first hop and by
  # the first node that reaches it, where the nodes of a hop are walked in the order they were
  # reached (the subject first) and each node's edges in edge id order. From each node of the
  # previous hop:
  #   - when the subject is itself an event, a node that is neither the subject nor an event is
  #     not walked on;
  #   - an intermediate — a node that is neither the subject nor an event — is walked on only when
  #     it has exactly one neighbour of the type of the node that reached it, and then only across
  #     edges whose target it is (what points at it, not what it originated);
  #   - from an event other than the subject, a hop reaches events only;
  #   - an event with no time is never reached.
  # Every event reached is one of the subject's events, counted once whatever the number of paths
  # to it. A Relation assertion with no Edge is not crossed (UNMAPPED, as on NodeSummary).
  #
  # Buckets: the span is [first, last], the least time and the greatest end of the revision's
  # events that have a time. The finest width is the request's `bucket` when given, otherwise a
  # week when last - first > 10,368,000,000 ms (120 days) and a day otherwise; the width is then
  # chosen from it exactly as the overview's is (ekr.views.OverviewTimeline): the first width of
  # the same list, from that finest one, that cuts the span into at most 200 buckets, so a row
  # holds at most 200 bucket starts per event type. A bucket's start is the overview's too. Only
  # buckets holding at least one event are listed.
  # ---------------------------------------------------------------------------------------------

  - name: ekr.views.GraphTimelineFormatV1
    kind: enum
    variants: [{name: EkrGraphTimeline1, wire: ekr.graph-timeline/1}]

  # The finest bucket width a request asks for; a longer span may be answered coarser.
  - name: ekr.views.TimelineBucketWidth
    kind: enum
    variants: [Day, Week]

  # A type the timeline offers as its row type, the reference viewer's subject types. The
  # candidates are the node types some node of the revision has that are not event types; when
  # every such type is an event type, every one but the overview's observation type. `nodes` is
  # how many nodes the revision holds of it; `reached` how many of them have at least one event
  # within 2 hops; `weight` sums, over its nodes, 2 for each event 1 hop away and 1 for each
  # event 2 hops away (the reference viewer's hop weights 1 and 1/2, in halves). Listed: the
  # candidates whose weight is above 0 and whose weight / nodes is at least 1/20 of the greatest,
  # at most six, in the order the format's determinism paragraph names.
  - name: ekr.views.TimelineRowType
    kind: struct
    fields:
      - name: type
        type: ekr.ontology.TypeId
      - name: nodes
        type: Integer
      - name: reached
        type: Integer
      - name: weight
        type: Integer

  # How many events of one event type are placed in the bucket starting at `start`.
  - name: ekr.views.TimelineCell
    kind: struct
    fields:
      - name: start
        type: ekr.views.EpochMillis
      - name: type
        type: ekr.ontology.TypeId
      - name: events
        type: Integer

  # One subject: `total` counts its events within the hops asked for, `first` and `last` are the
  # least and greatest of their times (omitted when it has none), and `cells` bucket them.
  - name: ekr.views.TimelineRow
    kind: struct
    fields:
      - name: id
        type: ekr.graph.NodeId
      - name: name
        type: String
      - name: total
        type: Integer
      - name: first
        type: Optional<ekr.views.EpochMillis>
      - name: last
        type: Optional<ekr.views.EpochMillis>
      - name: cells
        type: List<ekr.views.TimelineCell>

  # One hop of the walk that reached an event: across `edge`, of type `edge_type`, to the node
  # `node`; `forward` is true when the edge's source is the node the hop left.
  - name: ekr.views.TimelineStep
    kind: struct
    fields:
      - name: edge
        type: ekr.graph.EdgeId
      - name: edge_type
        type: ekr.ontology.TypeId
      - name: forward
        type: Boolean
      - name: node
        type: ekr.graph.NodeId
      - name: type
        type: ekr.ontology.TypeId
      - name: name
        type: String

  # One event of the subject a request names: its light record, its time and end, its distance in
  # hops, and the path the walk took to it from the subject, whose last step arrives at it.
  - name: ekr.views.TimelineEvent
    kind: struct
    fields:
      - name: id
        type: ekr.graph.NodeId
      - name: type
        type: ekr.ontology.TypeId
      - name: name
        type: String
      - name: start
        type: ekr.views.EpochMillis
      - name: end
        type: ekr.views.EpochMillis
      - name: distance
        type: Integer
      - name: path
        type: List<ekr.views.TimelineStep>

  # `row_type` is the type the rows are of: the subject's type when a held subject was asked
  # for, else the request's `row_type`, else the first listed row type; omitted when there is
  # none.
  # `subject` echoes the request's. `hops` and `limit` are the request's; `bucket_ms` the width
  # used; `first` and `last` the span (omitted when no event has a time). `subjects` counts the
  # revision's nodes of the row type, `active` those with at least one event, and `events` the
  # distinct events of all of the active ones, which the strip buckets.
  - name: ekr.views.TimelineMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.GraphTimelineFormatV1
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: row_type
        type: Optional<ekr.ontology.TypeId>
      - name: subject
        type: Optional<ekr.graph.NodeId>
      - name: hops
        type: Integer
      - name: limit
        type: Integer
      - name: bucket_ms
        type: Integer
      - name: first
        type: Optional<ekr.views.EpochMillis>
      - name: last
        type: Optional<ekr.views.EpochMillis>
      - name: subjects
        type: Integer
      - name: active
        type: Integer
      - name: events
        type: Integer

  # ekr.graph-timeline/1. `rows` is the first `limit` of the active subjects of the row type —
  # a subject with no event is not listed — or, when the request names a held subject, that one's
  # row alone, listed whatever its total. `strip` buckets the distinct events of every active
  # subject, listed or not. `events` lists the named, held subject's events and is empty
  # otherwise.
  # Counts and cells are derived from many facts and carry no assertion id.
  - name: ekr.views.GraphTimelineV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.TimelineMeta
      - name: row_types
        type: List<ekr.views.TimelineRowType>
      - name: rows
        type: List<ekr.views.TimelineRow>
      - name: strip
        type: List<ekr.views.TimelineCell>
      - name: events
        type: List<ekr.views.TimelineEvent>

  # ---------------------------------------------------------------------------------------------
  # ekr.graph-changes/1: what the committed revisions up to one revision `at` changed after a
  # revision or a time `since` (ChangesSince), so an agent that reacts to change need not diff two
  # snapshots.
  #
  # The changes of one revision are read off the transaction it committed, and the seed's
  # (revision 0) off its canonical state: every node it created (NodeCreated), every edge it
  # created (EdgeCreated), every assertion it added (AssertionAdded), superseded
  # (AssertionSuperseded) or retracted (AssertionRetracted), and every evidence entry an
  # ekr.kernel AddEvidence operation of its transaction added (EvidenceAdded). The seed's evidence
  # came with the seed and not through an AddEvidence, so it is no change of this format, and a
  # range holding no AddEvidence answers exactly as it did before EvidenceAdded was declared. An
  # edge a later revision deletes stays the change its creating revision made. A property update,
  # a named operation, an edge deletion and a schema change are not changes of this format.
  #
  # `since` is one revision, valid time or transaction time, and it chooses the changes:
  #   - a revision N (since_revision): every change of the revisions after N, up to and including
  #     `at`;
  #   - a transaction time T (since_recorded): every change of the revisions committed after T
  #     (committed_at > T), up to and including `at`. A revision records its changes at its
  #     committed_at: an added assertion's recorded_from and a superseded or retracted one's
  #     recorded_to are it;
  #   - a valid time T (since_valid): every assertion change, of every revision from the seed up
  #     to and including `at`, whose valid time is after T (valid_time > T, below). A node or an
  #     edge has no valid time of its own (ekr.views.ProjectedEdge), and neither has an evidence
  #     entry, so NodeCreated, EdgeCreated and EvidenceAdded are never chosen by a valid time, and
  #     an assertion with no valid_from is not either.
  # ---------------------------------------------------------------------------------------------

  - name: ekr.views.GraphChangesFormatV1
    kind: enum
    variants: [{name: EkrGraphChanges1, wire: ekr.graph-changes/1}]

  # Which of the three a `since` is: Revision, a revision number; ValidTime and TransactionTime,
  # an EpochMillis.
  - name: ekr.views.SinceKind
    kind: enum
    variants: [Revision, ValidTime, TransactionTime]

  - name: ekr.views.ChangeKind
    kind: enum
    variants: [NodeCreated, EdgeCreated, AssertionAdded, AssertionSuperseded, AssertionRetracted, EvidenceAdded]

  # The position in the change sequence: the number of changes the earlier pages delivered. A
  # page's `next` is its own `after` plus the changes it delivered. Like ekr.views.SliceCursor it
  # names no revision, so a reader that pages keeps `at` fixed to the first page's meta.revision.
  - name: ekr.views.ChangeCursor
    kind: newtype
    of: Integer

  # One change. `revision` is the revision that made it and `recorded_at` that revision's
  # committed_at; `id` is the node's, the edge's, the assertion's or the evidence entry's. Exactly
  # the payload its kind carries is present:
  #   - NodeCreated: `type` and `name`, the node's type and canonical_name as created;
  #   - EdgeCreated: `type`, `source` and `target`;
  #   - AssertionAdded, AssertionSuperseded and AssertionRetracted: `subject_kind` and `subject`,
  #     the assertion's subject; AssertionSuperseded also `by`, the replacing assertion;
  #   - EvidenceAdded: `locator`, the entry's source identity as ekr.graph.Evidence's locator
  #     (an AddEvidence admits only a HumanStatement, so it is the statement's identity, empty
  #     when the statement records none), and `content_hash`, the address of the payload bytes
  #     the AddEvidence brought and its commit retained.
  # `valid_time` is the valid time an assertion change is chosen by under since_valid: the
  # assertion's valid_from for AssertionAdded and AssertionRetracted, and the supersession's
  # effective_from for AssertionSuperseded; omitted for an assertion with no valid_from and for a
  # node or an edge.
  # `evidence` is, for an assertion change, the ids of the evidence the assertion cites; for a
  # NodeCreated or EdgeCreated, the ids of the evidence cited by the assertions the same revision
  # added whose subject is that node or edge — empty when it added none; for an EvidenceAdded,
  # empty.
  - name: ekr.views.GraphChange
    kind: struct
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: recorded_at
        type: ekr.views.EpochMillis
      - name: change
        type: ekr.views.ChangeKind
      - name: id
        type: Uuid
      - name: type
        type: Optional<ekr.ontology.TypeId>
      - name: name
        type: Optional<String>
      - name: source
        type: Optional<ekr.graph.NodeId>
      - name: target
        type: Optional<ekr.graph.NodeId>
      - name: subject_kind
        type: Optional<ekr.graph.SubjectKind>
      - name: subject
        type: Optional<Uuid>
      - name: by
        type: Optional<ekr.graph.AssertionId>
      - name: valid_time
        type: Optional<ekr.views.EpochMillis>
      - name: locator
        type: Optional<String>
      - name: content_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: evidence
        type: List<ekr.graph.EvidenceId>

  # `revision` is the revision read: `at`, or the head as it stood at the request when `at` is
  # absent. Exactly one of since_revision, since_valid and since_recorded is present: the
  # request's. `limit` and `after` are the request's after their defaults; `total` counts every
  # change the request chooses, not this page.
  - name: ekr.views.ChangesMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.GraphChangesFormatV1
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: since_revision
        type: Optional<ekr.kernel.RevisionNumber>
      - name: since_valid
        type: Optional<ekr.views.EpochMillis>
      - name: since_recorded
        type: Optional<ekr.views.EpochMillis>
      - name: limit
        type: Integer
      - name: after
        type: ekr.views.ChangeCursor
      - name: total
        type: Integer

  # ekr.graph-changes/1: one page of the chosen changes, in the format's order. A page takes the
  # changes from position `after` onward, at most `limit` of them. `next` is present exactly when
  # changes remain after the page, and is `after` plus the changes the page holds; `remaining`
  # counts them, 0 exactly when there is no `next`. A cursor at or past the end answers an empty
  # page with no `next`. Every fact here that one assertion states carries that assertion's id.
  - name: ekr.views.GraphChangesV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.ChangesMeta
      - name: changes
        type: List<ekr.views.GraphChange>
      - name: next
        type: Optional<ekr.views.ChangeCursor>
      - name: remaining
        type: Integer

  - name: ekr.views.StoreQualityFormatV1
    kind: enum
    variants: [{name: EkrStoreQuality1, wire: ekr.store-quality/1}]

  # A share in basis points, 0 to 10000: 10000 times a count divided by its whole, rounded down.
  - name: ekr.views.BasisPoints
    kind: newtype
    of: Integer

  # `revision` is the revision read: `at`, or the head as it stood at the request when `at` is
  # absent. The head itself is not carried (rule (5)).
  - name: ekr.views.QualityMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.StoreQualityFormatV1
      - name: revision
        type: ekr.kernel.RevisionNumber

  # The revision's assertions whose lifecycle is Active; a retracted or superseded one is no
  # longer a claim of the revision and is not counted. `with_evidence` counts those citing at
  # least one evidence record the revision holds and retains the bytes of. `with_item_evidence`
  # counts those citing at least one evidence record that entered after the seed, through an
  # ekr.kernel AddEvidence operation: evidence for one source item, where a seed's evidence is
  # whatever corpus the seed carried. It is 0 in a store whose evidence all came with its seed.
  # Evidence attached to an assertion after it was added (an ekr.graph.EvidenceAttachment) counts
  # in both as cited evidence does (story:evidence-attaches-to-a-held-assertion).
  # The two shares are of `active`, omitted when `active` is 0.
  # `with_seed_evidence` counts active assertions citing or attached to at least one seed
  # evidence record whose bytes remain retained. An assertion can count in both seed and item.
  - name: ekr.views.AssertionQuality
    kind: struct
    fields:
      - name: active
        type: Integer
      - name: with_evidence
        type: Integer
      - name: with_item_evidence
        type: Integer
      - name: with_seed_evidence
        type: Integer
      - name: with_evidence_share
        type: Optional<ekr.views.BasisPoints>
      - name: with_item_evidence_share
        type: Optional<ekr.views.BasisPoints>

  # `declared` counts the property declarations of the revision's ontology: each property each
  # node type and each edge type declares itself, so a property two types declare counts twice
  # and one a type inherits counts once, at its declarer. `constrained` counts those declaring at
  # least one constraint (design § 11.2 `constraints`). The share is of `declared`, omitted when
  # `declared` is 0.
  # `constrained_types` counts declaring node and edge types with at least one directly
  # declared constrained property. Several properties count one owner; inherited ones add none.
  - name: ekr.views.PropertyQuality
    kind: struct
    fields:
      - name: declared
        type: Integer
      - name: constrained
        type: Integer
      - name: constrained_types
        type: Integer
      - name: constrained_share
        type: Optional<ekr.views.BasisPoints>

  # One name two or more nodes of one type hold: `type` is the nodes' own type, `name` a canonical
  # name or an alias, compared exactly as text, and `nodes` every node of that type holding it as
  # either, two or more, by id. A node holding one name as its canonical name and as an alias is
  # listed once. The empty name identifies nothing (ekr.kernel's `empty-alias`) and is never
  # listed.
  - name: ekr.views.SharedName
    kind: struct
    fields:
      - name: type
        type: ekr.ontology.TypeId
      - name: name
        type: String
      - name: nodes
        type: List<ekr.graph.NodeId>

  # ekr.store-quality/1: the quality of one revision beyond its size. `shared_names` lists every
  # name two or more nodes of one type hold; `sharing_nodes` counts the distinct nodes it lists.
  - name: ekr.views.StoreQualityV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.QualityMeta
      - name: assertions
        type: ekr.views.AssertionQuality
      - name: properties
        type: ekr.views.PropertyQuality
      - name: shared_names
        type: List<ekr.views.SharedName>
      - name: sharing_nodes
        type: Integer

  # ekr.code-names/1: the store's names found in a consumer's source files, so its store-reading
  # code stays generic over any ontology (story:store-reading-code-names-no-contents).
  - name: ekr.views.CodeNamesFormatV1
    kind: enum
    variants: [{name: EkrCodeNames1, wire: ekr.code-names/1}]

  # One source file as the caller read it: `path` exactly as given, never resolved, and its whole
  # text. The command reads no file itself; the host reads each one and says which it was.
  - name: ekr.views.SourceText
    kind: struct
    fields:
      - name: path
        type: String
      - name: text
        type: String

  # Which of the store's names a literal equals: a node type's or an edge type's name, a
  # property's name, or a node's canonical name or one of its aliases.
  - name: ekr.views.CodeNameKind
    kind: enum
    variants: [NodeType, EdgeType, Property, CanonicalName, Alias]

  # One store name a literal equals. `id` is the type's, the property's or the node's. For a
  # CanonicalName or an Alias, `type_id` and `type_name` are the node's type, its id and its name;
  # for the other kinds both are omitted.
  - name: ekr.views.CodeNameMatch
    kind: struct
    fields:
      - name: kind
        type: ekr.views.CodeNameKind
      - name: id
        type: Uuid
      - name: type_id
        type: Optional<ekr.ontology.TypeId>
      - name: type_name
        type: Optional<String>

  # One literal that equals at least one store name. `file` is the source's path as given; `line`
  # is 1-based; `column` is the 1-based position, in Unicode scalar values, of the literal's
  # opening quote on that line; `literal` is the text between the quotes; `runtime_word` is true
  # exactly when that text is also one of the runtime's own words (below); `names` is every store
  # name it equals.
  - name: ekr.views.CodeNameFinding
    kind: struct
    fields:
      - name: file
        type: String
      - name: line
        type: Integer
      - name: column
        type: Integer
      - name: literal
        type: String
      - name: runtime_word
        type: Boolean
      - name: names
        type: List<ekr.views.CodeNameMatch>

  # `revision` is the revision whose names were read: `at`, or the head as it stood at the
  # request. `files` counts the distinct sources, `literals` every literal found in them,
  # `exempt` the literals that equal a store id's text (below), `findings` every finding and
  # `runtime_word_findings` those of them whose `runtime_word` is true. A literal is both exempt
  # and a finding never.
  - name: ekr.views.CodeNameMode
    kind: enum
    variants: [Literals, Words]

  - name: ekr.views.CodeNamesMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.CodeNamesFormatV1
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: files
        type: Integer
      - name: literals
        type: Integer
      - name: exempt
        type: Integer
      - name: findings
        type: Integer
      - name: runtime_word_findings
        type: Integer
      - name: mode
        type: Optional<ekr.views.CodeNameMode>

  # ekr.code-names/1. What a literal is: in each line of a source's text (lines split at `\n`),
  # the text between an opening quote — `"`, `'` or a backtick — and the next quote of the same
  # character on the same line that no backslash escapes. Each line is scanned twice, and a
  # literal either scan finds is one, counted once: (a) one pass left to right over all three
  # characters at once, which skips a backslash and the character after it and consumes a whole
  # literal before it looks for the next opening quote, so a quote inside a literal of another
  # kind (`'"'`, `"can't"`) opens nothing; (b) one pass per character, blind to the other two,
  # paired left to right, so a literal of one kind is found inside a literal of another. In both,
  # a quote with no closing partner on its line opens nothing. A literal is its raw text: no
  # escape is decoded, and none spans a line. Identifiers — a bare word outside quotes — are not
  # literals, and comments are not recognised: a quoted name in a comment is a literal like any
  # other, because the check is the same for every language. Finding the literals is linear in
  # the length of the text.
  # In Words mode a revision name may occur anywhere in the line, including comments and bare
  # identifiers. Exact case-sensitive text matches count only when each adjacent character is
  # absent or neither Unicode alphanumeric nor underscore. Names may contain punctuation or
  # spaces. Column is the first matched character's 1-based Unicode scalar position. Each
  # (line, column, name) occurrence counts once; ties at one column sort by name. The legacy
  # literals count counts these candidate name occurrences before exemptions in Words mode.
  # meta.mode is Words only in that mode and omitted in default Literals mode, preserving its
  # existing document bytes. All exemptions, name kinds and runtime_word flags remain the same.
  #
  # The store's names are those the revision holds: every node type's and edge type's name, the
  # name of every property any type declares, and every node's canonical name and aliases. A
  # literal equals a name when the two are the same text, byte for byte, case included; an empty
  # or blank name equals nothing. A finding is a literal equal to a name that is not exempt.
  # A name is exempt, and so never found, when it is a store id: the text, in any case, of an id
  # the revision holds — the graph root's, a schema version's, a transaction's, a type's, a
  # property's, a node's, an edge's, an assertion's, an evidence record's, or an agent's that an
  # assertion or evidence record names. A literal equal to an exempt name is counted in
  # meta.exempt and not reported. A name that is also one of the runtime's own words is reported,
  # flagged `runtime_word: true`, never dropped: the runtime's words are every field name, enum
  # variant, union tag and union variant name the ESS domains of this runtime declare
  # (systems/ekr/domains/*.yaml), which a reader of the runtime's documents names whatever the
  # ontology, so such a finding may be the runtime's word and not the store's name, and the
  # reader decides.
  #
  # Determinism: sources are read in ascending order of their path text, and a path given twice
  # is read once; findings are ordered by that path, then line, then column; each finding's names
  # by kind in the order ekr.views.CodeNameKind declares its variants, then id. Rules (2) key
  # order, (3) encoding, (4) presence and (5) hold as for the five bounded formats, except that
  # a finding's `file` is the path the request gave, which is part of the request.
  - name: ekr.views.CodeNamesV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.CodeNamesMeta
      - name: findings
        type: List<ekr.views.CodeNameFinding>

  # ---------------------------------------------------------------------------------------------
  # ekr.ocel/1 (ExportOcel): one revision as an object-centric event log in the OCEL 2.0 JSON
  # format (OCEL 2.0 specification § 8; its JSON schema,
  # https://www.ocel-standard.org/2.0/ocel20-schema-json.json, JSON Schema draft-07), wrapped with
  # `meta` and `names`. `ocel` is the log: it validates against that schema and is what an OCEL 2.0
  # reader reads. It holds nothing the revision does not.
  #
  # Event and object types. Every node type the revision's ontology declares, and every type a
  # node of the revision has, is exactly one of the two. When the request names no event type,
  # the event types are the overview's: a node type whose ekr.views.TypeTiming `event` is true,
  # by the reference viewer's valid-time rule as TypeTiming states it (the rule the timeline
  # uses), so EKR has one definition of an event type. When the request names event types, they
  # are exactly the node types whose name, compared exactly as text, is one of the names, a name
  # that two types share naming both; a name no node type of the revision's ontology holds is
  # refused (ekr.views.EventTypeNotFound, the first such name in request order) and nothing is
  # answered. Every other node type, one with no node included, is an object type. An edge type
  # is neither: it qualifies.
  #
  # Events and objects. Each node of an event type is an event at its time as the timeline defines
  # it (ekr.graph-timeline/1: its least timestamp-like property value, else the earliest of its
  # dated facts). A node of an event type with no time, or with a time the time form below cannot
  # write (a year outside 0000–9999), is not in the log: OCEL 2.0 gives every event a time.
  # Each node of an object type is an object.
  #
  # Named event time. A nonempty event_time list replaces the rule and cannot be combined with
  # events. Each selector is TypeName.propertyName, split at its last dot. Resolve the type name
  # exactly and uniquely in the requested revision, then the property name exactly and uniquely
  # among that type's effective properties (including inherited declarations). Its value type
  # must be Timestamp. Identical repeated selectors deduplicate; different properties mapped to
  # one type refuse. Only the mapped types are event types. Their nodes with no value for the
  # selected property are undated; one distinct Timestamp gives the time, while multiple distinct
  # timestamps refuse instead of choosing. A timestamp outside the writable range is undated.
  # Malformed, absent, ambiguous or conflicting selectors and ambiguous timestamp values refuse
  # as EventTimeInvalid, naming the selector, reason and revision. Every other type is an object.
  #
  # The CLI emits the exact OcelExported event as one compact JSON object followed by a newline
  # on stderr, including its counts and ocel_hash; stdout stays the existing ekr.ocel/1 document.
  # A session puts this same text in the individual response's stderr; it writes no counts to
  # the process's stderr. The hash is of the engine document bytes, before CLI pretty printing.
  #
  # Identities. A type's `name` is its type id, an event's or object's `id` its node id, an
  # attribute's `name` its property id and a relationship's `qualifier` its edge's type id. They
  # are ids because OCEL 2.0 identifies a type and an attribute by its name and two of the store's
  # types or properties may share one. `names` gives each id the names the revision's ontology
  # holds for it, so that a consumer labels the log without a second read.
  #
  # Attributes. A type's attributes are the properties ekr.ontology's properties_of gives for it
  # (its own and its ancestors', the most specific declaration winning). A declaration is scalar
  # when its cardinality is One and its value type is String, Enum or NodeRef (typed `string`),
  # Boolean (`boolean`), Integer or Duration (`integer`), Float or Decimal (`float`), or Timestamp
  # (`time`); every other declaration is typed `string`. A node's attributes are its property
  # values, one attribute per property it holds a value of: under a scalar declaration, a single
  # value of the declared kind is written as its text — a String's or an Enum's text, `true` or
  # `false`, the decimal integer, a Decimal's exact text, a Timestamp in the time form below, a
  # NodeRef's node id; any other value list is the compact JSON of the list as
  # ekr.views.ProjectedValue writes it in a projection's props. Under a declaration typed `time`
  # the attribute holds a time or is not in the log: a value the time form cannot write (a year
  # outside 0000–9999) is left out and counted, and the declaration keeps its type. Every value is
  # a JSON string, as the OCEL 2.0 JSON schema requires. An object's attribute values carry the
  # time OCEL 2.0 (§ 6.4) gives an object's initial values, 1970-01-01T00:00:00.000Z — or the
  # time of the log's earliest event when that is before it, so that no event precedes the values
  # of the objects it relates to: the store holds a node's properties without a time. A node's
  # canonical name, aliases and lifecycle state are not properties and are not attributes. An
  # edge's properties are not carried: an OCEL 2.0 relationship holds an object and a qualifier
  # only.
  #
  # A known departure from OCEL 2.0 (Definition 2, which makes an attribute name one type's): a
  # property a type inherits is an attribute of that type and of every type inheriting it, under
  # the one property id, so two OCEL types may declare one attribute name. OCEL 2.0 readers,
  # the JSON schema and the process_mining crate among them, accept it; declaring it on one type
  # only would drop it from the others' nodes.
  #
  # Relationships. Each edge of the revision is one relationship qualified by its type id: when
  # one end is an event and the other an object, an event-to-object relationship on the event
  # naming the object, whichever end is the source; when both ends are objects, an
  # object-to-object relationship on the source naming the target; when both ends are events,
  # none, since OCEL 2.0 relates an event to objects only; when an end is a node of an event type
  # that is not in the log, none. Relationships are a set: two edges of one type with the same
  # holder and object give one relationship, and the second is counted as merged.
  #
  # Names. `names.node_types` and `names.edge_types` hold one entry per type the revision's
  # ontology declares, its id and its name; `names.properties` one entry per distinct pair of a
  # property id and a name that a node type or an edge type of the ontology declares it under. Two
  # entries may carry one name, and two property entries one id.
  #
  # Determinism, so that two answers to one request are byte-identical. Order: eventTypes and
  # objectTypes by name; each type's attributes by name; events by time, then id; objects by id;
  # each event's and object's attributes by name and relationships by objectId, then qualifier;
  # each list of `names` by id, then name. Rules (2) key order, (3) encoding, (4) presence and (5)
  # hold as for the five bounded formats, and no field of this format is Optional.
  - name: ekr.views.OcelFormatV1
    kind: enum
    variants: [{name: EkrOcel1, wire: ekr.ocel/1}]

  # RFC 3339 in UTC with milliseconds: YYYY-MM-DDTHH:MM:SS.mmmZ, a four-digit year.
  - name: ekr.views.OcelTime
    kind: newtype
    of: String

  # The attribute types OCEL 2.0 names.
  - name: ekr.views.OcelAttributeType
    kind: enum
    variants: [string, time, integer, float, boolean]

  - name: ekr.views.OcelTypeAttribute
    kind: struct
    fields:
      - name: name
        type: String
      - name: type
        type: ekr.views.OcelAttributeType

  - name: ekr.views.OcelType
    kind: struct
    fields:
      - name: name
        type: String
      - name: attributes
        type: List<ekr.views.OcelTypeAttribute>

  - name: ekr.views.OcelEventAttribute
    kind: struct
    fields:
      - name: name
        type: String
      - name: value
        type: String

  - name: ekr.views.OcelObjectAttribute
    kind: struct
    fields:
      - name: name
        type: String
      - name: value
        type: String
      - name: time
        type: ekr.views.OcelTime

  - name: ekr.views.OcelRelationship
    kind: struct
    fields:
      - name: objectId
        type: String
      - name: qualifier
        type: String

  - name: ekr.views.OcelEvent
    kind: struct
    fields:
      - name: id
        type: String
      - name: type
        type: String
      - name: time
        type: ekr.views.OcelTime
      - name: attributes
        type: List<ekr.views.OcelEventAttribute>
      - name: relationships
        type: List<ekr.views.OcelRelationship>

  - name: ekr.views.OcelObject
    kind: struct
    fields:
      - name: id
        type: String
      - name: type
        type: String
      - name: attributes
        type: List<ekr.views.OcelObjectAttribute>
      - name: relationships
        type: List<ekr.views.OcelRelationship>

  # The OCEL 2.0 log itself, its four top-level arrays.
  - name: ekr.views.Ocel20Log
    kind: struct
    fields:
      - name: eventTypes
        type: List<ekr.views.OcelType>
      - name: objectTypes
        type: List<ekr.views.OcelType>
      - name: events
        type: List<ekr.views.OcelEvent>
      - name: objects
        type: List<ekr.views.OcelObject>

  # `revision` is the revision exported: `at`, or the head as it stood at the request. The head
  # itself is not carried (rule (5)).
  - name: ekr.views.OcelMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.OcelFormatV1
      - name: revision
        type: ekr.kernel.RevisionNumber

  - name: ekr.views.OcelName
    kind: struct
    fields:
      - name: id
        type: String
      - name: name
        type: String

  - name: ekr.views.OcelNames
    kind: struct
    fields:
      - name: node_types
        type: List<ekr.views.OcelName>
      - name: edge_types
        type: List<ekr.views.OcelName>
      - name: properties
        type: List<ekr.views.OcelName>

  - name: ekr.views.OcelLogV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.OcelMeta
      - name: names
        type: ekr.views.OcelNames
      - name: ocel
        type: ekr.views.Ocel20Log

  # ---------------------------------------------------------------------------------------------
  # Fact quality by a judged sample (story:fact-quality-by-judged-sample). DrawFactSample draws a
  # reproducible sample of one revision's facts, each with the bytes of the evidence it cites; an
  # agent judges each fact against that evidence; ReportFactQuality reports the pass rate of the
  # judged sample with its Wilson score interval. The runtime judges nothing (AGENTS.md
  # invariant 7): the verdicts are the caller's input. Determinism rules for both formats are in
  # the domain summary.
  # ---------------------------------------------------------------------------------------------

  - name: ekr.views.FactSampleFormatV1
    kind: enum
    variants: [{name: EkrFactSample1, wire: ekr.fact-sample/1}]

  # `seed`, `size` and `type` are the request's; `revision` is the revision read, `at` or the head
  # as it stood at the request. `population` counts the revision's facts the draw chose from: its
  # Active assertions, those whose subject is of `type` when the request names one. `drawn` is the
  # length of `items`, the lesser of `size` and `population`.
  - name: ekr.views.FactSampleMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.FactSampleFormatV1
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: seed
        type: Integer
      - name: size
        type: Integer
      - name: type
        type: Optional<ekr.ontology.TypeId>
      - name: population
        type: Integer
      - name: drawn
        type: Integer

  # One evidence record a sampled fact cites, with its bytes: `text` when they are UTF-8, else
  # `base64`, their standard padded base64 (RFC 4648 § 4). Exactly one of the two is present for
  # every record the kernel admitted, whose bytes are always retained (see "Evidence without
  # retained bytes is unreachable" in the domain summary); neither is present only for a record
  # whose bytes the store does not hold.
  - name: ekr.views.SampledEvidence
    kind: struct
    fields:
      - name: id
        type: ekr.graph.EvidenceId
      - name: kind
        type: ekr.graph.EvidenceKind
      - name: locator
        type: String
      - name: section
        type: Optional<String>
      - name: content_hash
        type: ekr.kernel.ContentHash
      - name: text
        type: Optional<String>
      - name: base64
        type: Optional<String>

  # One sampled fact. `subject_type` is the subject node's type, the subject edge's type, or, for
  # a Type subject, that type. `subject_name` is a node subject's canonical name or a Type
  # subject's type name, omitted for an Edge. `predicate_name` is the name `subject_type` gives a
  # Property predicate or, where it does not declare it, the first node type by id that
  # `subject_type` conforms to and that does; for a Relation, the edge type's name; omitted where
  # the revision's ontology declares neither. `object_name` is a Node object's
  # canonical name, omitted for any other object. `evidence` is every record the assertion cites.
  - name: ekr.views.SampledFact
    kind: struct
    fields:
      - name: subject_kind
        type: ekr.graph.SubjectKind
      - name: subject
        type: Uuid
      - name: subject_type
        type: ekr.ontology.TypeId
      - name: subject_name
        type: Optional<String>
      - name: predicate_name
        type: Optional<String>
      - name: object_name
        type: Optional<String>
      - name: assertion
        type: ekr.views.ProjectedAssertion
      - name: evidence
        type: List<ekr.views.SampledEvidence>

  # ekr.fact-sample/1: the sample, in draw order.
  - name: ekr.views.FactSampleV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.FactSampleMeta
      - name: items
        type: List<ekr.views.SampledFact>

  # A judge's verdict on one sampled fact: Pass when its evidence supports it, Fail otherwise.
  - name: ekr.views.FactVerdict
    kind: enum
    variants: [Pass, Fail]

  - name: ekr.views.FactJudgement
    kind: struct
    fields:
      - name: assertion
        type: ekr.graph.AssertionId
      - name: verdict
        type: ekr.views.FactVerdict

  # Which draw a judged sample came from, as its ekr.fact-sample/1 meta gave it. The report echoes
  # it and checks nothing against it: the report reads no store.
  - name: ekr.views.SampleOrigin
    kind: struct
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: seed
        type: Integer
      - name: size
        type: Integer
      - name: type
        type: Optional<ekr.ontology.TypeId>

  - name: ekr.views.FactJudgementsFormatV1
    kind: enum
    variants: [{name: EkrFactJudgements1, wire: ekr.fact-judgements/1}]

  # ekr.fact-judgements/1: the document a host reads ReportFactQuality's input from, the judged
  # sample. An agent writes it after judging an ekr.fact-sample/1: one judgement per sampled fact
  # it judged, and the sample's origin if it keeps it. No other key is admitted.
  - name: ekr.views.FactJudgementsV1
    kind: struct
    fields:
      - name: format
        type: ekr.views.FactJudgementsFormatV1
      - name: sample
        type: Optional<ekr.views.SampleOrigin>
      - name: judgements
        type: List<ekr.views.FactJudgement>

  - name: ekr.views.FactQualityFormatV1
    kind: enum
    variants: [{name: EkrFactQuality1, wire: ekr.fact-quality/1}]

  # `confidence` is the stated confidence in basis points, 9500 when the request states none; `z`
  # the standard normal quantile at (1 + confidence / 10000) / 2; `sample` the judged sample's
  # origin, echoed when the input carried one.
  - name: ekr.views.FactQualityMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.FactQualityFormatV1
      - name: confidence
        type: ekr.views.BasisPoints
      - name: z
        type: Decimal
      - name: sample
        type: Optional<ekr.views.SampleOrigin>

  # ekr.fact-quality/1: the pass rate of a judged sample and its Wilson score interval. `judged`
  # counts the judgements, `passed` those whose verdict is Pass and `failed` the rest. With n =
  # judged and k = passed, `rate` is k / n and `lower` and `upper` are the Wilson score interval
  # (2k + z² ∓ z·√(z² + 4k(n − k)/n)) / (2(n + z²)), held within [0, 1]: `lower` is exactly 0 when
  # k is 0 and `upper` exactly 1 when k is n. When n is 0, rate is explicitly null and the
  # vacuous interval is lower 0, upper 1; the interval reports no information about the rate.
  - name: ekr.views.FactQualityV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.FactQualityMeta
      - name: judged
        type: Integer
      - name: passed
        type: Integer
      - name: failed
        type: Integer
      - name: rate
        type: Optional<Decimal>
      - name: lower
        type: Decimal
      - name: upper
        type: Decimal

actors:
  - name: ekr.views.Reader
    may:
      - ekr.views.ProjectGraph
      - ekr.views.ProjectOverview
      - ekr.views.ExpandNeighbourhood
      - ekr.views.DescribeNode
      - ekr.views.SearchNodes
      - ekr.views.ProjectTimeline
      - ekr.views.ChangesSince
      - ekr.views.ReportStoreQuality
      - ekr.views.FindCodeNames
      - ekr.views.ExportOcel
      - ekr.views.DrawFactSample
      - ekr.views.ReportFactQuality
    naming:
      display: Reader

errors:
  - name: ekr.views.RevisionNotFound
    summary: The store holds no committed revision with the requested number; nothing was rendered.
    fields:
      - name: requested
        type: ekr.kernel.RevisionNumber
      - name: head
        type: ekr.kernel.RevisionNumber

  # The kernel's read answers CommitError::NotSeeded for such a store (crates/ekr-kernel/src/read.rs).
  - name: ekr.views.NotSeeded
    summary: The store was never seeded, so it has no revision and no head; nothing was rendered.
    fields:
      - name: requested
        type: Optional<ekr.kernel.RevisionNumber>

  # `node` is the requested node or, for ExpandNeighbourhood, the first seed in the order the
  # request gave them that the revision does not hold; `revision` is the revision that was read.
  - name: ekr.views.NodeNotFound
    summary: The revision holds no node with the requested id; nothing was answered.
    fields:
      - name: node
        type: ekr.graph.NodeId
      - name: revision
        type: ekr.kernel.RevisionNumber

  # `parameter` is the input's name as the command declares it; `maximum` is omitted for an input
  # with no upper bound (`after`).
  - name: ekr.views.LimitExceeded
    summary: An input is outside its bound; the store was not read and nothing was answered.
    fields:
      - name: parameter
        type: String
      - name: requested
        type: Integer
      - name: minimum
        type: Integer
      - name: maximum
        type: Optional<Integer>

  # `kind` and `requested` are the request's since_kind and since: a revision since below 0,
  # which names no revision.
  - name: ekr.views.SinceMalformed
    summary: A ChangesSince request's since is no revision, valid time or transaction time; the store was not read and nothing was answered.
    fields:
      - name: kind
        type: ekr.views.SinceKind
      - name: requested
        type: Integer

  # `name` is the first name of the request's `events` that no node type of the revision's
  # ontology holds; `revision` is the revision that was read.
  - name: ekr.views.EventTypeNotFound
    summary: The revision's ontology holds no node type with a name the request lists as an event type; nothing was answered.
    fields:
      - name: name
        type: String
      - name: revision
        type: ekr.kernel.RevisionNumber

  - name: ekr.views.EventTimeInvalid
    summary: A named event-time selector or its timestamp values are invalid or ambiguous; nothing was answered.
    fields:
      - name: selector
        type: String
      - name: reason
        type: String
      - name: revision
        type: ekr.kernel.RevisionNumber

  # `assertion` is the first assertion, in the order the judgements give them, judged a second
  # time. A fact judged twice would count twice in a sample whose draws are distinct facts.
  - name: ekr.views.JudgedTwice
    summary: A judged sample judges one assertion more than once; nothing was reported.
    fields:
      - name: assertion
        type: ekr.graph.AssertionId

commands:
  # Design § 82. A read of one immutable revision; the default is the newest. Writes no canonical
  # state and moves no subject.
  - name: ekr.views.ProjectGraph
    naming:
      wire: project-graph
      display: Project the graph
    input:
      - name: store
        type: ekr.views.StoreLocation
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
    response:
      - name: projection
        type: ekr.views.GraphProjectionV1
    outcomes:
      - name: projected
        emits:
          - ekr.views.GraphProjected
        payload:
          ekr.views.GraphProjected:
            revision: {generated: true}
            nodes: {generated: true}
            edges: {generated: true}
            assertions: {generated: true}
            evidence: {generated: true}
            schema_versions: {generated: true}
            revisions: {generated: true}
            transactions: {generated: true}
            node_types: {generated: true}
            edge_types: {generated: true}
            properties: {generated: true}
            edge_assertions: {generated: true}
            retracted_assertions: {generated: true}
            retained_evidence: {generated: true}
            projection_hash: {generated: true}
            supporting_evidence: {generated: true}
        summary: One ekr.graph-projection/1 document of the requested revision, byte-identical to every other render of that revision.
      # External because what decides it is the store's head, which is not command input, and the
      # projection is no entity whose field a guard could read; ESS's `when:` sees input only. The
      # authored scenario a-revision-beyond-the-head-is-refused constructs the case instead.
      - name: not-found
        external: the store holds no committed revision with the requested number
        error: ekr.views.RevisionNotFound
        summary: Nothing was rendered.
      # External for the same reason: whether the store holds a seed is store state, not command
      # input, and no guard can read it. A seeded store answers not-found, never this, whatever
      # `at` names.
      - name: not-seeded
        external: the store has never been seeded
        error: ekr.views.NotSeeded
        summary: Nothing was rendered; the request is echoed and no head is reported, because there is none.

  # The five bounded reads. Each reads one immutable revision, the newest when `at` is absent, and
  # writes no canonical state. Their bounds are input guards, decided before the store is read;
  # their not-found, not-seeded and node-not-found outcomes are external for the reason
  # ProjectGraph's are: what decides them is store state, which no guard reads.

  # `limit` is how many of the highest-degree nodes the overview lists: 1 to 500, 300 when absent.
  - name: ekr.views.ProjectOverview
    naming:
      wire: project-overview
      display: Overview the graph
    input:
      - name: store
        type: ekr.views.StoreLocation
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
      - name: limit
        type: Optional<Integer>
    response:
      - name: overview
        type: ekr.views.GraphOverviewV1
    outcomes:
      - name: overviewed
        emits:
          - ekr.views.GraphOverviewed
        payload:
          ekr.views.GraphOverviewed:
            revision: {generated: true}
            nodes: {generated: true}
            edges: {generated: true}
            assertions: {generated: true}
            evidence: {generated: true}
            node_types: {generated: true}
            edge_types: {generated: true}
            schema_versions: {generated: true}
            revisions: {generated: true}
            added: {generated: true}
            removed: {generated: true}
            widened: {generated: true}
            modified: {generated: true}
            unrecorded_nodes: {generated: true}
            unrecorded_edges: {generated: true}
            revision_zero_nodes: {generated: true}
            revision_zero_edges: {generated: true}
            revision_zero_assertions: {generated: true}
            event_types: {generated: true}
            observation_type: {generated: true}
            bucket_ms: {generated: true}
            timeline_buckets: {generated: true}
            dated_assertions: {generated: true}
            undated_assertions: {generated: true}
            top: {generated: true}
            overview_hash: {generated: true}
        summary: One ekr.graph-overview/1 document of the requested revision, byte-identical to every other answer to the same request.
      - name: limit-exceeded
        when:
          any:
            - limit < 1
            - limit > 500
        error: ekr.views.LimitExceeded
        summary: The store was not read; the refusal names `limit`, its value and its bounds 1 and 500.
      - name: not-found
        external: the store holds no committed revision with the requested number
        error: ekr.views.RevisionNotFound
        summary: Nothing was answered.
      - name: not-seeded
        external: the store has never been seeded
        error: ekr.views.NotSeeded
        summary: Nothing was answered; no head is reported, because there is none.

  # `seeds` is a set: order and repetition in the request change nothing but which unknown seed a
  # node-not-found names. Its size is not bounded, and every page is; an empty set answers an
  # empty page with node_total 0. A lower bound of one seed was tried and dropped: with it, ess
  # 0.36.0 finds no candidate for the expanded branch among the 64 it tries (ESS-SYNTH-003).
  # `depth` is 0 to 2 (0 answers the seeds and the edges among them); `limit` 1 to 2,000 nodes
  # per page; `edge_limit` 1 to 5,000 edges per page, 5,000 when absent; `after` a cursor from an
  # earlier page's `next`, 0 or more.
  # `edge_limit` is an input this specification adds to the approved plan's signature, so a store
  # smaller than 5,000 edges can hold the edge cap to account; the cap itself is the plan's.
  - name: ekr.views.ExpandNeighbourhood
    naming:
      wire: expand-neighbourhood
      display: Expand a neighbourhood
    input:
      - name: store
        type: ekr.views.StoreLocation
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
      - name: seeds
        type: List<ekr.graph.NodeId>
      - name: depth
        type: Integer
      - name: limit
        type: Integer
      - name: edge_limit
        type: Optional<Integer>
      - name: after
        type: Optional<ekr.views.SliceCursor>
    response:
      - name: slice
        type: ekr.views.GraphSliceV1
    outcomes:
      - name: expanded
        emits:
          - ekr.views.NeighbourhoodExpanded
        payload:
          ekr.views.NeighbourhoodExpanded:
            revision: {generated: true}
            seeds: {generated: true}
            depth: input.depth
            after: {generated: true}
            nodes: {generated: true}
            edges: {generated: true}
            node_total: {generated: true}
            edge_total: {generated: true}
            remaining: {generated: true}
            slice_hash: {generated: true}
        summary: One ekr.graph-slice/1 page, byte-identical to every other answer to the same request.
      - name: limit-exceeded
        when:
          any:
            - depth < 0
            - depth > 2
            - limit < 1
            - limit > 2000
            - edge_limit < 1
            - edge_limit > 5000
            - after < 0
        error: ekr.views.LimitExceeded
        summary: The store was not read; the refusal names the first broken input of depth, limit, edge_limit and after, its value and its bounds.
      - name: node-not-found
        external: a seed names a node the requested revision does not hold
        error: ekr.views.NodeNotFound
        summary: Nothing was answered; the refusal names the first such seed in the order the request gave them.
      - name: not-found
        external: the store holds no committed revision with the requested number
        error: ekr.views.RevisionNotFound
        summary: Nothing was answered.
      - name: not-seeded
        external: the store has never been seeded
        error: ekr.views.NotSeeded
        summary: Nothing was answered; no head is reported, because there is none.

  # One node. No input bound: the answer is one node, with all of its assertions and edges.
  - name: ekr.views.DescribeNode
    naming:
      wire: describe-node
      display: Describe a node
    input:
      - name: store
        type: ekr.views.StoreLocation
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
      - name: node
        type: ekr.graph.NodeId
    response:
      - name: detail
        type: ekr.views.NodeDetailV1
    outcomes:
      - name: described
        emits:
          - ekr.views.NodeDescribed
        payload:
          ekr.views.NodeDescribed:
            revision: {generated: true}
            node: input.node
            assertions: {generated: true}
            referencing: {generated: true}
            edges: {generated: true}
            neighbours: {generated: true}
            detail_hash: {generated: true}
        summary: One ekr.node-detail/1 document, byte-identical to every other answer to the same request.
      - name: node-not-found
        external: the requested revision holds no node with the requested id
        error: ekr.views.NodeNotFound
        summary: Nothing was answered; a node created after the requested revision is not found at it.
      - name: not-found
        external: the store holds no committed revision with the requested number
        error: ekr.views.RevisionNotFound
        summary: Nothing was answered.
      - name: not-seeded
        external: the store has never been seeded
        error: ekr.views.NotSeeded
        summary: Nothing was answered; no head is reported, because there is none.

  # `text` is matched against canonical names and aliases (ekr.views.MatchTier); it has no length
  # bound. `limit` is 1 to 100 matches. No match is an answer with no matches, not a refusal.
  - name: ekr.views.SearchNodes
    naming:
      wire: search-nodes
      display: Search nodes
    input:
      - name: store
        type: ekr.views.StoreLocation
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
      - name: text
        type: String
      - name: limit
        type: Integer
    response:
      - name: matches
        type: ekr.views.NodeMatchesV1
    outcomes:
      - name: searched
        emits:
          - ekr.views.NodesSearched
        payload:
          ekr.views.NodesSearched:
            revision: {generated: true}
            text: input.text
            matches: {generated: true}
            total: {generated: true}
            exact_total: {generated: true}
            first_match: {generated: true}
            matches_hash: {generated: true}
        summary: One ekr.node-matches/1 document, byte-identical to every other answer to the same request.
      - name: limit-exceeded
        when:
          any:
            - limit < 1
            - limit > 100
        error: ekr.views.LimitExceeded
        summary: The store was not read; the refusal names `limit`, its value and its bounds 1 and 100.
      - name: not-found
        external: the store holds no committed revision with the requested number
        error: ekr.views.RevisionNotFound
        summary: Nothing was answered.
      - name: not-seeded
        external: the store has never been seeded
        error: ekr.views.NotSeeded
        summary: Nothing was answered; no head is reported, because there is none.

  # The subjects' timeline (ekr.views.GraphTimelineV1). `row_type` names the type of the rows,
  # the first listed row type when absent; a type the revision holds no node of answers no rows,
  # not a refusal. `hops` is 1 to 3; `limit` 1 to 500 rows; `bucket` the finest width, the
  # span's when absent. `subject`, when given, asks for that node's row alone with its events
  # listed, and
  # then the row type is its type whatever `row_type` names; a subject the revision does not hold
  # is no refusal, and answers no row and no event.
  - name: ekr.views.ProjectTimeline
    naming:
      wire: project-timeline
      display: Timeline the subjects
    input:
      - name: store
        type: ekr.views.StoreLocation
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
      - name: row_type
        type: Optional<ekr.ontology.TypeId>
      - name: hops
        type: Integer
      - name: limit
        type: Integer
      - name: bucket
        type: Optional<ekr.views.TimelineBucketWidth>
      - name: subject
        type: Optional<ekr.graph.NodeId>
    response:
      - name: timeline
        type: ekr.views.GraphTimelineV1
    outcomes:
      - name: timelined
        emits:
          - ekr.views.SubjectsTimelined
        payload:
          ekr.views.SubjectsTimelined:
            revision: {generated: true}
            row_type: {generated: true}
            hops: input.hops
            bucket_ms: {generated: true}
            row_types: {generated: true}
            subjects: {generated: true}
            active: {generated: true}
            rows: {generated: true}
            events: {generated: true}
            row_events: {generated: true}
            cells: {generated: true}
            strip: {generated: true}
            first_row: {generated: true}
            listed_events: {generated: true}
            timeline_hash: {generated: true}
        summary: One ekr.graph-timeline/1 document, byte-identical to every other answer to the same request.
      - name: limit-exceeded
        when:
          any:
            - hops < 1
            - hops > 3
            - limit < 1
            - limit > 500
        error: ekr.views.LimitExceeded
        summary: The store was not read; the refusal names the first broken input of hops and limit, its value and its bounds.
      - name: not-found
        external: the store holds no committed revision with the requested number
        error: ekr.views.RevisionNotFound
        summary: Nothing was answered.
      - name: not-seeded
        external: the store has never been seeded
        error: ekr.views.NotSeeded
        summary: Nothing was answered; no head is reported, because there is none.

  # What changed (ekr.views.GraphChangesV1). `since` is one revision, valid time or transaction
  # time: `since_kind` says which and `since` is its value, a revision number or an EpochMillis.
  # A host that takes it as three inputs, since_revision, since_valid and since_recorded, takes
  # exactly one of them, and one given none or more than one refuses the request as its own
  # malformed input. `at` is the last revision read, the head when absent. `limit` is 1 to 2,000
  # changes per page, 500 when absent; `after` a cursor from an earlier page's `next`, 0 or more.
  # A revision since at or after `at` that the store holds chooses no change and is no refusal;
  # one beyond the head is not-found, decided after `at` is.
  - name: ekr.views.ChangesSince
    naming:
      wire: changes-since
      display: List changes since
    input:
      - name: store
        type: ekr.views.StoreLocation
      - name: since_kind
        type: ekr.views.SinceKind
      - name: since
        type: Integer
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
      - name: limit
        type: Optional<Integer>
      - name: after
        type: Optional<ekr.views.ChangeCursor>
    response:
      - name: changes
        type: ekr.views.GraphChangesV1
    outcomes:
      - name: listed
        emits:
          - ekr.views.ChangesListed
        payload:
          ekr.views.ChangesListed:
            revision: {generated: true}
            after: {generated: true}
            changes: {generated: true}
            total: {generated: true}
            remaining: {generated: true}
            nodes_created: {generated: true}
            edges_created: {generated: true}
            assertions_added: {generated: true}
            assertions_superseded: {generated: true}
            assertions_retracted: {generated: true}
            evidence_added: {generated: true}
            first_revision: {generated: true}
            last_revision: {generated: true}
            changes_hash: {generated: true}
        summary: One ekr.graph-changes/1 page, byte-identical to every other answer to the same request with `at` resolved.
      - name: since-malformed
        when:
          all:
            - since_kind == Revision
            - since < 0
        error: ekr.views.SinceMalformed
        summary: The store was not read; the refusal names the since's kind and its value, a revision number below 0.
      - name: limit-exceeded
        when:
          any:
            - limit < 1
            - limit > 2000
            - after < 0
        error: ekr.views.LimitExceeded
        summary: The store was not read; the refusal names the first broken input of limit and after, its value and its bounds.
      - name: not-found
        external: the store holds no committed revision with the requested number, as at or as since_revision
        error: ekr.views.RevisionNotFound
        summary: Nothing was answered.
      - name: not-seeded
        external: the store has never been seeded
        error: ekr.views.NotSeeded
        summary: Nothing was answered; no head is reported, because there is none.

  # The quality of one revision (ekr.views.StoreQualityV1). `at` is the revision read, the head
  # when absent. No input bound: the answer is one document of counts, and its shared_names are
  # the revision's own. Its not-found and not-seeded outcomes are external for the reason
  # ProjectGraph's are.
  - name: ekr.views.ReportStoreQuality
    naming:
      wire: report-store-quality
      display: Report the store's quality
    input:
      - name: store
        type: ekr.views.StoreLocation
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
    response:
      - name: quality
        type: ekr.views.StoreQualityV1
    outcomes:
      - name: reported
        emits:
          - ekr.views.StoreQualityReported
        payload:
          ekr.views.StoreQualityReported:
            revision: {generated: true}
            active_assertions: {generated: true}
            with_evidence: {generated: true}
            with_item_evidence: {generated: true}
            with_seed_evidence: {generated: true}
            properties: {generated: true}
            constrained_properties: {generated: true}
            constrained_types: {generated: true}
            shared_names: {generated: true}
            sharing_nodes: {generated: true}
            quality_hash: {generated: true}
        summary: One ekr.store-quality/1 document of the requested revision, byte-identical to every other answer to the same request with `at` resolved.
      - name: not-found
        external: the store holds no committed revision with the requested number
        error: ekr.views.RevisionNotFound
        summary: Nothing was answered.
      - name: not-seeded
        external: the store has never been seeded
        error: ekr.views.NotSeeded
        summary: Nothing was answered; no head is reported, because there is none.

  # The store's names in a consumer's source files (ekr.views.CodeNamesV1). `sources` is what
  # the host read, one entry per file. The answer reports findings; it is not a refusal to find
  # one, and a host exits 0 for every answer whatever meta.findings counts — failing on a count
  # is the caller's choice. Reads the revision and nothing else, and writes nothing.
  - name: ekr.views.FindCodeNames
    naming:
      wire: find-code-names
      display: Find store names in code
    input:
      - name: store
        type: ekr.views.StoreLocation
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
      - name: sources
        type: List<ekr.views.SourceText>
      - name: mode
        type: Optional<ekr.views.CodeNameMode>
    response:
      - name: code_names
        type: ekr.views.CodeNamesV1
    outcomes:
      - name: found
        emits:
          - ekr.views.CodeNamesFound
        payload:
          ekr.views.CodeNamesFound:
            revision: {generated: true}
            files: {generated: true}
            literals: {generated: true}
            exempt: {generated: true}
            findings: {generated: true}
            runtime_word_findings: {generated: true}
            node_types: {generated: true}
            edge_types: {generated: true}
            properties: {generated: true}
            canonical_names: {generated: true}
            aliases: {generated: true}
            first_file: {generated: true}
            first_line: {generated: true}
            code_names_hash: {generated: true}
        summary: One ekr.code-names/1 document, byte-identical to every other answer to the same request with `at` resolved, however many findings it holds.
      - name: not-found
        external: the store holds no committed revision with the requested number
        error: ekr.views.RevisionNotFound
        summary: Nothing was answered.
      - name: not-seeded
        external: the store has never been seeded
        error: ekr.views.NotSeeded
        summary: Nothing was answered; no head is reported, because there is none.

  # One revision as an OCEL 2.0 event log (ekr.views.OcelLogV1). `at` is the revision exported,
  # the head when absent. `events` names the event types by node type name; empty, the overview's
  # rule decides them (ekr.views.OcelLogV1). No input bound: the log is the revision's own, whole.
  # Its not-found, not-seeded and event-type-not-found outcomes are external for the reason
  # ProjectGraph's are: what decides them is store state, which no guard reads.
  - name: ekr.views.ExportOcel
    naming:
      wire: export-ocel
      display: Export an OCEL 2.0 event log
    input:
      - name: store
        type: ekr.views.StoreLocation
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
      - name: events
        type: List<String>
      - name: event_time
        type: Optional<List<String>>
    response:
      - name: log
        type: ekr.views.OcelLogV1
    outcomes:
      - name: exported
        emits:
          - ekr.views.OcelExported
        payload:
          ekr.views.OcelExported:
            revision: {generated: true}
            event_types: {generated: true}
            object_types: {generated: true}
            events: {generated: true}
            objects: {generated: true}
            event_object_relationships: {generated: true}
            object_object_relationships: {generated: true}
            edges_between_events: {generated: true}
            undated_events: {generated: true}
            edges_of_undated_events: {generated: true}
            parallel_edges_merged: {generated: true}
            attribute_values_out_of_range: {generated: true}
            ocel_hash: {generated: true}
        summary: One ekr.ocel/1 document of the requested revision, byte-identical to every other answer to the same request with `at` resolved.
      - name: not-found
        external: the store holds no committed revision with the requested number
        error: ekr.views.RevisionNotFound
        summary: Nothing was answered.
      - name: not-seeded
        external: the store has never been seeded
        error: ekr.views.NotSeeded
        summary: Nothing was answered; no head is reported, because there is none.
      - name: event-type-not-found
        external: the revision's ontology holds no node type with a name the request lists in events
        error: ekr.views.EventTypeNotFound
        summary: Nothing was answered; the refusal names the first such name.
      - name: event-time-invalid
        external: an event_time selector is malformed, absent, ambiguous or conflicting, or a selected node holds multiple distinct timestamps
        error: ekr.views.EventTimeInvalid
        summary: Nothing was answered; the refusal names the selector, reason and revision.

  # A reproducible sample of one revision's facts (ekr.views.FactSampleV1), for a judge. `at` is
  # the revision read, the head when absent; `seed` any integer; `size` how many facts to draw,
  # 1 to 1000; `type` a type id whose facts alone are drawn. A type the revision's ontology does
  # not declare is no refusal: no fact's subject is of it, so the population is 0 and nothing is
  # drawn, which meta.population says. The sample is a function of (seed, size, type, the
  # revision read) and nothing else. Its not-found and not-seeded outcomes are external for the
  # reason ProjectGraph's are.
  - name: ekr.views.DrawFactSample
    naming:
      wire: draw-fact-sample
      display: Draw a fact sample
    input:
      - name: store
        type: ekr.views.StoreLocation
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
      - name: seed
        type: Integer
      - name: size
        type: Integer
      - name: type
        type: Optional<ekr.ontology.TypeId>
    response:
      - name: sample
        type: ekr.views.FactSampleV1
    outcomes:
      - name: drawn
        emits:
          - ekr.views.FactSampleDrawn
        payload:
          ekr.views.FactSampleDrawn:
            revision: {generated: true}
            seed: input.seed
            size: input.size
            population: {generated: true}
            drawn: {generated: true}
            evidence: {generated: true}
            first_assertion: {generated: true}
            sample_hash: {generated: true}
        summary: One ekr.fact-sample/1 document, byte-identical to every other answer to the same request with `at` resolved.
      - name: limit-exceeded
        when:
          any:
            - size < 1
            - size > 1000
        error: ekr.views.LimitExceeded
        summary: The store was not read; the refusal names size, its value and its bounds.
      - name: not-found
        external: the store holds no committed revision with the requested number
        error: ekr.views.RevisionNotFound
        summary: Nothing was answered.
      - name: not-seeded
        external: the store has never been seeded
        error: ekr.views.NotSeeded
        summary: Nothing was answered; no head is reported, because there is none.

  # The pass rate of a judged sample with its Wilson score interval (ekr.views.FactQualityV1).
  # `judgements` are the caller's verdicts; `sample` the origin it keeps, echoed; `confidence`
  # the stated confidence in basis points, 1 to 9999, 9500 when absent. Reads no store: the
  # answer is arithmetic over the input, the same for the same input on every host. Judged-twice
  # is external because no guard reads whether a list holds one id twice.
  - name: ekr.views.ReportFactQuality
    naming:
      wire: report-fact-quality
      display: Report fact quality
    input:
      - name: judgements
        type: List<ekr.views.FactJudgement>
      - name: sample
        type: Optional<ekr.views.SampleOrigin>
      - name: confidence
        type: Optional<Integer>
    response:
      - name: quality
        type: ekr.views.FactQualityV1
    outcomes:
      - name: reported
        emits:
          - ekr.views.FactQualityReported
        payload:
          ekr.views.FactQualityReported:
            confidence: {generated: true}
            judged: {generated: true}
            passed: {generated: true}
            failed: {generated: true}
            rate_bp: {generated: true}
            lower_bp: {generated: true}
            upper_bp: {generated: true}
            fact_quality_hash: {generated: true}
        summary: One ekr.fact-quality/1 document, byte-identical to every other answer to the same input.
      - name: limit-exceeded
        when:
          any:
            - confidence < 1
            - confidence > 9999
        error: ekr.views.LimitExceeded
        summary: Nothing was reported; the refusal names confidence, its value and its bounds.
      - name: judged-twice
        external: the judgements judge one assertion more than once
        error: ekr.views.JudgedTwice
        summary: Nothing was reported; the refusal names the first assertion judged again.

events:
  # What one render returned, counted over the document it returned, so a suite can hold a
  # renderer to it without parsing the response. `projection_hash` is the hex SHA-256 of the
  # document's exact bytes. Every field is a function of the document, so this event is as
  # deterministic as the document is. `transactions` counts the schema.revisions entries that carry
  # a transaction_id, so the seed's entry, which carries none, is not one of them; `node_types`,
  # `edge_types` and `properties` count the projected ontology's three lists.
  - name: ekr.views.GraphProjected
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: nodes
        type: Integer
      - name: edges
        type: Integer
      - name: assertions
        type: Integer
      - name: evidence
        type: Integer
      - name: schema_versions
        type: Integer
      - name: revisions
        type: Integer
      - name: transactions
        type: Integer
      - name: node_types
        type: Integer
      - name: edge_types
        type: Integer
      - name: properties
        type: Integer
      - name: edge_assertions
        type: Integer
      - name: retracted_assertions
        type: Integer
      - name: retained_evidence
        type: Integer
      - name: projection_hash
        type: ekr.kernel.ContentHash
      # The same generated entries carried by projection.schema, including an empty
      # list before cited schema transactions. The authored schema-change-exposes-
      # supporting-evidence scenario observes the actual result after full replay.
      - name: supporting_evidence
        type: List<ekr.views.SchemaEvidenceEntry>

  # What one overview returned, every field a function of the document. `nodes`, `edges`,
  # `assertions` and `evidence` are its meta counts; `node_types` and `edge_types` the lengths of
  # its two type-count lists; `schema_versions` and `revisions` of schema.versions and
  # schema.revisions; `added` and `removed` the members summed over every listed version,
  # `widened` and `modified` the entries of its widened and modified lists summed likewise;
  # `unrecorded_nodes` and `unrecorded_edges` schema's; the three `revision_zero_` counts are
  # revision 0's entry in schema.revisions; `event_types` counts roles.types with event true, and
  # `observation_type` is roles.observation_type; `bucket_ms` is timeline.bucket_ms,
  # `timeline_buckets` the length of timeline.buckets, `dated_assertions` the sum of their
  # assertions and `undated_assertions` timeline.undated; `top` the length of the top list;
  # `overview_hash` the hex SHA-256 of the document's exact bytes.
  - name: ekr.views.GraphOverviewed
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: nodes
        type: Integer
      - name: edges
        type: Integer
      - name: assertions
        type: Integer
      - name: evidence
        type: Integer
      - name: node_types
        type: Integer
      - name: edge_types
        type: Integer
      - name: schema_versions
        type: Integer
      - name: revisions
        type: Integer
      - name: added
        type: Integer
      - name: removed
        type: Integer
      - name: widened
        type: Integer
      - name: modified
        type: Integer
      - name: unrecorded_nodes
        type: Integer
      - name: unrecorded_edges
        type: Integer
      - name: revision_zero_nodes
        type: Integer
      - name: revision_zero_edges
        type: Integer
      - name: revision_zero_assertions
        type: Integer
      - name: event_types
        type: Integer
      - name: observation_type
        type: Optional<ekr.ontology.TypeId>
      - name: bucket_ms
        type: Integer
      - name: timeline_buckets
        type: Integer
      - name: dated_assertions
        type: Integer
      - name: undated_assertions
        type: Integer
      - name: top
        type: Integer
      - name: overview_hash
        type: ekr.kernel.ContentHash

  # What one page returned. `seeds` is the size of meta.seeds; `after` is meta.after; `nodes` and
  # `edges` count this page's records; `node_total` and `edge_total` the whole neighbourhood's;
  # `remaining` the records of the sequence after this page, 0 exactly when the page has no
  # `next`; `slice_hash` the hex SHA-256 of the document's exact bytes.
  - name: ekr.views.NeighbourhoodExpanded
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: seeds
        type: Integer
      - name: depth
        type: Integer
      - name: after
        type: Integer
      - name: nodes
        type: Integer
      - name: edges
        type: Integer
      - name: node_total
        type: Integer
      - name: edge_total
        type: Integer
      - name: remaining
        type: Integer
      - name: slice_hash
        type: ekr.kernel.ContentHash

  # What one detail returned: the lengths of its four lists, and the hex SHA-256 of its bytes.
  - name: ekr.views.NodeDescribed
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: node
        type: ekr.graph.NodeId
      - name: assertions
        type: Integer
      - name: referencing
        type: Integer
      - name: edges
        type: Integer
      - name: neighbours
        type: Integer
      - name: detail_hash
        type: ekr.kernel.ContentHash

  # What one search returned. `matches` is the length of the matches list, `total` and
  # `exact_total` meta's, `first_match` the id of the first match, omitted when there is none;
  # `matches_hash` the hex SHA-256 of the document's exact bytes.
  - name: ekr.views.NodesSearched
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: text
        type: String
      - name: matches
        type: Integer
      - name: total
        type: Integer
      - name: exact_total
        type: Integer
      - name: first_match
        type: Optional<ekr.graph.NodeId>
      - name: matches_hash
        type: ekr.kernel.ContentHash

  # What one timeline returned. `row_type`, `hops`, `bucket_ms`, `subjects`, `active` and
  # `events` are meta's; `row_types`, `rows`, `strip` and `listed_events` the lengths of
  # row_types, rows, strip and events; `row_events` the sum of the rows' totals and `cells` of
  # their cells' lengths; `first_row` the first row's id, omitted when there is none;
  # `timeline_hash` the hex SHA-256 of the document's exact bytes.
  - name: ekr.views.SubjectsTimelined
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: row_type
        type: Optional<ekr.ontology.TypeId>
      - name: hops
        type: Integer
      - name: bucket_ms
        type: Integer
      - name: row_types
        type: Integer
      - name: subjects
        type: Integer
      - name: active
        type: Integer
      - name: rows
        type: Integer
      - name: events
        type: Integer
      - name: row_events
        type: Integer
      - name: cells
        type: Integer
      - name: strip
        type: Integer
      - name: first_row
        type: Optional<ekr.graph.NodeId>
      - name: listed_events
        type: Integer
      - name: timeline_hash
        type: ekr.kernel.ContentHash

  # What one page of changes returned. `revision`, `after` and `total` are meta's; `changes` the
  # length of changes and `remaining` the document's; the six kind counts count this page's
  # changes of each ekr.views.ChangeKind; `first_revision` and `last_revision` are the revisions
  # of the page's first and last change, omitted when the page is empty; `changes_hash` the hex
  # SHA-256 of the document's exact bytes.
  - name: ekr.views.ChangesListed
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: after
        type: Integer
      - name: changes
        type: Integer
      - name: total
        type: Integer
      - name: remaining
        type: Integer
      - name: nodes_created
        type: Integer
      - name: edges_created
        type: Integer
      - name: assertions_added
        type: Integer
      - name: assertions_superseded
        type: Integer
      - name: assertions_retracted
        type: Integer
      - name: evidence_added
        type: Integer
      - name: first_revision
        type: Optional<ekr.kernel.RevisionNumber>
      - name: last_revision
        type: Optional<ekr.kernel.RevisionNumber>
      - name: changes_hash
        type: ekr.kernel.ContentHash

  # What one quality report returned, every field a function of the document. `revision` is
  # meta's; `active_assertions`, `with_evidence` and `with_item_evidence` are assertions';
  # `properties` and `constrained_properties` are properties' declared and constrained;
  # `shared_names` the length of shared_names and `sharing_nodes` the document's;
  # `quality_hash` the hex SHA-256 of the document's exact bytes.
  - name: ekr.views.StoreQualityReported
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: active_assertions
        type: Integer
      - name: with_evidence
        type: Integer
      - name: with_item_evidence
        type: Integer
      - name: with_seed_evidence
        type: Integer
      - name: properties
        type: Integer
      - name: constrained_properties
        type: Integer
      - name: constrained_types
        type: Integer
      - name: shared_names
        type: Integer
      - name: sharing_nodes
        type: Integer
      - name: quality_hash
        type: ekr.kernel.ContentHash

  # What one code-names answer returned. `revision`, `files`, `literals`, `exempt`, `findings` and
  # `runtime_word_findings` are meta's; the five kind counts count the names of every finding of
  # each ekr.views.CodeNameKind, so a literal equal to two names counts in two; `first_file` and
  # `first_line` are the first finding's, omitted when there is none; `code_names_hash` the hex
  # SHA-256 of the document's exact bytes.
  - name: ekr.views.CodeNamesFound
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: files
        type: Integer
      - name: literals
        type: Integer
      - name: exempt
        type: Integer
      - name: findings
        type: Integer
      - name: runtime_word_findings
        type: Integer
      - name: node_types
        type: Integer
      - name: edge_types
        type: Integer
      - name: properties
        type: Integer
      - name: canonical_names
        type: Integer
      - name: aliases
        type: Integer
      - name: first_file
        type: Optional<String>
      - name: first_line
        type: Optional<Integer>
      - name: code_names_hash
        type: ekr.kernel.ContentHash

  # What one OCEL export returned, every field a function of the document. `revision` is meta's;
  # `event_types`, `object_types`, `events` and `objects` the lengths of the log's four arrays;
  # `event_object_relationships` the relationships its events hold and
  # `object_object_relationships` those its objects hold; `edges_between_events` the revision's
  # edges both of whose ends are events in the log; `undated_events` the nodes of an event type
  # left out of the log for want of a writable time, and `edges_of_undated_events` the edges with
  # such a node at an end, neither of which the log carries; `parallel_edges_merged` the edges
  # carried by a relationship an earlier edge of the same type between the same holder and object
  # already gave; `attribute_values_out_of_range` the values of a property typed `time` left out
  # for want of a writable time; `ocel_hash` the hex SHA-256 of the document's exact bytes.
  - name: ekr.views.OcelExported
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: event_types
        type: Integer
      - name: object_types
        type: Integer
      - name: events
        type: Integer
      - name: objects
        type: Integer
      - name: event_object_relationships
        type: Integer
      - name: object_object_relationships
        type: Integer
      - name: edges_between_events
        type: Integer
      - name: undated_events
        type: Integer
      - name: edges_of_undated_events
        type: Integer
      - name: parallel_edges_merged
        type: Integer
      - name: attribute_values_out_of_range
        type: Integer
      - name: ocel_hash
        type: ekr.kernel.ContentHash

  # What one fact sample returned, every field a function of the document. `revision`, `seed`,
  # `size`, `population` and `drawn` are meta's; `evidence` counts the evidence entries of every
  # item, so a record two sampled facts cite counts twice; `first_assertion` is the first item's
  # assertion id, omitted when nothing was drawn; `sample_hash` the hex SHA-256 of the document's
  # exact bytes.
  - name: ekr.views.FactSampleDrawn
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: seed
        type: Integer
      - name: size
        type: Integer
      - name: population
        type: Integer
      - name: drawn
        type: Integer
      - name: evidence
        type: Integer
      - name: first_assertion
        type: Optional<ekr.graph.AssertionId>
      - name: sample_hash
        type: ekr.kernel.ContentHash

  # What one fact-quality report returned, every field a function of the document. `confidence`
  # is meta's; `judged`, `passed` and `failed` the document's; `rate_bp`, `lower_bp` and
  # `upper_bp` are 10000 times rate, lower and upper rounded down. rate_bp is omitted when
  # no fact was judged; lower_bp and upper_bp then state the vacuous interval, 0 and 10000;
  # `fact_quality_hash` the hex SHA-256 of the document's exact bytes.
  - name: ekr.views.FactQualityReported
    fields:
      - name: confidence
        type: Integer
      - name: judged
        type: Integer
      - name: passed
        type: Integer
      - name: failed
        type: Integer
      - name: rate_bp
        type: Optional<Integer>
      - name: lower_bp
        type: Integer
      - name: upper_bp
        type: Integer
      - name: fact_quality_hash
        type: ekr.kernel.ContentHash
