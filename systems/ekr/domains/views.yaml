domain: ekr.views

summary: >-
  Read-only projections of one committed revision. A view is a deterministic function of a
  snapshot at a revision, a template version and a query scope; every rendered fact carries the id
  of the assertion it came from, and what a view renders is StorageClass Cache (design § 82). The
  one format declared here is the graph projection ekr.graph-projection/1: one JSON document per
  committed revision, scoped to canonical state as of that revision (§ 47), carrying assertion and
  evidence ids for the explain chain (§ 62), the schema version lineage (§ 95) and evidence
  identities without their bytes (§ 86). The format names no domain concept: it is generic over any
  ontology, and every name a viewer shows is taken from the projection's ontology or graph state.
  This domain writes nothing; its one command reads.

  Determinism, which every renderer of ekr.graph-projection/1 holds to so that two renders of one
  revision are byte-identical. (1) Order. By id: every array whose members carry an `id`, and
  every array of ids, ascending in the lowercase hyphenated text of the UUID — ontology.node_types,
  ontology.edge_types, ontology.properties, each type's properties, source_types, target_types and
  assertions, nodes, edges, evidence, each node's and edge's assertions, each assertion's evidence,
  assessment.validators (a set) and each schema version's added. By number, ascending:
  schema.versions and schema.revisions. In the store's own order, because the order is part of the
  value: each node's aliases, each property's value list in props (an ordered list in which
  duplicates count), each ListValue's items, and assessment.issues and
  assessment.competing_assertions (ordered vectors, amendment 88). Map keys (props, a RecordValue's
  fields) ascend by their text. No other array appears in the format. (2) Key order: every
  object's keys appear in the order its type below declares its fields, and a union's tag key
  `kind` comes first. (3) Encoding: UTF-8 JSON with no insignificant whitespace; an Integer or a
  RevisionNumber is a JSON integer with no sign on zero, no leading zero, no fraction and no
  exponent; every time is an ekr.views.EpochMillis, a JSON integer of milliseconds since the Unix
  epoch in UTC, which is how the runtime stores a Timestamp; a Uuid is its lowercase hyphenated
  text; a Decimal is its exact text as the store holds it. (4) Presence: every required field is
  always emitted; an Optional field with no value is omitted, never emitted as null, and one with a
  value is always emitted; an empty list or map is emitted empty, never omitted. No field of this
  format is an Optional inside a list or a map. (5) No field carries a wall-clock time, a host, a
  path or anything else that differs between two renders of one revision.

  UNMAPPED under decision-blocker:evidence-entry-after-seed: evidence without retained bytes. Every
  evidence record the kernel admits today arrives with the seed, and the seed retains its bytes, so
  `retained` is true for every evidence record a store can hold; no scenario can build the false
  case until that decision says how evidence enters canonical state after the seed.

naming:
  wire: views
  display: Views

types:
  # Where the store the projection reads lives, as the host that renders names it. Never emitted in
  # the projection: a location is a fact about the host, not about the revision.
  - name: ekr.views.StoreLocation
    kind: newtype
    of: String

  # The format name and version in one literal, as every other document of this runtime carries it.
  - name: ekr.views.GraphProjectionFormatV1
    kind: enum
    variants: [ekr.graph-projection/1]

  # Every time in the format: milliseconds since the Unix epoch in UTC, the runtime's own
  # Timestamp encoding (crates/ekr-core/src/time.rs). Declared rather than ESS's Timestamp, which
  # ESS spells as a date-time string.
  - name: ekr.views.EpochMillis
    kind: newtype
    of: Integer

  # `revision` is the projected revision, `head` the store's newest committed revision when the
  # projection was rendered. The four counts are over the document itself: nodes[], edges[], every
  # assertion entry under nodes[], edges[] and the ontology's types, and evidence[].
  - name: ekr.views.ProjectionMeta
    kind: struct
    fields:
      - name: format
        type: ekr.views.GraphProjectionFormatV1
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: head
        type: ekr.kernel.RevisionNumber
      - name: node_count
        type: Integer
      - name: edge_count
        type: Integer
      - name: assertion_count
        type: Integer
      - name: evidence_count
        type: Integer

  # A canonical value, readable. Design § 11.3 without Float, which canonical state does not
  # admit (ADR 0005). Duration is an Integer as the store holds it. On the wire a ProjectedValue is
  # {"kind": <variant>, "value": <payload>}: the payload of String, Decimal and Enum is JSON text,
  # of Boolean a JSON boolean, of Integer and Duration a JSON integer, of Timestamp an
  # EpochMillis, of NodeRef a node id, of List an array of ProjectedValue and of Record an object
  # of ProjectedValue by field name.
  - name: ekr.views.TextValue
    kind: newtype
    of: String

  - name: ekr.views.BooleanValue
    kind: newtype
    of: Boolean

  - name: ekr.views.IntegerValue
    kind: newtype
    of: Integer

  - name: ekr.views.ListValue
    kind: newtype
    of: List<ekr.views.ProjectedValue>

  - name: ekr.views.RecordValue
    kind: newtype
    of: Map<String, ekr.views.ProjectedValue>

  - name: ekr.views.ProjectedValue
    kind: union
    tag: kind
    variants:
      String: ekr.views.TextValue
      Boolean: ekr.views.BooleanValue
      Integer: ekr.views.IntegerValue
      Decimal: ekr.views.TextValue
      Timestamp: ekr.views.EpochMillis
      Duration: ekr.views.IntegerValue
      NodeRef: ekr.graph.NodeId
      Enum: ekr.views.TextValue
      List: ekr.views.ListValue
      Record: ekr.views.RecordValue

  # ekr.graph.AssertionLifecycleProjection with its time as EpochMillis. Exactly the payload its
  # kind carries is present (amendment 88).
  - name: ekr.views.ProjectedLifecycle
    kind: struct
    fields:
      - name: kind
        type: ekr.graph.AssertionLifecycleKind
      - name: at_revision
        type: Optional<ekr.kernel.RevisionNumber>
      - name: reason
        type: Optional<String>
      - name: by
        type: Optional<ekr.graph.AssertionId>
      - name: effective_from
        type: Optional<ekr.views.EpochMillis>

  # One assertion as the store holds it at the projected revision. It is listed under the node,
  # edge or type that is its subject, so the subject is not repeated. Exactly the object payload
  # its object_kind names is present: object_value for Value, object_ref for Node and Type.
  # `evidence` is the ids of the evidence its supports reference.
  - name: ekr.views.ProjectedAssertion
    kind: struct
    fields:
      - name: id
        type: ekr.graph.AssertionId
      - name: predicate_kind
        type: ekr.graph.PredicateKind
      - name: predicate
        type: Uuid
      - name: object_kind
        type: ekr.graph.ObjectKind
      - name: object_value
        type: Optional<ekr.views.ProjectedValue>
      - name: object_ref
        type: Optional<Uuid>
      - name: assessment
        type: ekr.graph.AssessmentProjection
      - name: lifecycle
        type: ekr.views.ProjectedLifecycle
      - name: valid_from
        type: Optional<ekr.views.EpochMillis>
      - name: valid_to
        type: Optional<ekr.views.EpochMillis>
      - name: recorded_from
        type: ekr.views.EpochMillis
      - name: recorded_to
        type: Optional<ekr.views.EpochMillis>
      - name: evidence
        type: List<ekr.graph.EvidenceId>

  # The ontology at the projected revision: the schema version that revision's canonical state is
  # valid against. `properties` on a type is the ids of the property definitions it declares;
  # `assertions` are those whose subject is that type.
  - name: ekr.views.ProjectedProperty
    kind: struct
    fields:
      - name: id
        type: ekr.ontology.PropertyId
      - name: name
        type: String
      - name: value_kind
        type: ekr.ontology.ValueKind

  - name: ekr.views.ProjectedNodeType
    kind: struct
    fields:
      - name: id
        type: ekr.ontology.TypeId
      - name: name
        type: String
      - name: properties
        type: List<ekr.ontology.PropertyId>
      - name: assertions
        type: List<ekr.views.ProjectedAssertion>

  - name: ekr.views.ProjectedEdgeType
    kind: struct
    fields:
      - name: id
        type: ekr.ontology.TypeId
      - name: name
        type: String
      - name: source_types
        type: List<ekr.ontology.TypeId>
      - name: target_types
        type: List<ekr.ontology.TypeId>
      - name: properties
        type: List<ekr.ontology.PropertyId>
      - name: assertions
        type: List<ekr.views.ProjectedAssertion>

  - name: ekr.views.ProjectedOntology
    kind: struct
    fields:
      - name: node_types
        type: List<ekr.views.ProjectedNodeType>
      - name: edge_types
        type: List<ekr.views.ProjectedEdgeType>
      - name: properties
        type: List<ekr.views.ProjectedProperty>

  # `name` is the node's canonical_name, `type` its type id, `state` its per-type lifecycle state
  # and `props` its property values keyed by property id.
  - name: ekr.views.ProjectedNode
    kind: struct
    fields:
      - name: id
        type: ekr.graph.NodeId
      - name: name
        type: String
      - name: type
        type: ekr.ontology.TypeId
      - name: aliases
        type: List<String>
      - name: state
        type: Optional<String>
      - name: props
        type: Map<String, List<ekr.views.ProjectedValue>>
      - name: assertions
        type: List<ekr.views.ProjectedAssertion>

  # The store's ekr.graph.Edge entities, exactly as it holds them. Whether a relation assertion and
  # an Edge with the same source, type and target are one projected edge is undecided
  # (decision-blocker:relation-assertion-edge-correspondence); this format joins neither to the
  # other, and carries no edge-level lifecycle, valid time or evidence of its own.
  - name: ekr.views.ProjectedEdge
    kind: struct
    fields:
      - name: id
        type: ekr.graph.EdgeId
      - name: source
        type: ekr.graph.NodeId
      - name: target
        type: ekr.graph.NodeId
      - name: type
        type: ekr.ontology.TypeId
      - name: props
        type: Map<String, List<ekr.views.ProjectedValue>>
      - name: assertions
        type: List<ekr.views.ProjectedAssertion>

  # An evidence identity. `locator` and `section` are ekr.graph.Evidence's. `retained` says whether
  # the store holds the bytes `content_hash` names; the bytes themselves are never projected.
  - name: ekr.views.ProjectedEvidence
    kind: struct
    fields:
      - name: id
        type: ekr.graph.EvidenceId
      - name: kind
        type: ekr.graph.EvidenceKind
      - name: locator
        type: String
      - name: section
        type: Optional<String>
      - name: content_hash
        type: ekr.kernel.ContentHash
      - name: observed_at
        type: ekr.views.EpochMillis
      - name: confidence_bp
        type: Integer
      - name: retained
        type: Boolean

  # `revision` is the first revision whose canonical state is valid against this version; `added`
  # the type and property ids this version declares and its parent does not (for the seed's
  # version, every id it declares). Only versions whose `revision` is at most the projected
  # revision are listed.
  - name: ekr.views.ProjectedSchemaVersion
    kind: struct
    fields:
      - name: number
        type: Integer
      - name: id
        type: ekr.ontology.SchemaVersionId
      - name: parent
        type: Optional<ekr.ontology.SchemaVersionId>
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: added
        type: List<Uuid>

  # One committed revision up to and including the projected one. `transaction_id` is omitted for
  # the seed; `schema_version` is the id of the version its canonical state is valid against.
  - name: ekr.views.ProjectedRevision
    kind: struct
    fields:
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: committed_at
        type: ekr.views.EpochMillis
      - name: transaction_id
        type: Optional<ekr.kernel.TransactionId>
      - name: schema_version
        type: ekr.ontology.SchemaVersionId

  - name: ekr.views.ProjectedSchema
    kind: struct
    fields:
      - name: versions
        type: List<ekr.views.ProjectedSchemaVersion>
      - name: revisions
        type: List<ekr.views.ProjectedRevision>

  # The document. Rendered, never stored as canonical state; nothing owns it. Its tie to one
  # revision is design § 82, stated here rather than as a relation.
  - name: ekr.views.GraphProjectionV1
    kind: struct
    fields:
      - name: meta
        type: ekr.views.ProjectionMeta
      - name: ontology
        type: ekr.views.ProjectedOntology
      - name: nodes
        type: List<ekr.views.ProjectedNode>
      - name: edges
        type: List<ekr.views.ProjectedEdge>
      - name: evidence
        type: List<ekr.views.ProjectedEvidence>
      - name: schema
        type: ekr.views.ProjectedSchema

actors:
  - name: ekr.views.Reader
    may:
      - ekr.views.ProjectGraph
    naming:
      display: Reader

errors:
  - name: ekr.views.RevisionNotFound
    summary: The store holds no committed revision with the requested number; nothing was rendered.
    fields:
      - name: requested
        type: ekr.kernel.RevisionNumber
      - name: head
        type: ekr.kernel.RevisionNumber

commands:
  # Design § 82. A read of one immutable revision; the default is the newest. Writes no canonical
  # state and moves no subject.
  - name: ekr.views.ProjectGraph
    naming:
      wire: project-graph
      display: Project the graph
    input:
      - name: store
        type: ekr.views.StoreLocation
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
    response:
      - name: projection
        type: ekr.views.GraphProjectionV1
    outcomes:
      - name: projected
        emits:
          - ekr.views.GraphProjected
        payload:
          ekr.views.GraphProjected:
            revision: {generated: true}
            head: {generated: true}
            nodes: {generated: true}
            edges: {generated: true}
            assertions: {generated: true}
            evidence: {generated: true}
            schema_versions: {generated: true}
            revisions: {generated: true}
            transactions: {generated: true}
            node_types: {generated: true}
            edge_types: {generated: true}
            properties: {generated: true}
            edge_assertions: {generated: true}
            retracted_assertions: {generated: true}
            retained_evidence: {generated: true}
            projection_hash: {generated: true}
        summary: One ekr.graph-projection/1 document of the requested revision, byte-identical to every other render of that revision.
      # External because what decides it is the store's head, which is not command input, and the
      # projection is no entity whose field a guard could read; ESS's `when:` sees input only. The
      # authored scenario a-revision-beyond-the-head-is-refused constructs the case instead.
      - name: not-found
        external: the store holds no committed revision with the requested number
        error: ekr.views.RevisionNotFound
        summary: Nothing was rendered.

events:
  # What one render returned, counted over the document it returned, so a suite can hold a
  # renderer to it without parsing the response. `projection_hash` is the hex SHA-256 of the
  # document's exact bytes. Every field is a function of the document, so this event is as
  # deterministic as the document is. `transactions` counts the schema.revisions entries that carry
  # a transaction_id, so the seed's entry, which carries none, is not one of them; `node_types`,
  # `edge_types` and `properties` count the projected ontology's three lists.
  - name: ekr.views.GraphProjected
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: head
        type: ekr.kernel.RevisionNumber
      - name: nodes
        type: Integer
      - name: edges
        type: Integer
      - name: assertions
        type: Integer
      - name: evidence
        type: Integer
      - name: schema_versions
        type: Integer
      - name: revisions
        type: Integer
      - name: transactions
        type: Integer
      - name: node_types
        type: Integer
      - name: edge_types
        type: Integer
      - name: properties
        type: Integer
      - name: edge_assertions
        type: Integer
      - name: retracted_assertions
        type: Integer
      - name: retained_evidence
        type: Integer
      - name: projection_hash
        type: ekr.kernel.ContentHash
