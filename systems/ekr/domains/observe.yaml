domain: ekr.observe

summary: >-
  The observation layer's own vocabulary: source units, the units of source-side progress this
  domain names, with their granularity held open; the checkpoint a poll resumes from; the health
  of one poll; and the idempotency key that makes a second observation of the same source record
  the same observation. Design § 15, § 54–57; predecessors A8. The
  observation itself is `ekr.graph.Observation` and is referenced here, not redeclared. Checkpoint
  state is durable but is not canonical knowledge (§ 55). How units, checkpoints, poll health and
  observations link to one another remains held open for polling by the remaining decision-blockers, named below where
  it applies. Redaction (A6), the coverage report and adapter declarations are not modelled yet.

naming:
  wire: observe
  display: Observe

types:
  - name: ekr.observe.RetainedObservationRead
    kind: struct
    fields:
      - {name: observation, type: ekr.graph.ObservationRecord}
      - {name: key, type: ekr.observe.ObservationIdempotencyKey}
      - {name: payload, type: Bytes}
  - name: ekr.observe.ObservationRetentionOutcome
    kind: enum
    variants: [Retained, AlreadyRetained]
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.observe.ObservationImport
    kind: struct
    fields:
    - name: observation
      type: ekr.graph.ObservationRecord
    - name: key
      type: ekr.observe.ObservationIdempotencyKey
    - name: payload
      type: Bytes
  - name: ekr.observe.ObservationImportReceipt
    kind: struct
    fields:
    - {name: outcome, type: ekr.observe.ObservationRetentionOutcome}
    - name: observation_id
      type: ekr.graph.ObservationId
    - name: content_hash
      type: ekr.kernel.ContentHash
    - name: already_retained
      type: Boolean

  - name: ekr.observe.SourceUnitId
    kind: newtype
    of: Uuid

  - name: ekr.observe.SourceCheckpointId
    kind: newtype
    of: Uuid

  # Predecessors A8: the four outcomes of one poll.
  - name: ekr.observe.PollStatus
    kind: enum
    variants:
      - Attempt
      - Complete
      - Partial
      - Failed

  # Predecessors A8: the health of one poll. `checked_through` is the end of the window this one
  # poll proves; a successful poll proves only its window.
  - name: ekr.observe.PollHealth
    kind: struct
    fields:
      - name: status
        type: ekr.observe.PollStatus
      - name: checked_through
        type: Optional<Timestamp>

  # Design § 56: source identity, source-native id, content hash. Two observations of one source
  # record carry equal keys. `source` and `source_native_id` have the same meaning as the fields of
  # that name on `ekr.graph.Observation`.
  - name: ekr.observe.ObservationIdempotencyKey
    kind: struct
    fields:
      - name: source
        type: String
      - name: source_native_id
        type: Optional<String>
      - name: content_hash
        type: ekr.kernel.ContentHash

  # The form an observation of one source record takes: the observation, by id, and the key that
  # identifies the record it was observed from. A value, not a stored record.
  #
  # Decided by the operator, 2026-10-03: RetainedObservation holds the key independently
  # of canonical revisions. The deduplication index is rebuilt from that append-only stream.
  - name: ekr.observe.SourceRecordObservation
    kind: struct
    fields:
      - name: key
        type: ekr.observe.ObservationIdempotencyKey
      - name: observation_id
        type: ekr.graph.ObservationId

entities:
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.observe.RetainedObservation
    identity:
      name: observation_id
      type: ekr.graph.ObservationId
    fields:
    - name: key
      type: ekr.observe.ObservationIdempotencyKey
    - name: content_hash
      type: ekr.kernel.ContentHash
    - name: retained_at
      type: Timestamp
    # An append-only admission in ekr-store, keyed uniquely by source identity,
    # source-native id and content hash; never owned by a revision or root. Cited bytes
    # are Provenance-pinned.
    relations:
    - name: observation
      kind: references
      target: ekr.graph.Observation
      cardinality: one
      via: observation_id
    - name: bytes
      kind: references
      target: ekr.store.StoredObject
      cardinality: one
      via: content_hash
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded

  # A source unit is the unit of source-side progress this domain names. Its granularity is held
  # open by decision-blocker:source-unit-granularity, below. Predecessors § 8 carries "replies are
  # their own units" as a requirement.
  #
  # UNMAPPED: decision-blocker:source-unit-granularity — what a unit is (one item or the stream a
  # checkpoint advances over), and so both `SourceUnit → Observation` and the link from a
  # SourceCheckpoint to the unit (or stream) it advances over. Neither is declared, as a relation
  # or as a field, until that is decided.
  #
  # UNMAPPED: decision-blocker:adapter-unit-ownership — whether a source adapter owns its units,
  # a declaration lists them, or both, and what becomes of a unit that disappears from its source.
  # Adapter declarations are outside this domain for now, so no relation names one, and the
  # lifecycle below says nothing about retirement.
  - name: ekr.observe.SourceUnit
    identity:
      name: source_unit_id
      type: ekr.observe.SourceUnitId
    fields:
      - name: source
        type: String
      - name: source_native_id
        type: Optional<String>
    lifecycle:
      initial: Present
      states: [Present]
      terminal: [Present]

  # Design § 54–55: the durable position a poll resumes from — a timestamp, a commit hash, a CDC
  # offset — held as the source's own opaque cursor. It is operational state, not canonical
  # knowledge.
  #
  # UNMAPPED: decision-blocker:checkpoint-unit-cardinality — whether a unit has one checkpoint
  # replaced in place or an append-only history of them, and so where PollHealth and the window
  # its `checked_through` proves are kept: on a checkpoint entry, or on a separate poll record.
  # PollHealth is therefore declared as a type and placed on no entity, and the lifecycle below is
  # the least that can be said.
  - name: ekr.observe.SourceCheckpoint
    identity:
      name: source_checkpoint_id
      type: ekr.observe.SourceCheckpointId
    fields:
      - name: cursor
        type: String
      - name: recorded_at
        type: Timestamp
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

errors:
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.observe.KnowledgeRefused
    summary: A named deterministic refusal; no unreported write occurred. Partial application
      is a typed report, never this refusal.
    fields:
    - name: code
      type: String
    - name: reason
      type: String

events:
  - name: ekr.observe.ObservationsListed
    fields:
      - {name: observations, type: List<ekr.graph.ObservationRecord>}
  - name: ekr.observe.ObservationShown
    fields:
      - {name: retained, type: ekr.observe.RetainedObservationRead}
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.observe.ImportObservationResult
    fields:
    - name: receipt
      type: ekr.observe.ObservationImportReceipt

commands:
  - name: ekr.observe.ListObservations
    naming: {wire: observe-list}
    input: []
    response:
      - {name: observations, type: List<ekr.graph.ObservationRecord>}
    outcomes:
      - name: listed
        emits: [ekr.observe.ObservationsListed]
        payload:
          ekr.observe.ObservationsListed:
            observations: {generated: true}
        summary: Read retained observations independently of canonical revisions and interpretations, in identity order.
  - name: ekr.observe.ShowObservation
    naming: {wire: observe-show}
    input:
      - {name: observation_id, type: ekr.graph.ObservationId}
    response:
      - {name: retained, type: ekr.observe.RetainedObservationRead}
    outcomes:
      - name: shown
        emits: [ekr.observe.ObservationShown]
        payload:
          ekr.observe.ObservationShown:
            retained: {generated: true}
        summary: Return exact retained bytes and their source metadata after reopen, including observations with no accepted interpretation.
      - name: refused
        external: An unknown observation or missing/mismatched retained bytes is refused before answering.
        error: ekr.observe.KnowledgeRefused
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.observe.ImportObservation
    naming:
      wire: observe-import
    input:
    - name: document
      type: ekr.observe.ObservationImport
    response:
    - name: receipt
      type: ekr.observe.ObservationImportReceipt
    outcomes:
    - name: answered
      emits:
      - ekr.observe.ImportObservationResult
      payload:
        ekr.observe.ImportObservationResult:
          receipt:
            generated: true
      summary: Retain the observation and exact bytes atomically through the store abstraction,
        before interpretation. A matching key returns its original identity without
        another record. It does not commit a canonical revision.
    - name: refused
      external: Payload digest, source key coherence, immutable identity and idempotency
        are checked against retained records; a reused identity with other bytes is
        refused.
      error: ekr.observe.KnowledgeRefused

actors:
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.observe.KnowledgeSupplier
    may:
    - ekr.observe.ImportObservation
    - ekr.observe.ListObservations
    - ekr.observe.ShowObservation

views:
  - name: ekr.observe.RetainedObservationRecords
    source: ekr.observe.RetainedObservation
    consistency: read_your_writes
    fields:
    - name: observation_id
      type: ekr.graph.ObservationId
    - name: state
      type: ekr.observe.RetainedObservation.State
    - name: key
      type: ekr.observe.ObservationIdempotencyKey
    - name: content_hash
      type: ekr.kernel.ContentHash
    - name: retained_at
      type: Timestamp
