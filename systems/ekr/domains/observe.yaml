domain: ekr.observe

summary: >-
  The observation layer's own vocabulary: source units, the units of source-side progress this
  domain names, with their granularity held open; the checkpoint a poll resumes from; the health
  of one poll; and the idempotency key that makes a second observation of the same source record
  the same observation. Design § 15, § 54–57; predecessors A8. The
  observation itself is `ekr.graph.Observation` and is referenced here, not redeclared. Checkpoint
  state is durable but is not canonical knowledge (§ 55). How units, checkpoints, poll health and
  observations link to one another is held open by four decision-blockers, each named below where
  it applies. Credential redaction before model input (A6) is modelled as the value a model-facing
  projection takes of an observed text: the credential shapes it detects, each redaction it
  records and the redacted text. The coverage report, adapter declarations and the PII and
  restricted-source halves of invariant 9 are not modelled yet.

naming:
  wire: observe
  display: Observe

types:
  - name: ekr.observe.SourceUnitId
    kind: newtype
    of: Uuid

  - name: ekr.observe.SourceCheckpointId
    kind: newtype
    of: Uuid

  # Predecessors A8: the four outcomes of one poll.
  - name: ekr.observe.PollStatus
    kind: enum
    variants:
      - Attempt
      - Complete
      - Partial
      - Failed

  # Predecessors A8: the health of one poll. `checked_through` is the end of the window this one
  # poll proves; a successful poll proves only its window.
  - name: ekr.observe.PollHealth
    kind: struct
    fields:
      - name: status
        type: ekr.observe.PollStatus
      - name: checked_through
        type: Optional<Timestamp>

  # Design § 56: source identity, source-native id, content hash. Two observations of one source
  # record carry equal keys. `source` and `source_native_id` have the same meaning as the fields of
  # that name on `ekr.graph.Observation`.
  - name: ekr.observe.ObservationIdempotencyKey
    kind: struct
    fields:
      - name: source
        type: String
      - name: source_native_id
        type: Optional<String>
      - name: content_hash
        type: ekr.kernel.ContentHash

  # The form an observation of one source record takes: the observation, by id, and the key that
  # identifies the record it was observed from. A value, not a stored record.
  #
  # UNMAPPED: decision-blocker:observation-retention-path — where the observation this names is
  # retained, whether it depends on a revision, and so whether a deduplication index from key to
  # observation exists and where it lives. Until that is decided nothing here persists a key.
  - name: ekr.observe.SourceRecordObservation
    kind: struct
    fields:
      - name: key
        type: ekr.observe.ObservationIdempotencyKey
      - name: observation_id
        type: ekr.graph.ObservationId

  # Predecessors A6, invariant 9: the credential shapes a model-facing projection detects and
  # replaces. Which fields of which source reach a model is instance policy and is not modelled;
  # these shapes are generic.
  #
  # A shape whose value is self-delimiting (an access key id, a token, a JSON Web Token, a bearer
  # credential, an AWS secret access key assignment) is detected where the byte before it does not
  # continue a word, or where it follows an escape the observed text carries as characters: `\n`,
  # `\t`, `\r`, `\b`, `\f`, `\uXXXX` or a percent-encoded byte such as `%3D`. A private key block
  # and a URL password are detected wherever they stand. A bearer credential follows the scheme
  # word `bearer` in any letter case and one or more spaces, tabs or `%20`. A private key block
  # is a PEM or OpenPGP armoured private key (`… PRIVATE KEY` or `… PRIVATE KEY BLOCK`), and no
  # token run extends into the `-----BEGIN ` that opens one. A JSON Web Token's third segment may
  # be empty (an unsecured token). An AWS secret access key is the forty-character value assigned
  # to the name `aws_secret_access_key`, in any letter case, by `=` or `:`. A URL password is the
  # password of a URL's userinfo, `scheme://user:password@`; the scheme and user stay visible.
  # Detection examines each byte of the observed text a bounded number of times.
  - name: ekr.observe.CredentialShape
    kind: enum
    variants:
      - AwsAccessKeyId
      - GitHubToken
      - SlackToken
      - JsonWebToken
      - BearerToken
      - PrivateKeyBlock
      - AwsSecretAccessKey
      - UrlPassword

  # Where a credential sat in the observed text: the byte offset of its first byte in the text as
  # observed, and its length in bytes. Offsets, not content: a span carries no byte of the
  # credential. A start and a length rather than two ends, so that a span is never empty is an
  # invariant of one field.
  - name: ekr.observe.RedactionSpan
    kind: struct
    fields:
      - name: start
        type: Integer
      - name: length
        type: Integer
    invariants:
      - start >= 0
      - length >= 1

  # One credential replaced: its shape and its span, and nothing else. The credential's value is
  # never recorded, hashed or echoed (story:credential-redaction-before-model-input).
  - name: ekr.observe.Redaction
    kind: struct
    fields:
      - name: shape
        type: ekr.observe.CredentialShape
      - name: span
        type: ekr.observe.RedactionSpan

  # The model-facing projection of an observed text: the text with every detected credential
  # replaced by a marker naming its shape, and one redaction per replacement, in span order. A
  # value computed from the observed text and never stored: the observation and the bytes it was
  # observed from are left as they were. A text with no credential projects to itself, byte for
  # byte, with no redactions.
  #
  # UNMAPPED: decision-blocker:observation-retention-path — nothing retains an observed text yet,
  # so nothing here names the pipeline step, adapter or checkpoint a projection runs at; it is a
  # pure function over the text it is given.
  - name: ekr.observe.ModelInput
    kind: struct
    fields:
      - name: text
        type: String
      - name: redactions
        type: List<ekr.observe.Redaction>

entities:
  # A source unit is the unit of source-side progress this domain names. Its granularity is held
  # open by decision-blocker:source-unit-granularity, below. Predecessors § 8 carries "replies are
  # their own units" as a requirement.
  #
  # UNMAPPED: decision-blocker:source-unit-granularity — what a unit is (one item or the stream a
  # checkpoint advances over), and so both `SourceUnit → Observation` and the link from a
  # SourceCheckpoint to the unit (or stream) it advances over. Neither is declared, as a relation
  # or as a field, until that is decided.
  #
  # UNMAPPED: decision-blocker:adapter-unit-ownership — whether a source adapter owns its units,
  # a declaration lists them, or both, and what becomes of a unit that disappears from its source.
  # Adapter declarations are outside this domain for now, so no relation names one, and the
  # lifecycle below says nothing about retirement.
  - name: ekr.observe.SourceUnit
    identity:
      name: source_unit_id
      type: ekr.observe.SourceUnitId
    fields:
      - name: source
        type: String
      - name: source_native_id
        type: Optional<String>
    lifecycle:
      initial: Present
      states: [Present]
      terminal: [Present]

  # Design § 54–55: the durable position a poll resumes from — a timestamp, a commit hash, a CDC
  # offset — held as the source's own opaque cursor. It is operational state, not canonical
  # knowledge.
  #
  # UNMAPPED: decision-blocker:checkpoint-unit-cardinality — whether a unit has one checkpoint
  # replaced in place or an append-only history of them, and so where PollHealth and the window
  # its `checked_through` proves are kept: on a checkpoint entry, or on a separate poll record.
  # PollHealth is therefore declared as a type and placed on no entity, and the lifecycle below is
  # the least that can be said.
  - name: ekr.observe.SourceCheckpoint
    identity:
      name: source_checkpoint_id
      type: ekr.observe.SourceCheckpointId
    fields:
      - name: cursor
        type: String
      - name: recorded_at
        type: Timestamp
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
