domain: ekr.graph

summary: >-
  Graph roots, nodes, edges, bitemporal assertions with independent assessment and lifecycle, evidence and
  observations. Design § 13–17, § 21–23, § 36. This domain has no commands: every change to it is an
  operation inside a transaction the kernel commits, which is why assertion assessment/lifecycle and per-type
  lifecycle state are fields here rather than ESS lifecycles — one commit applies many operations,
  and an outcome causes one move.

naming:
  wire: graph
  display: Graph

types:
  - name: ekr.graph.GraphRootId
    kind: newtype
    of: Uuid

  - name: ekr.graph.NodeId
    kind: newtype
    of: Uuid

  - name: ekr.graph.EdgeId
    kind: newtype
    of: Uuid

  - name: ekr.graph.AssertionId
    kind: newtype
    of: Uuid

  - name: ekr.graph.SupportId
    kind: newtype
    of: Uuid

  - name: ekr.graph.EvidenceId
    kind: newtype
    of: Uuid

  - name: ekr.graph.ObservationId
    kind: newtype
    of: Uuid

  # Design § 23.
  - name: ekr.graph.Space
    kind: enum
    variants:
      - Canonical
      - Transient

  # Amendment 88. These are typed ESS projections of strict Rust tagged variants, not their
  # serialized representation. Exactly the payload belonging to kind is present; every other
  # optional field is absent. Proposed and Active have none. Runtime projection acceptance
  # checks the coherence; ESS validation alone does not establish it. Validators are a set,
  # whereas issues and competing_assertions preserve their original ordered-vector meaning.
  - name: ekr.graph.AssessmentKind
    kind: enum
    variants:
      - Proposed
      - Validating
      - Accepted
      - Rejected
      - Disputed

  - name: ekr.graph.AssertionLifecycleKind
    kind: enum
    variants:
      - Active
      - Retracted
      - Superseded

  - name: ekr.graph.AssessmentProjection
    kind: struct
    fields:
      - name: kind
        type: ekr.graph.AssessmentKind
      - name: completed
        type: Optional<Integer>
      - name: required
        type: Optional<Integer>
      - name: validators
        type: Optional<List<ekr.kernel.AgentId>>
      - name: issues
        type: Optional<List<ekr.kernel.IssueId>>
      - name: competing_assertions
        type: Optional<List<ekr.graph.AssertionId>>

  - name: ekr.graph.AssertionLifecycleProjection
    kind: struct
    fields:
      - name: kind
        type: ekr.graph.AssertionLifecycleKind
      - name: at_revision
        type: Optional<ekr.kernel.RevisionNumber>
      - name: reason
        type: Optional<String>
      - name: by
        type: Optional<ekr.graph.AssertionId>
      - name: effective_from
        type: Optional<Timestamp>

  # Design § 13.
  - name: ekr.graph.SubjectKind
    kind: enum
    variants:
      - Node
      - Edge
      - Type

  - name: ekr.graph.PredicateKind
    kind: enum
    variants:
      - Property
      - Relation

  - name: ekr.graph.ObjectKind
    kind: enum
    variants:
      - Value
      - Node
      - Type

  # Design § 16 `EvidenceSource`, by kind; the locator fields live on Evidence.
  - name: ekr.graph.EvidenceKind
    kind: enum
    variants:
      - Url
      - Document
      - DatabaseRecord
      - GraphAssertion
      - Observation
      - HumanStatement

  # Design § 15 `ObservationContent`, plus `Blob` from amendment 86.
  - name: ekr.graph.ObservationKind
    kind: enum
    variants:
      - Document
      - ApiResponse
      - DatabaseRecord
      - FeedItem
      - GraphFragment
      - MessageBatch
      - GitDiff
      - Blob

  # Canonical graph read projection only: canonical_bytes is the exact existing tagged binary
  # value encoding, not JSON, a debug string, or a stored-object payload. The kind must agree with
  # those bytes. The strict graph/seed documents retain typed Rust values, and transaction
  # documents retain transient Value (including Float) in their original YAML bytes (§91).
  # ESS supports Bytes and recursive types; earlier comments claiming otherwise were incorrect.
  - name: ekr.graph.CanonicalValueKind
    kind: enum
    variants:
      - String
      - Boolean
      - Integer
      - Decimal
      - Timestamp
      - Duration
      - NodeRef
      - Enum
      - List
      - Record

  - name: ekr.graph.TypedValue
    kind: struct
    fields:
      - name: kind
        type: ekr.graph.CanonicalValueKind
      - name: canonical_bytes
        type: Bytes


  # Complete admitted-document projections used by §91's retained seed records. Map keys are
  # exact stable UUID strings and must agree with nested ids. Lists projecting sets are unique
  # and sorted canonically. The source wire shape remains the strict typed document, not these
  # projections. Subject/predicate/object and evidence-source payloads must match their kind.
  - name: ekr.graph.RevisionRoot
    kind: struct
    fields:
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: parent
        type: Optional<ekr.kernel.ContentHash>
      - name: ontology_root
        type: ekr.kernel.ContentHash
      - name: knowledge_root
        type: ekr.kernel.ContentHash
      - name: evidence_root
        type: ekr.kernel.ContentHash
      - name: agent_root
        type: ekr.kernel.ContentHash
      - name: transaction
        type: ekr.kernel.ContentHash

  - name: ekr.graph.GraphRootRecord
    kind: struct
    fields:
      - name: id
        type: ekr.graph.GraphRootId
      - name: space
        type: ekr.graph.Space
      - name: schema_version_id
        type: ekr.ontology.SchemaVersionId
      - name: parent
        type: Optional<ekr.graph.GraphRootId>
      - name: created_at
        type: Timestamp

  - name: ekr.graph.NodeRecord
    kind: struct
    fields:
      - name: id
        type: ekr.graph.NodeId
      - name: root_id
        type: ekr.graph.GraphRootId
      - name: type_id
        type: ekr.ontology.TypeId
      - name: canonical_name
        type: String
      - name: aliases
        type: List<String>
      - name: type_state
        type: Optional<String>
      - name: properties
        type: Map<String, List<ekr.graph.TypedValue>>

  - name: ekr.graph.EdgeRecord
    kind: struct
    fields:
      - name: id
        type: ekr.graph.EdgeId
      - name: root_id
        type: ekr.graph.GraphRootId
      - name: type_id
        type: ekr.ontology.TypeId
      - name: source
        type: ekr.graph.NodeId
      - name: target
        type: ekr.graph.NodeId
      - name: properties
        type: Map<String, List<ekr.graph.TypedValue>>

  - name: ekr.graph.SubjectProjection
    kind: struct
    fields:
      - name: kind
        type: ekr.graph.SubjectKind
      - name: id
        type: Uuid

  - name: ekr.graph.PredicateProjection
    kind: struct
    fields:
      - name: kind
        type: ekr.graph.PredicateKind
      - name: id
        type: Uuid

  - name: ekr.graph.ObjectProjection
    kind: struct
    fields:
      - name: kind
        type: ekr.graph.ObjectKind
      - name: value
        type: Optional<ekr.graph.TypedValue>
      - name: reference
        type: Optional<Uuid>

  - name: ekr.graph.TemporalRange
    kind: struct
    fields:
      - name: from
        type: Optional<Timestamp>
      - name: to
        type: Optional<Timestamp>

  - name: ekr.graph.TransactionTime
    kind: struct
    fields:
      - name: recorded_from
        type: Timestamp
      - name: recorded_to
        type: Optional<Timestamp>

  - name: ekr.graph.AssertionRecord
    kind: struct
    fields:
      - name: id
        type: ekr.graph.AssertionId
      - name: root_id
        type: ekr.graph.GraphRootId
      - name: subject
        type: ekr.graph.SubjectProjection
      - name: predicate
        type: ekr.graph.PredicateProjection
      - name: object
        type: ekr.graph.ObjectProjection
      - name: evidence
        type: List<ekr.graph.EvidenceId>
      - name: proposed_by
        type: ekr.kernel.AgentId
      - name: assessment
        type: ekr.graph.AssessmentProjection
      - name: lifecycle
        type: ekr.graph.AssertionLifecycleProjection
      - name: valid_time
        type: ekr.graph.TemporalRange
      - name: transaction_time
        type: ekr.graph.TransactionTime

  - name: ekr.graph.EvidenceSourceProjection
    kind: struct
    fields:
      - name: kind
        type: ekr.graph.EvidenceKind
      - name: url
        type: Optional<String>
      - name: document_id
        type: Optional<String>
      - name: section
        type: Optional<String>
      - name: database
        type: Optional<String>
      - name: table
        type: Optional<String>
      - name: key
        type: Optional<String>
      - name: assertion
        type: Optional<ekr.graph.AssertionId>
      - name: observation
        type: Optional<ekr.graph.ObservationId>
      - name: identity
        type: Optional<String>

  - name: ekr.graph.EvidenceRecord
    kind: struct
    fields:
      - name: id
        type: ekr.graph.EvidenceId
      - name: source
        type: ekr.graph.EvidenceSourceProjection
      - name: content_hash
        type: ekr.kernel.ContentHash
      - name: extracted_by
        type: ekr.kernel.AgentId
      - name: observed_at
        type: Timestamp
      - name: confidence_bp
        type: Integer

  - name: ekr.graph.GraphDocumentBodyProjection
    kind: struct
    fields:
      - name: root
        type: ekr.graph.GraphRootRecord
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: nodes
        type: Map<String, ekr.graph.NodeRecord>
      - name: edges
        type: Map<String, ekr.graph.EdgeRecord>
      - name: assertions
        type: Map<String, ekr.graph.AssertionRecord>
      - name: evidence
        type: Map<String, ekr.graph.EvidenceRecord>

  # Required literal: "ekr.graph-document/2". Runtime version dispatch enforces it.
  - name: ekr.graph.GraphDocumentFormatV2
    kind: newtype
    of: String

  - name: ekr.graph.GraphDocumentV2Projection
    kind: struct
    fields:
      - name: format
        type: ekr.graph.GraphDocumentFormatV2
      - name: graph
        type: ekr.graph.GraphDocumentBodyProjection

entities:
  # Design § 22–23, § 69 `GraphRoot`. In P1 there is exactly one root, the canonical core.
  # The KnowledgeState ladder of § 29 is added in P3 together with the commands that move a root.
  - name: ekr.graph.GraphRoot
    identity:
      name: root_id
      type: ekr.graph.GraphRootId
    fields:
      - name: space
        type: ekr.graph.Space
      - name: schema_version_id
        type: ekr.ontology.SchemaVersionId
      - name: parent
        type: Optional<ekr.graph.GraphRootId>
      - name: created_at
        type: Timestamp
    relations:
      - name: nodes
        kind: owns
        target: ekr.graph.Node
        cardinality: many
        via: root_id
      - name: edges
        kind: owns
        target: ekr.graph.Edge
        cardinality: many
        via: root_id
      - name: assertions
        kind: owns
        target: ekr.graph.Assertion
        cardinality: many
        via: root_id
    lifecycle:
      initial: Active
      states: [Active]
      terminal: [Active]

  # Property maps use stable PropertyId UUID strings as keys, never names. Each ordered outer
  # list is nonempty; duplicates count. A List value inside it is still one member (§89).
  # Design § 10 and amendment 87. `state` is the per-type lifecycle state the ontology declares for
  # this node's type; the ontology-constraint validator, not ESS, checks its transitions.
  - name: ekr.graph.Node
    identity:
      name: node_id
      type: ekr.graph.NodeId
    fields:
      - name: root_id
        type: ekr.graph.GraphRootId
      - name: type_id
        type: ekr.ontology.TypeId
      - name: canonical_name
        type: String
      - name: aliases
        type: List<String>
      - name: type_state
        type: Optional<String>
      - name: properties
        type: Map<String, List<ekr.graph.TypedValue>>
    relations:
      - name: type
        kind: references
        target: ekr.ontology.NodeType
        cardinality: one
        via: type_id
    lifecycle:
      initial: Present
      states: [Present]
      terminal: [Present]

  # Design § 12.
  - name: ekr.graph.Edge
    identity:
      name: edge_id
      type: ekr.graph.EdgeId
    fields:
      - name: root_id
        type: ekr.graph.GraphRootId
      - name: type_id
        type: ekr.ontology.TypeId
      - name: source
        type: ekr.graph.NodeId
      - name: target
        type: ekr.graph.NodeId
      - name: properties
        type: Map<String, List<ekr.graph.TypedValue>>
    relations:
      - name: type
        kind: references
        target: ekr.ontology.EdgeType
        cardinality: one
        via: type_id
      - name: from
        kind: references
        target: ekr.graph.Node
        cardinality: one
        via: source
      - name: to
        kind: references
        target: ekr.graph.Node
        cardinality: one
        via: target
    lifecycle:
      initial: Present
      states: [Present]
      terminal: [Present]

  # Design § 13–14, § 17, § 36. Subject, predicate and object are typed by kind plus identity or
  # value. Valid time is the world's; recorded time is the runtime's.
  - name: ekr.graph.Assertion
    identity:
      name: assertion_id
      type: ekr.graph.AssertionId
    fields:
      - name: root_id
        type: ekr.graph.GraphRootId
      - name: subject_kind
        type: ekr.graph.SubjectKind
      - name: subject
        type: Uuid
      - name: predicate_kind
        type: ekr.graph.PredicateKind
      - name: predicate
        type: Uuid
      - name: object_kind
        type: ekr.graph.ObjectKind
      - name: object_value
        type: Optional<ekr.graph.TypedValue>
      - name: object_ref
        type: Optional<Uuid>
      - name: proposed_by
        type: ekr.kernel.AgentId
      - name: assessment
        type: ekr.graph.AssessmentProjection
      - name: lifecycle
        type: ekr.graph.AssertionLifecycleProjection
      - name: valid_from
        type: Optional<Timestamp>
      - name: valid_to
        type: Optional<Timestamp>
      - name: recorded_from
        type: Timestamp
      - name: recorded_to
        type: Optional<Timestamp>
    relations:
      - name: support
        kind: owns
        target: ekr.graph.Support
        cardinality: many
        via: assertion_id
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # The link from an assertion to one piece of evidence. Design § 13 `evidence: BTreeSet<EvidenceId>`.
  - name: ekr.graph.Support
    identity:
      name: support_id
      type: ekr.graph.SupportId
    fields:
      - name: assertion_id
        type: ekr.graph.AssertionId
      - name: evidence_id
        type: ekr.graph.EvidenceId
    relations:
      - name: evidence
        kind: references
        target: ekr.graph.Evidence
        cardinality: one
        via: evidence_id
    lifecycle:
      initial: Linked
      states: [Linked]
      terminal: [Linked]

  # Design § 16. Confidence in basis points, so it is an integer a suite can compare.
  - name: ekr.graph.Evidence
    identity:
      name: evidence_id
      type: ekr.graph.EvidenceId
    fields:
      - name: kind
        type: ekr.graph.EvidenceKind
      - name: locator
        type: String
      - name: section
        type: Optional<String>
      - name: content_hash
        type: ekr.kernel.ContentHash
      - name: extracted_by
        type: ekr.kernel.AgentId
      - name: observed_at
        type: Timestamp
      - name: confidence_bp
        type: Integer
      # An evidence of kind Observation names its observation here; other kinds have none. ESS
      # relations are total, so this optional link is a field, checked by the reference validator.
      - name: observation_id
        type: Optional<ekr.graph.ObservationId>
    invariants:
      - confidence_bp >= 0
      - confidence_bp <= 10000
    lifecycle:
      initial: Retained
      states: [Retained]
      terminal: [Retained]

  # Design § 15. Immutable; what was received, not what it means. P2 adds the source adapters
  # and checkpoints around it.
  - name: ekr.graph.Observation
    identity:
      name: observation_id
      type: ekr.graph.ObservationId
    fields:
      - name: source
        type: String
      - name: source_native_id
        type: Optional<String>
      - name: kind
        type: ekr.graph.ObservationKind
      - name: content_hash
        type: ekr.kernel.ContentHash
      - name: captured_at
        type: Timestamp
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

views:
  # Design § 47: the default application query is canonical active knowledge.
  - name: ekr.graph.Assertions
    source: ekr.graph.Assertion
    consistency: read_your_writes
    order_by:
      - recorded_from desc
    fields:
      - name: assertion_id
        type: ekr.graph.AssertionId
      - name: root_id
        type: ekr.graph.GraphRootId
      - name: assessment
        type: ekr.graph.AssessmentProjection
      - name: lifecycle
        type: ekr.graph.AssertionLifecycleProjection
      - name: recorded_from
        type: Timestamp
    naming:
      wire: assertions
      display: Assertions
