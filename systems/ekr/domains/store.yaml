domain: ekr.store

summary: >-
  Persistence through eventlog. A committed revision is an event; the graph is a fold; snapshots
  are eventlog snapshots; bytes are content-addressed and carry a storage class that decides their
  retention. Design § 34, § 37, § 57. Reclamation (§ 38–39) arrives in P6 with the commands that
  move an object toward deletion.

naming:
  wire: store
  display: Store

types:
  # Design § 37.
  - name: ekr.store.StorageClass
    kind: enum
    variants:
      - Canonical
      - Provenance
      - Incubating
      - Cache
      - Ephemeral

  # DESIGN 94: private recovery carriers, not canonical transaction states.
  # Runtime recovery controls remain unexecuted at declaration.
  - name: ekr.store.PublicationCommandKind
    kind: enum
    variants: [Bootstrap, Propose, Validate, Commit]

  - name: ekr.store.PublicationCommandKey
    kind: struct
    fields:
      - name: kind
        type: ekr.store.PublicationCommandKind
      - name: transaction_id
        type: Optional<ekr.kernel.TransactionId>
      - name: predecessor_event_id
        type: Optional<ekr.kernel.EventId>
      - name: predecessor_record_hash
        type: Optional<ekr.kernel.ContentHash>

  - name: ekr.store.PublicationObject
    kind: struct
    fields:
      - name: storage_class
        type: ekr.store.StorageClass
      - name: stored_at
        type: Timestamp
      - name: bytes
        type: Bytes

  - name: ekr.store.Publication
    kind: struct
    fields:
      - name: event
        type: ekr.kernel.RevisionEventV2
      - name: objects
        type: Map<String, ekr.store.PublicationObject>
      - name: expected_version
        type: Integer

  - name: ekr.store.NativeExpectedKind
    kind: enum
    variants: [Any, NoStream, Exact]

  - name: ekr.store.NativeExpected
    kind: struct
    fields:
      - name: kind
        type: ekr.store.NativeExpectedKind
      - name: version
        type: Optional<Integer>

  - name: ekr.store.NativeStreamId
    kind: struct
    fields:
      - name: tenant
        type: String
      - name: stream_type
        type: String
      - name: stream_id
        type: String

  - name: ekr.store.NativeNewEvent
    kind: struct
    fields:
      - name: name
        type: String
      - name: schema_version
        type: Integer
      - name: data
        type: Bytes

  - name: ekr.store.NativeStreamAppend
    kind: struct
    fields:
      - name: stream
        type: ekr.store.NativeStreamId
      - name: expected
        type: ekr.store.NativeExpected
      - name: events
        type: List<ekr.store.NativeNewEvent>

  - name: ekr.store.NativeClaim
    kind: struct
    fields:
      - name: scope
        type: String
      - name: key
        type: String
      - name: digest
        type: String

  - name: ekr.store.NativeCommandMeta
    kind: struct
    fields:
      - name: idempotency_key
        type: String
      - name: request_hash
        type: String
      - name: subject
        type: String
      - name: actor
        type: String
      - name: request_id
        type: String
      - name: trace_id
        type: String
      - name: causation_id
        type: Optional<String>
      - name: causation_depth
        type: Integer
      - name: occurred_at_unix_nanos
        type: String
      - name: occurred_at_offset_seconds
        type: Integer
      - name: claim
        type: Optional<ekr.store.NativeClaim>

  - name: ekr.store.NativeBlobWrite
    kind: struct
    fields:
      - name: digest
        type: String
      - name: bytes
        type: Bytes

  - name: ekr.store.NativePublicationRequest
    kind: struct
    fields:
      - name: tenant
        type: String
      - name: appends
        type: List<ekr.store.NativeStreamAppend>
      - name: meta
        type: ekr.store.NativeCommandMeta
      - name: blobs
        type: List<ekr.store.NativeBlobWrite>

  # Design §100.2, added 2026-09-29 by story:seed-envelope-v3-references-payloads. A decision that
  # stages a Provenance object (an evidence payload) is elected in ekr.publication-preparation/3:
  # the /2 layout, except that each Provenance object is this carrier, without its bytes. The
  # preparation's own atomic group binds those bytes under the object's own content address, the
  # address its publication binds the same bytes to again, so the bytes are retained once. Until
  # that publication no ObjectStored metadata names them and no object read finds them. Reading a
  # /3 attempt back reads each staged binding and checks it against the address and byte_len; one
  # that is absent refuses `preparation-staged-object-missing: <content hash>`. A decision that
  # stages no Provenance object is still elected in /2, byte for byte as before.
  - name: ekr.store.StagedPublicationObject
    kind: struct
    fields:
      - name: storage_class
        type: ekr.store.StorageClass
      - name: stored_at
        type: Timestamp
      - name: byte_len
        type: Integer

  - name: ekr.store.PublicationPreparationFormatV1
    kind: enum
    variants:
      - ekr.publication-preparation/1
      - ekr.publication-preparation/2
      - ekr.publication-preparation/3

  - name: ekr.store.PublicationPreparationV1
    kind: struct
    fields:
      - name: format
        type: ekr.store.PublicationPreparationFormatV1
      - name: command_key
        type: ekr.store.PublicationCommandKey
      - name: input_hash
        type: ekr.kernel.ContentHash
      - name: decision
        type: ekr.store.Publication
      - name: attempt_number
        type: Integer
      - name: previous_attempt_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: native_request
        type: ekr.store.NativePublicationRequest
      - name: native_fingerprint
        type: String

  # Operational resolution; UnknownCommit does not move a domain transaction state.
  - name: ekr.store.PublicationResolution
    kind: enum
    variants: [Written, AlreadyRecorded, Conflict, UnknownCommit]

entities:
  # Design § 57. Identity is the content hash; two writes of the same bytes are one object.
  - name: ekr.store.StoredObject
    identity:
      name: content_hash
      type: ekr.kernel.ContentHash
    fields:
      - name: storage_class
        type: ekr.store.StorageClass
      - name: byte_len
        type: Integer
      - name: stored_at
        type: Timestamp
    invariants:
      - byte_len >= 0
    lifecycle:
      initial: Stored
      states: [Stored]
      terminal: [Stored]

events:
  # Private selection metadata, backend schema1; payload is a private native blob.
  - name: ekr.store.PublicationPrepared
    fields:
      - name: preparation_hash
        type: ekr.kernel.ContentHash
      - name: attempt_number
        type: Integer
      - name: previous_attempt_hash
        type: Optional<ekr.kernel.ContentHash>

  - name: ekr.store.CheckpointWritten
    fields:
      - name: checkpoint_hash
        type: ekr.kernel.ContentHash
      - name: covered
        type: Integer
      - name: binding
        type: ekr.kernel.ContentHash

  # Added 2026-09-21 in wave p1-05. A StoredObject's identity is its content hash, so two writes
  # of the same bytes are one object — and the two writes may ask for different retention. The
  # store records the strongest class ever requested rather than the first or the last, so that
  # bytes canonical state depends on are never freely deletable because an earlier caller wanted
  # less. The raise is an event rather than an update because the object store is append-only and
  # the class has to survive a reopen.
  #
  # `from` and `to` are both carried so a reader can see the ladder was climbed and not descended.
  - name: ekr.store.ObjectRetentionRaised
    # Unchanged event: backend schema1 remains the exact current discriminator.
    fields:
      - name: content_hash
        type: ekr.kernel.ContentHash
      - name: from
        type: ekr.store.StorageClass
      - name: to
        type: ekr.store.StorageClass

  # Added 2026-09-21 in wave p1-05, correction round 2, by story:eventlog-store. The event above
  # was declared and this one was not, and they are written by the same code path — so the guard
  # that holds one to its declaration found the other missing. Both are bytes a later reader gets.
  #
  # `content_hash` is redundant with the stream this event is read from, and is carried for the
  # reason the raise carries it: a body that only makes sense beside its stream stops making sense
  # the moment anything exports one.
  # §89/91 activation: bytes are atomically published through provider blob bindings addressed
  # by content_hash. This event is metadata only; standalone put-then-append is not an atomic
  # publication. Generic storage carries no kernel receipt or validation-authority semantics.
  # Metadata-only ObjectStored uses backend schema2. Original inline ObjectStored/schema1
  # is frozen verification/migration-only after activation. Dispatch by exact event name and
  # backend schema; refuse unknown versions, inline/schema2, metadata/schema1, extra/missing
  # semantic fields and mismatched/missing blob bindings. Do not infer a format from bytes absence.
  # ObjectRetentionRaised stays schema1; this is a per-event version rule, not a blanket bump.
  # Design §100.3: the preserving migration (`ekr migrate --to <path>`) is the one reader of the
  # frozen schema1 body. It verifies the inline bytes against content_hash and byte_len and writes
  # the object into the migration's new destination store as schema2 metadata and a blob, with its
  # class, retention raises and stored_at. The provider log is append-only and the source is left
  # untouched, so an inline record is never rewritten in place; current reads of the source keep
  # refusing it as before.
  - name: ekr.store.ObjectStored
    fields:
      - name: content_hash
        type: ekr.kernel.ContentHash
      - name: storage_class
        type: ekr.store.StorageClass
      - name: byte_len
        type: Integer
      - name: stored_at
        type: Timestamp

# Held bytes and a replaced store. Decided 2026-10-01 (store audit) for
# task:sqlite-store-replaced-in-place and task:held-bytes-notice-deleted-blobs together: a live
# handle never answers from bytes a fresh handle would refuse. Three rules hold it.
#
# 1. A store file replaced in place is refused by name. Replaced means the SQLite database file at
#    the handle's path no longer has the device and inode the handle opened, or its log header is
#    not the one the handle opened: the log's first event, read from the file alone, is not the
#    one the handle's own connection begins with, or the newest event the handle saw in the file
#    is no longer at its place. The store checks before every read and write: one stat while the
#    file is unchanged, and the header read from the file (immutable: no lock, no WAL) when it has
#    changed; at open it checks once. Only positive evidence proves a replacement: another device
#    or inode, or a header that reads successfully while no checkpoint runs across the read (the
#    WAL index's checkpoint record unchanged and idle, the stat unchanged) and differs from the
#    one recorded. A read that errs or does not settle is retried a bounded number of times and
#    then proves nothing; a damaged database is refused by the read that follows, under its own
#    code. The refusal is ekr.store.StoreReplaced, named
#    `store-replaced` (Rust StoreError::Replaced). `ekr session`, `ekr mcp` and `ekr view` open the
#    store at the path again on it, as on a history the File provider refuses as diverged, and
#    answer from what is there; one that does not open is `store-replaced` there too. A File store
#    replaced in place is the provider's own divergence refusal.
# 2. Any operation that withdraws retained bytes (a redaction, a deletion, a retention lowering)
#    appends an event to the object's stream, so a handle holding the object sees the stream move
#    when it looks through the log for its held objects' streams, and reads that stream again. An
#    object's stream is judged before its bytes, so a stream recording what the store does not
#    read is refused by the holding handle exactly as by a fresh one. Nothing in the runtime
#    redacts, deletes or forgets retained bytes in place without that event (the provider calls
#    redact, delete_blob and forget_tenant, in any form): its one provider deletion is
#    of the replay checkpoint's cache blob, after the pointer event naming its successor, and a
#    source guard holds that list. Canonical objects are never withdrawn (invariant 5), and the
#    memo does not look for them.
# 3. Not seen, recorded rather than hidden: a redaction or blob deletion made through a provider
#    directly, outside the runtime, without that event; a backup of the same store restored over
#    its SQLite file while the handle had not seen any event in the file the backup lacks; and the
#    replaced database's WAL beside the file, which SQLite writes into the file at the path when
#    the replaced connection closes. Copy a database over a live store only with its -wal and -shm
#    files, or with no handle open.
errors:
  - name: ekr.store.StoreReplaced
    summary: >-
      The SQLite database file at the store's path is no longer the one this handle opened;
      nothing was answered or written through the handle.
    fields:
      - name: path
        type: String
      - name: reason
        type: String
