domain: ekr.store

# Hosted provider operational contract (2026-10-03): PostgreSQL reuses the same
# retained events, objects and kernel admission as native providers. Schema setup
# is explicit; hosted application open uses verified TLS and bounded connections.
# Initial cross-provider copy captures one consistent SQLite image before inventory,
# preserves all logical revision roots and retained evidence, and cannot be read as
# complete until admitted replay and equivalence checks finish. Configuration is a
# provider input, not a knowledge entity. Acceptance is currently unexecuted:
# story:hosted-postgres-snapshot names the required real-provider cases.
#
# Amended 2026-10-08 (design § 107.2, task:postgres-source-copy): a PostgreSQL store's inventory
# is read under one provider capture (eventlog `ConsistentTenantCapture`) and never from its
# change feed, so PostgreSQL is a copy source for a stage as a SQLite image is. The inventory no
# longer refuses `postgres-inventory-requires-capture`. A writing handle first ensures the
# tenant's capture identity, as the emptiness check does; a reading handle whose tenant has none
# refuses as read-only. A copy reads its source once (`Commit::capture`) and then only writes the
# destination (`CapturedStore::copy_into`). Held by unit C's cases in
# `crates/ekr-kernel/tests/hosted_postgres.rs` where the PostgreSQL tests run.

summary: >-
  Persistence through eventlog. A committed revision is an event; the graph is a fold; snapshots
  are eventlog snapshots; bytes are content-addressed and carry a storage class that decides their
  retention. Design § 34, § 37, § 57. Reclamation (§ 38–39) arrives in P6 with the commands that
  move an object toward deletion.

naming:
  wire: store
  display: Store

types:
  # Design § 37.
  - name: ekr.store.StorageClass
    kind: enum
    variants:
      - Canonical
      - Provenance
      - Incubating
      - Cache
      - Ephemeral

  # DESIGN 94: private recovery carriers, not canonical transaction states.
  # Runtime recovery controls remain unexecuted at declaration.
  # `PublishStage` (design § 107.5, unit P) is a stage's publication. It is admitted only in an
  # ekr.store.StagePublicationCommandKey, under `ekr.publication-preparation/4`; a
  # PublicationCommandKey carrying it is refused `preparation-command-key`, so `/1`–`/3` never
  # name it.
  - name: ekr.store.PublicationCommandKind
    kind: enum
    variants: [Bootstrap, Propose, Validate, Commit, PublishStage]

  - name: ekr.store.PublicationCommandKey
    kind: struct
    fields:
      - name: kind
        type: ekr.store.PublicationCommandKind
      - name: transaction_id
        type: Optional<ekr.kernel.TransactionId>
      - name: predecessor_event_id
        type: Optional<ekr.kernel.EventId>
      - name: predecessor_record_hash
        type: Optional<ekr.kernel.ContentHash>

  - name: ekr.store.PublicationObject
    kind: struct
    fields:
      - name: storage_class
        type: ekr.store.StorageClass
      - name: stored_at
        type: Timestamp
      - name: bytes
        type: Bytes

  - name: ekr.store.Publication
    kind: struct
    fields:
      - name: event
        type: ekr.kernel.RevisionEventV2
      - name: objects
        type: Map<String, ekr.store.PublicationObject>
      - name: expected_version
        type: Integer

  - name: ekr.store.NativeExpectedKind
    kind: enum
    variants: [Any, NoStream, Exact]

  - name: ekr.store.NativeExpected
    kind: struct
    fields:
      - name: kind
        type: ekr.store.NativeExpectedKind
      - name: version
        type: Optional<Integer>

  - name: ekr.store.NativeStreamId
    kind: struct
    fields:
      - name: tenant
        type: String
      - name: stream_type
        type: String
      - name: stream_id
        type: String

  - name: ekr.store.NativeNewEvent
    kind: struct
    fields:
      - name: name
        type: String
      - name: schema_version
        type: Integer
      - name: data
        type: Bytes

  - name: ekr.store.NativeStreamAppend
    kind: struct
    fields:
      - name: stream
        type: ekr.store.NativeStreamId
      - name: expected
        type: ekr.store.NativeExpected
      - name: events
        type: List<ekr.store.NativeNewEvent>

  - name: ekr.store.NativeClaim
    kind: struct
    fields:
      - name: scope
        type: String
      - name: key
        type: String
      - name: digest
        type: String

  - name: ekr.store.NativeCommandMeta
    kind: struct
    fields:
      - name: idempotency_key
        type: String
      - name: request_hash
        type: String
      - name: subject
        type: String
      - name: actor
        type: String
      - name: request_id
        type: String
      - name: trace_id
        type: String
      - name: causation_id
        type: Optional<String>
      - name: causation_depth
        type: Integer
      - name: occurred_at_unix_nanos
        type: String
      - name: occurred_at_offset_seconds
        type: Integer
      - name: claim
        type: Optional<ekr.store.NativeClaim>

  - name: ekr.store.NativeBlobWrite
    kind: struct
    fields:
      - name: digest
        type: String
      - name: bytes
        type: Bytes

  - name: ekr.store.NativePublicationRequest
    kind: struct
    fields:
      - name: tenant
        type: String
      - name: appends
        type: List<ekr.store.NativeStreamAppend>
      - name: meta
        type: ekr.store.NativeCommandMeta
      - name: blobs
        type: List<ekr.store.NativeBlobWrite>

  # Design §100.2, added 2026-09-29 by story:seed-envelope-v3-references-payloads. A decision that
  # stages a Provenance object (an evidence payload) is elected in ekr.publication-preparation/3:
  # the /2 layout, except that each Provenance object is this carrier, without its bytes. The
  # preparation's own atomic group binds those bytes under the object's own content address, the
  # address its publication binds the same bytes to again, so the bytes are retained once. Until
  # that publication no ObjectStored metadata names them and no object read finds them. Reading a
  # /3 attempt back reads each staged binding and checks it against the address and byte_len; one
  # that is absent refuses `preparation-staged-object-missing: <content hash>`. A decision that
  # stages no Provenance object is still elected in /2, byte for byte as before.
  - name: ekr.store.StagedPublicationObject
    kind: struct
    fields:
      - name: storage_class
        type: ekr.store.StorageClass
      - name: stored_at
        type: Timestamp
      - name: byte_len
        type: Integer

  - name: ekr.store.PublicationPreparationFormatV1
    kind: enum
    variants:
      - ekr.publication-preparation/1
      - ekr.publication-preparation/2
      - ekr.publication-preparation/3

  - name: ekr.store.PublicationPreparationV1
    kind: struct
    fields:
      - name: format
        type: ekr.store.PublicationPreparationFormatV1
      - name: command_key
        type: ekr.store.PublicationCommandKey
      - name: input_hash
        type: ekr.kernel.ContentHash
      - name: decision
        type: ekr.store.Publication
      - name: attempt_number
        type: Integer
      - name: previous_attempt_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: native_request
        type: ekr.store.NativePublicationRequest
      - name: native_fingerprint
        type: String

  # Operational resolution; UnknownCommit does not move a domain transaction state.
  - name: ekr.store.PublicationResolution
    kind: enum
    variants: [Written, AlreadyRecorded, Conflict, UnknownCommit]

  # Design § 107.5 (unit P). A stage's publication is elected in a preparation slot keyed by
  # Publish and the stage id, one slot per stage: `kind` is always PublishStage.
  - name: ekr.store.StagePublicationCommandKey
    kind: struct
    fields:
      - name: kind
        type: ekr.store.PublicationCommandKind
      - name: stage_id
        type: ekr.store.StageId

  # One object a stage's publication appends to the store: its first class in the stage, the class
  # of each retention raise the stage recorded after it, in order, its original `stored_at` and its
  # bytes. The append group stores it at `storage_class` and raises it through `raised_to` where
  # the store does not hold it, and raises it from the class the store holds through every later
  # rung where the store holds it weaker; it appends nothing where the store holds it as strongly.
  - name: ekr.store.StagePublicationObject
    kind: struct
    fields:
      - name: storage_class
        type: ekr.store.StorageClass
      - name: raised_to
        type: List<ekr.store.StorageClass>
      - name: stored_at
        type: Timestamp
      - name: bytes
        type: Bytes

  # The decision of a stage's publication (design § 107.5): the whole suffix. `occurrences` are the
  # stage's revision-stream occurrences after its copy, derived again for the store's lineage, in
  # order; `objects` every object they and the run's other writes need, by content hash: each
  # occurrence's record, each payload a commit added, and every other object the stage stored or
  # raised after its copy, never a record of the stage's own lineage (its seed envelope, a record
  # the publication derives again, its migration report or its completion receipt).
  # `expected_version` is the store's revision-stream version the attempt's group expects: the
  # version read at the capture, or, for a successor after `stream-moved`, the version read then.
  # A successor keeps every other member. `head`, `published_first` and `published_last` are what
  # ekr.store.StagePublished records: the store's head after the group, and the first and last
  # revision it adds, absent where the run committed nothing.
  - name: ekr.store.StagePublication
    kind: struct
    fields:
      - name: stage_id
        type: ekr.store.StageId
      - name: base
        type: ekr.kernel.RevisionNumber
      - name: expected_version
        type: Integer
      - name: occurrences
        type: List<ekr.kernel.RevisionEventV2>
      - name: objects
        type: Map<String, ekr.store.StagePublicationObject>
      - name: head
        type: ekr.kernel.RevisionNumber
      - name: published_first
        type: Optional<ekr.kernel.RevisionId>
      - name: published_last
        type: Optional<ekr.kernel.RevisionId>

  # Design § 107.5. A new format, used by the PublishStage kind only; `/1`–`/3`, their kinds and
  # every retained preparation are read exactly as before. An earlier binary never reads a `/4`
  # slot by its key, since no earlier command has one; its inventory, which reads every slot's
  # newest record without its format, refuses a `/4` record `inventory-preparation-unreadable`,
  # because the decision holds no single occurrence (read from that inventory's source at the
  # commit before unit P; unexecuted).
  - name: ekr.store.PublicationPreparationFormatV4
    kind: enum
    variants:
      - ekr.publication-preparation/4

  # An elected attempt of a stage's publication. Its native request is the whole append group in
  # the store's tenant: the revision stream at `decision.expected_version` with every occurrence,
  # each object stream it appends to (absent, or at the version whose class it raises), and the
  # stage record's stream at its Sealing version with ekr.store.StagePublished, then every blob
  # binding. The record writes byte strings as base64 and omits the blob list, which is exactly
  # the decision's objects in address order, as `/2` does. Inventory resolution of a `/4` slot is
  # design § 107.5's: published, abandoned, or definitively conflicted.
  - name: ekr.store.PublicationPreparationV4
    kind: struct
    fields:
      - name: format
        type: ekr.store.PublicationPreparationFormatV4
      - name: command_key
        type: ekr.store.StagePublicationCommandKey
      - name: input_hash
        type: ekr.kernel.ContentHash
      - name: decision
        type: ekr.store.StagePublication
      - name: attempt_number
        type: Integer
      - name: previous_attempt_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: native_request
        type: ekr.store.NativePublicationRequest
      - name: native_fingerprint
        type: String

  # Design § 107 (2026-10-07, story:a-run-is-staged-and-published-whole). A stage's identity.
  # Begin mints it, from the `Id::mint()` family as `ekr mint` mints every other id, and returns
  # it; the caller passes it on as `EKR_STAGE=<id>` or `--stage <id>` and never supplies one.
  #
  # The stage's Eventlog tenant is derived from the store's own tenant (the one the host
  # configuration names, ekr.kernel.CliHostConfigurationV1.tenant) and this id, deterministically
  # (`ekr_store::stage_tenant`): `ekr.stage:<store>:<stage>`, where `ekr.stage:` is the marker
  # reserved to stage tenants, `<store>` the 64 lowercase hex characters of the store tenant's
  # payload address (`ContentHash::of_bytes`) and `<stage>` this id in its lowercase hyphenated
  # form. The same store tenant and id give the same name; different ids give different names. The
  # name is 111 ASCII graphic bytes for every store tenant, however long, so it is valid under
  # Eventlog's TenantId rules (non-empty, at most 512 bytes, eventlog-core `MAX_FIELD_LEN`; ASCII
  # graphic or space: `validate_field`).
  #
  # It is distinct from every store tenant: a tenant that contains the marker anywhere is refused
  # as a store's tenant by every provider's open, before anything is read or created
  # (ekr.store.StageTenantReserved, `stage-tenant-reserved`; `Runtime`'s openers, which every host
  # configuration opens through), so neither this store's own tenant nor another store's can be
  # produced by the derivation. That refusal is the one refusal design § 107 adds for an existing
  # store. Held by `a_stage_tenant_is_never_a_store_tenant` in `crates/ekr-kernel/tests/stage.rs`,
  # on File and SQLite and, where the PostgreSQL tests run, on PostgreSQL.
  - name: ekr.store.StageId
    kind: newtype
    of: Uuid

  # Design § 107. A store's identity: the Eventlog tenant it is opened with, the one its host
  # configuration names. Unique among the tenants of one provider location; two stores at two
  # paths may carry the same tenant.
  - name: ekr.store.StoreTenant
    kind: newtype
    of: String

  # The provider a store is opened on, as the CLI's `--backend` names it (`file`, `sqlite`,
  # `postgres`).
  - name: ekr.store.ProviderKind
    kind: enum
    variants: [File, Sqlite, Postgres]

  # What begin, seal, publish and abandon answer: the stage record as the command left it. For a
  # publication, `published_first` and `published_last` are the first and last revision it
  # published into the store, by id, and `occurrences` how many revision-stream occurrences it
  # appended; a publication of no commit has neither id. A retry that replays returns the original
  # value. The printed document's format literal, if any, is unit L's to name with the verbs.
  - name: ekr.store.StageResult
    kind: struct
    fields:
      - name: stage_id
        type: ekr.store.StageId
      - name: state
        type: ekr.store.Stage.State
      - name: base
        type: ekr.kernel.RevisionNumber
      - name: base_revision
        type: ekr.kernel.RevisionId
      - name: published_first
        type: Optional<ekr.kernel.RevisionId>
      - name: published_last
        type: Optional<ekr.kernel.RevisionId>
      - name: occurrences
        type: Optional<Integer>

entities:
  # Design § 57. Identity is the content hash; two writes of the same bytes are one object.
  - name: ekr.store.StoredObject
    identity:
      name: content_hash
      type: ekr.kernel.ContentHash
    fields:
      - name: storage_class
        type: ekr.store.StorageClass
      - name: byte_len
        type: Integer
      - name: stored_at
        type: Timestamp
    invariants:
      - byte_len >= 0
    lifecycle:
      initial: Stored
      states: [Stored]
      terminal: [Stored]

  # Design § 107. A store: one Eventlog tenant on one provider. Minimal on purpose: it carries
  # nothing the specification would have to keep in step with its head, which is read from its
  # revision stream (ekr.kernel.CurrentRevision), not declared here. A store has many stages;
  # each stage references the one store it was begun from.
  - name: ekr.store.Store
    identity:
      name: tenant
      type: ekr.store.StoreTenant
    fields:
      - name: provider
        type: ekr.store.ProviderKind
    lifecycle:
      initial: Provisioned
      states: [Provisioned]
      terminal: [Provisioned]

  # Design § 107. A stage: its own Eventlog tenant in the same store, begun by a preserving copy of
  # the store at its head (§§ 100.3, 105.2), written by a run's one-shot verbs, then published into
  # the store whole or abandoned whole. `base` and `base_revision` are the store's head when the
  # stage was begun.
  #
  # The record is a private stream per stage in the store's own tenant, outside the revision
  # stream, so writing it never moves `ekr head`. It holds only the small events below — begun,
  # sealed, published, abandoned — and no blob. It stays after the stage's tenant is forgotten, as
  # the stage's history: it is what answers a stage already published or abandoned, and what a
  # handle joined to a stage reads before and after every write (held bytes, rule 2, below).
  #
  # Sealing fences joined writers from a publication. A publication first seals the stage and
  # captures its suffix only after the seal; a verb joined to a Sealing, Published or Abandoned
  # stage is refused ekr.store.StageStateConflict. A joined write reads the record again after its
  # own write lands: Begun then means the write landed before the seal, so the capture holds it;
  # anything else refuses the write by name, and the published range says whether it is in.
  #
  # A stage's revisions are provisional: they are not the store's committed revisions, and become
  # committed only when a publication derives them again into the store's lineage.
  #
  # `published_revisions` are the store's revisions the publication added, in order. The record
  # retains only the first and last (ekr.store.StagePublished); the list is read from the store as
  # the revisions from the first to the last, contiguous because one append group published them.
  #
  # The stage's own tenant is not a field: it is derived from `store` and `stage_id` (see
  # ekr.store.StageId). ekr.store.StageBegun records the name begin wrote, and the forgetting takes
  # it from that record rather than deriving it again.
  - name: ekr.store.Stage
    identity:
      name: stage_id
      type: ekr.store.StageId
    fields:
      - name: store
        type: ekr.store.StoreTenant
      - name: base
        type: ekr.kernel.RevisionNumber
      - name: base_revision
        type: ekr.kernel.RevisionId
      - name: published_revisions
        type: List<ekr.kernel.RevisionId>
    relations:
      # The store the stage was begun from, whose tenant holds the stage's record. One per stage;
      # a store has many stages, and outlives them: references, one.
      - name: store
        kind: references
        target: ekr.store.Store
        cardinality: one
        via: store
      # The store's revision the stage was begun at. It outlives the stage: references, one.
      - name: base_revision
        kind: references
        target: ekr.kernel.Revision
        cardinality: one
        via: base_revision
      # The store's revisions a publication added. They are committed revisions of the store and
      # outlive the stage: references, many.
      - name: published
        kind: references
        target: ekr.kernel.Revision
        cardinality: many
        via: published_revisions
      # The stage owns its own lineage, the provisional revisions and transactions in its tenant:
      # forgetting the stage removes them. Not expressible as a relations entry: `owns` needs a
      # field on the owned entity typed by ekr.store.StageId, which neither ekr.kernel.Revision
      # nor ekr.kernel.GraphTransaction has (the tenant is the link, not a field), and
      # ekr.kernel.GraphTransaction already has an owner (ekr.kernel.Agent.proposals).
    lifecycle:
      initial: Begun
      states: [Begun, Sealing, Published, Abandoned]
      terminal: [Published, Abandoned]
      transitions:
        - name: seal
          from: [Begun]
          to: Sealing
        - name: publish
          from: [Sealing]
          to: Published
        - name: abandon
          from: [Begun, Sealing]
          to: Abandoned

events:
  # Private selection metadata, backend schema1; payload is a private native blob.
  - name: ekr.store.PublicationPrepared
    fields:
      - name: preparation_hash
        type: ekr.kernel.ContentHash
      - name: attempt_number
        type: Integer
      - name: previous_attempt_hash
        type: Optional<ekr.kernel.ContentHash>

  - name: ekr.store.CheckpointWritten
    fields:
      - name: checkpoint_hash
        type: ekr.kernel.ContentHash
      - name: covered
        type: Integer
      - name: binding
        type: ekr.kernel.ContentHash

  # Added 2026-09-21 in wave p1-05. A StoredObject's identity is its content hash, so two writes
  # of the same bytes are one object — and the two writes may ask for different retention. The
  # store records the strongest class ever requested rather than the first or the last, so that
  # bytes canonical state depends on are never freely deletable because an earlier caller wanted
  # less. The raise is an event rather than an update because the object store is append-only and
  # the class has to survive a reopen.
  #
  # `from` and `to` are both carried so a reader can see the ladder was climbed and not descended.
  - name: ekr.store.ObjectRetentionRaised
    # Unchanged event: backend schema1 remains the exact current discriminator.
    fields:
      - name: content_hash
        type: ekr.kernel.ContentHash
      - name: from
        type: ekr.store.StorageClass
      - name: to
        type: ekr.store.StorageClass

  # Added 2026-09-21 in wave p1-05, correction round 2, by story:eventlog-store. The event above
  # was declared and this one was not, and they are written by the same code path — so the guard
  # that holds one to its declaration found the other missing. Both are bytes a later reader gets.
  #
  # `content_hash` is redundant with the stream this event is read from, and is carried for the
  # reason the raise carries it: a body that only makes sense beside its stream stops making sense
  # the moment anything exports one.
  # §89/91 activation: bytes are atomically published through provider blob bindings addressed
  # by content_hash. This event is metadata only; standalone put-then-append is not an atomic
  # publication. Generic storage carries no kernel receipt or validation-authority semantics.
  # Metadata-only ObjectStored uses backend schema2. Original inline ObjectStored/schema1
  # is frozen verification/migration-only after activation. Dispatch by exact event name and
  # backend schema; refuse unknown versions, inline/schema2, metadata/schema1, extra/missing
  # semantic fields and mismatched/missing blob bindings. Do not infer a format from bytes absence.
  # ObjectRetentionRaised stays schema1; this is a per-event version rule, not a blanket bump.
  # Design §100.3: the preserving migration (`ekr migrate --to <path>`) is the one reader of the
  # frozen schema1 body. It verifies the inline bytes against content_hash and byte_len and writes
  # the object into the migration's new destination store as schema2 metadata and a blob, with its
  # class, retention raises and stored_at. The provider log is append-only and the source is left
  # untouched, so an inline record is never rewritten in place; current reads of the source keep
  # refusing it as before.
  - name: ekr.store.ObjectStored
    fields:
      - name: content_hash
        type: ekr.kernel.ContentHash
      - name: storage_class
        type: ekr.store.StorageClass
      - name: byte_len
        type: Integer
      - name: stored_at
        type: Timestamp

  # Design § 107. The stage record's events: a private stream per stage in the store's own tenant,
  # small and without blobs, kept after the stage's tenant is forgotten as the stage's history.
  # Each is one command's summary: the copy a begin writes into the stage's tenant and the suffix a
  # publication appends to the store are the kernel's occurrences and the store's object events,
  # as an apply-extraction's commits are, and their number is the run's.
  #
  # `tenant` is the stage's tenant as begin derived and wrote it; every later forgetting takes it
  # from here.
  - name: ekr.store.StageBegun
    fields:
      - name: stage_id
        type: ekr.store.StageId
      - name: tenant
        type: String
      - name: base
        type: ekr.kernel.RevisionNumber
      - name: base_revision
        type: ekr.kernel.RevisionId

  # The stage accepts no further write; the suffix a publication captures after this is final.
  - name: ekr.store.StageSealed
    fields:
      - name: stage_id
        type: ekr.store.StageId
      - name: base
        type: ekr.kernel.RevisionNumber

  # `occurrences` counts the revision-stream occurrences the publication appended after `base`:
  # every proposal, validation, rejection, stale record and commit the run made, derived again for
  # the store's lineage. `published_first` and `published_last` are the first and last revision it
  # added, by id, absent where the run committed nothing; `head` is the store's head after it.
  - name: ekr.store.StagePublished
    fields:
      - name: stage_id
        type: ekr.store.StageId
      - name: base
        type: ekr.kernel.RevisionNumber
      - name: head
        type: ekr.kernel.RevisionNumber
      - name: published_first
        type: Optional<ekr.kernel.RevisionId>
      - name: published_last
        type: Optional<ekr.kernel.RevisionId>
      - name: occurrences
        type: Integer

  - name: ekr.store.StageAbandoned
    fields:
      - name: stage_id
        type: ekr.store.StageId

# Held bytes and a replaced store. Decided 2026-10-01 (store audit) for
# task:sqlite-store-replaced-in-place and task:held-bytes-notice-deleted-blobs together: a live
# handle never answers from bytes a fresh handle would refuse. Three rules hold it.
#
# 1. A store file replaced in place is refused by name. Replaced means the SQLite database file at
#    the handle's path no longer has the device and inode the handle opened, or the file holds an
#    event this handle's log does not. The store checks before every read and write: one stat
#    while the file is unchanged, and, when it has changed, the tenant's first and newest events
#    read from the file alone (immutable: no lock, no WAL); at open it checks once. Only positive
#    evidence proves a replacement: another device or inode, or a file read that succeeds and
#    shows an event this handle's own log does not hold at that position, shown again by a second
#    read. A read made while a checkpoint writes the file can err or mix two versions of this same
#    database, whose events are all this log's, so it proves nothing; an erring read is retried a
#    bounded number of times and then proves nothing either, and a damaged database is refused by
#    the read that follows, under its own code. No file of a store is opened outside SQLite in a
#    process holding a SQLite connection on it: closing any descriptor of a file releases every
#    POSIX record lock the process holds on it, and a dropped lock on the -shm lets another process
#    truncate the -shm the connection has mapped (SIGBUS). The refusal is ekr.store.StoreReplaced,
#    named
#    `store-replaced` (Rust StoreError::Replaced). `ekr session`, `ekr mcp` and `ekr view` open the
#    store at the path again on it, as on a history the File provider refuses as diverged, and
#    answer from what is there; one that does not open is `store-replaced` there too. A File store
#    replaced in place is the provider's own divergence refusal.
# 2. Any operation that withdraws retained bytes (a redaction, a deletion, a retention lowering)
#    appends an event to the object's stream, so a handle holding the object sees the stream move
#    when it looks through the log for its held objects' streams, and reads that stream again. An
#    object's stream is judged before its bytes, so a stream recording what the store does not
#    read is refused by the holding handle exactly as by a fresh one. Nothing in the runtime
#    redacts, deletes or forgets retained bytes in place without that event (the provider calls
#    redact, delete_blob and forget_tenant, in any form): its one provider deletion is
#    of the replay checkpoint's cache blob, after the pointer event naming its successor, and a
#    source guard holds that list. Canonical objects are never withdrawn (invariant 5), and the
#    memo does not look for them.
#    Amended 2026-10-07 (design § 107.7): `forget_tenant` is admitted for a stage's own tenant and
#    for nothing else. The store's own tenant, the one its host configuration names, is never
#    forgotten, and the derivation of a stage's tenant can never produce a store's tenant
#    (ekr.store.StageId). A forgotten tenant leaves no stream to append the event to, so the event
#    a holding handle looks for is in the store's own tenant: the stage record's
#    ekr.store.StagePublished or ekr.store.StageAbandoned, appended before the tenant is forgotten.
#    A handle joined to a stage reads its stage's record before every read and write, as rule 1's
#    check runs, and refuses ekr.store.StageStateConflict once the stage is not Begun, as a fresh
#    handle joining it does; rule 1 alone cannot see a forgotten stage, because a tenant that
#    holds no event is in rule 3's list. A stage's revisions are provisional, not the store's
#    committed revisions, and nothing in the store's lineage names a record of the stage's, since
#    a publication derives every record it appends again: forgetting a stage's tenant reclaims no
#    committed revision and no Canonical object of the store, and the sentence above about
#    Canonical objects is about the store's own tenant.
#    The source guard is `crates/ekr-store/tests/eventlog_object_memo.rs`,
#    `no_source_withdraws_retained_bytes_without_an_event_on_the_object_stream`. Its `allowed`
#    list is `ekr-store/src/eventlog.rs` 1, `ekr-store/src/eventlog_reads.rs` 5 (compiled only
#    under `cfg(test)`) and, since unit P (2026-10-08), `ekr-store/src/stage_record.rs` 1: the one
#    product call of `forget_tenant`, and its doc comment names it. That source takes the tenant
#    from the stage's ekr.store.StageBegun, forgets it only for a Published or Abandoned stage,
#    and refuses (`stage-tenant-not-derived`, nothing forgotten) unless it carries the stage marker,
#    equals the tenant derived from the store's tenant and the stage id, and is not the store's
#    own. Held by `the_store_tenant_is_never_forgotten` (`crates/ekr-kernel/tests/stage.rs`), whose
#    forged records name the store's tenant, another store's, and two other live stages'; its
#    forged part runs on SQLite only.
# 3. Not seen, recorded rather than hidden: a redaction or blob deletion made through a provider
#    directly, outside the runtime, without that event; a backup of the same store restored over
#    its SQLite file, whose first and newest events this log holds; a database whose file holds no
#    event yet copied over the store; and the replaced database's WAL beside the file, which SQLite writes into the file at the path when
#    the replaced connection closes. Copy a database over a live store only with its -wal and -shm
#    files, or with no handle open.
errors:
  - name: ekr.store.StoreReplaced
    summary: >-
      The SQLite database file at the store's path is no longer the one this handle opened;
      nothing was answered or written through the handle.
    fields:
      - name: path
        type: String
      - name: reason
        type: String

  # Design § 107. The stage's named refusals. Every one writes nothing: no stage record, no
  # occurrence or object in the store or in the stage, and no forgetting.
  - name: ekr.store.StageNotFound
    summary: No stage carries the requested id in this store; nothing was read or written.
    fields:
      - name: stage_id
        type: ekr.store.StageId

  # The stage is not in a state the command or the joined verb acts from; `state` says which, and
  # the refusal is named by it: Begun `stage-not-sealed` (a publish of a stage never sealed),
  # Sealing `stage-sealed`, Published `stage-already-published`, Abandoned
  # `stage-already-abandoned`. Every verb joined to a stage that is not Begun answers it before
  # every read and write; a write that landed meanwhile answers ekr.store.StageWriteLanded.
  - name: ekr.store.StageStateConflict
    summary: The stage is not in a state this acts from, so nothing was sealed, published, abandoned, read or written through it.
    fields:
      - name: stage_id
        type: ekr.store.StageId
      - name: state
        type: ekr.store.Stage.State

  # Design § 107.3, unit P. A write joined to the stage passed its check while the stage was Begun,
  # its append landed, and the stage record read again after it is no longer Begun: the stage was
  # sealed, published or abandoned meanwhile. The write is refused, `stage-write-landed`, and is not
  # reported successful. `event_ids` are the revision-stream occurrences it landed, empty for a
  # write that landed none (an election, an object, a checkpoint pointer): whether those are in the
  # publication is read from the store by these ids once the stage is Published. Where the stage
  # is Published or Abandoned, the stage's tenant is forgotten again before the refusal, so a late
  # write leaves nothing behind.
  - name: ekr.store.StageWriteLanded
    summary: A write joined to the stage landed after the stage left Begun; it is refused, and the store says by its event ids whether the publication holds it.
    fields:
      - name: stage_id
        type: ekr.store.StageId
      - name: state
        type: ekr.store.Stage.State
      - name: event_ids
        type: List<ekr.kernel.EventId>

  # A store's head, here and in every stage command, is the number of its last committed revision
  # (`ekr head`), never the version of its revision stream: a proposal, a validation, a rejection
  # or a stale record appends to that stream and does not move the head. `current` is the head
  # when the refusal was decided, before the append or at a definitive conflict of it.
  - name: ekr.store.StageHeadMoved
    summary: >-
      The store's head is not the expected head, or not the stage's base; the suffix is never
      rebased. Nothing was appended to the store.
    fields:
      - name: stage_id
        type: ekr.store.StageId
      - name: expected
        type: ekr.kernel.RevisionNumber
      - name: base
        type: ekr.kernel.RevisionNumber
      - name: current
        type: ekr.kernel.RevisionNumber

  # A publication's append group expects the store's revision stream at the version the
  # publication read when it captured the suffix (design § 107.4). Another writer appended to that
  # stream after the capture, and the head did not move: a proposal, a validation, a rejection or a
  # stale record, which commits nothing. The stage stays Sealing; a publish retried with the same
  # expected head prepares its slot's successor attempt (design § 94.2) at the stream's current
  # version, with the same suffix, which the store's authority checks again: where the occurrence
  # decides a transaction the suffix decides too, the retry is refused ekr.store.StageSuffixRefused.
  - name: ekr.store.StageStreamMoved
    summary: >-
      The store's revision stream moved after the publication captured it, and its head did not;
      nothing was appended and the stage stays Sealing.
    fields:
      - name: stage_id
        type: ekr.store.StageId
      - name: captured
        type: Integer
      - name: current
        type: Integer

  # An object stream the publication's append group expects (absent for an object the store did
  # not hold at the capture, at its version for one whose retention it raises) moved after the
  # capture: another writer stored or raised the same content-addressed object. The stage stays
  # Sealing; a publish retried with the same expected head prepares its slot's successor attempt
  # with that object's append rebuilt against what the store now holds (design § 94.2).
  - name: ekr.store.StageObjectMoved
    summary: >-
      An object the publication appends moved in the store after the capture; nothing was appended
      and the stage stays Sealing.
    fields:
      - name: stage_id
        type: ekr.store.StageId
      - name: content_hash
        type: ekr.kernel.ContentHash

  # The stage's preserving copy holds no completion receipt (the copy's `migrate-incomplete`,
  # design §§ 100.3 and 105.2): its begin was interrupted. Also what every verb joined to it answers.
  - name: ekr.store.StageIncomplete
    summary: The stage's copy of the store never finished; it is not the store at its base and can only be abandoned.
    fields:
      - name: stage_id
        type: ekr.store.StageId

  # A decision elected (design § 94) and never published: in the store, a begin's copy refuses it
  # as the migration does (`migrate-unresolved-preparation`); in the stage, a seal or a
  # publication refuses it, since the suffix would leave out an occurrence the run elected.
  # A stage's publication slot that is not resolved (design § 107.5) is named by its stage,
  # `stage_id`, which publishing or abandoning resolves, with the first occurrence it elected if it
  # elected one; any other decision is named by its occurrence, `event_id`, alone (unit P's
  # adversary, 2026-10-08).
  - name: ekr.store.UnresolvedPreparation
    summary: >-
      A decision was elected and never published; resolve it with the command that elected it,
      or publish or abandon the stage it names, then retry. Nothing was copied or appended.
    fields:
      - name: event_id
        type: Optional<ekr.kernel.EventId>
      - name: stage_id
        type: Optional<ekr.store.StageId>

  # The kernel's check of the suffix derived again for the store's lineage refused it: a refusal of
  # the stage's full replay, a record that does not derive again, or the store's replay after the
  # suffix disagreeing with the stage's (`migrate-verification-disagrees`). All or nothing.
  - name: ekr.store.StageSuffixRefused
    summary: The stage's suffix did not validate against the store at the expected head; nothing was appended and the stage stays Sealing.
    fields:
      - name: stage_id
        type: ekr.store.StageId
      - name: code
        type: String
      - name: reason
        type: String

  # Design § 107.1, unit C. A store is opened under a tenant that contains the marker reserved to
  # stage tenants (`ekr.stage:`, ekr.store.StageId), so no store's tenant can be a stage's derived
  # tenant. Every provider's open refuses it before it reads, creates or writes anything; a host
  # configuration carrying such a tenant opens no store at all.
  - name: ekr.store.StageTenantReserved
    summary: The tenant carries the marker reserved to stage tenants; no store was opened under it and nothing was read or written.
    fields:
      - name: tenant
        type: String

  # The File provider's `forget_tenant` rewrites the provider's one journal, which every other open
  # handle of that directory may then read as a diverged history, so no stage is begun there.
  # SQLite and PostgreSQL admit stages.
  - name: ekr.store.StageUnsupportedProvider
    summary: Stages are not admitted on this store's provider; nothing was recorded or copied.
    fields:
      - name: provider
        type: ekr.store.ProviderKind

# Design § 107. The stage's four commands are ekr.cli's (cli.yaml): ekr.cli.BeginStage,
# ekr.cli.SealStage, ekr.cli.PublishStage and ekr.cli.AbandonStage. Decided: the CLI component
# `ekr` handles them, not ekr-kernel. A command's one handler is the component owning its domain
# (ESS-COMPONENT-004, `conflicting_declaration`, ess 0.36.0 and 0.55.0), and ekr-store owns
# ekr.store, so they are declared in ekr.cli, which `ekr` owns. The Stage, its id, its record's
# events and its refusals stay here, and the commands reference them. The view of every stage is
# ekr.cli.Stages (cli.yaml, unit L): declared here, it left every lifecycle scenario of a suite for
# the `ekr` component outside it, needing a view another component owns.
