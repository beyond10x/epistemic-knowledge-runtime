domain: ekr.integrate

summary: >-
  Entity resolution and the merge and split lineage around it. Design § 10, § 45, § 46 and
  amendment A10 (docs/predecessors.md § 2): a typed reference resolves against canonical nodes by
  identity, never by string matching, and a merge or a split is an explicit transaction with
  provenance. Its one command, ApplyExtraction, applies an extraction document; the resolver's
  verbs and the merge and split transactions are declared once the decision-blockers are answered.

naming:
  wire: integrate
  display: Integrate

types:
  # E transports reuse declared proposal/review fields; they do not grant authority.
  - name: ekr.integrate.SchemaProposalImport
    kind: struct
    fields:
    - {name: proposal, type: ekr.integrate.SchemaProposalDocument}
    - {name: payload, type: Bytes}
  - name: ekr.integrate.SchemaProposalRead
    kind: struct
    fields:
    - {name: proposal, type: ekr.integrate.SchemaProposalDocument}
    - {name: proposal_digest, type: ekr.kernel.ContentHash}
    - {name: preview, type: List<ekr.integrate.MappingPreview>}
    - {name: reviews, type: List<ekr.integrate.ProposalReviewSnapshot>}
    - {name: receipts, type: List<ekr.integrate.ApplicationReceiptSnapshot>}
    - {name: basis, type: ekr.kernel.ReviewBasis}
    - {name: expected_previous_decision, type: Optional<ekr.kernel.ContentHash>}
  - name: ekr.integrate.RetainedSchemaProposal
    kind: struct
    fields:
    - {name: proposal, type: ekr.integrate.SchemaProposalDocument}
    - {name: proposal_digest, type: ekr.kernel.ContentHash}
    - {name: payload, type: Bytes}
  - name: ekr.integrate.SchemaProposalReviewApplication
    kind: struct
    fields:
    - {name: human_proof, type: ekr.kernel.SignedHumanDecision}
    - {name: proposal_id, type: ekr.integrate.SchemaProposalId}
    - {name: proposal_digest, type: ekr.kernel.ContentHash}
    - {name: basis, type: ekr.kernel.ReviewBasis}
    - {name: statement, type: Bytes}
  - name: ekr.integrate.RetainedProposalReview
    kind: struct
    fields:
    - {name: review, type: ekr.integrate.ProposalReviewSnapshot}
    - {name: decision, type: ekr.kernel.HumanDecisionRecord}
    - {name: proof, type: Bytes}
    - {name: policy, type: Bytes}
    - {name: statement, type: ekr.kernel.EvidenceAdditionProjection}
    # Exact proof/policy codec bytes and statement evidence are pinned independently.
    # Recording a review does not add evidence to a canonical graph revision.
    # Duplicated fields must agree wherever represented: proposal identity/digest, basis
    # and decision match the signed target; operator, recording time and proof digest
    # match HumanDecisionRecord. Evidence id/hash/payload agree, never granting authority.
  # Named transport and retention projections share the command's declared fields.
  # The retained document bytes, not a serialized TransientGraph, bind its identity.
  - name: ekr.integrate.InterpretationImport
    kind: struct
    fields:
    - {name: document, type: ekr.integrate.InterpretationDocument}
    - {name: payload, type: Bytes}
  - name: ekr.integrate.InterpretationRead
    kind: struct
    fields:
    - {name: document, type: ekr.integrate.InterpretationDocument}
    - {name: blockers, type: List<ekr.integrate.IntegrationBlockerSnapshot>}
    - {name: receipts, type: List<ekr.integrate.ProcessingReceiptSnapshot>}
  - name: ekr.integrate.RetainedInterpretation
    kind: struct
    fields:
    - {name: version, type: ekr.integrate.InterpretationVersion}
    - {name: interpretation, type: ekr.integrate.InterpretationRead}
    - {name: payload, type: Bytes}
    - {name: root, type: ekr.graph.GraphRootRecord}
  - name: ekr.integrate.IntegrationBlockerSnapshot
    kind: struct
    fields:
    - name: blocker_id
      type: ekr.integrate.IntegrationBlockerId
    - name: document_digest
      type: ekr.kernel.ContentHash
    - name: item
      type: String
    - name: kind
      type: ekr.integrate.IntegrationBlockerKind
    - name: declaration
      type: String
    - name: reason
      type: String
    - name: basis_digest
      type: ekr.kernel.ContentHash
  - name: ekr.integrate.ProcessingReceiptSnapshot
    kind: struct
    fields:
    - name: receipt_id
      type: ekr.integrate.ProcessingReceiptId
    - name: mapping_digest
      type: Optional<ekr.kernel.ContentHash>
    - name: document_digest
      type: ekr.kernel.ContentHash
    - name: item
      type: String
    - name: disposition
      type: ekr.integrate.ProcessingDisposition
    - name: transaction_id
      type: Optional<ekr.kernel.TransactionId>
    - name: assertions
      type: List<ekr.graph.AssertionId>
    - name: basis_digest
      type: ekr.kernel.ContentHash
  - name: ekr.integrate.ProposalReviewSnapshot
    kind: struct
    fields:
    - {name: human_proof_digest, type: ekr.kernel.ContentHash}
    - name: review_id
      type: ekr.integrate.ProposalReviewId
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: proposal_digest
      type: ekr.kernel.ContentHash
    - name: basis
      type: ekr.kernel.ReviewBasis
    - name: decision
      type: ekr.integrate.ReviewDecision
    - name: operator
      type: ekr.kernel.TrustedOperatorIdentity
    - name: evidence_id
      type: ekr.graph.EvidenceId
    - name: recorded_at
      type: Timestamp
  - name: ekr.integrate.ApplicationReceiptSnapshot
    kind: struct
    fields:
    - name: receipt_id
      type: ekr.integrate.ApplicationReceiptId
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: review_id
      type: ekr.integrate.ProposalReviewId
    - name: progress
      type: ekr.integrate.ApplicationProgress
    - name: schema_transaction
      type: ekr.kernel.TransactionId
    - name: schema_revision
      type: ekr.kernel.RevisionNumber
    - name: processing_receipts
      type: List<ekr.integrate.ProcessingReceiptId>
    - name: remaining_items
      type: List<String>
    - name: stop_reason
      type: Optional<String>
  # The hashed input carries no digest of itself; the retained reference adds that digest.
  - name: ekr.integrate.InterpretationCoordinate
    kind: struct
    fields:
      - {name: interpretation_id, type: ekr.integrate.InterpretationId}
      - {name: version, type: Integer}
  - name: ekr.integrate.IncubationOutcome
    kind: enum
    variants: [Retained, RetainedWithBlockers, AlreadyRetained]
  - name: ekr.integrate.IntegrationItemReceipt
    kind: struct
    fields:
      - {name: source, type: ekr.integrate.InterpretationVersion}
      - {name: item, type: String}
      - {name: mapping_digest, type: ekr.kernel.ContentHash}
      - {name: disposition, type: ekr.integrate.ProcessingDisposition}
      - {name: transaction_id, type: Optional<ekr.kernel.TransactionId>}
      - {name: assertions, type: List<ekr.graph.AssertionId>}
      - {name: blockers, type: List<ekr.integrate.IntegrationBlockerId>}
      - {name: reason, type: Optional<String>}
  - name: ekr.integrate.ApplicationReport
    kind: struct
    fields:
      - {name: receipt_id, type: ekr.integrate.ApplicationReceiptId}
      - {name: progress, type: ekr.integrate.ApplicationProgress}
      - {name: schema_transaction, type: ekr.kernel.TransactionId}
      - {name: schema_revision, type: ekr.kernel.RevisionNumber}
      - {name: items, type: List<ekr.integrate.IntegrationItemReceipt>}
      - {name: remaining_items, type: List<String>}
      - {name: stop_reason, type: Optional<String>}
      - {name: already_complete, type: Boolean}
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.integrate.InterpretationId
    kind: newtype
    of: Uuid
  - name: ekr.integrate.IntegrationBlockerId
    kind: newtype
    of: Uuid
  - name: ekr.integrate.ProcessingReceiptId
    kind: newtype
    of: Uuid
  - name: ekr.integrate.SchemaProposalId
    kind: newtype
    of: Uuid
  - name: ekr.integrate.ProposalReviewId
    kind: newtype
    of: Uuid
  - name: ekr.integrate.ApplicationReceiptId
    kind: newtype
    of: Uuid
  - name: ekr.integrate.MappingRecordId
    kind: newtype
    of: Uuid
  - name: ekr.integrate.GapGroupId
    kind: newtype
    of: Uuid
  - name: ekr.integrate.IntegrationBlockerKind
    kind: enum
    variants:
    - UnknownType
    - UnknownProperty
    - UnknownRelation
    - UnresolvedReference
    - ValueMismatch
    - Contradiction
    - RejectedInterpretation
  - name: ekr.integrate.ProcessingDisposition
    kind: enum
    variants:
    - Parked
    - Integrated
    - Rejected
    - AlreadyIntegrated
  - name: ekr.integrate.ReviewDecision
    kind: enum
    variants:
    - Approved
    - Rejected
  - name: ekr.integrate.ApplicationProgress
    kind: enum
    variants:
    - SchemaCommitted
    - FactsInProgress
    - Complete
    - Partial
  - name: ekr.integrate.InterpretationVersion
    kind: struct
    fields:
    - name: interpretation_id
      type: ekr.integrate.InterpretationId
    - name: version
      type: Integer
    - name: document_digest
      type: ekr.kernel.ContentHash
  - name: ekr.integrate.InterpretationDocument
    kind: struct
    fields:
    - name: version
      type: ekr.integrate.InterpretationCoordinate
    - name: root_id
      type: ekr.graph.GraphRootId
    - name: observations
      type: List<ekr.graph.ObservationId>
    - name: local_schema
      type: ekr.integrate.OntologySpec
    - name: entities
      type: List<ekr.integrate.ExtractedReference>
    - name: facts
      type: List<ekr.integrate.ExtractedFact>
    - name: evidence
      type: List<ekr.kernel.EvidenceAdditionProjection>
  - name: ekr.integrate.IncubationImportReceipt
    kind: struct
    fields:
    - {name: outcome, type: ekr.integrate.IncubationOutcome}
    - name: version
      type: ekr.integrate.InterpretationVersion
    - name: already_retained
      type: Boolean
    - name: blockers
      type: List<ekr.integrate.IntegrationBlockerId>
  - name: ekr.integrate.OptionalPropertyAddition
    kind: struct
    fields:
    - name: owner_type
      type: String
    - name: property
      type: ekr.integrate.PropertySpec
  - name: ekr.integrate.AdditiveSchemaOperation
    kind: union
    tag: kind
    variants:
      DefineType: ekr.integrate.NodeTypeSpec
      DefineRelation: ekr.integrate.EdgeTypeSpec
      AddOptionalProperty: ekr.integrate.OptionalPropertyAddition
  - name: ekr.integrate.DeclaredSourceField
    kind: struct
    fields:
    - name: declaration
      type: String
    - name: field
      type: String
  - name: ekr.integrate.DeclaredSourceRelation
    kind: struct
    fields:
    - name: declaration
      type: String
    - name: relation
      type: String
  - name: ekr.integrate.MappingValue
    kind: union
    tag: kind
    variants:
      CopyField: ekr.integrate.DeclaredSourceField
      CopyRelation: ekr.integrate.DeclaredSourceRelation
      Constant: ekr.graph.TypedValue
  - name: ekr.integrate.KnowledgeMapping
    kind: struct
    fields:
    - name: source
      type: ekr.integrate.InterpretationVersion
    - name: source_item
      type: String
    - name: source_type
      type: String
    - name: target_type
      type: String
    - name: target_member
      type: String
    - name: value
      type: ekr.integrate.MappingValue
    # source + source_item selects one facts[index] in one immutable document.
    # Entity selectors are not mappings: unknown or ambiguous canonical subjects and
    # relation objects remain blocked; mapping never silently creates a new entity.
    # The version must occur in proposal.sources and the item in that source's selected items;
    # duplicate source/item/target mappings and unknown paths are refused.
    # source_type names its declared subject type. target_type names the canonical
    # subject type; target_member names its property or an outgoing relation.
    # CopyField/CopyRelation select declarations of that exact source item. Constants
    # are explicit typed values; there is no expression or transformation language.
  - name: ekr.integrate.ProposalSource
    kind: struct
    fields:
    - name: version
      type: ekr.integrate.InterpretationVersion
    - name: items
      type: List<String>
  - name: ekr.integrate.SchemaProposalDocument
    kind: struct
    fields:
    - {name: observations, type: List<ekr.graph.ObservationId>}
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: base_schema
      type: ekr.ontology.SchemaVersionId
    - name: sources
      type: List<ekr.integrate.ProposalSource>
    - name: evidence
      type: List<ekr.graph.EvidenceId>
    - name: additions
      type: List<ekr.integrate.AdditiveSchemaOperation>
    - name: mappings
      type: List<ekr.integrate.KnowledgeMapping>
    - name: corrections
      type: List<ekr.kernel.ClaimCorrection>
    - name: explanation
      type: String
  - name: ekr.integrate.GapGroup
    kind: struct
    # Projects outstanding source items against SchemaLearningRequest.base_schema.
    # Kind and declaration describe the current classification. Blocker IDs identify
    # retained historical findings anchoring those exact document/item coordinates;
    # their recorded classification and basis remain unchanged.
    fields:
    - name: group_id
      type: ekr.integrate.GapGroupId
    - name: kind
      type: ekr.integrate.IntegrationBlockerKind
    - name: declaration
      type: String
    - name: blockers
      type: List<ekr.integrate.IntegrationBlockerId>
    - name: observations
      type: List<ekr.graph.ObservationId>
    - name: sources
      type: List<ekr.integrate.InterpretationVersion>
  - name: ekr.integrate.SchemaLearningRequest
    kind: struct
    fields:
    - name: base_schema
      type: ekr.ontology.SchemaVersionId
    - name: groups
      type: List<ekr.integrate.GapGroup>
    - name: evidence
      type: List<ekr.graph.EvidenceId>
  - name: ekr.integrate.SchemaLearningResult
    kind: struct
    fields:
    - name: proposals
      type: List<ekr.integrate.SchemaProposalDocument>
    - name: unresolved_groups
      type: List<ekr.integrate.GapGroupId>
  - name: ekr.integrate.MappingPreview
    kind: struct
    fields:
    - name: source
      type: ekr.integrate.InterpretationVersion
    - name: item
      type: String
    - name: mapping
      type: ekr.integrate.KnowledgeMapping
    - name: blockers
      type: List<String>
    - name: corrections
      type: List<ekr.kernel.ClaimCorrection>

  - name: ekr.integrate.MergeId
    kind: newtype
    of: Uuid

  - name: ekr.integrate.SplitId
    kind: newtype
    of: Uuid

  # A reference to a node by its type and the names it is known by, before it is resolved.
  # `type_id` names an `ekr.ontology.NodeType`, many references to one type, no ownership — the
  # same reference `ekr.graph.Node.type` makes via its own `type_id`. A struct carries no relation
  # in ESS, so the reference is the field's type.
  #
  # UNMAPPED: the identifying keys of a reference. The relation is NodeType -> PropertyDefinition
  # (identifying), one-to-many, the far side may be zero, owned by the type; which properties it
  # holds and whether a key value is unique within the type are open. Blocked by
  # decision-blocker:typed-reference-identifying-keys; no field stands in for the keys.
  - name: ekr.integrate.TypedReference
    kind: struct
    fields:
      - name: type_id
        type: ekr.ontology.TypeId
      - name: aliases
        type: List<String>

  # The one canonical node a reference resolved to: many references to one node, a reference, no
  # ownership (`ekr.graph.Node` identity `node_id`).
  - name: ekr.integrate.ResolvedReference
    kind: struct
    fields:
      - name: node_id
        type: ekr.graph.NodeId

  # Every candidate the reference matched, in id order. Nothing is chosen.
  - name: ekr.integrate.AmbiguousReference
    kind: struct
    fields:
      - name: candidates
        type: List<ekr.graph.NodeId>

  # Why a reference cannot be resolved at all.
  - name: ekr.integrate.ResolutionRefusalCode
    kind: enum
    variants:
      - reference-without-identity
      - reference-type-has-subtypes
      - reference-type-undeclared

  - name: ekr.integrate.ResolutionRefusal
    kind: struct
    fields:
      - name: code
        type: ekr.integrate.ResolutionRefusalCode
      - name: reference
        type: ekr.integrate.TypedReference

  # What resolving one typed reference answers. `ProposeNew` carries the reference's type and
  # aliases and writes nothing: a new node is a proposal, committed only through a transaction.
  - name: ekr.integrate.ResolutionOutcome
    kind: union
    tag: kind
    variants:
      Resolved: ekr.integrate.ResolvedReference
      ProposeNew: ekr.integrate.TypedReference
      Ambiguous: ekr.integrate.AmbiguousReference
      Refused: ekr.integrate.ResolutionRefusal

  # The extraction document, `ekr.extraction-document/1` (design § 24, § 63): what an extracting
  # agent hands the engine — the ontology it needs by name, the named things it found, the facts
  # it read about them and the evidence each fact cites. It is written by a consumer's extractor,
  # which the engine does not start, and read before anything is written: a name no declaration
  # of the document or the store gives is refused, and so is a fact citing no evidence. Applying
  # it resolves every reference before any CreateNode, adds each evidence item with AddEvidence
  # and commits the facts as assertions through validated transactions.
  - name: ekr.integrate.ExtractionFormat
    kind: enum
    variants:
      - {name: EkrExtractionDocument1, wire: ekr.extraction-document/1}
  # A value type by name, as `ekr.ontology.ValueTypeProjection` is by id: `allowed_types` names
  # the node types a NodeRef may point at. Exactly the one parameter its kind takes is present; the
  # document writes it as `parameters` exactly as a value type writes its own
  # (`{allowed_types: [...]}`, `{variants: [...]}`, the element type, the fields). An Enum's
  # variants and a NodeRef's types are at least one, each once; a Record field is written once.
  - name: ekr.integrate.ValueSpec
    kind: struct
    fields:
      - name: value_kind
        type: ekr.ontology.ValueKind
      - name: allowed_types
        type: Optional<List<String>>
      - name: variants
        type: Optional<List<String>>
      - name: element
        type: Optional<ekr.integrate.ValueSpec>
      - name: fields
        type: Optional<Map<String, ekr.integrate.ValueSpec>>

  # A property by name, with its value type; unique on the type that declares it.
  - name: ekr.integrate.PropertySpec
    kind: struct
    fields:
      - name: name
        type: String
      - name: value
        type: ekr.integrate.ValueSpec
      - name: cardinality
        type: ekr.ontology.Cardinality
      - name: required
        type: Boolean

  # A node type by name: its parents by name and the properties it declares itself. A name is
  # not an identity (invariant 3): applying the document maps each name to the id the store holds,
  # or mints one for a type the store lacks.
  - name: ekr.integrate.NodeTypeSpec
    kind: struct
    fields:
      - name: name
        type: String
      - name: parents
        type: List<String>
      - name: abstract_type
        type: Boolean
      - name: properties
        type: List<ekr.integrate.PropertySpec>

  # An edge type by name: its ends by node type name.
  - name: ekr.integrate.EdgeTypeSpec
    kind: struct
    fields:
      - name: name
        type: String
      - name: source_types
        type: List<String>
      - name: target_types
        type: List<String>
      - name: cardinality
        type: ekr.ontology.Cardinality
      - name: properties
        type: List<ekr.integrate.PropertySpec>

  # The ontology the document needs, by name. Applying it adds what the store lacks through the
  # schema operations (DefineNodeType, DefineEdgeType, ModifyProperty, WidenEdgeType).
  - name: ekr.integrate.OntologySpec
    kind: struct
    fields:
      - name: node_types
        type: List<ekr.integrate.NodeTypeSpec>
      - name: edge_types
        type: List<ekr.integrate.EdgeTypeSpec>

  # A named thing: a node by its type's name and the aliases it is known by. Once the name maps to
  # a type id it is an `ekr.integrate.TypedReference`, with these aliases, and resolves as one.
  - name: ekr.integrate.ExtractedReference
    kind: struct
    fields:
      - name: node_type
        type: String
      - name: aliases
        type: List<String>

  # A property value read about a named thing. `evidence` holds the ids of evidence items of the
  # same document; at least one.
  - name: ekr.integrate.PropertyFact
    kind: struct
    fields:
      - name: subject
        type: ekr.integrate.ExtractedReference
      - name: property
        type: String
      - name: value
        type: ekr.graph.TypedValue
      - name: evidence
        type: List<ekr.graph.EvidenceId>

  # A relation read between two named things, by edge type name.
  - name: ekr.integrate.RelationFact
    kind: struct
    fields:
      - name: subject
        type: ekr.integrate.ExtractedReference
      - name: relation
        type: String
      - name: object
        type: ekr.integrate.ExtractedReference
      - name: evidence
        type: List<ekr.graph.EvidenceId>

  - name: ekr.integrate.ExtractedFact
    kind: union
    tag: kind
    variants:
      Property: ekr.integrate.PropertyFact
      Relation: ekr.integrate.RelationFact

  # Each evidence item is the entry and payload an ekr.kernel AddEvidence carries: an evidence
  # entry (`ekr.graph.Evidence`) and the exact bytes its content_hash addresses.
  - name: ekr.integrate.ExtractionDocument
    kind: struct
    fields:
      - name: format
        type: ekr.integrate.ExtractionFormat
      - name: ontology
        type: ekr.integrate.OntologySpec
      - name: entities
        type: List<ekr.integrate.ExtractedReference>
      - name: facts
        type: List<ekr.integrate.ExtractedFact>
      - name: evidence
        type: List<ekr.kernel.EvidenceAdditionProjection>

  # Why the reader refuses a document. Before it is decoded: over 8388608 bytes; containers
  # nested deeper than 32, the transaction document's limit, which the YAML loader stops at; a
  # YAML alias; anything but one document of the format. Once decoded, checked in document order,
  # the first being the answer: a name the document declares twice (a node type, an edge type, a
  # property of one type, an Enum variant, a NodeRef type); a store type redeclared with other
  # parents, abstractness or cardinality; a node type or edge type no declaration of the document
  # or the store gives; an Enum with no variant or a NodeRef to no type; a reference with no alias
  # but the empty string (as ekr.integrate.ResolutionRefusalCode names it); a property its
  # subject's type and ancestors do not declare; a property value its type does not hold; a
  # relation between node types its edge type does not connect, subtypes conforming; a fact citing
  # no evidence; a fact citing an evidence id the document does not hold; two evidence items under
  # one id; a payload that does not hash to its entry's content_hash (the codes
  # ekr.kernel AddEvidence validation uses for the same two).
  - name: ekr.integrate.ExtractionRefusalCode
    kind: enum
    variants:
      - extraction-document-too-large
      - extraction-document-too-deep
      - extraction-yaml-alias
      - extraction-document-malformed
      - extraction-name-duplicate
      - extraction-type-conflict
      - extraction-type-undeclared
      - extraction-property-conflict
      - extraction-value-type-empty
      - reference-without-identity
      - reference-type-has-subtypes
      - extraction-property-undeclared
      - extraction-value-mismatch
      - extraction-relation-ends
      - fact-without-evidence
      - fact-evidence-unlisted
      - duplicate-identity
      - extraction-evidence-kind-unsupported
      - evidence-payload-mismatch

  # `name` is what the refused part names: the type, `Type.property`, the position of the entity
  # or fact with what it carries, an evidence id, or before decoding the reason.
  - name: ekr.integrate.ExtractionRefusal
    kind: struct
    fields:
      - name: code
        type: ekr.integrate.ExtractionRefusalCode
      - name: name
        type: String

  # Where the extraction document ApplyExtraction reads is: a file, or `-` for standard input.
  - name: ekr.integrate.ExtractionDocumentPath
    kind: newtype
    of: String

  # The apply report: what applying one extraction document did.
  - name: ekr.integrate.CommittedExtraction
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: revision
        type: ekr.kernel.RevisionNumber

  # One validator issue as `ekr validate` printed it: the validator, the stable code, the message.
  - name: ekr.integrate.ExtractionIssue
    kind: struct
    fields:
      - name: validator
        type: ekr.kernel.ValidatorName
      - name: code
        type: String
      - name: message
        type: String

  # One part of the document that was not applied, named by `item`: `ontology`, `entities[<i>]`,
  # `facts[<i>]`, or `facts[<i>].subject` / `.object` where a named thing first appears. Applying
  # bisects a rejected transaction down to the one part validation refuses, so `transaction_id`
  # is the transaction that held that part alone and `issues` what the validators raised against
  # it. Where no validator answered, both are absent and `refusal` says why: a refusal of Propose
  # (`<code>: <reason>`), a document limit, or a named thing the fact rests on that was not
  # created.
  - name: ekr.integrate.RejectedExtraction
    kind: struct
    fields:
      - name: item
        type: String
      - name: transaction_id
        type: Optional<ekr.kernel.TransactionId>
      - name: issues
        type: List<ekr.integrate.ExtractionIssue>
      - name: refusal
        type: Optional<String>

  # A named thing the store answers with more than one node: nothing is chosen, and no fact about
  # it is applied. `candidates` are the resolver's Ambiguous answer's, in id order.
  # `reference` is the group of named things the document lists that share an alias: its node type
  # and every alias of its members, the group's name first.
  - name: ekr.integrate.AmbiguousExtraction
    kind: struct
    fields:
      - name: reference
        type: ekr.integrate.ExtractedReference
      - name: candidates
        type: List<ekr.graph.NodeId>

  # The re-apply rule. A fact is held, not asserted, when an assertion making its claim — the same
  # subject, predicate, object and valid time — cites every evidence item the fact cites. `reason`
  # says which: `asserted`, the store holds it active; `repeated`, an earlier fact of the document
  # asserted it; `retracted` or `superseded`, the store held it and an operator retracted or
  # superseded it, which asserting it again from the same evidence would undo. A fact citing
  # evidence no such assertion cited is asserted, whatever became of the claim.
  - name: ekr.integrate.HeldReason
    kind: enum
    variants:
      - asserted
      - repeated
      - retracted
      - superseded

  - name: ekr.integrate.HeldExtraction
    kind: struct
    fields:
      - name: item
        type: String
      - name: reason
        type: ekr.integrate.HeldReason

  # What applying one document did. Named things of one node type that share an alias, transitively,
  # are one thing whatever order the document lists them in: resolved once with every alias of its
  # members, and created, where the store holds none, named by the least in byte order of its
  # members' first aliases. `held` lists each fact not asserted (ekr.integrate.HeldExtraction): a
  # document applied twice adds nothing the second time. `stopped` says why applying ended before
  # the end of the document once something had committed, a request getting no answer it could act
  # on; absent when it went to its end. `committed` then names every transaction committed until
  # then, the ones the batch that stopped committed included: a stop after any commit is a report,
  # never a refusal or a fault. A document the reader refuses is refused before anything is
  # written — among them a named thing whose type is abstract or has a subtype once the document's
  # ontology is applied, a subtype redeclaring a property an ancestor declares otherwise, and an
  # evidence item whose source is not a HumanStatement.
  - name: ekr.integrate.ExtractionReport
    kind: struct
    fields:
      - name: committed
        type: List<ekr.integrate.CommittedExtraction>
      - name: rejected
        type: List<ekr.integrate.RejectedExtraction>
      - name: ambiguous
        type: List<ekr.integrate.AmbiguousExtraction>
      - name: held
        type: List<ekr.integrate.HeldExtraction>
      - name: stopped
        type: Optional<String>

entities:
  - name: ekr.integrate.ProposalObservation
    identity:
      name: binding_id
      type: Uuid
    fields:
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: observation_id
      type: ekr.graph.ObservationId
    relations:
    - name: proposal
      kind: references
      target: ekr.integrate.SchemaProposal
      cardinality: one
      via: proposal_id
    - name: observation
      kind: references
      target: ekr.observe.RetainedObservation
      cardinality: one
      via: observation_id
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  # Canonical provenance is independent of the source's live incubation root.
  # Each row is one provenance link; a fact with several observations/evidence items has several rows.
  - name: ekr.integrate.CanonicalDerivation
    identity: {name: derivation_id, type: Uuid}
    fields:
      - {name: assertion_id, type: ekr.graph.AssertionId}
      - {name: mapping_id, type: ekr.integrate.MappingRecordId}
      - {name: observation_id, type: ekr.graph.ObservationId}
      - {name: evidence_id, type: ekr.graph.EvidenceId}
    relations:
      - {name: assertion, kind: references, target: ekr.graph.Assertion, cardinality: one, via: assertion_id}
      - {name: mapping, kind: references, target: ekr.integrate.MappingRecord, cardinality: one, via: mapping_id}
      - {name: observation, kind: references, target: ekr.observe.RetainedObservation, cardinality: one, via: observation_id}
      - {name: evidence, kind: references, target: ekr.graph.Evidence, cardinality: one, via: evidence_id}
    lifecycle: {initial: Recorded, states: [Recorded], terminal: [Recorded]}
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.integrate.Interpretation
    identity:
      name: document_digest
      type: ekr.kernel.ContentHash
    fields:
    - name: interpretation_id
      type: ekr.integrate.InterpretationId
    - name: version
      type: Integer
    - name: root_id
      type: ekr.graph.GraphRootId
    - name: document
      type: ekr.integrate.InterpretationDocument
    # Immutable typed interpretation version. Local schema and facts stay in
    # a TransientGraph, with a GraphRoot whose space is Transient; they do not create
    # canonical declarations.
    relations:
    - name: root
      kind: references
      target: ekr.graph.GraphRoot
      cardinality: one
      via: root_id
    - name: bytes
      kind: references
      target: ekr.store.StoredObject
      cardinality: one
      via: document_digest
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.integrate.InterpretationObservation
    identity:
      name: link_id
      type: Uuid
    fields:
    - name: document_digest
      type: ekr.kernel.ContentHash
    - name: observation_id
      type: ekr.graph.ObservationId
    # 'A durable reference, not ownership: rejecting an interpretation or retiring
    # a root never withdraws an observation.'
    relations:
    - name: interpretation
      kind: references
      target: ekr.integrate.Interpretation
      cardinality: one
      via: document_digest
    - name: observation
      kind: references
      target: ekr.observe.RetainedObservation
      cardinality: one
      via: observation_id
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.integrate.IntegrationBlocker
    identity:
      name: blocker_id
      type: ekr.integrate.IntegrationBlockerId
    fields:
    - name: document_digest
      type: ekr.kernel.ContentHash
    - name: item
      type: String
    - name: kind
      type: ekr.integrate.IntegrationBlockerKind
    - name: declaration
      type: String
    - name: reason
      type: String
    - name: basis_digest
      type: ekr.kernel.ContentHash
    # Immutable finding for an exact interpretation version and source item;
    # resolution is projected from later processing receipts, never deletion of the
    # finding.
    relations:
    - name: interpretation
      kind: references
      target: ekr.integrate.Interpretation
      cardinality: one
      via: document_digest
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.integrate.ProcessingReceipt
    identity:
      name: receipt_id
      type: ekr.integrate.ProcessingReceiptId
    fields:
    - {name: mapping_digest, type: Optional<ekr.kernel.ContentHash>}
    - name: document_digest
      type: ekr.kernel.ContentHash
    - name: item
      type: String
    - name: disposition
      type: ekr.integrate.ProcessingDisposition
    - name: transaction_id
      type: Optional<ekr.kernel.TransactionId>
    - name: assertions
      type: List<ekr.graph.AssertionId>
    - name: basis_digest
      type: ekr.kernel.ContentHash
    # Append-only receipt. A completed canonical integration is indexed by immutable
    # document digest, source item and mapping digest; retry reconciles committed transactions
    # before another proposal.
    relations:
    - name: interpretation
      kind: references
      target: ekr.integrate.Interpretation
      cardinality: one
      via: document_digest
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.integrate.SchemaProposal
    identity:
      name: proposal_id
      type: ekr.integrate.SchemaProposalId
    fields:
    - name: proposal_digest
      type: ekr.kernel.ContentHash
    - name: base_schema
      type: ekr.ontology.SchemaVersionId
    - name: document
      type: ekr.integrate.SchemaProposalDocument
    # Immutable consumer-agent proposal. Its digest covers every addition, source
    # version, mapping, selected correction and supporting evidence. Submission does
    # not change canonical knowledge.
    relations:
    - name: base_schema
      kind: references
      target: ekr.ontology.SchemaVersion
      cardinality: one
      via: base_schema
    - name: bytes
      kind: references
      target: ekr.store.StoredObject
      cardinality: one
      via: proposal_digest
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.integrate.ProposalSourceBinding
    identity:
      name: binding_id
      type: Uuid
    fields:
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: document_digest
      type: ekr.kernel.ContentHash
    relations:
    - name: proposal
      kind: references
      target: ekr.integrate.SchemaProposal
      cardinality: one
      via: proposal_id
    - name: interpretation
      kind: references
      target: ekr.integrate.Interpretation
      cardinality: one
      via: document_digest
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.integrate.ProposalEvidence
    identity:
      name: binding_id
      type: Uuid
    fields:
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: evidence_id
      type: ekr.graph.EvidenceId
    relations:
    - name: proposal
      kind: references
      target: ekr.integrate.SchemaProposal
      cardinality: one
      via: proposal_id
    - name: evidence
      kind: references
      target: ekr.graph.Evidence
      cardinality: one
      via: evidence_id
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.integrate.ProposalReview
    identity:
      name: review_id
      type: ekr.integrate.ProposalReviewId
    fields:
    - {name: human_proof_digest, type: ekr.kernel.ContentHash}
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: proposal_digest
      type: ekr.kernel.ContentHash
    - name: basis
      type: ekr.kernel.ReviewBasis
    - name: decision
      type: ekr.integrate.ReviewDecision
    - name: operator
      type: ekr.kernel.TrustedOperatorIdentity
    - name: evidence_id
      type: ekr.graph.EvidenceId
    - name: recorded_at
      type: Timestamp
    # An immutable decision authenticated by the CLI/SDK host, never by a Boolean
    # or actor supplied inside agent content. Approval records exact proposal and reviewed
    # evidence; rejection preserves all sources.
    relations:
    - {name: human_proof, kind: references, target: ekr.kernel.RetainedHumanDecision, cardinality: one, via: human_proof_digest}
    - name: proposal
      kind: references
      target: ekr.integrate.SchemaProposal
      cardinality: one
      via: proposal_id
    - name: human_evidence
      kind: references
      target: ekr.graph.Evidence
      cardinality: one
      via: evidence_id
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.integrate.MappingRecord
    identity:
      name: mapping_id
      type: ekr.integrate.MappingRecordId
    fields:
    - name: proposal_digest
      type: ekr.kernel.ContentHash
    - name: mapping_digest
      type: ekr.kernel.ContentHash
    - name: source_document_digest
      type: ekr.kernel.ContentHash
    - name: mapping
      type: ekr.integrate.KnowledgeMapping
    - name: evidence
      type: List<ekr.graph.EvidenceId>
    # Retained admissible immutable provenance independent of any live TransientGraph.
    # Canonical derivations cite this record and retained observations; no reference
    # to a live root is required.
    relations:
    - {name: proposal_bytes, kind: references, target: ekr.store.StoredObject, cardinality: one, via: proposal_digest}
    - {name: source_bytes, kind: references, target: ekr.store.StoredObject, cardinality: one, via: source_document_digest}
    - name: bytes
      kind: references
      target: ekr.store.StoredObject
      cardinality: one
      via: mapping_digest
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.integrate.ApplicationReceipt
    identity:
      name: receipt_id
      type: ekr.integrate.ApplicationReceiptId
    fields:
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: review_id
      type: ekr.integrate.ProposalReviewId
    - name: progress
      type: ekr.integrate.ApplicationProgress
    - name: schema_transaction
      type: ekr.kernel.TransactionId
    - name: schema_revision
      type: ekr.kernel.RevisionNumber
    - name: processing_receipts
      type: List<ekr.integrate.ProcessingReceiptId>
    - name: remaining_items
      type: List<String>
    - name: stop_reason
      type: Optional<String>
    # Append-only partial progress after schema commit. Facts are ordinary validated
    # transactions and each source item is resumable without duplication; blocked and
    # newly disputed facts remain visible.
    relations:
    - name: proposal
      kind: references
      target: ekr.integrate.SchemaProposal
      cardinality: one
      via: proposal_id
    - name: review
      kind: references
      target: ekr.integrate.ProposalReview
      cardinality: one
      via: review_id
    - name: schema_transaction
      kind: references
      target: ekr.kernel.GraphTransaction
      cardinality: one
      via: schema_transaction
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded

  # Design § 46 Merge: two or more nodes found to be one canonical entity. Declared as an identity
  # only; every relation is undecided.
  #
  # UNMAPPED: absorbed Node -> surviving Node, many-to-one (one node may absorb several), recorded
  # by this merge; whether the absorbed node stays in canonical state and whether the merge
  # rewrites the references to it are open. Blocked by decision-blocker:merge-absorbed-node-fate.
  # UNMAPPED: Merge -> NodeType of each side, two many-to-one references; whether the two types
  # must be equal or conform, and which survives, is open. Blocked by
  # decision-blocker:merge-across-node-types.
  - name: ekr.integrate.Merge
    identity:
      name: merge_id
      type: ekr.integrate.MergeId
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # Design § 46 Split: a previously merged node found to be several entities. Declared as an
  # identity only; every relation is undecided.
  #
  # UNMAPPED: Split -> source Node it splits, exactly one. Blocked by
  # decision-blocker:split-reverting-merge-identity.
  # UNMAPPED: Split -> produced Node, one-to-many (at least two); whether a split that reverts a
  # merge restores the absorbed node's id or mints new nodes is open. Blocked by
  # decision-blocker:split-reverting-merge-identity.
  # UNMAPPED: Split -> the Merge it reverts, zero-or-one; its lifecycle coupling with the merge
  # record is open. Blocked by decision-blocker:split-reverting-merge-identity.
  - name: ekr.integrate.Split
    identity:
      name: split_id
      type: ekr.integrate.SplitId
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

actors:
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.integrate.KnowledgeProposer
    may:
    - ekr.integrate.ImportInterpretation
    - ekr.integrate.ListInterpretations
    - ekr.integrate.ShowInterpretation
    - ekr.integrate.DiscoverSchemaGaps
    - ekr.integrate.SubmitSchemaProposal
    - ekr.integrate.ShowSchemaProposal
    - ekr.integrate.ApplySchemaProposal
  - name: ekr.integrate.HumanReviewer
    may:
    - ekr.integrate.ApproveSchemaProposal
    - ekr.integrate.RejectSchemaProposal

  # The host operator, through `ekr apply-extraction`: every transaction the command proposes is
  # proposed as the operator and validated as the host's validator, as `ekr propose` is.
  - name: ekr.integrate.Applier
    may:
      - ekr.integrate.ApplyExtraction
    naming:
      display: Extraction applier

errors:
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.integrate.KnowledgeRefused
    summary: A named deterministic refusal; no unreported write occurred. Partial application
      is a typed report, never this refusal.
    fields:
    - name: code
      type: String
    - name: reason
      type: String

  # The reader refused the document against the ontology of the store's head, by the first code
  # in document order (ekr.integrate.ExtractionRefusalCode). `name` is what the refused part names.
  - name: ekr.integrate.ExtractionRefused
    summary: The reader refused the extraction document; nothing was proposed and nothing was written.
    fields:
      - name: code
        type: ekr.integrate.ExtractionRefusalCode
      - name: name
        type: String

commands:
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.integrate.ImportInterpretation
    naming:
      wire: incubate-import
    input:
    - name: document
      type: ekr.integrate.InterpretationDocument
    - name: payload
      type: Bytes
    response:
    - name: receipt
      type: ekr.integrate.IncubationImportReceipt
    outcomes:
    - name: answered
      emits:
      - ekr.integrate.ImportInterpretationResult
      payload:
        ekr.integrate.ImportInterpretationResult:
          receipt:
            generated: true
      summary: Retain immutable document bytes and local declarations, bind a Transient
        GraphRoot, and report blockers. Retain exact document bytes by content digest; materialize the TransientGraph for inspection without serializing or canonically hashing it. Supplied observation bytes must already be independently
        retained. Repeated exact import returns the same version and no duplicate blockers.
    - name: refused
      external: The typed document must match its bytes and digest; its root must be
        Transient, every observation retained, every evidence source admissible, and
        an existing version immutable. Local declaration/reference integrity is checked independently
        of canonical ontology; a canonical vocabulary mismatch is a durable blocker, not an import refusal.
      error: ekr.integrate.KnowledgeRefused
  - name: ekr.integrate.ListInterpretations
    naming:
      wire: incubate-list
    input: []
    response:
    - name: interpretations
      type: List<ekr.integrate.InterpretationVersion>
    outcomes:
    - name: answered
      emits:
      - ekr.integrate.ListInterpretationsResult
      payload:
        ekr.integrate.ListInterpretationsResult:
          interpretations:
            generated: true
      summary: Read retained interpretation versions in stable identity/version order
        without canonical mutation.
  - name: ekr.integrate.ShowInterpretation
    naming:
      wire: incubate-show
    input:
    - name: version
      type: ekr.integrate.InterpretationVersion
    response:
    - name: document
      type: ekr.integrate.InterpretationDocument
    - name: blockers
      type: List<ekr.integrate.IntegrationBlockerSnapshot>
    - name: receipts
      type: List<ekr.integrate.ProcessingReceiptSnapshot>
    outcomes:
    - name: answered
      emits:
      - ekr.integrate.ShowInterpretationResult
      payload:
        ekr.integrate.ShowInterpretationResult:
          document:
            generated: true
          blockers:
            generated: true
          receipts:
            generated: true
      summary: Read immutable local schema, facts, source references and processing
        history after reopen.
    - name: refused
      external: An unknown version or changed document digest is refused.
      error: ekr.integrate.KnowledgeRefused
  - name: ekr.integrate.DiscoverSchemaGaps
    naming:
      wire: schema-proposal-discover
    input: []
    response:
    - name: request
      type: ekr.integrate.SchemaLearningRequest
    outcomes:
    - name: answered
      emits:
      - ekr.integrate.DiscoverSchemaGapsResult
      payload:
        ekr.integrate.DiscoverSchemaGapsResult:
          request:
            generated: true
      summary: Deterministically group recurring integration blockers by kind and declared
        source vocabulary against one verified current base schema. Reclassify outstanding
        source items while preserving immutable historical blocker anchors and their original
        classification and basis. Return a typed request for a consumer-supplied agent; do
        not start a model provider or scheduler.
    - name: refused
      external: A canonical base schema is required; an unseeded or unverifiable store is refused.
      error: ekr.integrate.KnowledgeRefused
  - name: ekr.integrate.SubmitSchemaProposal
    naming:
      wire: schema-proposal-submit
    input:
    - name: proposal
      type: ekr.integrate.SchemaProposalDocument
    - name: payload
      type: Bytes
    response:
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: proposal_digest
      type: ekr.kernel.ContentHash
    - name: preview
      type: List<ekr.integrate.MappingPreview>
    outcomes:
    - name: answered
      emits:
      - ekr.integrate.SubmitSchemaProposalResult
      payload:
        ekr.integrate.SubmitSchemaProposalResult:
          proposal_id:
            generated: true
          proposal_digest:
            generated: true
          preview:
            generated: true
      summary: Retain the exact proposal and a mapping preview without changing ontology
        or claims. Retained observations and immutable source documents are sufficient support;
        canonical evidence ids are optional additional citations before application. The
        payload must decode to the supplied proposal; the digest hashes the exact bytes.
        Identical retries return the retained proposal; reusing its id with other bytes refuses.
    - name: refused
      external: Refuse unknown or incompatible base schemas, mutable or missing sources/evidence, nonadditive changes, required
        property additions, undeclared selectors, mismatched typed constants and enum
        constraints whose complete variant set is not equal to a selected retained local
        enum declaration. Subsets, unions of declarations, observed literals and prose alone
        do not establish this support. Never
        infer an exhaustive enum from observed fact values; the reviewer sees the explicit constraint.
      error: ekr.integrate.KnowledgeRefused
  - name: ekr.integrate.ShowSchemaProposal
    naming:
      wire: schema-proposal-show
    input:
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    response:
    - name: proposal
      type: ekr.integrate.SchemaProposalDocument
    - name: proposal_digest
      type: ekr.kernel.ContentHash
    - name: preview
      type: List<ekr.integrate.MappingPreview>
    - name: reviews
      type: List<ekr.integrate.ProposalReviewSnapshot>
    - name: receipts
      type: List<ekr.integrate.ApplicationReceiptSnapshot>
    - {name: basis, type: ekr.kernel.ReviewBasis}
    - {name: expected_previous_decision, type: Optional<ekr.kernel.ContentHash>}
    outcomes:
    - name: answered
      emits:
      - ekr.integrate.ShowSchemaProposalResult
      payload:
        ekr.integrate.ShowSchemaProposalResult:
          proposal:
            generated: true
          proposal_digest:
            generated: true
          preview:
            generated: true
          reviews:
            generated: true
          receipts:
            generated: true
          basis: {generated: true}
          expected_previous_decision: {generated: true}
      summary: Show proposed additions, supporting observations, exact mappings and
        review/application history through CLI, SDK and the read-only viewer. Expose
        the current material review basis and the latest retained proof digest so a
        human can sign the exact target and predecessor outside the runtime. The predecessor
        is HumanDecisionRecord.proof_digest, not proof_object_hash. Recorded approval is a
        decision on its observed basis; compare the current material basis to show when
        renewed review is needed. An approval is not an unconditional applicability grant.
    - name: refused
      external: An unknown proposal is refused.
      error: ekr.integrate.KnowledgeRefused
  - name: ekr.integrate.ApproveSchemaProposal
    naming:
      wire: schema-proposal-approve
    input:
    - {name: human_proof, type: ekr.kernel.SignedHumanDecision}
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: proposal_digest
      type: ekr.kernel.ContentHash
    - name: basis
      type: ekr.kernel.ReviewBasis
    - name: statement
      type: Bytes
    response:
    - name: review_id
      type: ekr.integrate.ProposalReviewId
    outcomes:
    - name: answered
      emits:
      - ekr.integrate.ApproveSchemaProposalResult
      payload:
        ekr.integrate.ApproveSchemaProposalResult:
          review_id:
            generated: true
      summary: Record the host-authenticated human decision and retain its statement
        as evidence; approval includes additions, mappings and selected corrections. Verify
        material against one coherent canonical snapshot, then atomically retain the decision,
        proof, policy and statement against the exact review predecessor. Canonical revisions
        do not advance. A concurrent canonical change may immediately make this observed-basis
        decision stale; application revalidates it. Exact retries retain the original review;
        a reused decision identity with changed input refuses across all human decision kinds
        in the audience, including upgrades and attention answers, in the same atomic publication.
    - name: refused
      external: Verify human_proof under the independently enrolled reviewer policy, with a target matching this approve/reject operation, proposal id, proposal digest, statement and expected predecessor decision. Derive the operator from the verified key registry; a host UUID, agent statement or caller-supplied key cannot authenticate a human. The exact proposal,
        reviewed evidence and intended effects must match the verified observed snapshot.
        Unknown proposals and stale review predecessors refuse. Agent-supplied content cannot
        grant approval.
      error: ekr.integrate.KnowledgeRefused
  - name: ekr.integrate.RejectSchemaProposal
    naming:
      wire: schema-proposal-reject
    input:
    - {name: human_proof, type: ekr.kernel.SignedHumanDecision}
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: proposal_digest
      type: ekr.kernel.ContentHash
    - name: basis
      type: ekr.kernel.ReviewBasis
    - name: statement
      type: Bytes
    response:
    - name: review_id
      type: ekr.integrate.ProposalReviewId
    outcomes:
    - name: answered
      emits:
      - ekr.integrate.RejectSchemaProposalResult
      payload:
        ekr.integrate.RejectSchemaProposalResult:
          review_id:
            generated: true
      summary: Record the host-authenticated human decision and retain its statement
        as evidence without advancing canonical revisions. Atomically retain rejection,
        proof, policy and statement against the exact review predecessor. Rejection prevents
        subsequent application writes while preserving committed history. Exact retries return
        the retained decision; changed input under the same decision identity refuses across all
        human decision kinds in the audience, including upgrades and attention answers, in the
        same atomic publication.
    - name: refused
      external: Verify human_proof under the independently enrolled reviewer policy, with a target matching this approve/reject operation, proposal id, proposal digest, statement and expected predecessor decision. Derive the operator from the verified key registry; a host UUID, agent statement or caller-supplied key cannot authenticate a human. The exact proposal,
        reviewed evidence and intended effects must match the verified observed snapshot.
        Unknown proposals and stale review predecessors refuse. Agent-supplied content cannot
        grant approval.
      error: ekr.integrate.KnowledgeRefused
  - name: ekr.integrate.ApplySchemaProposal
    naming:
      wire: schema-proposal-apply
    input:
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: review_id
      type: ekr.integrate.ProposalReviewId
    - name: proposal_digest
      type: ekr.kernel.ContentHash
    response:
    - name: receipt
      type: ekr.integrate.ApplicationReport
    outcomes:
    - name: answered
      emits:
      - ekr.integrate.ApplySchemaProposalResult
      payload:
        ekr.integrate.ApplySchemaProposalResult:
          receipt:
            generated: true
      summary: Revalidate the exact approved additions/mappings/corrections and latest effective
        review before each canonical write; a later rejection stops application/resume and reports
        confirmed partial progress. Commit schema with evidence first, then selected facts and corrections by ordinary
        validated transactions. Return durable partial progress on interruption; reconcile
        receipts and resume without duplicates.
    - name: refused
      external: Before mutation require the referenced review to match proposal_id and exact proposal digest, to be Approved, and to be the latest trusted human decision for that proposal. Refuse changed digest/evidence/options/effects
        or incompatible base schema. A later failure after any commit produces a partial
        receipt, not a refusal.
      error: ekr.integrate.KnowledgeRefused

  # Design § 24 and § 63, story:extraction-verb-shares-the-sdk-path. `ekr apply-extraction` runs
  # the SDK's apply routine (ekr_sdk::extraction::apply) in process, over the session's own
  # dispatch: the document's missing ontology as one schema change, every named thing resolved as
  # a typed reference and created where the store holds none, every fact about a thing that
  # resolved as one AddAssertion with the evidence it cites. Its only writes are the kernel's
  # Propose, Validate and Commit; a rejected part of the document is a row of the report, not a
  # refusal of the command.
  - name: ekr.integrate.ApplyExtraction
    naming:
      wire: apply-extraction
      display: Apply an extraction document
    input:
      - name: extraction_document
        type: ekr.integrate.ExtractionDocumentPath
    response:
      - name: report
        type: ekr.integrate.ExtractionReport
    outcomes:
      - name: applied
        emits:
          - ekr.integrate.ExtractionApplied
        payload:
          ekr.integrate.ExtractionApplied:
            committed: {generated: true}
            rejected: {generated: true}
            ambiguous: {generated: true}
            held: {generated: true}
        summary: The document was read and every part of it tried; the report lists what committed, what was rejected and which named things were ambiguous.
      # External because what decides it is the store's ontology at its head, which is not
      # command input.
      - name: refused
        external: the reader refuses the document against the ontology of the store's head
        error: ekr.integrate.ExtractionRefused
        summary: Nothing was proposed or written; the refusal names the first refused part in document order.

events:
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.integrate.ImportInterpretationResult
    fields:
    - name: receipt
      type: ekr.integrate.IncubationImportReceipt
  - name: ekr.integrate.ListInterpretationsResult
    fields:
    - name: interpretations
      type: List<ekr.integrate.InterpretationVersion>
  - name: ekr.integrate.ShowInterpretationResult
    fields:
    - name: document
      type: ekr.integrate.InterpretationDocument
    - name: blockers
      type: List<ekr.integrate.IntegrationBlockerSnapshot>
    - name: receipts
      type: List<ekr.integrate.ProcessingReceiptSnapshot>
  - name: ekr.integrate.DiscoverSchemaGapsResult
    fields:
    - name: request
      type: ekr.integrate.SchemaLearningRequest
  - name: ekr.integrate.SubmitSchemaProposalResult
    fields:
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: proposal_digest
      type: ekr.kernel.ContentHash
    - name: preview
      type: List<ekr.integrate.MappingPreview>
  - name: ekr.integrate.ShowSchemaProposalResult
    fields:
    - name: proposal
      type: ekr.integrate.SchemaProposalDocument
    - name: proposal_digest
      type: ekr.kernel.ContentHash
    - name: preview
      type: List<ekr.integrate.MappingPreview>
    - name: reviews
      type: List<ekr.integrate.ProposalReviewSnapshot>
    - name: receipts
      type: List<ekr.integrate.ApplicationReceiptSnapshot>
    - {name: basis, type: ekr.kernel.ReviewBasis}
    - {name: expected_previous_decision, type: Optional<ekr.kernel.ContentHash>}
  - name: ekr.integrate.ApproveSchemaProposalResult
    fields:
    - name: review_id
      type: ekr.integrate.ProposalReviewId
  - name: ekr.integrate.RejectSchemaProposalResult
    fields:
    - name: review_id
      type: ekr.integrate.ProposalReviewId
  - name: ekr.integrate.ApplySchemaProposalResult
    fields:
    - name: receipt
      type: ekr.integrate.ApplicationReport

  # What one application did, counted over the report it printed.
  - name: ekr.integrate.ExtractionApplied
    fields:
      - name: committed
        type: Integer
      - name: rejected
        type: Integer
      - name: ambiguous
        type: Integer
      - name: held
        type: Integer

