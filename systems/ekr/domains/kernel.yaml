domain: ekr.kernel

summary: >-
  The trusted kernel: stable identity, the transaction boundary and the revision lineage. A
  proposal becomes a validated transaction only through the validators this domain names, and only
  a validated transaction commits a revision. Design § 9–10, § 19–20, § 34, § 70–72.

naming:
  wire: kernel
  display: Kernel

types:
  - name: ekr.kernel.AgentId
    kind: newtype
    of: Uuid

  - name: ekr.kernel.TransactionId
    kind: newtype
    of: Uuid

  - name: ekr.kernel.RevisionId
    kind: newtype
    of: Uuid

  - name: ekr.kernel.IssueId
    kind: newtype
    of: Uuid

  - name: ekr.kernel.RevisionNumber
    kind: newtype
    of: Integer

  # Hex-encoded SHA-256 over canonical bytes. Design § 57.
  - name: ekr.kernel.ContentHash
    kind: newtype
    of: String

  # Existing indices 0–10 stay fixed; §88 appends SupersedeAssertion at index11 in new-format
  # transactions. Legacy verification retains the original eleven variants and scalar retraction.
  # Design §19 plus amendments87–91.
  - name: ekr.kernel.OperationKind
    kind: enum
    variants:
      - CreateNode
      - UpdateProperty
      - CreateEdge
      - DeleteEdge
      - AddAssertion
      - RetractAssertion
      - DefineNodeType
      - DefineEdgeType
      - ModifyProperty
      - MergeEntity
      - Invoke
      - SupersedeAssertion

  # Design § 20 items 1–7. Items 8–10 (contradiction, temporal consistency, policy) arrive with the
  # subsystems that need them and are added here together with the outcome that runs them.
  - name: ekr.kernel.ValidatorName
    kind: enum
    variants:
      - Structural
      - Reference
      - Type
      - Cardinality
      - OntologyConstraint
      - Provenance
      - Authorization

  # Amendments88–91. These named contracts precede production activation. They are ESS typed
  # projections, not a second serializer. Exact format literals, strict semantic fields, UUID map
  # keys, set ordering and cross-record equality are checked by the kernel codecs and replay.
  - name: ekr.kernel.EventId
    kind: newtype
    of: Uuid

  - name: ekr.kernel.SeedDocumentPath
    kind: newtype
    of: String

  - name: ekr.kernel.TransactionDocumentPath
    kind: newtype
    of: String

  # Required literal: "ekr.authority-state/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.AuthorityStateFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.p1-validation-profile/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ValidationProfileFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.p1-deterministic/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.RulesetV1
    kind: newtype
    of: String

  # Required literal: "distinct-authenticated-actor/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ProposerSeparationV1
    kind: newtype
    of: String

  # Required literal: "retained-admissible-evidence/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ProvenanceProfileV1
    kind: newtype
    of: String

  # Required literal: "ekr.p1-apply/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ApplicationProfileV1
    kind: newtype
    of: String

  # Required literal: "ekr.proposal-record/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ProposalRecordFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.validation-basis/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ValidationBasisFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.validation-receipt/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ValidationReceiptFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.validation-material/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ValidationMaterialFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.commit-receipt/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.CommitReceiptFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.seed-result/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.SeedResultFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.rejection-record/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.RejectionRecordFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.stale-record/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.StaleRecordFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.transaction-document/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.TransactionDocumentFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr-seed/2". Runtime version dispatch enforces it.
  - name: ekr.kernel.SeedDocumentFormatV2
    kind: newtype
    of: String

  # Required literal: "ekr-seed-envelope/2". Runtime version dispatch enforces it.
  - name: ekr.kernel.SeedEnvelopeFormatV2
    kind: newtype
    of: String

  # Required literal: "ekr.revision-event/2". Runtime version dispatch enforces it.
  - name: ekr.kernel.RevisionEventFormatV2
    kind: newtype
    of: String

  - name: ekr.kernel.RegisteredAgent
    kind: struct
    fields:
      - name: id
        type: ekr.kernel.AgentId
      - name: name
        type: String
      - name: capabilities
        type: List<String>

  - name: ekr.kernel.P1ValidationProfileV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.ValidationProfileFormatV1
      - name: ruleset
        type: ekr.kernel.RulesetV1
      - name: checks
        type: List<ekr.kernel.ValidatorName>
      - name: validator
        type: ekr.kernel.AgentId
      - name: proposer_separation
        type: ekr.kernel.ProposerSeparationV1
      - name: provenance
        type: ekr.kernel.ProvenanceProfileV1
      - name: application
        type: ekr.kernel.ApplicationProfileV1

  - name: ekr.kernel.AuthorityStateV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.AuthorityStateFormatV1
      - name: agents
        type: Map<String, ekr.kernel.RegisteredAgent>
      - name: validation_profile
        type: ekr.kernel.P1ValidationProfileV1

  - name: ekr.kernel.BootstrapContext
    kind: struct
    fields:
      - name: operator
        type: ekr.kernel.AgentId
      - name: validator
        type: ekr.kernel.AgentId

  - name: ekr.kernel.SeedInputV2Projection
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.SeedDocumentFormatV2
      - name: ontology
        type: ekr.ontology.OntologyDocumentProjection
      - name: graph
        type: ekr.graph.GraphDocumentV2Projection
      - name: evidence_payloads
        type: Map<String, Bytes>

  - name: ekr.kernel.SeedEnvelopeV2Projection
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.SeedEnvelopeFormatV2
      - name: input
        type: ekr.kernel.SeedInputV2Projection
      - name: context
        type: ekr.kernel.BootstrapContext
      - name: authority
        type: ekr.kernel.AuthorityStateV1
      - name: committed_at
        type: Timestamp

  - name: ekr.kernel.ProposalRecordV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.ProposalRecordFormatV1
      - name: event_id
        type: ekr.kernel.EventId
      - name: submitted_at
        type: Timestamp
      - name: submitter
        type: ekr.kernel.AgentId
      - name: document_hash
        type: ekr.kernel.ContentHash
      - name: document_bytes
        type: Bytes
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: operation_count
        type: Integer
      - name: evidence_hash
        type: ekr.kernel.ContentHash
      - name: canonical_transaction_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: canonical_operations_hash
        type: Optional<ekr.kernel.ContentHash>

  - name: ekr.kernel.ValidationBasisV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.ValidationBasisFormatV1
      - name: graph_root_id
        type: ekr.graph.GraphRootId
      - name: previous_revision_id
        type: ekr.kernel.RevisionId
      - name: previous_event_id
        type: ekr.kernel.EventId
      - name: previous_record_hash
        type: ekr.kernel.ContentHash
      - name: previous_root
        type: ekr.graph.RevisionRoot
      - name: previous_root_hash
        type: ekr.kernel.ContentHash
      - name: seed_hash
        type: ekr.kernel.ContentHash
      - name: ontology_root
        type: ekr.kernel.ContentHash
      - name: authority_root
        type: ekr.kernel.ContentHash
      - name: validation_profile_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.ValidationReceiptV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.ValidationReceiptFormatV1
      - name: event_id
        type: ekr.kernel.EventId
      - name: proposed_event_id
        type: ekr.kernel.EventId
      - name: proposal_record_hash
        type: ekr.kernel.ContentHash
      - name: transaction_hash
        type: ekr.kernel.ContentHash
      - name: operations_hash
        type: ekr.kernel.ContentHash
      - name: evidence_hash
        type: ekr.kernel.ContentHash
      - name: operation_count
        type: Integer
      - name: basis
        type: ekr.kernel.ValidationBasisV1
      - name: validators
        type: List<ekr.kernel.AgentId>
      - name: validated_at
        type: Timestamp
      - name: validation_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.CommitReceiptV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.CommitReceiptFormatV1
      - name: event_id
        type: ekr.kernel.EventId
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: proposal
        type: ekr.kernel.ProposalRecordV1
      - name: validation
        type: ekr.kernel.ValidationReceiptV1
      - name: validation_record_hash
        type: ekr.kernel.ContentHash
      - name: committer
        type: ekr.kernel.AgentId
      - name: committed_at
        type: Timestamp
      - name: result
        type: ekr.graph.RevisionRoot
      - name: result_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.SeedResultV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.SeedResultFormatV1
      - name: event_id
        type: ekr.kernel.EventId
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: seed_hash
        type: ekr.kernel.ContentHash
      - name: authority_root
        type: ekr.kernel.ContentHash
      - name: committed_at
        type: Timestamp
      - name: result
        type: ekr.graph.RevisionRoot
      - name: result_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.ValidationIssueRecord
    kind: struct
    fields:
      - name: id
        type: ekr.kernel.IssueId
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: validator
        type: ekr.kernel.ValidatorName
      - name: code
        type: String
      - name: message
        type: String

  - name: ekr.kernel.RejectionRecordV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.RejectionRecordFormatV1
      - name: event_id
        type: ekr.kernel.EventId
      - name: proposed_event_id
        type: ekr.kernel.EventId
      - name: proposal_record_hash
        type: ekr.kernel.ContentHash
      - name: requested_basis
        type: ekr.kernel.ValidationBasisV1
      - name: validator
        type: ekr.kernel.AgentId
      - name: rejected_at
        type: Timestamp
      - name: issues
        type: List<ekr.kernel.ValidationIssueRecord>

  - name: ekr.kernel.StaleRecordV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.StaleRecordFormatV1
      - name: event_id
        type: ekr.kernel.EventId
      - name: validation_record_hash
        type: ekr.kernel.ContentHash
      - name: expected_basis
        type: ekr.kernel.ValidationBasisV1
      - name: observed_revision_id
        type: ekr.kernel.RevisionId
      - name: observed_event_id
        type: ekr.kernel.EventId
      - name: observed_record_hash
        type: ekr.kernel.ContentHash
      - name: observed_root
        type: ekr.graph.RevisionRoot
      - name: observed_root_hash
        type: ekr.kernel.ContentHash
      - name: stale_at
        type: Timestamp

  # Canonical transaction projection only. The transient input is exactly the full typed Rust
  # GraphTransaction<Value> inside the retained YAML document; no JSON/Decimal coercion occurs.
  - name: ekr.kernel.NodeDraftProjection
    kind: struct
    fields:
      - name: id
        type: ekr.graph.NodeId
      - name: root_id
        type: ekr.graph.GraphRootId
      - name: type_id
        type: ekr.ontology.TypeId
      - name: canonical_name
        type: String
      - name: properties
        type: Map<String, List<ekr.graph.TypedValue>>

  - name: ekr.kernel.PropertyMutationProjection
    kind: struct
    fields:
      - name: node
        type: ekr.graph.NodeId
      - name: property
        type: ekr.ontology.PropertyId
      - name: values
        type: List<ekr.graph.TypedValue>

  - name: ekr.kernel.EdgeDraftProjection
    kind: struct
    fields:
      - name: id
        type: ekr.graph.EdgeId
      - name: root_id
        type: ekr.graph.GraphRootId
      - name: type_id
        type: ekr.ontology.TypeId
      - name: source
        type: ekr.graph.NodeId
      - name: target
        type: ekr.graph.NodeId
      - name: properties
        type: Map<String, List<ekr.graph.TypedValue>>

  - name: ekr.kernel.Retraction
    kind: struct
    fields:
      - name: assertion
        type: ekr.graph.AssertionId
      - name: reason
        type: String

  - name: ekr.kernel.Supersession
    kind: struct
    fields:
      - name: assertion
        type: ekr.graph.AssertionId
      - name: by
        type: ekr.graph.AssertionId
      - name: effective_from
        type: Timestamp

  - name: ekr.kernel.EntityMerge
    kind: struct
    fields:
      - name: absorbed
        type: ekr.graph.NodeId
      - name: into
        type: ekr.graph.NodeId

  - name: ekr.kernel.InvocationProjection
    kind: struct
    fields:
      - name: node
        type: ekr.graph.NodeId
      - name: operation
        type: String
      - name: arguments
        type: Map<String, ekr.graph.TypedValue>

  - name: ekr.kernel.CanonicalOperationProjection
    kind: union
    tag: kind
    variants:
      CreateNode: ekr.kernel.NodeDraftProjection
      UpdateProperty: ekr.kernel.PropertyMutationProjection
      CreateEdge: ekr.kernel.EdgeDraftProjection
      DeleteEdge: ekr.graph.EdgeId
      AddAssertion: ekr.graph.AssertionRecord
      RetractAssertion: ekr.kernel.Retraction
      DefineNodeType: ekr.ontology.NodeTypeDeclaration
      DefineEdgeType: ekr.ontology.EdgeTypeDeclaration
      ModifyProperty: ekr.ontology.PropertyDeclaration
      MergeEntity: ekr.kernel.EntityMerge
      Invoke: ekr.kernel.InvocationProjection
      SupersedeAssertion: ekr.kernel.Supersession

  - name: ekr.kernel.CanonicalTransactionProjection
    kind: struct
    fields:
      - name: id
        type: ekr.kernel.TransactionId
      - name: proposer
        type: ekr.kernel.AgentId
      - name: operations
        type: List<ekr.kernel.CanonicalOperationProjection>
      - name: evidence
        type: List<ekr.graph.EvidenceId>

  - name: ekr.kernel.ValidationMaterialV1Projection
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.ValidationMaterialFormatV1
      - name: transaction
        type: ekr.kernel.CanonicalTransactionProjection
      - name: basis
        type: ekr.kernel.ValidationBasisV1
      - name: validators
        type: List<ekr.kernel.AgentId>

  - name: ekr.kernel.SeededPayload
    kind: struct
    fields:
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: seed_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.ProposedPayload
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: proposer
        type: ekr.kernel.AgentId
      - name: operations_hash
        type: Optional<ekr.kernel.ContentHash>

  - name: ekr.kernel.ValidatedPayload
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: against
        type: ekr.kernel.RevisionNumber
      - name: validation_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.RejectedPayload
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: issues
        type: Integer

  - name: ekr.kernel.StalePayload
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: validated_against
        type: ekr.kernel.RevisionNumber
      - name: current
        type: ekr.kernel.RevisionNumber

  - name: ekr.kernel.CommittedPayload
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: knowledge_root
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.RevisionPayload
    kind: union
    tag: kind
    variants:
      Seeded: ekr.kernel.SeededPayload
      TransactionProposed: ekr.kernel.ProposedPayload
      TransactionValidated: ekr.kernel.ValidatedPayload
      TransactionRejected: ekr.kernel.RejectedPayload
      TransactionStale: ekr.kernel.StalePayload
      RevisionCommitted: ekr.kernel.CommittedPayload

  - name: ekr.kernel.RevisionEventV2
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.RevisionEventFormatV2
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: payload
        type: ekr.kernel.RevisionPayload

  # Command responses expose actual retained decisions, without adding persisted formats.
  - name: ekr.kernel.ValidationCommandResult
    kind: union
    tag: kind
    variants:
      Validated: ekr.kernel.ValidationReceiptV1
      Rejected: ekr.kernel.RejectionRecordV1

  - name: ekr.kernel.CommitCommandResult
    kind: union
    tag: kind
    variants:
      Committed: ekr.kernel.CommitReceiptV1
      Stale: ekr.kernel.StaleRecordV1

  # CLI host transport is trusted local configuration, separate from command documents.
  # Decoder acceptance remains unexecuted until task:strict-cli-host-input lands.
  - name: ekr.kernel.CliHostFormatV1
    kind: enum
    variants: [ekr.cli-host/1]

  - name: ekr.kernel.CliHostConfigurationV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.CliHostFormatV1
      - name: tenant
        type: String
      - name: context
        type: ekr.kernel.BootstrapContext
      - name: authority
        type: ekr.kernel.AuthorityStateV1

entities:
  # Design § 18. TrustProfile (§ 48) is a P5 concern and is not typed here yet.
  - name: ekr.kernel.Agent
    identity:
      name: agent_id
      type: ekr.kernel.AgentId
    fields:
      - name: name
        type: String
      - name: capabilities
        type: List<String>
    relations:
      - name: proposals
        kind: owns
        target: ekr.kernel.GraphTransaction
        cardinality: many
        via: proposer
    lifecycle:
      initial: Registered
      states: [Registered]
      terminal: [Registered]

  # §91. The retained exact document is authoritative. Canonical hashes are absent for a
  # well-formed proposal whose values are not canonical; the count and evidence hash are derived.
  - name: ekr.kernel.GraphTransaction
    identity:
      name: transaction_id
      type: ekr.kernel.TransactionId
    fields:
      - name: proposer
        type: ekr.kernel.AgentId
      - name: document_hash
        type: ekr.kernel.ContentHash
      - name: proposal_record_hash
        type: ekr.kernel.ContentHash
      - name: canonical_transaction_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: canonical_operations_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: operation_count
        type: Integer
      - name: evidence_hash
        type: ekr.kernel.ContentHash
      - name: validation_basis
        type: Optional<ekr.kernel.ValidationBasisV1>
      - name: validated_against
        type: Optional<ekr.kernel.RevisionNumber>
      - name: validation_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: validation_record_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: terminal_record_hash
        type: Optional<ekr.kernel.ContentHash>
    invariants:
      - operation_count >= 1
    relations:
      - name: issues
        kind: owns
        target: ekr.kernel.ValidationIssue
        cardinality: many
        via: transaction_id
    lifecycle:
      initial: Proposed
      states: [Proposed, Validated, Committed, Rejected, Stale]
      terminal: [Committed, Rejected, Stale]
      transitions:
        - name: validate
          from: [Proposed]
          to: Validated
        - name: reject
          from: [Proposed]
          to: Rejected
        - name: commit
          from: [Validated]
          to: Committed
        - name: stale
          from: [Validated]
          to: Stale

  - name: ekr.kernel.ValidationIssue
    identity:
      name: issue_id
      type: ekr.kernel.IssueId
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: validator
        type: ekr.kernel.ValidatorName
      - name: code
        type: String
      - name: message
        type: String
    lifecycle:
      initial: Raised
      states: [Raised]
      terminal: [Raised]

  # Design § 34. Immutable once committed. `Seed` creates the first; `Commit` announces every later
  # one in `RevisionCommitted` — an outcome causes one subject change, and Commit's is the
  # transaction's move, so the revision it produces is read from the event and the view below.
  - name: ekr.kernel.Revision
    identity:
      name: revision_id
      type: ekr.kernel.RevisionId
    fields:
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: parent
        type: Optional<ekr.kernel.RevisionId>
      - name: ontology_root
        type: ekr.kernel.ContentHash
      - name: knowledge_root
        type: ekr.kernel.ContentHash
      - name: evidence_root
        type: ekr.kernel.ContentHash
      - name: agent_root
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: Optional<ekr.kernel.TransactionId>
      - name: committed_at
        type: Timestamp
    lifecycle:
      initial: Committed
      states: [Committed]
      terminal: [Committed]

# Design § 6.10: the actor that proposes is never the sole basis of validation. Three actors, so a
# conformance suite can hold an implementation to the separation.
actors:
  - name: ekr.kernel.Proposer
    may:
      - ekr.kernel.Propose
    naming:
      display: Proposing agent

  - name: ekr.kernel.Validator
    may:
      - ekr.kernel.Validate
    naming:
      display: Validator

  - name: ekr.kernel.Committer
    may:
      - ekr.kernel.Commit
    naming:
      display: Commit gate

  - name: ekr.kernel.Operator
    may:
      - ekr.kernel.Seed
      - ekr.kernel.Snapshot
      - ekr.kernel.Explain
    naming:
      display: Operator

errors:
  # P1-08 admission acceptance was unexecuted at declaration; the kernel seed suite supplies
  # the behavioral cases. This contract does not certify the later durable writer.
  - name: ekr.kernel.InvalidSeed
    summary: Seed admission refused before canonical state or its lineage was written.
    fields:
      - name: code
        type: String
      - name: reason
        type: String

  - name: ekr.kernel.AlreadySeeded
    summary: A retained seed exists but its full parsed input, actual bootstrap context or trusted host authority anchor differs; an exact logical retry returns its retained result.
    fields:
      - name: current
        type: ekr.kernel.RevisionNumber

  - name: ekr.kernel.StructurallyInvalid
    summary: The proposal is not a well-formed transaction; nothing was recorded.
    fields:
      - name: reason
        type: String

  - name: ekr.kernel.TransactionStateConflict
    summary: The transaction is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: ekr.kernel.GraphTransaction.State

  - name: ekr.kernel.TransactionNotFound
    summary: No retained transaction carries the requested identity; no state or decision is invented.
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId

  - name: ekr.kernel.RevisionNotFound
    summary: No committed revision carries that number.
    fields:
      - name: requested
        type: ekr.kernel.RevisionNumber

  - name: ekr.kernel.AssertionNotFound
    summary: No assertion carries that identity in the canonical core.
    fields:
      - name: requested
        type: ekr.graph.AssertionId

commands:
  # Design § 8. The seed is the minimal trusted starting state; loading it produces revision 0.
  - name: ekr.kernel.Seed
    naming:
      wire: seed
      display: Load the seed
    input:
      - name: seed_document
        type: ekr.kernel.SeedDocumentPath
    response:
      - name: result
        type: ekr.kernel.SeedResultV1
    outcomes:
      - name: seeded
        creates: ekr.kernel.Revision
        instance: revision_id
        emits:
          - ekr.kernel.Seeded
        payload:
          ekr.kernel.Seeded:
            event_id: {generated: true}
            record_hash: {generated: true}
            revision_id: {generated: true}
            seed_hash: {generated: true}
        summary: Revision0 and its complete retained seed result exist atomically; real ontology and authority roots have no placeholders.
      - name: already-seeded
        external: a retained seed exists and its parsed full Seed2 input or actual BootstrapContext or trusted host AuthorityStateV1 anchor differs
        error: ekr.kernel.AlreadySeeded
        summary: Nothing was written; compare retained typed input and actual trusted context before allocating an occurrence or sampling time. YAML whitespace alone is not a different logical seed.
      - name: retained-seed
        external: a retained seed has the same full parsed Seed2 input, actual BootstrapContext and trusted host AuthorityStateV1 anchor
        replays: seeded
        summary: Return the original SeedResultV1 and preserve its original Revision, including after head advancement; allocate no new occurrence, sample no new time and write nothing.
      - name: invalid-seed
        external: deterministic bootstrap validation refuses the seed
        error: ekr.kernel.InvalidSeed
        summary: Nothing was written; the refusal identifies the violated bootstrap rule.

  # Design § 19. Structural validity is checked at the door; every other validator runs in Validate.
  - name: ekr.kernel.Propose
    naming:
      wire: propose
      display: Propose a transaction
    input:
      - name: transaction_document
        type: ekr.kernel.TransactionDocumentPath
    response:
      - name: result
        type: ekr.kernel.ProposalRecordV1
    outcomes:
      - name: proposed
        creates: ekr.kernel.GraphTransaction
        instance: transaction_id
        emits:
          - ekr.kernel.TransactionProposed
        payload:
          ekr.kernel.TransactionProposed:
            event_id: {generated: true}
            record_hash: {generated: true}
            transaction_id: {generated: true}
            proposer: {generated: true}
            operations_hash: {generated: true}
        summary: Exact document bytes and trusted submitter are retained; nothing canonical changed.
      - name: malformed
        external: strict document parsing or structural admission refuses before recording
        error: ekr.kernel.StructurallyInvalid
        summary: Unknown versions, malformed documents and empty operation lists record nothing.

  # Design § 20. Deterministic validators 1–7 run against one snapshot; the revision they ran
  # against is recorded so Commit can notice movement.
  - name: ekr.kernel.Validate
    naming:
      wire: validate
      display: Validate a transaction
    input:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: against
        type: ekr.kernel.RevisionNumber
    response:
      - name: result
        type: ekr.kernel.ValidationCommandResult
    outcomes:
      - name: validated
        moves: ekr.kernel.GraphTransaction.validate
        instance: transaction_id
        emits:
          - ekr.kernel.TransactionValidated
        payload:
          ekr.kernel.TransactionValidated:
            event_id: {generated: true}
            record_hash: {generated: true}
            transaction_id: input.transaction_id
            against: input.against
            validation_hash: {generated: true}
        sets:
          validated_against: input.against
        summary: Every validator passed against the named revision; the transaction is Validated.
      - name: rejected
        external: at least one deterministic validator raised an issue against the named revision
        moves: ekr.kernel.GraphTransaction.reject
        instance: transaction_id
        emits:
          - ekr.kernel.TransactionRejected
        payload:
          ekr.kernel.TransactionRejected:
            event_id: {generated: true}
            record_hash: {generated: true}
            transaction_id: input.transaction_id
            issues: {generated: true}
        summary: At least one validator raised an issue; the issues are recorded and the transaction is Rejected.
      - name: revision-not-found
        external: the transaction is Proposed and no committed revision carries input.against
        error: ekr.kernel.RevisionNotFound
        summary: Leave the transaction Proposed with no validation or rejection receipt or event; an older existing revision is still a valid basis and may become Stale only at Commit.
      - name: transaction-not-found
        external: no retained transaction carries input.transaction_id
        error: ekr.kernel.TransactionNotFound
        summary: Refuse before state or revision-basis evaluation; write no object, receipt, issue or event.
      - name: wrong-state
        wrong_state: true
        error: ekr.kernel.TransactionStateConflict
        summary: The transaction is not Proposed, so nothing was validated.

  # Design § 19, § 34, § 72. Only a Validated transaction commits, and only against the revision it
  # was validated against; otherwise it is Stale and a new proposal is needed.
  - name: ekr.kernel.Commit
    naming:
      wire: commit
      display: Commit a validated transaction
    input:
      - name: transaction_id
        type: ekr.kernel.TransactionId
    response:
      - name: result
        type: ekr.kernel.CommitCommandResult
    outcomes:
      - name: committed
        when_subject_state: Validated
        moves: ekr.kernel.GraphTransaction.commit
        instance: transaction_id
        emits:
          - ekr.kernel.RevisionCommitted
        payload:
          ekr.kernel.RevisionCommitted:
            event_id: {generated: true}
            record_hash: {generated: true}
            transaction_id: input.transaction_id
            revision_id: {generated: true}
            number: {generated: true}
            knowledge_root: {generated: true}
        summary: A new immutable revision exists whose parent is the one validated against.
      - name: stale
        external: the canonical revision moved since the transaction was validated
        moves: ekr.kernel.GraphTransaction.stale
        instance: transaction_id
        emits:
          - ekr.kernel.TransactionStale
        payload:
          ekr.kernel.TransactionStale:
            event_id: {generated: true}
            record_hash: {generated: true}
            transaction_id: input.transaction_id
            validated_against: {generated: true}
            current: {generated: true}
        summary: Canonical state moved since validation; nothing committed and the transaction is Stale.
      - name: retained-commit
        when_subject_state: Committed
        replays: committed
        summary: Return this transaction's original CommitReceiptV1, including after head advancement; preserve the transaction and publish no event or object.
      - name: transaction-not-found
        external: no retained transaction carries input.transaction_id
        error: ekr.kernel.TransactionNotFound
        summary: Refuse before state or staleness evaluation; write no object, receipt or event.
      - name: wrong-state
        error: ekr.kernel.TransactionStateConflict
        summary: Proposed, Rejected and Stale transactions refuse without a commit, event or subject change.

  # Design § 71. A read over an immutable revision; the default is the newest.
  - name: ekr.kernel.Snapshot
    naming:
      wire: snapshot
      display: Read a snapshot
    input:
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
    outcomes:
      - name: taken
        emits:
          - ekr.kernel.SnapshotTaken
        payload:
          ekr.kernel.SnapshotTaken:
            number: {generated: true}
            knowledge_root: {generated: true}
        summary: The snapshot is consistent as of one revision and records which.
      - name: not-found
        external: no revision carries the requested number
        error: ekr.kernel.RevisionNotFound
        summary: Nothing was read.

  # Design § 62. Why is this true: assertion → transaction → validation → evidence → observation.
  - name: ekr.kernel.Explain
    naming:
      wire: explain
      display: Explain an assertion
    input:
      - name: assertion_id
        type: ekr.graph.AssertionId
    outcomes:
      - name: explained
        emits:
          - ekr.kernel.Explained
        payload:
          ekr.kernel.Explained:
            assertion_id: input.assertion_id
            links: {generated: true}
        summary: The chain from the assertion to its external sources, one link per line.
      - name: not-found
        external: the canonical core holds no such assertion
        error: ekr.kernel.AssertionNotFound
        summary: Nothing was explained.

# The six durable event declarations flatten only the envelope's event_id/record_hash plus its
# named metadata payload for command/view projection. The actual strict wire envelope is
# RevisionEventV2; record_hash selects the corresponding full retained record (§91).
events:
  - name: ekr.kernel.Seeded
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: seed_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.TransactionProposed
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: proposer
        type: ekr.kernel.AgentId
      - name: operations_hash
        type: Optional<ekr.kernel.ContentHash>

  - name: ekr.kernel.TransactionValidated
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: against
        type: ekr.kernel.RevisionNumber
      - name: validation_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.TransactionRejected
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: issues
        type: Integer

  - name: ekr.kernel.TransactionStale
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: validated_against
        type: ekr.kernel.RevisionNumber
      - name: current
        type: ekr.kernel.RevisionNumber

  - name: ekr.kernel.RevisionCommitted
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: knowledge_root
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.SnapshotTaken
    fields:
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: knowledge_root
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.Explained
    fields:
      - name: assertion_id
        type: ekr.graph.AssertionId
      - name: links
        type: Integer

views:
  # All retained states, including Committed, Rejected and Stale, reconstructed from real records.
  # This query is an ESS read surface, not a seventh P1 CLI command.
  - name: ekr.kernel.Transactions
    source: ekr.kernel.GraphTransaction
    consistency: read_your_writes
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: proposer
        type: ekr.kernel.AgentId
      - name: document_hash
        type: ekr.kernel.ContentHash
      - name: proposal_record_hash
        type: ekr.kernel.ContentHash
      - name: canonical_transaction_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: canonical_operations_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: operation_count
        type: Integer
      - name: evidence_hash
        type: ekr.kernel.ContentHash
      - name: validation_basis
        type: Optional<ekr.kernel.ValidationBasisV1>
      - name: validated_against
        type: Optional<ekr.kernel.RevisionNumber>
      - name: validation_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: validation_record_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: terminal_record_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: state
        type: ekr.kernel.GraphTransaction.State

  # Complete immutable revisions, including the original seed after later commits.
  # Replay observation selects the original emitted identity; this adds no CLI verb.
  - name: ekr.kernel.Revisions
    source: ekr.kernel.Revision
    consistency: read_your_writes
    fields:
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: parent
        type: Optional<ekr.kernel.RevisionId>
      - name: ontology_root
        type: ekr.kernel.ContentHash
      - name: knowledge_root
        type: ekr.kernel.ContentHash
      - name: evidence_root
        type: ekr.kernel.ContentHash
      - name: agent_root
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: Optional<ekr.kernel.TransactionId>
      - name: committed_at
        type: Timestamp
      - name: state
        type: ekr.kernel.Revision.State

  - name: ekr.kernel.CurrentRevision
    source: ekr.kernel.Revision
    consistency: read_your_writes
    order_by:
      - number desc
    fields:
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: knowledge_root
        type: ekr.kernel.ContentHash
    naming:
      wire: current-revision
      display: Current revision

  - name: ekr.kernel.PendingTransactions
    source: ekr.kernel.GraphTransaction
    consistency: read_your_writes
    filter: state == Proposed
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: proposer
        type: ekr.kernel.AgentId
      - name: operation_count
        type: Integer
    naming:
      wire: pending
      display: Pending transactions
