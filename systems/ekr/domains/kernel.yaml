domain: ekr.kernel

summary: >-
  The trusted kernel: stable identity, the transaction boundary and the revision lineage. A
  proposal becomes a validated transaction only through the validators this domain names, and only
  a validated transaction commits a revision. Design § 9–10, § 19–20, § 34, § 70–72.

naming:
  wire: kernel
  display: Kernel

types:
  - name: ekr.kernel.HumanDecisionFormat
    kind: enum
    variants:
    - name: HumanDecision1
      wire: ekr.human-decision/1
  - name: ekr.kernel.ReviewerTrustFormat
    kind: enum
    variants:
    - name: ReviewerTrust1
      wire: ekr.reviewer-trust/1
  - name: ekr.kernel.ReviewSignatureAlgorithm
    kind: enum
    variants:
    - Ed25519
  - name: ekr.kernel.HumanDecisionScope
    kind: enum
    variants:
    - AnswerAttention
    - ApproveSchemaProposal
    - RejectSchemaProposal
    - UpgradeAuthority
  - name: ekr.kernel.HumanDecisionAudience
    kind: struct
    fields:
    - name: tenant
      type: String
    - name: seed_anchor
      type: ekr.kernel.ContentHash
  - name: ekr.kernel.ReviewerVerificationKey
    kind: struct
    fields:
    - name: key_digest
      type: ekr.kernel.ContentHash
    - name: algorithm
      type: ekr.kernel.ReviewSignatureAlgorithm
    - name: public_key
      type: Bytes
    - name: operator
      type: ekr.kernel.TrustedOperatorIdentity
    - name: scopes
      type: List<ekr.kernel.HumanDecisionScope>
  - name: ekr.kernel.ReviewerTrustPolicy
    kind: struct
    fields:
    - name: format
      type: ekr.kernel.ReviewerTrustFormat
    - name: audience
      type: ekr.kernel.HumanDecisionAudience
    - name: keys
      type: List<ekr.kernel.ReviewerVerificationKey>
  - name: ekr.kernel.TrustedReviewHostBinding
    kind: struct
    fields:
    - name: audience
      type: ekr.kernel.HumanDecisionAudience
    - name: reviewer_policy_digest
      type: ekr.kernel.ContentHash
  - name: ekr.kernel.AttentionAnswerTarget
    kind: struct
    fields:
    - name: dispute_id
      type: ekr.kernel.DisputeId
    - name: basis
      type: ekr.kernel.ReviewBasis
    - name: corrections_digest
      type: ekr.kernel.ContentHash
  - name: ekr.kernel.SchemaReviewTarget
    kind: struct
    fields:
    - name: proposal_id
      type: ekr.integrate.SchemaProposalId
    - name: proposal_digest
      type: ekr.kernel.ContentHash
    - name: basis
      type: ekr.kernel.ReviewBasis
  - name: ekr.kernel.AuthorityUpgradeTarget
    kind: struct
    fields:
    - name: preview_digest
      type: ekr.kernel.ContentHash
    - name: reviewer_policy_digest
      type: ekr.kernel.ContentHash
  - name: ekr.kernel.HumanDecisionTarget
    kind: union
    tag: kind
    variants:
      AnswerAttention: ekr.kernel.AttentionAnswerTarget
      ApproveSchemaProposal: ekr.kernel.SchemaReviewTarget
      RejectSchemaProposal: ekr.kernel.SchemaReviewTarget
      UpgradeAuthority: ekr.kernel.AuthorityUpgradeTarget
  - name: ekr.kernel.HumanDecisionIntent
    kind: struct
    fields:
    - name: format
      type: ekr.kernel.HumanDecisionFormat
    - name: decision_id
      type: Uuid
    - name: audience
      type: ekr.kernel.HumanDecisionAudience
    - name: reviewer_policy_digest
      type: ekr.kernel.ContentHash
    - name: signer_key_digest
      type: ekr.kernel.ContentHash
    - name: target
      type: ekr.kernel.HumanDecisionTarget
    - name: statement_digest
      type: ekr.kernel.ContentHash
    - name: expected_previous_decision
      type: Optional<ekr.kernel.ContentHash>
  - name: ekr.kernel.SignedHumanDecision
    kind: struct
    fields:
    - name: intent
      type: ekr.kernel.HumanDecisionIntent
    - name: algorithm
      type: ekr.kernel.ReviewSignatureAlgorithm
    - name: signature
      type: Bytes
  - name: ekr.kernel.HumanDecisionRecord
    kind: struct
    fields:
    - {name: proof_object_hash, type: ekr.kernel.ContentHash}
    - {name: policy_object_hash, type: ekr.kernel.ContentHash}
    - {name: statement_object_hash, type: ekr.kernel.ContentHash}
    - name: decision_id
      type: Uuid
    - name: proof_digest
      type: ekr.kernel.ContentHash
    - name: policy_digest
      type: ekr.kernel.ContentHash
    - name: statement_digest
      type: ekr.kernel.ContentHash
    - name: operator
      type: ekr.kernel.TrustedOperatorIdentity
    - name: recorded_at
      type: Timestamp
  - name: ekr.kernel.ReviewerTrustEnrollment
    kind: struct
    fields:
    - name: audience
      type: ekr.kernel.HumanDecisionAudience
    - name: policy_digest
      type: ekr.kernel.ContentHash
    - name: host_binding_digest
      type: ekr.kernel.ContentHash
    - name: upgrade_proof_digest
      type: ekr.kernel.ContentHash
  - name: ekr.kernel.AuthorityTransitionFormat
    kind: enum
    variants: [{name: KnowledgeAuthorityTransition1, wire: ekr.authority-transition/1}]
  - name: ekr.kernel.AnswerOutcome
    kind: enum
    variants: [Resolved, PartiallyResolved, Unresolved, AlreadyApplied]
  - name: ekr.kernel.AnswerReceipt
    kind: struct
    fields:
      - {name: answer_id, type: ekr.kernel.HumanAnswerId}
      - {name: outcome, type: ekr.kernel.AnswerOutcome}
      - {name: transaction_id, type: Optional<ekr.kernel.TransactionId>}
      - {name: revision, type: Optional<ekr.kernel.RevisionNumber>}
      - {name: evidence_id, type: ekr.graph.EvidenceId}
      - {name: remaining, type: List<ekr.kernel.AttentionItem>}
  - name: ekr.kernel.UpgradeContradiction
    kind: struct
    fields:
      - {name: left, type: ekr.graph.AssertionId}
      - {name: right, type: ekr.graph.AssertionId}
      - {name: subject, type: ekr.graph.SubjectProjection}
      - {name: predicate, type: ekr.graph.PredicateProjection}
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.kernel.DisputeId
    kind: newtype
    of: Uuid
  - name: ekr.kernel.HumanAnswerId
    kind: newtype
    of: Uuid
  - name: ekr.kernel.AuthorityTransitionId
    kind: newtype
    of: Uuid
  - name: ekr.kernel.AttentionKind
    kind: enum
    variants:
    - Dispute
    - BlockedIntegration
    - SchemaProposal
  - name: ekr.kernel.ClaimCorrectionKind
    kind: enum
    variants:
    - Choose
    - Retract
    - CorrectTime
    - Unresolved
  - name: ekr.kernel.TrustedOperatorIdentity
    kind: struct
    fields:
    - name: actor
      type: ekr.kernel.AgentId
    - name: authentication_subject
      type: String
  - name: ekr.kernel.ReviewBasis
    kind: struct
    fields:
    - name: observed_revision
      type: ekr.kernel.RevisionNumber
    - name: evidence_digest
      type: ekr.kernel.ContentHash
    - name: options_digest
      type: ekr.kernel.ContentHash
    - name: effects_digest
      type: ekr.kernel.ContentHash
  - name: ekr.kernel.ClaimCorrection
    kind: struct
    fields:
    - name: kind
      type: ekr.kernel.ClaimCorrectionKind
    - name: assertion_id
      type: ekr.graph.AssertionId
    - name: valid_from
      type: Optional<Timestamp>
    - name: valid_to
      type: Optional<Timestamp>
    - name: reason
      type: String
  - name: ekr.kernel.AttentionSubject
    kind: struct
    fields:
    - name: kind
      type: ekr.kernel.AttentionKind
    - name: dispute_id
      type: Optional<ekr.kernel.DisputeId>
    - name: blocker_id
      type: Optional<ekr.integrate.IntegrationBlockerId>
    - name: proposal_id
      type: Optional<ekr.integrate.SchemaProposalId>
  - name: ekr.kernel.AttentionItem
    kind: struct
    fields:
    - name: subject
      type: ekr.kernel.AttentionSubject
    - name: question
      type: String
    - name: basis
      type: ekr.kernel.ReviewBasis
    - name: claims
      type: List<ekr.graph.AssertionId>
    - name: evidence
      type: List<ekr.graph.EvidenceId>
    - name: observations
      type: List<ekr.graph.ObservationId>
  - name: ekr.kernel.AuthorityVersion
    kind: struct
    fields:
    - name: ruleset
      type: ekr.kernel.RulesetV1
    - name: application
      type: ekr.kernel.ApplicationProfileV1
    - name: profile_digest
      type: ekr.kernel.ContentHash
  - name: ekr.kernel.UpgradePreview
    kind: struct
    fields:
    - {name: reviewer_policy_digest, type: ekr.kernel.ContentHash}
    - name: head_revision
      type: ekr.kernel.RevisionNumber
    - name: head_hash
      type: ekr.kernel.ContentHash
    - name: from
      type: ekr.kernel.AuthorityVersion
    - name: to
      type: ekr.kernel.AuthorityVersion
    - name: preview_digest
      type: ekr.kernel.ContentHash
    - name: contradictions
      type: List<ekr.kernel.UpgradeContradiction>
    - name: pending_revalidation
      type: List<ekr.kernel.TransactionId>

  - name: ekr.kernel.AgentId
    kind: newtype
    of: Uuid

  - name: ekr.kernel.TransactionId
    kind: newtype
    of: Uuid

  - name: ekr.kernel.RevisionId
    kind: newtype
    of: Uuid

  - name: ekr.kernel.IssueId
    kind: newtype
    of: Uuid

  - name: ekr.kernel.RevisionNumber
    kind: newtype
    of: Integer

  # Hex-encoded SHA-256 over canonical bytes. Design § 57.
  - name: ekr.kernel.ContentHash
    kind: newtype
    of: String

  # Existing indices 0–10 stay fixed; §88 appends SupersedeAssertion at index11 in new-format
  # transactions. Legacy verification retains the original eleven variants and scalar retraction.
  # AddEvidence is index 12 (decision-blocker:evidence-entry-after-seed, option 1): it carries one
  # ekr.graph.Evidence and the payload bytes its content_hash addresses, and is applied under every
  # validation profile. Design §19 plus amendments87–91. WidenEdgeType is index 13 (design §101,
  # story:edge-type-endpoints-widen): a schema change, as DefineNodeType, DefineEdgeType and
  # ModifyProperty are, admitted only under validation profiles v2 and v3 in a schema-only
  # transaction naming its schema_version, and refused under v1 as unsupported-operation. AddAlias
  # is index 14 (story:node-gains-an-alias): data, not a schema change, applied under every
  # validation profile; it appends one alias to a node that exists
  # (ekr.kernel.AliasAdditionProjection). AttachEvidence is index 15
  # (story:evidence-attaches-to-a-held-assertion, design § 103): data, applied under every
  # validation profile; it attaches evidence canonical state retains, or an AddEvidence of the
  # same transaction adds, to an accepted and active assertion canonical state holds, as an
  # ekr.graph.EvidenceAttachment (ekr.kernel.EvidenceAttachmentProjection).
  - name: ekr.kernel.OperationKind
    kind: enum
    variants:
      - CreateNode
      - UpdateProperty
      - CreateEdge
      - DeleteEdge
      - AddAssertion
      - RetractAssertion
      - DefineNodeType
      - DefineEdgeType
      - ModifyProperty
      - MergeEntity
      - Invoke
      - SupersedeAssertion
      - AddEvidence
      - WidenEdgeType
      - AddAlias
      - AttachEvidence

  # Design § 20 items 1–7. Items 8–10 (contradiction, temporal consistency, policy) arrive with the
  # subsystems that need them and are added here together with the outcome that runs them.
  - name: ekr.kernel.ValidatorName
    kind: enum
    variants:
      - Structural
      - Reference
      - Type
      - Cardinality
      - OntologyConstraint
      - Provenance
      - Authorization

  # Amendments88–91. These named contracts precede production activation. They are ESS typed
  # projections, not a second serializer. Exact format literals, strict semantic fields, UUID map
  # keys, set ordering and cross-record equality are checked by the kernel codecs and replay.
  - name: ekr.kernel.EventId
    kind: newtype
    of: Uuid

  - name: ekr.kernel.SeedDocumentPath
    kind: newtype
    of: String

  - name: ekr.kernel.TransactionDocumentPath
    kind: newtype
    of: String

  # Required literal: "ekr.authority-state/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.AuthorityStateFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.p1-validation-profile/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ValidationProfileFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.p1-deterministic/1" (validation profile v1), "ekr.p2-deterministic/1"
  # (profile v2, which admits schema changes) or "ekr.p3-deterministic/1" (profile v3: v2, and a
  # node or edge id any revision held is never created again), paired with the matching
  # application. Runtime version dispatch enforces it; a store keeps the profile its authority
  # anchor named at seed.
  - name: ekr.kernel.RulesetV1
    kind: newtype
    of: String

  # Required literal: "distinct-authenticated-actor/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ProposerSeparationV1
    kind: newtype
    of: String

  # Required literal: "retained-admissible-evidence/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ProvenanceProfileV1
    kind: newtype
    of: String

  # Required literal: "ekr.p1-apply/1" (profile v1) or "ekr.p2-apply/1" (profiles v2 and v3, under
  # which a committed schema change replaces the ontology with the version it names). Runtime
  # version dispatch enforces it.
  - name: ekr.kernel.ApplicationProfileV1
    kind: newtype
    of: String

  - name: ekr.kernel.ProposalRecordFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.validation-basis/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ValidationBasisFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.validation-receipt/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ValidationReceiptFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.validation-material/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.ValidationMaterialFormatV1
    kind: newtype
    of: String

  - name: ekr.kernel.CommitReceiptFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.seed-result/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.SeedResultFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.rejection-record/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.RejectionRecordFormatV1
    kind: newtype
    of: String

  # Required literal: "ekr.stale-record/1". Runtime version dispatch enforces it.
  - name: ekr.kernel.StaleRecordFormatV1
    kind: newtype
    of: String

  - name: ekr.kernel.TransactionDocumentFormatV1
    kind: enum
    variants: [{name: EkrTransactionDocument1, wire: ekr.transaction-document/1}, {name: EkrTransactionDocument2, wire: ekr.transaction-document/2}]

  # Required literal: "ekr-seed/2". Runtime version dispatch enforces it.
  - name: ekr.kernel.SeedDocumentFormatV2
    kind: newtype
    of: String

  # Required literal: "ekr-seed-envelope/2". Runtime version dispatch enforces it.
  - name: ekr.kernel.SeedEnvelopeFormatV2
    kind: newtype
    of: String

  # Required literal: "ekr-seed-envelope/3". Runtime version dispatch enforces it. Design §100.
  - name: ekr.kernel.SeedEnvelopeFormatV3
    kind: newtype
    of: String

  # Required literal: "ekr.revision-event/2". Runtime version dispatch enforces it.
  - name: ekr.kernel.RevisionEventFormatV2
    kind: newtype
    of: String

  - name: ekr.kernel.RegisteredAgent
    kind: struct
    fields:
      - name: id
        type: ekr.kernel.AgentId
      - name: name
        type: String
      - name: capabilities
        type: List<String>

  - name: ekr.kernel.P1ValidationProfileV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.ValidationProfileFormatV1
      - name: ruleset
        type: ekr.kernel.RulesetV1
      - name: checks
        type: List<ekr.kernel.ValidatorName>
      - name: validator
        type: ekr.kernel.AgentId
      - name: proposer_separation
        type: ekr.kernel.ProposerSeparationV1
      - name: provenance
        type: ekr.kernel.ProvenanceProfileV1
      - name: application
        type: ekr.kernel.ApplicationProfileV1

  - name: ekr.kernel.AuthorityStateV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.AuthorityStateFormatV1
      - name: agents
        type: Map<String, ekr.kernel.RegisteredAgent>
      - name: validation_profile
        type: ekr.kernel.P1ValidationProfileV1

  - name: ekr.kernel.BootstrapContext
    kind: struct
    fields:
      - name: operator
        type: ekr.kernel.AgentId
      - name: validator
        type: ekr.kernel.AgentId

  - name: ekr.kernel.SeedInputV2Projection
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.SeedDocumentFormatV2
      - name: ontology
        type: ekr.ontology.OntologyDocumentProjection
      - name: graph
        type: ekr.graph.GraphDocumentV2Projection
      - name: evidence_payloads
        type: Map<String, Bytes>

  - name: ekr.kernel.SeedEnvelopeV2Projection
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.SeedEnvelopeFormatV2
      - name: input
        type: ekr.kernel.SeedInputV2Projection
      - name: context
        type: ekr.kernel.BootstrapContext
      - name: authority
        type: ekr.kernel.AuthorityStateV1
      - name: committed_at
        type: Timestamp

  # Design §100, added 2026-09-29 by story:seed-envelope-v3-references-payloads. The retained seed
  # input with every evidence payload named by its content hash instead of carried: the ekr-seed/2
  # a seed command reads, less the payload bytes, which are retained once, as Provenance objects
  # under their own addresses, published in the same atomic group as the envelope. The hashes are
  # exactly the keys of the input's evidence_payloads, unique and in ascending order.
  - name: ekr.kernel.SeedInputV3Projection
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.SeedDocumentFormatV2
      - name: ontology
        type: ekr.ontology.OntologyDocumentProjection
      - name: graph
        type: ekr.graph.GraphDocumentV2Projection
      - name: evidence_payloads
        type: List<ekr.kernel.ContentHash>

  # Every new seed retains this envelope; a retained ekr-seed-envelope/2 keeps replaying exactly as
  # before, by exact format dispatch. Replay reads each payload the input names from the store and
  # checks its bytes against its address before admission. A named payload the store holds no
  # object for refuses `seed-evidence-payload-absent: <content hash>` on every read and at
  # publication; a store never substitutes an archived or inline copy for it.
  - name: ekr.kernel.SeedEnvelopeV3Projection
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.SeedEnvelopeFormatV3
      - name: input
        type: ekr.kernel.SeedInputV3Projection
      - name: context
        type: ekr.kernel.BootstrapContext
      - name: authority
        type: ekr.kernel.AuthorityStateV1
      - name: committed_at
        type: Timestamp

  # Design §100.3: the report of the preserving migration (`ekr migrate --to <path>`). The source
  # store is only read: nothing in it is deleted, rewritten or reinterpreted. The destination is a
  # new store at a new path that must hold nothing. It is seeded with the source seed's exact input,
  # context, authority, identities and time under ekr-seed-envelope/3, and every later occurrence
  # is published again with its original event identity, revision identity, actors and times.
  # Proposal records are carried byte for byte; a record naming the seed envelope, a prior root or
  # a prior record is derived again by the kernel for the destination lineage, and the map below
  # says which. Every other object the source holds is carried with its class and stored_at, and a
  # legacy ObjectStored/schema1 inline object is verified under its frozen shape and carried as
  # ObjectStored/schema2 metadata and a provider blob. The destination is published only through
  # the real kernel authority and is replayed in full before the report is returned; the report is
  # also retained in it, as a Canonical object at map_hash. Before its first write the migration
  # retains the fixed Canonical object {"format":"ekr.migration-started/1"} in the destination, and
  # after its last, the report included, {"format":"ekr.migration-finished/1"}; every replay of a
  # store holding the first without the second refuses `migrate-incomplete`, except the migrating
  # handle's own. The CLI refuses a destination that is, lies inside or contains the source
  # (`migrate-destination-is-source`, `-inside-source`, `-contains-source`) before creating it.
  - name: ekr.kernel.MigratedOccurrence
    kind: struct
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: event
        type: String
      - name: source_record_hash
        type: ekr.kernel.ContentHash
      - name: destination_record_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.StoreMigrationV1
    kind: struct
    fields:
      - name: format
        type: String
      - name: source_seed_hash
        type: ekr.kernel.ContentHash
      - name: destination_seed_hash
        type: ekr.kernel.ContentHash
      - name: occurrences
        type: List<ekr.kernel.MigratedOccurrence>
      - name: carried_objects
        type: List<ekr.kernel.ContentHash>
      - name: legacy_objects
        type: List<ekr.kernel.ContentHash>
      - name: map_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.ProposalRecordV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.ProposalRecordFormatV1
      - name: event_id
        type: ekr.kernel.EventId
      - name: submitted_at
        type: Timestamp
      - name: submitter
        type: ekr.kernel.AgentId
      - name: document_hash
        type: ekr.kernel.ContentHash
      - name: document_bytes
        type: Bytes
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: operation_count
        type: Integer
      - name: evidence_hash
        type: ekr.kernel.ContentHash
      - name: canonical_transaction_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: canonical_operations_hash
        type: Optional<ekr.kernel.ContentHash>

  - name: ekr.kernel.ValidationBasisV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.ValidationBasisFormatV1
      - name: graph_root_id
        type: ekr.graph.GraphRootId
      - name: previous_revision_id
        type: ekr.kernel.RevisionId
      - name: previous_event_id
        type: ekr.kernel.EventId
      - name: previous_record_hash
        type: ekr.kernel.ContentHash
      - name: previous_root
        type: ekr.graph.RevisionRoot
      - name: previous_root_hash
        type: ekr.kernel.ContentHash
      - name: seed_hash
        type: ekr.kernel.ContentHash
      - name: ontology_root
        type: ekr.kernel.ContentHash
      - name: authority_root
        type: ekr.kernel.ContentHash
      - name: validation_profile_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.ValidationReceiptV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.ValidationReceiptFormatV1
      - name: event_id
        type: ekr.kernel.EventId
      - name: proposed_event_id
        type: ekr.kernel.EventId
      - name: proposal_record_hash
        type: ekr.kernel.ContentHash
      - name: transaction_hash
        type: ekr.kernel.ContentHash
      - name: operations_hash
        type: ekr.kernel.ContentHash
      - name: evidence_hash
        type: ekr.kernel.ContentHash
      - name: operation_count
        type: Integer
      - name: basis
        type: ekr.kernel.ValidationBasisV1
      - name: validators
        type: List<ekr.kernel.AgentId>
      - name: validated_at
        type: Timestamp
      - name: validation_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.CommitReceiptV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.CommitReceiptFormatV1
      - name: event_id
        type: ekr.kernel.EventId
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: proposal
        type: ekr.kernel.ProposalRecordV1
      - name: validation
        type: ekr.kernel.ValidationReceiptV1
      - name: validation_record_hash
        type: ekr.kernel.ContentHash
      - name: committer
        type: ekr.kernel.AgentId
      - name: committed_at
        type: Timestamp
      - name: result
        type: ekr.graph.RevisionRoot
      - name: result_hash
        type: ekr.kernel.ContentHash
      # Design § 99.5: present in an "ekr.commit-receipt/3", the format new commits retain, and
      # absent from "/2" and "/1", which are still read and keep their bytes.
      - name: created
        type: Optional<ekr.kernel.CreatedIdentitiesV1>

  # The node and edge ids one committed transaction created, ascending: each CreateNode draft's
  # id and each CreateEdge draft's id. Admitting a replay checkpoint under validation profile v3
  # reads them from the receipt, which the commit's event names by digest, instead of parsing the
  # committed proposal; a receipt retained before "/3" names none and its proposal is parsed.
  - name: ekr.kernel.CreatedIdentitiesV1
    kind: struct
    fields:
      - name: nodes
        type: List<ekr.graph.NodeId>
      - name: edges
        type: List<ekr.graph.EdgeId>

  - name: ekr.kernel.SeedResultV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.SeedResultFormatV1
      - name: event_id
        type: ekr.kernel.EventId
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: seed_hash
        type: ekr.kernel.ContentHash
      - name: authority_root
        type: ekr.kernel.ContentHash
      - name: committed_at
        type: Timestamp
      - name: result
        type: ekr.graph.RevisionRoot
      - name: result_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.ValidationIssueRecord
    kind: struct
    fields:
      - name: id
        type: ekr.kernel.IssueId
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: validator
        type: ekr.kernel.ValidatorName
      - name: code
        type: String
      - name: message
        type: String

  - name: ekr.kernel.RejectionRecordV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.RejectionRecordFormatV1
      - name: event_id
        type: ekr.kernel.EventId
      - name: proposed_event_id
        type: ekr.kernel.EventId
      - name: proposal_record_hash
        type: ekr.kernel.ContentHash
      - name: requested_basis
        type: ekr.kernel.ValidationBasisV1
      - name: validator
        type: ekr.kernel.AgentId
      - name: rejected_at
        type: Timestamp
      - name: issues
        type: List<ekr.kernel.ValidationIssueRecord>

  - name: ekr.kernel.StaleRecordV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.StaleRecordFormatV1
      - name: event_id
        type: ekr.kernel.EventId
      - name: validation_record_hash
        type: ekr.kernel.ContentHash
      - name: expected_basis
        type: ekr.kernel.ValidationBasisV1
      - name: observed_revision_id
        type: ekr.kernel.RevisionId
      - name: observed_event_id
        type: ekr.kernel.EventId
      - name: observed_record_hash
        type: ekr.kernel.ContentHash
      - name: observed_root
        type: ekr.graph.RevisionRoot
      - name: observed_root_hash
        type: ekr.kernel.ContentHash
      - name: stale_at
        type: Timestamp

  # Canonical transaction projection only. The transient input is exactly the full typed Rust
  # GraphTransaction<Value> inside the retained YAML document; no JSON/Decimal coercion occurs.
  - name: ekr.kernel.NodeDraftProjection
    kind: struct
    fields:
      - name: id
        type: ekr.graph.NodeId
      - name: root_id
        type: ekr.graph.GraphRootId
      - name: type_id
        type: ekr.ontology.TypeId
      - name: canonical_name
        type: String
      - name: properties
        type: Map<String, List<ekr.graph.TypedValue>>
      - name: aliases
        type: Optional<List<String>>

  - name: ekr.kernel.PropertyMutationProjection
    kind: struct
    fields:
      - name: node
        type: ekr.graph.NodeId
      - name: property
        type: ekr.ontology.PropertyId
      - name: values
        type: List<ekr.graph.TypedValue>

  - name: ekr.kernel.EdgeDraftProjection
    kind: struct
    fields:
      - name: id
        type: ekr.graph.EdgeId
      - name: root_id
        type: ekr.graph.GraphRootId
      - name: type_id
        type: ekr.ontology.TypeId
      - name: source
        type: ekr.graph.NodeId
      - name: target
        type: ekr.graph.NodeId
      - name: properties
        type: Map<String, List<ekr.graph.TypedValue>>

  - name: ekr.kernel.Retraction
    kind: struct
    fields:
      - name: assertion
        type: ekr.graph.AssertionId
      - name: reason
        type: String

  - name: ekr.kernel.Supersession
    kind: struct
    fields:
      - name: assertion
        type: ekr.graph.AssertionId
      - name: by
        type: ekr.graph.AssertionId
      - name: effective_from
        type: Timestamp

  - name: ekr.kernel.EntityMerge
    kind: struct
    fields:
      - name: absorbed
        type: ekr.graph.NodeId
      - name: into
        type: ekr.graph.NodeId

  # `ModifyProperty` in the canonical operation. `owner` is absent only in the P1 shape, the bare
  # declaration P1 refused and v1 stores retain; it then encodes as P1 encoded it, and profile v2
  # refuses it (design § 95).
  - name: ekr.kernel.PropertyModificationProjection
    kind: struct
    fields:
      - name: owner
        type: Optional<ekr.ontology.TypeId>
      - name: property
        type: ekr.ontology.PropertyDeclaration

  # `WidenEdgeType` in the canonical operation: the edge type, then each end written whole, as it
  # is to be — every node type it holds and the declared node types added. Encoded as the three
  # fields in this order, each end as a set. Validation, as named issues of a Rejected
  # transaction raised by OntologyConstraint under the ontology's own codes: an edge type the
  # schema does not declare (unknown-edge-type), a node type it does not declare
  # (unknown-endpoint-type), an end that leaves out a type it holds (edge-endpoint-removed), and
  # ends exactly as they are (schema-change-without-effect); by Structural, two widenings of one
  # edge type in one transaction (conflicting-write). Commit makes the next schema version, with
  # the prior version as its parent; every edge the type holds stays valid, and no node, edge or
  # assertion changes.
  - name: ekr.kernel.EdgeWideningProjection
    kind: struct
    fields:
      - name: edge_type
        type: ekr.ontology.TypeId
      - name: source_types
        type: List<ekr.ontology.TypeId>
      - name: target_types
        type: List<ekr.ontology.TypeId>

  # `AddAlias` in the canonical operation: the node, then the alias, in this order. Commit appends
  # the alias to the node's aliases (ekr.graph.Node), so the alias index of the next head, and
  # every typed reference resolved against it, finds the node by it; no operation removes an alias.
  # Validation holds it to the rules a CreateNode's aliases are held to, as named issues of a
  # Rejected transaction: a node canonical state does not hold and the transaction does not create
  # (unresolved-node, Reference); the empty alias, which identifies nothing (empty-alias,
  # Structural); an alias a node of the root and of the node's type already holds, the node itself
  # included (alias-already-exists, Structural); and an alias the same transaction also gives, by
  # another AddAlias or a CreateNode, to a node of that type (duplicate-alias, Structural).
  - name: ekr.kernel.AliasAdditionProjection
    kind: struct
    fields:
      - name: node
        type: ekr.graph.NodeId
      - name: alias
        type: String

  # `AttachEvidence` in the canonical operation: the assertion, then the evidence, in this order.
  # Commit records an ekr.graph.EvidenceAttachment of the evidence to the assertion at the revision
  # it produces; the assertion itself, its evidence included, is unchanged. The attached evidence
  # is part of what the transaction rests on, so its id is in the transaction's evidence set
  # (evidence-set-mismatch, Structural, otherwise). Validation looks the assertion up by id and
  # refuses, as named issues of a Rejected transaction: an assertion canonical state does not hold
  # (unresolved-assertion, Reference), an assertion the same transaction adds among them; evidence
  # canonical state does not retain and no AddEvidence of the transaction adds
  # (unresolved-evidence, Reference); an assertion that is not accepted and active, or that the
  # same transaction retracts or supersedes (assertion-not-active, Structural); and evidence the
  # assertion already cites, already has attached, or that the transaction attaches to it twice
  # (evidence-already-attached, Structural).
  - name: ekr.kernel.EvidenceAttachmentProjection
    kind: struct
    fields:
      - name: assertion
        type: ekr.graph.AssertionId
      - name: evidence
        type: ekr.graph.EvidenceId

  - name: ekr.kernel.InvocationProjection
    kind: struct
    fields:
      - name: node
        type: ekr.graph.NodeId
      - name: operation
        type: String
      - name: arguments
        type: Map<String, ekr.graph.TypedValue>

  # `AddEvidence`: one evidence entry, as a seed's graph.evidence holds one, and the exact bytes
  # its content_hash addresses (ContentHash::of_bytes, "ekr.payload.v1"). Validation refuses, as
  # named issues of a Rejected transaction: a payload that does not hash to the entry
  # (evidence-payload-mismatch, Provenance), a source other than HumanStatement
  # (evidence-unsupported-source, Provenance), an id canonical state already retains
  # (identity-already-exists, Structural) or that the transaction adds twice (duplicate-identity,
  # Structural). An entry whose extracted_by is not the submitter is refused at Propose as
  # ekr.kernel.ProposalAttribution. An AddAssertion of the same or a later transaction may cite the
  # id; an assertion citing evidence no revision retains and no AddEvidence of its transaction
  # brings is refused as unresolved-evidence (Reference). Commit applies the entry to retained
  # evidence and stores the payload as its own ekr.store object in the Provenance class, beside
  # the Canonical commit receipt; no event carries the bytes. Replay requires that object.
  - name: ekr.kernel.EvidenceAdditionProjection
    kind: struct
    fields:
      - name: evidence
        type: ekr.graph.EvidenceRecord
      - name: payload
        type: Bytes

  - name: ekr.kernel.CanonicalOperationProjection
    kind: union
    tag: kind
    variants:
      CreateNode: ekr.kernel.NodeDraftProjection
      UpdateProperty: ekr.kernel.PropertyMutationProjection
      CreateEdge: ekr.kernel.EdgeDraftProjection
      DeleteEdge: ekr.graph.EdgeId
      AddAssertion: ekr.graph.AssertionRecord
      RetractAssertion: ekr.kernel.Retraction
      DefineNodeType: ekr.ontology.NodeTypeDeclaration
      DefineEdgeType: ekr.ontology.EdgeTypeDeclaration
      ModifyProperty: ekr.kernel.PropertyModificationProjection
      MergeEntity: ekr.kernel.EntityMerge
      Invoke: ekr.kernel.InvocationProjection
      SupersedeAssertion: ekr.kernel.Supersession
      AddEvidence: ekr.kernel.EvidenceAdditionProjection
      WidenEdgeType: ekr.kernel.EdgeWideningProjection
      AddAlias: ekr.kernel.AliasAdditionProjection
      AttachEvidence: ekr.kernel.EvidenceAttachmentProjection

  - name: ekr.kernel.CanonicalTransactionProjection
    kind: struct
    fields:
      - name: id
        type: ekr.kernel.TransactionId
      - name: proposer
        type: ekr.kernel.AgentId
      - name: operations
        type: List<ekr.kernel.CanonicalOperationProjection>
      - name: evidence
        type: List<ekr.graph.EvidenceId>
      # Present exactly when the operations change the schema (profile v2); absent, it is absent
      # from the canonical encoding, so a transaction without it hashes as it did before.
      - name: schema_version
        type: Optional<ekr.ontology.SchemaVersionId>

  - name: ekr.kernel.ValidationMaterialV1Projection
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.ValidationMaterialFormatV1
      - name: transaction
        type: ekr.kernel.CanonicalTransactionProjection
      - name: basis
        type: ekr.kernel.ValidationBasisV1
      - name: validators
        type: List<ekr.kernel.AgentId>

  - name: ekr.kernel.SeededPayload
    kind: struct
    fields:
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: seed_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.ProposedPayload
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: proposer
        type: ekr.kernel.AgentId
      - name: operations_hash
        type: Optional<ekr.kernel.ContentHash>

  - name: ekr.kernel.ValidatedPayload
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: against
        type: ekr.kernel.RevisionNumber
      - name: validation_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.RejectedPayload
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: issues
        type: Integer

  - name: ekr.kernel.StalePayload
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: validated_against
        type: ekr.kernel.RevisionNumber
      - name: current
        type: ekr.kernel.RevisionNumber

  - name: ekr.kernel.CommittedPayload
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: knowledge_root
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.RevisionPayload
    kind: union
    tag: kind
    variants:
      Seeded: ekr.kernel.SeededPayload
      TransactionProposed: ekr.kernel.ProposedPayload
      TransactionValidated: ekr.kernel.ValidatedPayload
      TransactionRejected: ekr.kernel.RejectedPayload
      TransactionStale: ekr.kernel.StalePayload
      RevisionCommitted: ekr.kernel.CommittedPayload

  - name: ekr.kernel.RevisionEventV2
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.RevisionEventFormatV2
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: payload
        type: ekr.kernel.RevisionPayload

  # Command responses expose actual retained decisions, without adding persisted formats.
  - name: ekr.kernel.ValidationCommandResult
    kind: union
    tag: kind
    variants:
      Validated: ekr.kernel.ValidationReceiptV1
      Rejected: ekr.kernel.RejectionRecordV1

  - name: ekr.kernel.CommitCommandResult
    kind: union
    tag: kind
    variants:
      Committed: ekr.kernel.CommitReceiptV1
      Stale: ekr.kernel.StaleRecordV1

  # CLI host transport is trusted local configuration, separate from command documents.
  # Decoder witnesses: ekr host tests and tests/host_input_adversary.rs.
  # Full CLI command integration remains unexecuted.
  - name: ekr.kernel.CliHostFormatV1
    kind: enum
    variants: [{name: EkrCliHost1, wire: ekr.cli-host/1}]

  - name: ekr.kernel.CliHostConfigurationV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.CliHostFormatV1
      - name: tenant
        type: String
      - name: context
        type: ekr.kernel.BootstrapContext
      - name: authority
        type: ekr.kernel.AuthorityStateV1

  # Read projections selected in p1-cli-explain-contract-r2.md; execution is still pending.
  - name: ekr.kernel.SnapshotResult
    kind: struct
    fields:
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: root
        type: ekr.graph.RevisionRoot
      - name: graph
        type: ekr.graph.GraphDocumentV2Projection
      - name: valid_at
        type: Optional<Timestamp>
      - name: matching_assertions
        type: Optional<List<ekr.graph.AssertionId>>

  - name: ekr.kernel.ExplainedSeed
    kind: struct
    fields:
      - name: result
        type: ekr.kernel.SeedResultV1
      - name: context
        type: ekr.kernel.BootstrapContext
      - name: validation_profile
        type: ekr.kernel.P1ValidationProfileV1
      - name: record_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.ExplainedValidation
    kind: struct
    fields:
      - name: receipt
        type: ekr.kernel.ValidationReceiptV1
      - name: validation_profile
        type: ekr.kernel.P1ValidationProfileV1
      - name: record_hash
        type: ekr.kernel.ContentHash

  # story:explain-reads-an-index. ekr.explanation/2 references the retained records of a chain by
  # their payload addresses instead of embedding them: an ordinary origin's proposal record
  # (ExplainedProposal.record_hash) with only the document's operations about the explained
  # assertion, and each commit receipt (ExplainedCommit.record_hash) with the proposal and
  # validation records it commits. The chain itself — which links, in which order, naming which
  # records — is the unversioned answer's, link for link. `ekr explain --documents` adds the
  # whole records; that is the CLI's rendering, not this result.
  #
  # What explain trusts. Explain trusts the verified graph and reads only the documents on the
  # assertion's own chain: the commit at the instant the graph records the assertion was added
  # (transaction_time.recorded_from), matched by revision, and the commit at its lifecycle's
  # at_revision. Each document read is held to what the graph says it did (origin-missing,
  # lifecycle-disagrees), and two records claiming one revision are origin-ambiguous before any
  # document is read. A record on no chain — another commit whose document also adds the
  # assertion, or one that retracts an assertion the graph holds active — is not read and neither
  # changes nor refuses the answer, which is the chain of verified links the graph names. Every
  # retained record is replayed and verified when a store is opened, and a store altered on disk
  # is refused there; re-reading every committed document per call is the cost this removes.
  - name: ekr.kernel.ExplanationFormatV2
    kind: enum
    variants: [{name: EkrExplanation2, wire: ekr.explanation/2}]

  - name: ekr.kernel.ExplainedProposal
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: event_id
        type: ekr.kernel.EventId
      - name: submitter
        type: ekr.kernel.AgentId
      - name: submitted_at
        type: Timestamp
      - name: document_hash
        type: ekr.kernel.ContentHash
      - name: operation_count
        type: Integer
      # In document order: the AddAssertion of the explained assertion.
      - name: operations
        type: List<ekr.kernel.CanonicalOperationProjection>

  - name: ekr.kernel.ExplainedCommit
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: event_id
        type: ekr.kernel.EventId
      - name: committer
        type: ekr.kernel.AgentId
      - name: committed_at
        type: Timestamp
      - name: result
        type: ekr.graph.RevisionRoot
      - name: result_hash
        type: ekr.kernel.ContentHash
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: proposal_record_hash
        type: ekr.kernel.ContentHash
      - name: validation_record_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.ExplainedLifecycle
    kind: struct
    fields:
      - name: assertion_id
        type: ekr.graph.AssertionId
      - name: lifecycle
        type: ekr.graph.AssertionLifecycleProjection
      - name: commit
        type: ekr.kernel.ExplainedCommit

  # One ekr.graph.EvidenceAttachment of an explained assertion, with the commit that attached it
  # by reference (story:evidence-attaches-to-a-held-assertion). Listed after the assertion's
  # lifecycle changes, in evidence-id order, only for attachments the captured revision holds:
  # an explanation at a revision before the attachment does not list it. The attached evidence is
  # one of the chain's Evidence links; the attaching commit's other evidence is not. The commit's
  # document is read and must attach exactly this evidence to this assertion
  # (attachment-disagrees otherwise). Added to ekr.explanation/2 without a version bump: a reader
  # that does not know the kind skips the link.
  - name: ekr.kernel.ExplainedAttachment
    kind: struct
    fields:
      - name: assertion_id
        type: ekr.graph.AssertionId
      - name: evidence_id
        type: ekr.graph.EvidenceId
      - name: revision
        type: ekr.kernel.RevisionNumber
      - name: commit
        type: ekr.kernel.ExplainedCommit

  - name: ekr.kernel.ExplanationLink
    kind: union
    tag: kind
    variants:
      Assertion: ekr.graph.AssertionRecord
      Seed: ekr.kernel.ExplainedSeed
      Proposal: ekr.kernel.ExplainedProposal
      Validation: ekr.kernel.ExplainedValidation
      Commit: ekr.kernel.ExplainedCommit
      Lifecycle: ekr.kernel.ExplainedLifecycle
      Evidence: ekr.graph.EvidenceRecord
      Attachment: ekr.kernel.ExplainedAttachment

  - name: ekr.kernel.ExplanationResult
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.ExplanationFormatV2
      - name: assertion_id
        type: ekr.graph.AssertionId
      - name: at
        type: ekr.kernel.RevisionNumber
      - name: links
        type: List<ekr.kernel.ExplanationLink>

  # `ekr rejections` (story:validation-findings-read): each rejected transaction whose retained
  # rejection was validated against a revision in a range, with the issues that rejection record
  # holds. A read of retained records; it adds no record format. A rejection has no revision of
  # its own, so it is keyed on its basis: `against` is the number of the revision its
  # requested_basis names (ValidationBasisV1.previous_root). Committed transactions carry no
  # findings — a transaction is sealed only when no validator raised an issue — and never appear;
  # neither does a Proposed, Validated or Stale one.
  # Determinism, so that two answers to one range are byte-identical: `rejections` by `against`
  # ascending, then transaction_id ascending in the lowercase hyphenated text of the UUID; each
  # transaction's `issues` in the order its rejection record retains them. Every object's keys
  # ascend by their text, as in every document `ekr` prints. `from` and `to` echo the request:
  # each is omitted when it was not given, never emitted as null, and `rejections` is emitted
  # empty, never omitted. No field carries a wall-clock time, the store's head or a path;
  # `rejected_at` is the retained decision's time. An answer changes only when a rejection in its
  # range is recorded, so a commit leaves every answer as it was. `from` greater than `to` selects
  # nothing and is not refused. ekr.kernel.Rejections below is this document one row per issue.
  - name: ekr.kernel.RejectionsFormatV1
    kind: enum
    variants: [{name: EkrRejections1, wire: ekr.rejections/1}]

  - name: ekr.kernel.RejectedTransactionV1
    kind: struct
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: against
        type: ekr.kernel.RevisionNumber
      - name: proposer
        type: ekr.kernel.AgentId
      - name: rejected_at
        type: Timestamp
      - name: issues
        type: List<ekr.kernel.ValidationIssueRecord>

  - name: ekr.kernel.RejectionsV1
    kind: struct
    fields:
      - name: format
        type: ekr.kernel.RejectionsFormatV1
      - name: from
        type: Optional<ekr.kernel.RevisionNumber>
      - name: to
        type: Optional<ekr.kernel.RevisionNumber>
      - name: rejections
        type: List<ekr.kernel.RejectedTransactionV1>

entities:
  - name: ekr.kernel.RetainedHumanDecision
    identity:
      name: proof_digest
      type: ekr.kernel.ContentHash
    fields:
    # Protocol digests are plain SHA-256; StoredObject addresses include the payload domain.
    # These explicit addresses retain the corresponding bytes without conflating the hashes.
    - {name: proof_object_hash, type: ekr.kernel.ContentHash}
    - {name: policy_object_hash, type: ekr.kernel.ContentHash}
    - {name: statement_object_hash, type: ekr.kernel.ContentHash}
    - name: decision_id
      type: Uuid
    - name: policy_digest
      type: ekr.kernel.ContentHash
    - name: statement_digest
      type: ekr.kernel.ContentHash
    - name: operator
      type: ekr.kernel.TrustedOperatorIdentity
    - name: recorded_at
      type: Timestamp
    relations:
    - name: proof_bytes
      kind: references
      target: ekr.store.StoredObject
      cardinality: one
      via: proof_object_hash
    - name: policy_bytes
      kind: references
      target: ekr.store.StoredObject
      cardinality: one
      via: policy_object_hash
    - name: statement_bytes
      kind: references
      target: ekr.store.StoredObject
      cardinality: one
      via: statement_object_hash
    lifecycle:
      initial: Verified
      states:
      - Verified
      terminal:
      - Verified
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.kernel.Dispute
    identity:
      name: dispute_id
      type: ekr.kernel.DisputeId
    fields:
    - name: basis_revision
      type: ekr.kernel.RevisionNumber
    - name: subject
      type: ekr.graph.SubjectProjection
    - name: predicate
      type: ekr.graph.PredicateProjection
    - name: basis_digest
      type: ekr.kernel.ContentHash
    # A deterministic projection of active assertions under declared One property
    # or relation semantics with differing values and overlapping valid times. Equal
    # values, disjoint intervals and Many never conflict. Both competing assertions
    # are Disputed and remain inspectable.
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.kernel.DisputeClaim
    identity:
      name: claim_link_id
      type: Uuid
    fields:
    - name: dispute_id
      type: ekr.kernel.DisputeId
    - name: assertion_id
      type: ekr.graph.AssertionId
    # Projected references, recomputed after every affected commit; no dangling
    # competitors and no separately persisted attention queue.
    relations:
    - name: dispute
      kind: references
      target: ekr.kernel.Dispute
      cardinality: one
      via: dispute_id
    - name: claim
      kind: references
      target: ekr.graph.Assertion
      cardinality: one
      via: assertion_id
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.kernel.HumanAnswer
    identity:
      name: answer_id
      type: ekr.kernel.HumanAnswerId
    fields:
    - {name: human_proof_digest, type: ekr.kernel.ContentHash}
    - name: dispute_id
      type: ekr.kernel.DisputeId
    - name: basis
      type: ekr.kernel.ReviewBasis
    - name: operator
      type: ekr.kernel.TrustedOperatorIdentity
    - name: corrections
      type: List<ekr.kernel.ClaimCorrection>
    - name: statement_evidence
      type: ekr.graph.EvidenceId
    - name: transaction_id
      type: Optional<ekr.kernel.TransactionId>
    # Immutable authenticated human answer. Choosing, retracting or correcting
    # time requires kernel validation and supporting evidence. Unresolved uncertainty
    # records an answer without settling the dispute.
    relations:
    - {name: human_proof, kind: references, target: ekr.kernel.RetainedHumanDecision, cardinality: one, via: human_proof_digest}
    - name: dispute
      kind: references
      target: ekr.kernel.Dispute
      cardinality: one
      via: dispute_id
    - name: statement
      kind: references
      target: ekr.graph.Evidence
      cardinality: one
      via: statement_evidence
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.kernel.AuthorityTransition
    identity:
      name: transition_id
      type: ekr.kernel.AuthorityTransitionId
    fields:
    - {name: review_host_binding_object_hash, type: ekr.kernel.ContentHash}
    - {name: reviewer_policy_object_hash, type: ekr.kernel.ContentHash}
    - {name: review_host_binding_digest, type: ekr.kernel.ContentHash}
    - {name: reviewer_policy_digest, type: ekr.kernel.ContentHash}
    - {name: trust_enrollment, type: ekr.kernel.ReviewerTrustEnrollment}
    - {name: human_proof_digest, type: ekr.kernel.ContentHash}
    - {name: target_profile_digest, type: ekr.kernel.ContentHash}
    - {name: format, type: ekr.kernel.AuthorityTransitionFormat}
    - name: seed_anchor
      type: ekr.kernel.ContentHash
    - name: predecessor_head
      type: ekr.kernel.ContentHash
    - name: activation_revision
      type: ekr.kernel.RevisionNumber
    - name: from
      type: ekr.kernel.AuthorityVersion
    - name: to
      type: ekr.kernel.AuthorityVersion
    - name: preview_digest
      type: ekr.kernel.ContentHash
    - name: operator
      type: ekr.kernel.TrustedOperatorIdentity
    - name: recorded_at
      type: Timestamp
    # Append-only authority boundary. Historical seed, graph bytes, revision
    # hashes and replay profiles stay unchanged. New validation/application rules take
    # effect only after this boundary; pending validations under the old authority are
    # invalidated and must be revalidated.
    relations:
    - {name: reviewer_host_binding, kind: references, target: ekr.store.StoredObject, cardinality: one, via: review_host_binding_object_hash}
    - {name: reviewer_policy, kind: references, target: ekr.store.StoredObject, cardinality: one, via: reviewer_policy_object_hash}
    - {name: human_proof, kind: references, target: ekr.kernel.RetainedHumanDecision, cardinality: one, via: human_proof_digest}
    - {name: target_profile, kind: references, target: ekr.store.StoredObject, cardinality: one, via: target_profile_digest}
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded
  - name: ekr.kernel.SchemaTransactionEvidence
    identity:
      name: link_id
      type: Uuid
    fields:
    - name: transaction_id
      type: ekr.kernel.TransactionId
    - name: evidence_id
      type: ekr.graph.EvidenceId
    # Supporting evidence retained by an ordinary validated schema transaction
    # and exposed in schema history. Required evidence is checked by the kernel, whether
    # the transaction came from a proposal or directly through the SDK.
    relations:
    - name: transaction
      kind: references
      target: ekr.kernel.GraphTransaction
      cardinality: one
      via: transaction_id
    - name: evidence
      kind: references
      target: ekr.graph.Evidence
      cardinality: one
      via: evidence_id
    lifecycle:
      initial: Recorded
      states:
      - Recorded
      terminal:
      - Recorded

  # Design § 18. TrustProfile (§ 48) is a P5 concern and is not typed here yet.
  - name: ekr.kernel.Agent
    identity:
      name: agent_id
      type: ekr.kernel.AgentId
    fields:
      - name: name
        type: String
      - name: capabilities
        type: List<String>
    relations:
      - name: proposals
        kind: owns
        target: ekr.kernel.GraphTransaction
        cardinality: many
        via: proposer
    lifecycle:
      initial: Registered
      states: [Registered]
      terminal: [Registered]

  # §91. The retained exact document is authoritative. Canonical hashes are absent for a
  # well-formed proposal whose values are not canonical; the count and evidence hash are derived.
  - name: ekr.kernel.GraphTransaction
    identity:
      name: transaction_id
      type: ekr.kernel.TransactionId
    fields:
      - name: proposer
        type: ekr.kernel.AgentId
      - name: document_hash
        type: ekr.kernel.ContentHash
      - name: proposal_record_hash
        type: ekr.kernel.ContentHash
      - name: canonical_transaction_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: canonical_operations_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: operation_count
        type: Optional<Integer>
      - name: evidence_hash
        type: ekr.kernel.ContentHash
      - name: validation_basis
        type: Optional<ekr.kernel.ValidationBasisV1>
      - name: validated_against
        type: Optional<ekr.kernel.RevisionNumber>
      - name: validation_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: validation_record_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: terminal_record_hash
        type: Optional<ekr.kernel.ContentHash>
    invariants:
      - operation_count >= 1
    relations:
      - name: issues
        kind: owns
        target: ekr.kernel.ValidationIssue
        cardinality: many
        via: transaction_id
    lifecycle:
      initial: Proposed
      states: [Proposed, Validated, Committed, Rejected, Stale]
      terminal: [Committed, Rejected, Stale]
      transitions:
        - name: validate
          from: [Proposed]
          to: Validated
        - name: reject
          from: [Proposed]
          to: Rejected
        - name: commit
          from: [Validated]
          to: Committed
        - name: stale
          from: [Validated]
          to: Stale

  - name: ekr.kernel.ValidationIssue
    identity:
      name: issue_id
      type: ekr.kernel.IssueId
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      # The revision the rejection that records this issue was validated against: its
      # requested_basis (ValidationBasisV1.previous_root.revision). An issue is recorded only in a
      # rejection, so every issue has one; it keys ekr.kernel.Rejections.
      - name: against
        type: ekr.kernel.RevisionNumber
      - name: validator
        type: ekr.kernel.ValidatorName
      - name: code
        type: String
      - name: message
        type: String
    lifecycle:
      initial: Raised
      states: [Raised]
      terminal: [Raised]

  # Design § 34. Immutable once committed. `Seed` creates the first; `Commit` announces every later
  # one in `RevisionCommitted` — an outcome causes one subject change, and Commit's is the
  # transaction's move, so the revision it produces is read from the event and the view below.
  - name: ekr.kernel.Revision
    identity:
      name: revision_id
      type: ekr.kernel.RevisionId
    fields:
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: parent
        type: Optional<ekr.kernel.RevisionId>
      - name: ontology_root
        type: ekr.kernel.ContentHash
      - name: knowledge_root
        type: ekr.kernel.ContentHash
      - name: evidence_root
        type: ekr.kernel.ContentHash
      - name: agent_root
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: Optional<ekr.kernel.TransactionId>
      - name: committed_at
        type: Timestamp
    lifecycle:
      initial: Committed
      states: [Committed]
      terminal: [Committed]

# Design § 6.10: the actor that proposes is never the sole basis of validation. Three actors, so a
# conformance suite can hold an implementation to the separation.
actors:
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.kernel.KnowledgeReader
    may:
    - ekr.kernel.ListAttention
    - ekr.kernel.ShowAttention
    - ekr.kernel.PreviewUpgrade
  - name: ekr.kernel.HumanOperator
    may:
    - ekr.kernel.AnswerAttention
    - ekr.kernel.ApplyUpgrade

  - name: ekr.kernel.Proposer
    may:
      - ekr.kernel.Propose
    naming:
      display: Proposing agent

  - name: ekr.kernel.Validator
    may:
      - ekr.kernel.Validate
    naming:
      display: Validator

  - name: ekr.kernel.Committer
    may:
      - ekr.kernel.Commit
    naming:
      display: Commit gate

  - name: ekr.kernel.Operator
    may:
      - ekr.kernel.Seed
      - ekr.kernel.Snapshot
      - ekr.kernel.Explain
    naming:
      display: Operator

errors:
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.kernel.KnowledgeRefused
    summary: A named deterministic refusal; no unreported write occurred. Partial application
      is a typed report, never this refusal.
    fields:
    - name: code
      type: String
    - name: reason
      type: String

  # P1-08 admission acceptance was unexecuted at declaration; the kernel seed suite supplies
  # the behavioral cases. This contract does not certify the later durable writer.
  - name: ekr.kernel.InvalidSeed
    summary: Seed admission refused before canonical state or its lineage was written.
    fields:
      - name: code
        type: String
      - name: reason
        type: String

  - name: ekr.kernel.AlreadySeeded
    summary: A retained seed exists but its full parsed input, actual bootstrap context or trusted host authority anchor differs; an exact logical retry returns its retained result.
    fields:
      - name: current
        type: ekr.kernel.RevisionNumber

  - name: ekr.kernel.StructurallyInvalid
    summary: The proposal is not a well-formed transaction; nothing was recorded.
    fields:
      - name: reason
        type: String

  - name: ekr.kernel.ProposalAttribution
    summary: The trusted submitter is unregistered or differs from the proposer the document names; nothing was recorded.
    fields:
      - name: actor
        type: ekr.kernel.AgentId

  - name: ekr.kernel.TransactionStateConflict
    summary: The transaction is not in a state this command acts from, so nothing moved.
    fields:
      - name: state
        type: ekr.kernel.GraphTransaction.State

  - name: ekr.kernel.TransactionNotFound
    summary: No retained transaction carries the requested identity; no state or decision is invented.
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId

  - name: ekr.kernel.RevisionNotFound
    summary: No committed revision carries that number.
    fields:
      - name: requested
        type: ekr.kernel.RevisionNumber

  - name: ekr.kernel.AssertionNotFound
    summary: No assertion carries that identity in the canonical core.
    fields:
      - name: requested
        type: ekr.graph.AssertionId

commands:
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.kernel.ListAttention
    naming:
      wire: attention-list
    input: []
    response:
    - name: items
      type: List<ekr.kernel.AttentionItem>
    outcomes:
    - name: answered
      emits:
      - ekr.kernel.ListAttentionResult
      payload:
        ekr.kernel.ListAttentionResult:
          items:
            generated: true
      summary: Project disputes, pending integration blockers and schema proposals from
        retained state. Exclude settled questions and include all unresolved ones; this
        is not a queue database.
  - name: ekr.kernel.ShowAttention
    naming:
      wire: attention-show
    input:
    - name: subject
      type: ekr.kernel.AttentionSubject
    response:
    - name: item
      type: ekr.kernel.AttentionItem
    outcomes:
    - name: answered
      emits:
      - ekr.kernel.ShowAttentionResult
      payload:
        ekr.kernel.ShowAttentionResult:
          item:
            generated: true
      summary: Show both claims with retained evidence and a useful clarification question.
        The viewer renders the same read-only projection.
    - name: refused
      external: Refuse an attention subject whose kind and supplied identity disagree
        or whose source does not exist.
      error: ekr.kernel.KnowledgeRefused
  - name: ekr.kernel.AnswerAttention
    naming:
      wire: attention-answer
    input:
    - {name: human_proof, type: ekr.kernel.SignedHumanDecision}
    - name: dispute_id
      type: ekr.kernel.DisputeId
    - name: basis
      type: ekr.kernel.ReviewBasis
    - name: corrections
      type: List<ekr.kernel.ClaimCorrection>
    - name: statement
      type: Bytes
    response:
    - {name: receipt, type: ekr.kernel.AnswerReceipt}
    outcomes:
    - name: answered
      emits:
      - ekr.kernel.AnswerAttentionResult
      payload:
        ekr.kernel.AnswerAttentionResult:
          receipt: {generated: true}
      summary: Verify the signed human proof and derive the operator from the pinned reviewer policy, retain the statement, validate supported
        corrections and commit them. Recompute affected disputes without dangling competitor
        ids. Resolved questions disappear; evidence and historical assertions remain.
    - name: refused
      external: Verify human_proof under the independently enrolled reviewer policy and the exact AnswerAttention target, statement, corrections and predecessor decision. A host operator UUID or supplied key establishes no human authority. Revalidate against current state. Unrelated revisions alone do not invalidate
        review; changed evidence, choices or intended effects require renewed human
        review. An agent-provided identity or unsupported claim cannot authorize resolution.
      error: ekr.kernel.KnowledgeRefused
  - name: ekr.kernel.PreviewUpgrade
    naming:
      wire: upgrade-preview
    input:
    - name: target
      type: ekr.kernel.AuthorityVersion
    response:
    - name: preview
      type: ekr.kernel.UpgradePreview
    outcomes:
    - name: answered
      emits:
      - ekr.kernel.PreviewUpgradeResult
      payload:
        ekr.kernel.PreviewUpgradeResult:
          preview:
            generated: true
      summary: Read the exact head, simulate newly disputed claims under target rules
        and list pending transactions requiring revalidation. Do not mutate authority
        or graph.
    - name: refused
      external: Unknown rule versions, unverified history and unsupported transitions
        are refused.
      error: ekr.kernel.KnowledgeRefused
  - name: ekr.kernel.ApplyUpgrade
    naming:
      wire: upgrade-apply
    input:
    - {name: statement, type: Bytes}
    - {name: human_proof, type: ekr.kernel.SignedHumanDecision}
    - name: preview
      type: ekr.kernel.UpgradePreview
    response:
    - name: transition_id
      type: ekr.kernel.AuthorityTransitionId
    outcomes:
    - name: answered
      emits:
      - ekr.kernel.ApplyUpgradeResult
      payload:
        ekr.kernel.ApplyUpgradeResult:
          transition_id:
            generated: true
      summary: Verify the signed human proof and derive the operator from the pinned reviewer policy, then atomically append the authority boundary
        against the exact preview basis; preserve historical bytes and original replay
        rules.
    - name: refused
      external: Verify an UpgradeAuthority human_proof and the independently provisioned host/store reviewer binding before enrollment or mutation. Never trust a policy or verification key solely because request content supplies it. Before any mutation refuse a stale head, altered preview digest, unsupported
        target, unauthenticated operator or incomplete historical verification.
      error: ekr.kernel.KnowledgeRefused

  # Design § 8. The seed is the minimal trusted starting state; loading it produces revision 0.
  - name: ekr.kernel.Seed
    naming:
      wire: seed
      display: Load the seed
    input:
      - name: seed_document
        type: ekr.kernel.SeedDocumentPath
    response:
      - name: result
        type: ekr.kernel.SeedResultV1
    outcomes:
      - name: seeded
        creates: ekr.kernel.Revision
        instance: revision_id
        emits:
          - ekr.kernel.Seeded
          - ekr.store.PublicationPrepared
          - ekr.store.ObjectStored
          - ekr.store.CheckpointWritten
        payload:
          ekr.store.CheckpointWritten:
            checkpoint_hash: {generated: true}
            covered: {generated: true}
            binding: {generated: true}
          ekr.store.PublicationPrepared:
            preparation_hash: {generated: true}
            attempt_number: {generated: true}
            previous_attempt_hash: {generated: true}
          ekr.store.ObjectStored:
            content_hash: {generated: true}
            storage_class: {generated: true}
            byte_len: {generated: true}
            stored_at: {generated: true}
          ekr.kernel.Seeded:
            event_id: {generated: true}
            record_hash: {generated: true}
            revision_id: {generated: true}
            seed_hash: {generated: true}
        summary: Revision0 and its complete retained seed result exist atomically; real ontology and authority roots have no placeholders.
      - name: already-seeded
        external: a retained seed exists and its parsed full Seed2 input or actual BootstrapContext or trusted host AuthorityStateV1 anchor differs
        error: ekr.kernel.AlreadySeeded
        summary: Nothing was written; compare retained typed input and actual trusted context before allocating an occurrence or sampling time. YAML whitespace alone is not a different logical seed.
      - name: retained-seed
        external: a retained seed has the same full parsed Seed2 input, actual BootstrapContext and trusted host AuthorityStateV1 anchor
        replays: seeded
        summary: Return the original SeedResultV1 and preserve its original Revision, including after head advancement; allocate no new occurrence, sample no new time and write nothing.
      - name: invalid-seed
        external: deterministic bootstrap validation refuses the seed
        error: ekr.kernel.InvalidSeed
        summary: Nothing was written; the refusal identifies the violated bootstrap rule.

  # Design § 19. Structural validity is checked at the door; every other validator runs in Validate.
  - name: ekr.kernel.Propose
    naming:
      wire: propose
      display: Propose a transaction
    input:
      - name: transaction_document
        type: ekr.kernel.TransactionDocumentPath
    response:
      - name: result
        type: ekr.kernel.ProposalRecordV1
    outcomes:
      - name: proposed
        creates: ekr.kernel.GraphTransaction
        instance: transaction_id
        emits:
          - ekr.kernel.TransactionProposed
          - ekr.store.PublicationPrepared
          - ekr.store.ObjectStored
        payload:
          ekr.store.PublicationPrepared:
            preparation_hash: {generated: true}
            attempt_number: {generated: true}
            previous_attempt_hash: {generated: true}
          ekr.store.ObjectStored:
            content_hash: {generated: true}
            storage_class: {generated: true}
            byte_len: {generated: true}
            stored_at: {generated: true}
          ekr.kernel.TransactionProposed:
            event_id: {generated: true}
            record_hash: {generated: true}
            transaction_id: {generated: true}
            proposer: {generated: true}
            operations_hash: {generated: true}
        summary: Exact document bytes and trusted submitter are retained; nothing canonical changed.
      - name: malformed
        external: strict document parsing or structural admission refuses before recording
        error: ekr.kernel.StructurallyInvalid
        summary: Unknown versions, documents over their version's frozen limits, malformed documents and empty operation lists record nothing.
      - name: misattributed
        external: the document names a proposer other than the trusted submitter, or the submitter is unregistered
        error: ekr.kernel.ProposalAttribution
        summary: The proposer is bound to the host submitter; a mismatch records nothing.

  # Design § 20. Deterministic validators 1–7 run against one snapshot; the revision they ran
  # against is recorded so Commit can notice movement.
  - name: ekr.kernel.Validate
    naming:
      wire: validate
      display: Validate a transaction
    input:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: against
        type: ekr.kernel.RevisionNumber
    response:
      - name: result
        type: ekr.kernel.ValidationCommandResult
    outcomes:
      - name: validated
        moves: ekr.kernel.GraphTransaction.validate
        instance: transaction_id
        emits:
          - ekr.kernel.TransactionValidated
          - ekr.store.PublicationPrepared
          - ekr.store.ObjectStored
        payload:
          ekr.store.PublicationPrepared:
            preparation_hash: {generated: true}
            attempt_number: {generated: true}
            previous_attempt_hash: {generated: true}
          ekr.store.ObjectStored:
            content_hash: {generated: true}
            storage_class: {generated: true}
            byte_len: {generated: true}
            stored_at: {generated: true}
          ekr.kernel.TransactionValidated:
            event_id: {generated: true}
            record_hash: {generated: true}
            transaction_id: input.transaction_id
            against: input.against
            validation_hash: {generated: true}
        sets:
          validated_against: input.against
        summary: Every validator passed against the named revision; the transaction is Validated.
      - name: rejected
        external: at least one deterministic validator raised an issue against the named revision
        moves: ekr.kernel.GraphTransaction.reject
        instance: transaction_id
        emits:
          - ekr.kernel.TransactionRejected
          - ekr.store.PublicationPrepared
          - ekr.store.ObjectStored
        payload:
          ekr.store.PublicationPrepared:
            preparation_hash: {generated: true}
            attempt_number: {generated: true}
            previous_attempt_hash: {generated: true}
          ekr.store.ObjectStored:
            content_hash: {generated: true}
            storage_class: {generated: true}
            byte_len: {generated: true}
            stored_at: {generated: true}
          ekr.kernel.TransactionRejected:
            event_id: {generated: true}
            record_hash: {generated: true}
            transaction_id: input.transaction_id
            issues: {generated: true}
        summary: At least one validator raised an issue; the issues are recorded and the transaction is Rejected.
      - name: revision-not-found
        external: the transaction is Proposed and no committed revision carries input.against
        error: ekr.kernel.RevisionNotFound
        summary: Leave the transaction Proposed with no validation or rejection receipt or event; an older existing revision is still a valid basis and may become Stale only at Commit.
      - name: transaction-not-found
        external: no retained transaction carries input.transaction_id
        error: ekr.kernel.TransactionNotFound
        summary: Refuse before state or revision-basis evaluation; write no object, receipt, issue or event.
      - name: wrong-state
        wrong_state: true
        error: ekr.kernel.TransactionStateConflict
        summary: The transaction is not Proposed, so nothing was validated.

  # Design § 19, § 34, § 72. Only a Validated transaction commits, and only against the revision it
  # was validated against; otherwise it is Stale and a new proposal is needed.
  - name: ekr.kernel.Commit
    naming:
      wire: commit
      display: Commit a validated transaction
    input:
      - name: transaction_id
        type: ekr.kernel.TransactionId
    response:
      - name: result
        type: ekr.kernel.CommitCommandResult
    outcomes:
      - name: committed
        when_subject_state: Validated
        moves: ekr.kernel.GraphTransaction.commit
        instance: transaction_id
        emits:
          - ekr.kernel.RevisionCommitted
          - ekr.store.PublicationPrepared
          - ekr.store.ObjectStored
          - ekr.store.CheckpointWritten
        payload:
          ekr.store.CheckpointWritten:
            checkpoint_hash: {generated: true}
            covered: {generated: true}
            binding: {generated: true}
          ekr.store.PublicationPrepared:
            preparation_hash: {generated: true}
            attempt_number: {generated: true}
            previous_attempt_hash: {generated: true}
          ekr.store.ObjectStored:
            content_hash: {generated: true}
            storage_class: {generated: true}
            byte_len: {generated: true}
            stored_at: {generated: true}
          ekr.kernel.RevisionCommitted:
            event_id: {generated: true}
            record_hash: {generated: true}
            transaction_id: input.transaction_id
            revision_id: {generated: true}
            number: {generated: true}
            knowledge_root: {generated: true}
        summary: A new immutable revision exists whose parent is the one validated against.
      - name: stale
        external: the canonical revision moved since the transaction was validated
        moves: ekr.kernel.GraphTransaction.stale
        instance: transaction_id
        emits:
          - ekr.kernel.TransactionStale
          - ekr.store.PublicationPrepared
          - ekr.store.ObjectStored
        payload:
          ekr.store.PublicationPrepared:
            preparation_hash: {generated: true}
            attempt_number: {generated: true}
            previous_attempt_hash: {generated: true}
          ekr.store.ObjectStored:
            content_hash: {generated: true}
            storage_class: {generated: true}
            byte_len: {generated: true}
            stored_at: {generated: true}
          ekr.kernel.TransactionStale:
            event_id: {generated: true}
            record_hash: {generated: true}
            transaction_id: input.transaction_id
            validated_against: {generated: true}
            current: {generated: true}
        summary: Canonical state moved since validation; nothing committed and the transaction is Stale.
      - name: retained-commit
        when_subject_state: Committed
        replays: committed
        summary: Return this transaction's original CommitReceiptV1, including after head advancement; preserve the transaction and publish no event or object.
      - name: transaction-not-found
        external: no retained transaction carries input.transaction_id
        error: ekr.kernel.TransactionNotFound
        summary: Refuse before state or staleness evaluation; write no object, receipt or event.
      - name: wrong-state
        error: ekr.kernel.TransactionStateConflict
        summary: Proposed, Rejected and Stale transactions refuse without a commit, event or subject change.

  # Design § 71. A read over an immutable revision; the default is the newest.
  - name: ekr.kernel.Snapshot
    naming:
      wire: snapshot
      display: Read a snapshot
    input:
      - name: at
        type: Optional<ekr.kernel.RevisionNumber>
      - name: valid_at
        type: Optional<Timestamp>
    response:
      - name: result
        type: ekr.kernel.SnapshotResult
    outcomes:
      - name: taken
        emits:
          - ekr.kernel.SnapshotTaken
        payload:
          ekr.kernel.SnapshotTaken:
            number: {generated: true}
            knowledge_root: {generated: true}
        summary: The snapshot is consistent as of one revision and records which.
      - name: not-found
        external: no revision carries the requested number
        error: ekr.kernel.RevisionNotFound
        summary: Nothing was read.

  # Design § 62. Why is this true: assertion → transaction → validation → evidence → observation.
  - name: ekr.kernel.Explain
    naming:
      wire: explain
      display: Explain an assertion
    input:
      - name: assertion_id
        type: ekr.graph.AssertionId
    response:
      - name: result
        type: ekr.kernel.ExplanationResult
    outcomes:
      - name: explained
        emits:
          - ekr.kernel.Explained
        payload:
          ekr.kernel.Explained:
            assertion_id: input.assertion_id
            links: {generated: true}
        summary: The chain from the assertion to its external sources, one link per line.
      - name: not-found
        external: the canonical core holds no such assertion
        error: ekr.kernel.AssertionNotFound
        summary: Nothing was explained.

# The six durable event declarations flatten only the envelope's event_id/record_hash plus its
# named metadata payload for command/view projection. The actual strict wire envelope is
# RevisionEventV2; record_hash selects the corresponding full retained record (§91).
events:
  # Knowledge inbox and evidence-led schema learning, design § 105.
  - name: ekr.kernel.ListAttentionResult
    fields:
    - name: items
      type: List<ekr.kernel.AttentionItem>
  - name: ekr.kernel.ShowAttentionResult
    fields:
    - name: item
      type: ekr.kernel.AttentionItem
  - name: ekr.kernel.AnswerAttentionResult
    fields:
    - {name: receipt, type: ekr.kernel.AnswerReceipt}
  - name: ekr.kernel.PreviewUpgradeResult
    fields:
    - name: preview
      type: ekr.kernel.UpgradePreview
  - name: ekr.kernel.ApplyUpgradeResult
    fields:
    - name: transition_id
      type: ekr.kernel.AuthorityTransitionId

  - name: ekr.kernel.Seeded
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: seed_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.TransactionProposed
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: proposer
        type: ekr.kernel.AgentId
      - name: operations_hash
        type: Optional<ekr.kernel.ContentHash>

  - name: ekr.kernel.TransactionValidated
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: against
        type: ekr.kernel.RevisionNumber
      - name: validation_hash
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.TransactionRejected
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: issues
        type: Integer

  - name: ekr.kernel.TransactionStale
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: validated_against
        type: ekr.kernel.RevisionNumber
      - name: current
        type: ekr.kernel.RevisionNumber

  - name: ekr.kernel.RevisionCommitted
    fields:
      - name: event_id
        type: ekr.kernel.EventId
      - name: record_hash
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: knowledge_root
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.SnapshotTaken
    fields:
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: knowledge_root
        type: ekr.kernel.ContentHash

  - name: ekr.kernel.Explained
    fields:
      - name: assertion_id
        type: ekr.graph.AssertionId
      - name: links
        type: Integer

views:
  - name: ekr.kernel.HumanDecisionRecords
    source: ekr.kernel.RetainedHumanDecision
    consistency: read_your_writes
    fields:
    - {name: proof_object_hash, type: ekr.kernel.ContentHash}
    - {name: policy_object_hash, type: ekr.kernel.ContentHash}
    - {name: statement_object_hash, type: ekr.kernel.ContentHash}
    - name: proof_digest
      type: ekr.kernel.ContentHash
    - name: state
      type: ekr.kernel.RetainedHumanDecision.State
    - name: decision_id
      type: Uuid
    - name: policy_digest
      type: ekr.kernel.ContentHash
    - name: statement_digest
      type: ekr.kernel.ContentHash
    - name: operator
      type: ekr.kernel.TrustedOperatorIdentity
    - name: recorded_at
      type: Timestamp
  - name: ekr.kernel.DisputeRecords
    source: ekr.kernel.Dispute
    consistency: read_your_writes
    fields:
    - name: dispute_id
      type: ekr.kernel.DisputeId
    - name: state
      type: ekr.kernel.Dispute.State
    - name: basis_revision
      type: ekr.kernel.RevisionNumber
    - name: subject
      type: ekr.graph.SubjectProjection
    - name: predicate
      type: ekr.graph.PredicateProjection
    - name: basis_digest
      type: ekr.kernel.ContentHash
  - name: ekr.kernel.DisputeClaimRecords
    source: ekr.kernel.DisputeClaim
    consistency: read_your_writes
    fields:
    - name: claim_link_id
      type: Uuid
    - name: state
      type: ekr.kernel.DisputeClaim.State
    - name: dispute_id
      type: ekr.kernel.DisputeId
    - name: assertion_id
      type: ekr.graph.AssertionId
  - name: ekr.kernel.HumanAnswerRecords
    source: ekr.kernel.HumanAnswer
    consistency: read_your_writes
    fields:
    - {name: human_proof_digest, type: ekr.kernel.ContentHash}
    - name: answer_id
      type: ekr.kernel.HumanAnswerId
    - name: state
      type: ekr.kernel.HumanAnswer.State
    - name: dispute_id
      type: ekr.kernel.DisputeId
    - name: basis
      type: ekr.kernel.ReviewBasis
    - name: operator
      type: ekr.kernel.TrustedOperatorIdentity
    - name: corrections
      type: List<ekr.kernel.ClaimCorrection>
    - name: statement_evidence
      type: ekr.graph.EvidenceId
    - name: transaction_id
      type: Optional<ekr.kernel.TransactionId>
  - name: ekr.kernel.AuthorityTransitionRecords
    source: ekr.kernel.AuthorityTransition
    consistency: read_your_writes
    fields:
    - {name: review_host_binding_object_hash, type: ekr.kernel.ContentHash}
    - {name: reviewer_policy_object_hash, type: ekr.kernel.ContentHash}
    - {name: review_host_binding_digest, type: ekr.kernel.ContentHash}
    - {name: reviewer_policy_digest, type: ekr.kernel.ContentHash}
    - {name: trust_enrollment, type: ekr.kernel.ReviewerTrustEnrollment}
    - {name: human_proof_digest, type: ekr.kernel.ContentHash}
    - {name: target_profile_digest, type: ekr.kernel.ContentHash}
    - name: transition_id
      type: ekr.kernel.AuthorityTransitionId
    - name: state
      type: ekr.kernel.AuthorityTransition.State
    - name: format
      type: ekr.kernel.AuthorityTransitionFormat
    - name: seed_anchor
      type: ekr.kernel.ContentHash
    - name: predecessor_head
      type: ekr.kernel.ContentHash
    - name: activation_revision
      type: ekr.kernel.RevisionNumber
    - name: from
      type: ekr.kernel.AuthorityVersion
    - name: to
      type: ekr.kernel.AuthorityVersion
    - name: preview_digest
      type: ekr.kernel.ContentHash
    - name: operator
      type: ekr.kernel.TrustedOperatorIdentity
    - name: recorded_at
      type: Timestamp
  - name: ekr.kernel.SchemaTransactionEvidenceRecords
    source: ekr.kernel.SchemaTransactionEvidence
    consistency: read_your_writes
    fields:
    - name: link_id
      type: Uuid
    - name: state
      type: ekr.kernel.SchemaTransactionEvidence.State
    - name: transaction_id
      type: ekr.kernel.TransactionId
    - name: evidence_id
      type: ekr.graph.EvidenceId
  # All retained states, including Committed, Rejected and Stale, reconstructed from real records.
  # This query is an ESS read surface, not a seventh P1 CLI command.
  - name: ekr.kernel.Transactions
    source: ekr.kernel.GraphTransaction
    consistency: read_your_writes
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: proposer
        type: ekr.kernel.AgentId
      - name: document_hash
        type: ekr.kernel.ContentHash
      - name: proposal_record_hash
        type: ekr.kernel.ContentHash
      - name: canonical_transaction_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: canonical_operations_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: operation_count
        type: Optional<Integer>
      - name: evidence_hash
        type: ekr.kernel.ContentHash
      - name: validation_basis
        type: Optional<ekr.kernel.ValidationBasisV1>
      - name: validated_against
        type: Optional<ekr.kernel.RevisionNumber>
      - name: validation_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: validation_record_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: terminal_record_hash
        type: Optional<ekr.kernel.ContentHash>
      - name: state
        type: ekr.kernel.GraphTransaction.State

  # The rows of ekr.kernel.RejectionsV1 (`ekr rejections`, `ekr session`), one per issue: each
  # issue of each rejected transaction whose rejection's basis revision, `against`, lies in the
  # range `from`..`to`, both inclusive, an absent bound unbounded. Read from the real rejection
  # records, as ValidationIssues is; a committed transaction has none and never has a row.
  - name: ekr.kernel.Rejections
    source: ekr.kernel.ValidationIssue
    consistency: read_your_writes
    params:
      - name: from
        type: Optional<ekr.kernel.RevisionNumber>
      - name: to
        type: Optional<ekr.kernel.RevisionNumber>
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: against
        type: ekr.kernel.RevisionNumber
      - name: issue_id
        type: ekr.kernel.IssueId
      - name: validator
        type: ekr.kernel.ValidatorName
      - name: code
        type: String
      - name: message
        type: String
    filter:
      all:
        - any:
            - not defined(param.from)
            - against >= param.from
        - any:
            - not defined(param.to)
            - against <= param.to
    naming:
      wire: rejections
      display: Rejections

  # Complete immutable revisions, including the original seed after later commits.
  # Replay observation selects the original emitted identity; this adds no CLI verb.
  - name: ekr.kernel.Revisions
    source: ekr.kernel.Revision
    consistency: read_your_writes
    fields:
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: parent
        type: Optional<ekr.kernel.RevisionId>
      - name: ontology_root
        type: ekr.kernel.ContentHash
      - name: knowledge_root
        type: ekr.kernel.ContentHash
      - name: evidence_root
        type: ekr.kernel.ContentHash
      - name: agent_root
        type: ekr.kernel.ContentHash
      - name: transaction_id
        type: Optional<ekr.kernel.TransactionId>
      - name: committed_at
        type: Timestamp
      - name: state
        type: ekr.kernel.Revision.State

  - name: ekr.kernel.CurrentRevision
    source: ekr.kernel.Revision
    consistency: read_your_writes
    fields:
      - name: revision_id
        type: ekr.kernel.RevisionId
      - name: number
        type: ekr.kernel.RevisionNumber
      - name: knowledge_root
        type: ekr.kernel.ContentHash
    naming:
      wire: current-revision
      display: Current revision

  - name: ekr.kernel.PendingTransactions
    source: ekr.kernel.GraphTransaction
    consistency: read_your_writes
    filter: state == Proposed
    fields:
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: proposer
        type: ekr.kernel.AgentId
      - name: operation_count
        type: Optional<Integer>
    naming:
      wire: pending
      display: Pending transactions

  # Every issue a retained rejection records, one row per issue, from the real rejection records:
  # the named refusal a Validate `rejected` outcome carries, which TransactionRejected counts and
  # does not name. A conformance read surface, not a CLI verb; `ekr validate` prints the same
  # issues in its Rejected result.
  - name: ekr.kernel.ValidationIssues
    source: ekr.kernel.ValidationIssue
    consistency: read_your_writes
    fields:
      - name: issue_id
        type: ekr.kernel.IssueId
      - name: transaction_id
        type: ekr.kernel.TransactionId
      - name: validator
        type: ekr.kernel.ValidatorName
      - name: code
        type: String
      - name: message
        type: String
    naming:
      wire: validation-issues
      display: Validation issues

  # Every evidence entry the newest revision retains, seeded or added by a committed AddEvidence,
  # whose payload the verified read holds as an object at the entry's content_hash — an object of
  # its own, since bytes inside a record have that record's address. An entry whose payload is not
  # held has no row; the verified read refuses such a store outright. A conformance read surface,
  # not a CLI verb.
  - name: ekr.kernel.RetainedEvidence
    source: ekr.graph.Evidence
    consistency: read_your_writes
    fields:
      - name: evidence_id
        type: ekr.graph.EvidenceId
      - name: content_hash
        type: ekr.kernel.ContentHash
      - name: extracted_by
        type: ekr.kernel.AgentId
    naming:
      wire: retained-evidence
      display: Retained evidence
