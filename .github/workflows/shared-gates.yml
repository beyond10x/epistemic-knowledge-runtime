name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@eb5440b03159da3b2e7dfae6d2b8087bee6803ce
    secrets:
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
