name: Correctness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld

jobs:
  check:
    name: Repository correctness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          class=code
          if [ "$EVENT_NAME" = pull_request ]; then
            class=$(sh scripts/classify-changes.sh --diff "origin/$BASE_REF" || echo code)
          fi
          case "$class" in
            code | docs-site-only | planning-only) ;;
            *)
              echo "the classifier answered \`$class\`, none of code, docs-site-only, planning-only" >&2
              exit 1
              ;;
          esac
          echo "class=$class" >> "$GITHUB_OUTPUT"
          echo "changed files classified: $class"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        if: steps.classify.outputs.class != 'planning-only'
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install task runner
        env:
          TASK_VERSION: "3.53.1"
          TASK_SHA256: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        if: steps.classify.outputs.class == 'code'
        env:
          NEXTEST_VERSION: "0.9.143"
          NEXTEST_SHA256: 66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin" cargo-nextest
          cargo nextest --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.classify.outputs.class != 'planning-only'
        with:
          shared-key: correctness-rust-1.98.1

      - name: Install pinned specification and planning tools
        env:
          ESS_VERSION: "0.36.0"
          ESS_SHA256: 5e32e277196fe8162ab4baec0debe20c093744ff33969e5cc497c952a20dc717
          AEP_VERSION: "0.64.0"
          AEP_SHA256: 074d3c301d6184f8ce37006478957c60e62607ca6853ac41765ff5f7ebfdb03b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools-bin"
          for pair in "ess:$ESS_VERSION:$ESS_SHA256" "aep:$AEP_VERSION:$AEP_SHA256"; do
            IFS=: read -r tool version digest <<< "$pair"
            archive="$tool-$version-x86_64-unknown-linux-gnu.tar.gz"
            dir="$RUNNER_TEMP/$tool-release"
            mkdir -p "$dir"
            curl --fail --silent --show-error --location --output "$dir/$archive" \
              "https://github.com/beyond10x/$tool/releases/download/$version/$archive"
            curl --fail --silent --show-error --location --output "$dir/SHA256SUMS" \
              "https://github.com/beyond10x/$tool/releases/download/$version/SHA256SUMS"
            grep -qxF "$digest  $archive" "$dir/SHA256SUMS"
            (cd "$dir" && echo "$digest  $archive" | sha256sum --check --strict)
            tar -xzf "$dir/$archive" -C "$dir"
            find "$dir" -type f -name "$tool" -exec install -m 755 {} "$RUNNER_TEMP/tools-bin/" \;
          done
          echo "$RUNNER_TEMP/tools-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tools-bin/ess" --version
          "$RUNNER_TEMP/tools-bin/aep" --version

      - name: Fetch the complete locked dependency graph
        if: steps.classify.outputs.class != 'planning-only'
        run: cargo fetch --locked

      - name: Run all repository checks
        if: steps.classify.outputs.class == 'code'
        env:
          EKR_REQUIRE_BROWSER: "1"
          EKR_VIEW_BROWSER: /usr/bin/google-chrome
        run: |
          mkdir -p "$RUNNER_TEMP/tests-tmp"
          sudo mount -t tmpfs -o size=6g,mode=1777 tmpfs "$RUNNER_TEMP/tests-tmp"
          export TMPDIR="$RUNNER_TEMP/tests-tmp"
          task check

      - name: Check the documentation site
        if: steps.classify.outputs.class == 'docs-site-only'
        run: task site-check

      - name: Validate the planning store
        if: steps.classify.outputs.class != 'code'
        run: task plan-check
