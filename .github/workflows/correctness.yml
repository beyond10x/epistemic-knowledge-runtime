name: Correctness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld

jobs:
  check:
    name: Repository correctness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install task runner
        env:
          TASK_VERSION: "3.53.1"
          TASK_SHA256: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: correctness-rust-1.98.1

      - name: Install pinned specification and planning tools
        env:
          ESS_VERSION: "0.36.0"
          ESS_SHA256: 5e32e277196fe8162ab4baec0debe20c093744ff33969e5cc497c952a20dc717
          AEP_VERSION: "0.63.1"
          AEP_SHA256: b6e73488336508804d7d07efbbf4585290df3e3a4fc1dd54b8469eb27ece3c96
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools-bin"
          for pair in "ess:$ESS_VERSION:$ESS_SHA256" "aep:$AEP_VERSION:$AEP_SHA256"; do
            IFS=: read -r tool version digest <<< "$pair"
            archive="$tool-$version-x86_64-unknown-linux-gnu.tar.gz"
            dir="$RUNNER_TEMP/$tool-release"
            mkdir -p "$dir"
            curl --fail --silent --show-error --location --output "$dir/$archive" \
              "https://github.com/beyond10x/$tool/releases/download/$version/$archive"
            curl --fail --silent --show-error --location --output "$dir/SHA256SUMS" \
              "https://github.com/beyond10x/$tool/releases/download/$version/SHA256SUMS"
            grep -qxF "$digest  $archive" "$dir/SHA256SUMS"
            (cd "$dir" && echo "$digest  $archive" | sha256sum --check --strict)
            tar -xzf "$dir/$archive" -C "$dir"
            find "$dir" -type f -name "$tool" -exec install -m 755 {} "$RUNNER_TEMP/tools-bin/" \;
          done
          echo "$RUNNER_TEMP/tools-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tools-bin/ess" --version
          "$RUNNER_TEMP/tools-bin/aep" --version

      - name: Fetch the complete locked dependency graph
        run: cargo fetch --locked

      - name: Run all repository checks
        run: task check
