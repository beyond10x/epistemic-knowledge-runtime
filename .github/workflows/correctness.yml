name: Correctness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_JOBS: 2

jobs:
  check:
    name: Repository correctness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.10"
          cache: false

      - name: Install task runner
        env:
          GOTOOLCHAIN: local
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: correctness-rust-1.98.1-ess-0.32.0-aep-0.57.0

      - name: Install pinned specification and planning tools
        run: |
          cargo install --locked --git https://github.com/beyond10x/ess --rev f4c1bb84298e75650674c028f9995b2324f79c06 --bin ess ess-cli
          cargo install --locked --git https://github.com/beyond10x/aep --rev ed0f60e7eba1a9e483a003d4024177c3917c3fb5 --bin aep aep-cli

      - name: Fetch the complete locked dependency graph
        run: cargo fetch --locked

      - name: Run all repository checks
        run: task check
