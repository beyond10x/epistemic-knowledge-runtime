name: Correctness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_BUILD_JOBS: 2

jobs:
  check:
    name: Repository correctness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.10"
          cache: false

      - name: Install task runner
        env:
          GOTOOLCHAIN: local
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: correctness-rust-1.98.1-ess-0.26.0-aep-0.55.0

      - name: Install pinned specification and planning tools
        run: |
          cargo install --locked --git https://github.com/beyond10x/ess --rev a5f1bea13294510819b266561c83be9509e6ba57 --bin ess ess-cli
          cargo install --locked --git https://github.com/beyond10x/aep --rev 28abe09bb6e5b0a6b4db839f6bf5693957d39324 --bin aep aep-cli

      - name: Fetch the complete locked dependency graph
        run: cargo fetch --locked

      - name: Run all repository checks
        run: task check
