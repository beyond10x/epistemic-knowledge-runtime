version: '3'

tasks:
  check:
    desc: The full gate; land nothing until it exits zero
    cmds:
      - task: fmt-check
      - task: search-web-check
      - task: clippy
      - task: test
      - task: bench-check
      - task: compile-fail-check
      - task: doc-check
      - task: vendor-check
      - task: sdk-standalone-check
      - task: spec-check
      - task: conform-fresh
      - task: plan-check
      - task: site-check

  site-check:
    desc: Validate the public project's document, anchors and asset routes
    cmds:
      - cargo run --locked -p xtask --bin ekr-docs -- check

  search-web-check:
    desc: Reproduce browser Rust bytes and check the separate target without changing native install prerequisites
    cmds:
      - cargo run --locked -p xtask --bin xtask -- search-web --check
      - cargo fmt --manifest-path crates/ekr-search-web/Cargo.toml -- --check
      - cargo test --locked --manifest-path crates/ekr-search-web/Cargo.toml
      - cargo clippy --locked --manifest-path crates/ekr-search-web/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

  site-build:
    desc: Build the static public site with exact source provenance
    cmds:
      - cargo run --locked -p xtask --bin ekr-docs -- build --out website/build --commit "$(git rev-parse HEAD)"

  fmt-check:
    desc: rustfmt, check only
    cmds:
      - cargo fmt -- --check

  clippy:
    desc: clippy over every target, warnings are errors
    cmds:
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    desc: every unit, integration and doc test under nextest; prints the ten slowest and the time against 120 s
    cmds:
      - sh scripts/test-step.sh

  bench-check:
    desc: the bench-only test targets compile, outside the test step
    cmds:
      - cargo check -p ekr-kernel --features bench --tests --locked

  compile-fail-check:
    desc: the trybuild compile-fail cases .config/nextest.toml leaves out of the test step (each compiles crates)
    cmds:
      - cargo nextest run --workspace --locked --ignore-default-filter -E 'not default()' --test-threads 1

  doc-check:
    desc: rustdoc with broken intra-doc links as errors
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --workspace --no-deps --locked

  vendor-check:
    desc: Preserve upstream YAML compatibility and check the opt-in observation facade
    cmds:
      - task: vendor-fmt-check
      - task: vendor-test
      - task: vendor-doc-check

  vendor-fmt-check:
    desc: Format the added facade and its tests without rewriting upstream source
    cmds:
      - rustfmt --edition 2021 --check vendor/serde_yaml_ng/src/observation.rs vendor/serde_yaml_ng/tests/test_observation.rs

  vendor-test:
    desc: Run unchanged upstream tests and the observation contract
    cmds:
      - cargo test --manifest-path vendor/serde_yaml_ng/Cargo.toml --locked --target-dir "${CARGO_TARGET_DIR:-target}/vendor-serde_yaml_ng"

  vendor-doc-check:
    desc: Validate the vendored public API documentation
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --manifest-path vendor/serde_yaml_ng/Cargo.toml --no-deps --locked --target-dir "${CARGO_TARGET_DIR:-target}/vendor-serde_yaml_ng"

  sdk-standalone-check:
    desc: An application outside this workspace builds ekr-sdk from its declared dependencies alone, offline
    cmds:
      - sh scripts/sdk-standalone-check.sh

  spec-check:
    desc: the runtime's own ESS contract validates
    preconditions:
      - sh: test "$(ess --version)" = "ess 0.36.0"
        msg: spec-check needs an ess on PATH whose --version is ess 0.36.0
    cmds:
      - ess specify validate --path systems/ekr

  conform-check:
    desc: conform-fresh, then both native providers run the ekr-kernel and ekr suites
    preconditions:
      - sh: test "$(ess --version)" = "ess 0.36.0"
        msg: conform-check needs an ess on PATH whose --version is ess 0.36.0
    cmds:
      - task: conform-fresh
      - cargo nextest run --locked -p ekr -E 'test(/^conformance::/) | test(/^conformance_cli::/)' --no-capture

  conform-fresh:
    desc: the committed ekr-kernel, ekr-views, ekr-integrate and ekr suites are fresh synthesis
    preconditions:
      - sh: test "$(ess --version)" = "ess 0.36.0"
        msg: conform-fresh needs an ess on PATH whose --version is ess 0.36.0
    cmds:
      - mkdir -p "${CARGO_TARGET_DIR:-target}/ekr-conformance"
      - ess conform synthesize --path systems/ekr --component ekr-kernel --suite-format 5 --target ir --scenarios crates/ekr/tests/fixtures/conformance/scenarios --out "$(realpath "${CARGO_TARGET_DIR:-target}")/ekr-conformance/fresh-suite.json"
      - cmp systems/ekr/conformance/suite.json "${CARGO_TARGET_DIR:-target}/ekr-conformance/fresh-suite.json"
      - ess conform synthesize --path systems/ekr --component ekr-views --suite-format 5 --target ir --scenarios crates/ekr-views/tests/fixtures/conformance/scenarios --out "$(realpath "${CARGO_TARGET_DIR:-target}")/ekr-conformance/fresh-views-suite.json"
      - cmp systems/ekr/conformance/views-suite.json "${CARGO_TARGET_DIR:-target}/ekr-conformance/fresh-views-suite.json"
      - ess conform synthesize --path systems/ekr --component ekr-integrate --suite-format 5 --target ir --out "$(realpath "${CARGO_TARGET_DIR:-target}")/ekr-conformance/fresh-integrate-suite.json"
      - cmp systems/ekr/conformance/integrate-suite.json "${CARGO_TARGET_DIR:-target}/ekr-conformance/fresh-integrate-suite.json"
      - ess conform synthesize --path systems/ekr --component ekr --suite-format 5 --target ir --out "$(realpath "${CARGO_TARGET_DIR:-target}")/ekr-conformance/fresh-cli-suite.json"
      - cmp systems/ekr/conformance/cli-suite.json "${CARGO_TARGET_DIR:-target}/ekr-conformance/fresh-cli-suite.json"

  plan-check:
    desc: the planning store validates
    preconditions:
      - sh: test "$(aep --version)" = "aep 0.64.0"
        msg: plan-check needs an aep on PATH whose --version is aep 0.64.0
    cmds:
      - aep plan artifact validate

  fmt:
    desc: rustfmt, in place
    cmds:
      - cargo fmt
