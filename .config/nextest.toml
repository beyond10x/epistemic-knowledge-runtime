[profile.default]
slow-timeout = { period = "60s", terminate-after = 1 }
global-timeout = "600s"
fail-fast = false
final-status-level = "slow"
default-filter = "not (binary_id(ekr-kernel::main) & test(=validation::only_the_kernel_constructs_a_validated_transaction))"

[profile.default.junit]
path = "junit.xml"
